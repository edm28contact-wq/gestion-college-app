<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comptabilité fournisseurs</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929;--warn:#8a5a00}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:420px;margin:10vh auto}.hide{display:none!important}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.active{background:var(--p);color:#fff}.muted{color:#6e7983;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{font-size:28px;font-weight:800}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{background:#f7f9fa}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.b-warn{background:#fff3cd;color:#765500}.b-err{background:#fdeaea;color:#941f1f}.b-ok{background:#e7f4eb;color:#176b3a}.b-exp{background:#e8edf1;color:#39444d}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}.drop{border:2px dashed #aab5bf;border-radius:12px;padding:34px;text-align:center;background:#fafbfc;cursor:pointer}.drop.drag{border-color:var(--p);background:#eef3f7}.status{min-height:22px}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.review{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:12px}.pdf{width:100%;height:760px;border:1px solid #dde3e8;border-radius:10px;background:#f7f7f7}.warnings{margin:0;padding-left:20px}.warning-box{border:1px solid #f0d58a;background:#fff8df;border-radius:9px;padding:10px}.danger-box{border:1px solid #efb3b3;background:#fff0f0;border-radius:9px;padding:10px}.rule-row{display:grid;grid-template-columns:1.2fr .9fr .9fr .9fr .7fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f2}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.review{grid-template-columns:1fr}.pdf{height:520px}.fields{grid-template-columns:1fr 1fr}.rule-row{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:10px}.grid,.fields{grid-template-columns:1fr}.top{align-items:flex-start!important;flex-direction:column}.rule-row{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<section id="login" class="card login"><h1>Comptabilité fournisseurs</h1><p class="muted">Préparation, contrôle, imputation et export des factures vers Charlemagne.</p><label>Identifiant</label><input id="user" value="comptabilite" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="doLogin()">Se connecter</button><div id="loginMsg" class="status"></div></section>
<section id="passwordFirst" class="card login hide"><h2>Changer le mot de passe</h2><p class="muted">Le premier mot de passe doit être remplacé avant d’accéder aux factures.</p><label>Nouveau mot de passe</label><input id="firstPass" type="password"><br><br><label>Confirmation</label><input id="firstPass2" type="password"><br><br><button class="btn primary" style="width:100%" onclick="changeFirstPassword()">Enregistrer</button><div id="firstMsg" class="status"></div></section>
<section id="app" class="hide"><div class="actions top" style="justify-content:space-between"><div><h1>Comptabilité fournisseurs</h1><div id="who" class="muted"></div></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div class="tabs"><button id="tDash" class="btn active" onclick="show('dashboard')">À traiter</button><button id="tImport" class="btn secondary" onclick="show('import')">Importer une facture</button><button id="tRules" class="btn secondary" onclick="show('rules')">Règles fournisseurs</button><button id="tSettings" class="btn secondary" onclick="show('settings')">Paramètres</button></div><br><div id="content"></div></section>
<div id="modal"></div>
</main>
<script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs';window.pdfjsLib=pdfjsLib;</script>
<script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/accounting-api';let token=localStorage.getItem('college_accounting_token')||'',db=null,page='dashboard';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,method='GET',body,raw=false){const r=await fetch(API+'?action='+encodeURIComponent(action),{method,headers:{...(raw?{}:{'content-type':'application/json'}),...(token?{authorization:'Bearer '+token}:{})},body:raw?body:(body?JSON.stringify(body):undefined),cache:'no-store'});if(raw){if(!r.ok){const j=await r.json().catch(()=>({error:'Erreur serveur'}));throw new Error(j.error||'Erreur serveur')}return r}const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok){const e=new Error(j.error||'Erreur serveur');e.data=j;throw e}return j}
async function doLogin(){const m=$('loginMsg');m.textContent='Connexion…';try{const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('college_accounting_token',token);$('login').classList.add('hide');if(j.must_change_password){$('passwordFirst').classList.remove('hide');return}await load()}catch(e){m.className='status err';m.textContent=e.message}}
async function changeFirstPassword(){const a=$('firstPass').value,b=$('firstPass2').value;if(a.length<10){$('firstMsg').textContent='10 caractères minimum.';return}if(a!==b){$('firstMsg').textContent='Les mots de passe ne correspondent pas.';return}try{await api('change-password','POST',{password:a});localStorage.removeItem('college_accounting_token');alert('Mot de passe modifié. Reconnectez-vous.');location.reload()}catch(e){$('firstMsg').textContent=e.message}}
function logout(){token='';db=null;localStorage.removeItem('college_accounting_token');location.reload()}
async function load(){db=await api('data');$('login').classList.add('hide');$('passwordFirst').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=(db.current_user?.display_name||'Comptabilité')+' · contrôle humain obligatoire avant export';render()}
async function refresh(){try{db=await api('data');render()}catch(e){alert(e.message)}}
function show(p){page=p;render()}
function render(){if(!db)return;[['Dash','dashboard'],['Import','import'],['Rules','rules'],['Settings','settings']].forEach(([id,k])=>{$('t'+id).className='btn '+(page===k?'active':'secondary')});({dashboard:renderDashboard,import:renderImport,rules:renderRules,settings:renderSettings}[page]||renderDashboard)()}
function badge(s){return s==='exportee'?'<span class="badge b-exp">Exportée</span>':s==='validee'?'<span class="badge b-ok">Validée</span>':s==='erreur'?'<span class="badge b-err">Erreur</span>':'<span class="badge b-warn">À contrôler</span>'}
function renderDashboard(){const inv=db.invoices||[],pending=inv.filter(x=>x.status==='a_controler'||x.status==='erreur'),validated=inv.filter(x=>x.status==='validee'),exported=inv.filter(x=>x.status==='exportee');$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">À contrôler</div><div class="kpi">${pending.length}</div></div><div class="card"><div class="muted">Validées à exporter</div><div class="kpi">${validated.length}</div></div><div class="card"><div class="muted">Exportées</div><div class="kpi">${exported.length}</div></div><div class="card"><div class="muted">Règles fournisseurs</div><div class="kpi">${(db.rules||[]).length}</div></div></div><br><div class="card table"><table><thead><tr><th>État</th><th>Fournisseur</th><th>Facture</th><th>Date</th><th>HT</th><th>TVA</th><th>TTC</th><th>Alertes</th><th></th></tr></thead><tbody>${inv.map(i=>`<tr><td>${badge(i.status)}</td><td><b>${esc(i.supplier||'À identifier')}</b></td><td>${esc(i.invoice_number||'—')}</td><td>${esc(i.invoice_date||'—')}</td><td>${fmt(i.amount_ht)}</td><td>${fmt(i.amount_vat)}</td><td><b>${fmt(i.amount_ttc)}</b></td><td>${(i.warnings||[]).map(w=>`<div class="warn">${esc(w)}</div>`).join('')||'—'}</td><td><button class="btn secondary" onclick="review('${i.id}')">${i.status==='a_controler'||i.status==='erreur'?'Vérifier':'Ouvrir'}</button>${i.status==='validee'||i.status==='exportee'?` <button class="btn primary" onclick="exportInvoice('${i.id}')">Export Charlemagne</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9">Aucune facture comptable.</td></tr>'}</tbody></table></div>`}
function fmt(v){return v===null||v===undefined?'—':Number(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function renderImport(){$('content').innerHTML=`<div class="card"><h2>Importer une facture fournisseur</h2><p class="muted">Le PDF original est conservé. L’application extrait les informations et crée une facture « À contrôler ». Rien n’est envoyé vers Charlemagne sans validation humaine.</p><div id="drop" class="drop"><b>Déposer un PDF ici</b><br><span class="muted">20 Mo maximum</span><input id="file" class="hide" type="file" accept="application/pdf"></div><br><progress id="prog" class="hide" max="100" value="0" style="width:100%"></progress><div id="importMsg" class="status"></div></div>`;const d=$('drop'),f=$('file');d.onclick=()=>f.click();f.onchange=()=>processFile(f.files[0]);d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');processFile(e.dataTransfer.files[0])}}
function setProg(v,t){$('prog').classList.remove('hide');$('prog').value=v;$('importMsg').textContent=t||'';$('importMsg').className='status'}
async function extractPdf(file){const buf=await file.arrayBuffer(),pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;let text='';for(let n=1;n<=Math.min(pdf.numPages,20);n++){const p=await pdf.getPage(n),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';setProg(10+Math.round(45*n/Math.min(pdf.numPages,20)),'Lecture PDF… page '+n)}if(norm(text).length>120)return text;setProg(60,'PDF scanné : OCR…');const w=await Tesseract.createWorker('fra',1,{logger:m=>{if(m.status==='recognizing text')setProg(60+Math.round((m.progress||0)*30),'OCR…')}});let out='';for(let n=1;n<=Math.min(pdf.numPages,5);n++){const p=await pdf.getPage(n),vp=p.getViewport({scale:1.7}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:ctx,viewport:vp}).promise;const r=await w.recognize(canvas);out+=r.data.text+'\n'}await w.terminate();return out}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function clean(s){return String(s||'').replace(/_/g,' ').replace(/\s+/g,' ').trim()}
function detectSupplier(text){const n=norm(text);for(const r of db.rules||[]){if(norm(r.supplier_name).length>=4&&n.includes(norm(r.supplier_name)))return r.supplier_name}const domains=[];for(const m of text.matchAll(/[A-Z0-9._%+-]+@([A-Z0-9.-]+\.[A-Z]{2,})/ig))domains.push(m[1].toLowerCase().split('.')[0].replace(/[^a-z0-9]/g,''));for(const m of text.matchAll(/(?:www\.)?([A-Z0-9-]+)\.(?:fr|com|net|eu|org)\b/ig))domains.push(m[1].toLowerCase().replace(/[^a-z0-9]/g,''));const caps=text.match(/[A-ZÀ-Ý][A-ZÀ-Ý0-9&.'_-]{1,}(?:[\s_]+[A-ZÀ-Ý][A-ZÀ-Ý0-9&.'_-]{1,}){0,3}/g)||[];for(const c of caps){const cc=norm(c).replace(/\s/g,'');if(domains.some(d=>d.length>=4&&(cc===d||cc.includes(d)||d.includes(cc))))return clean(c)}const lines=text.split(/\r?\n/).map(clean).filter(Boolean);for(const l of lines){const m=l.match(/^(?:fournisseur|supplier|vendeur|émetteur)\s*[:\-–—]\s*(.+)$/i);if(m)return clean(m[1])}const company=lines.find(l=>/\b(?:SASU?|SARL|EURL|SA|SNC|GMBH|LTD|LIMITED|ETS|ÉTABLISSEMENTS?)\b/i.test(l)&&l.length<120);return company||''}
function detectNumber(text){const m=text.match(/(?:facture|invoice)\s*(?:n[°ºo]?\s*)?[:#-]?\s*([A-Z0-9][A-Z0-9._\/-]{2,})/i);return m?m[1]:''}
function detectDate(text){const candidates=[...text.matchAll(/(?:date(?:\s+document)?|date\s+facture)[^\d]{0,20}(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2}|\d{2})/ig)];const m=candidates[0]||text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](20\d{2})/);if(!m)return '';let y=String(m[3]);if(y.length===2)y='20'+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
function num(s){const v=String(s||'').replace(/[\s ]/g,'').replace(',','.').replace(/[^0-9.-]/g,'');const n=Number(v);return Number.isFinite(n)?n:null}
function findMoney(text,patterns){for(const re of patterns){const all=[...text.matchAll(re)];if(all.length){const v=num(all[all.length-1][1]);if(v!==null)return v}}return null}
function detectAmounts(text){const ht=findMoney(text,[/(?:total\s+(?:eur\s+)?ht|montant\s+ht)\s*[:€]?\s*([0-9][0-9\s .,]*)/ig]),ttc=findMoney(text,[/(?:total\s+(?:eur\s+)?ttc|montant\s+ttc)\s*[:€]?\s*([0-9][0-9\s .,]*)/ig]),vat=findMoney(text,[/(?:montant\s+tva|tva\s+\d+(?:[.,]\d+)?\s*%)\s*[:€]?\s*([0-9][0-9\s .,]*)/ig]);let rate=null;const rm=text.match(/tva\s*(\d+(?:[.,]\d+)?)\s*%/i);if(rm)rate=num(rm[1]);return {ht,vat,ttc,rate}}
async function processFile(file){if(!file)return;if(file.type!=='application/pdf'){alert('PDF requis.');return}try{setProg(2,'Préparation…');const text=await extractPdf(file),a=detectAmounts(text),supplier=detectSupplier(text),number=detectNumber(text),date=detectDate(text);setProg(92,'Enregistrement du document original…');const form=new FormData();form.append('file',file);form.append('raw_text',text);form.append('supplier',supplier);form.append('invoice_number',number);form.append('invoice_date',date);form.append('amount_ht',a.ht??'');form.append('amount_vat',a.vat??'');form.append('amount_ttc',a.ttc??'');form.append('vat_rate',a.rate??'');const r=await api('upload','POST',form,true),j=await r.json();setProg(100,'Facture importée. Contrôle requis.');await refresh();setTimeout(()=>{page='dashboard';render();review(j.item.id)},400)}catch(e){$('importMsg').className='status err';$('importMsg').textContent=e.message;$('prog').classList.add('hide')}}
async function review(id){const i=(db.invoices||[]).find(x=>x.id===id);if(!i)return;let pdf='';try{pdf=(await api('file&id='+encodeURIComponent(id))).url}catch{}const warnings=(i.warnings||[]);$('modal').innerHTML=`<div style="position:fixed;inset:0;background:#0007;z-index:60;overflow:auto;padding:18px"><div class="card" style="max-width:1180px;margin:auto"><div class="actions" style="justify-content:space-between"><h2>Contrôle de la facture</h2><button class="btn secondary" onclick="closeModal()">Fermer</button></div>${warnings.length?`<div class="${i.status==='erreur'?'danger-box':'warning-box'}"><b>Contrôles automatiques</b><ul class="warnings">${warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><br>`:''}<div class="review"><div>${pdf?`<iframe class="pdf" src="${esc(pdf)}"></iframe>`:'<div class="card">Aperçu indisponible.</div>'}</div><div><div class="fields"><div><label>Fournisseur</label><input id="rsupplier" value="${esc(i.supplier||'')}"></div><div><label>N° facture</label><input id="rnumber" value="${esc(i.invoice_number||'')}"></div><div><label>Date</label><input id="rdate" type="date" value="${esc(i.invoice_date||'')}"></div><div><label>HT</label><input id="rht" type="number" step="0.01" value="${i.amount_ht??''}"></div><div><label>TVA</label><input id="rvat" type="number" step="0.01" value="${i.amount_vat??''}"></div><div><label>TTC</label><input id="rttc" type="number" step="0.01" value="${i.amount_ttc??''}"></div><div><label>Taux TVA %</label><input id="rrate" type="number" step="0.001" value="${i.vat_rate??''}"></div><div><label>Journal</label><input id="rjournal" value="${esc(i.journal||'AC')}"></div><div><label>Compte fournisseur</label><input id="rsupacc" value="${esc(i.supplier_account||'40100000')}"></div><div><label>Compte de charge</label><input id="rexpacc" value="${esc(i.expense_account||'')}"></div><div><label>Libellé compte charge</label><input id="rexplabel" value="${esc(i.expense_label||'')}"></div><div><label>Compte TVA</label><input id="rvatacc" value="${esc(i.vat_account||'44566000')}"></div><div class="full"><label>Libellé écriture</label><input id="rlabel" value="${esc(i.entry_label||'')}"></div></div><br><label style="display:flex;gap:8px;align-items:center"><input id="saveRule" type="checkbox" style="width:auto"> Mémoriser cette imputation comme règle fournisseur</label><br><div class="actions"><button class="btn primary" onclick="validateInvoice('${i.id}')">Valider l’écriture</button>${i.status==='validee'||i.status==='exportee'?`<button class="btn secondary" onclick="exportInvoice('${i.id}')">Exporter Charlemagne</button>`:''}</div><div id="reviewMsg" class="status"></div></div></div></div></div>`}
function closeModal(){$('modal').innerHTML=''}
async function validateInvoice(id){const data={id,supplier:$('rsupplier').value,invoice_number:$('rnumber').value,invoice_date:$('rdate').value,amount_ht:$('rht').value,amount_vat:$('rvat').value,amount_ttc:$('rttc').value,vat_rate:$('rrate').value,journal:$('rjournal').value,supplier_account:$('rsupacc').value,expense_account:$('rexpacc').value,expense_label:$('rexplabel').value,vat_account:$('rvatacc').value,entry_label:$('rlabel').value};if(!confirm('Valider cette facture ? L’écriture sera figée pour l’export Charlemagne.'))return;try{if($('saveRule')?.checked)await api('save-rule','POST',{supplier_name:data.supplier,supplier_account:data.supplier_account,expense_account:data.expense_account,expense_label:data.expense_label,vat_account:data.vat_account,journal:data.journal});await api('validate','POST',data);$('reviewMsg').className='status ok';$('reviewMsg').textContent='Facture validée et écriture équilibrée.';await refresh();setTimeout(()=>{closeModal();render()},500)}catch(e){$('reviewMsg').className='status err';$('reviewMsg').textContent=e.message}}
async function exportInvoice(id){try{const r=await api('export&id='+encodeURIComponent(id),'GET',null,true),blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='charlemagne-facture.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);await refresh()}catch(e){alert(e.message)}}
function renderRules(){$('content').innerHTML=`<div class="card"><div class="actions" style="justify-content:space-between"><div><h2>Règles fournisseurs</h2><div class="muted">Les règles déterministes sont appliquées avant toute proposition automatique.</div></div><button class="btn primary" onclick="editRule()">Ajouter une règle</button></div></div><div class="card">${(db.rules||[]).map(r=>`<div class="rule-row"><div><b>${esc(r.supplier_name)}</b></div><div>${esc(r.expense_account)}<div class="muted">${esc(r.expense_label||'')}</div></div><div>${esc(r.supplier_account)}</div><div>${esc(r.vat_account)}</div><div>${esc(r.journal)}</div><button class="btn secondary" onclick="editRule('${r.id}')">Modifier</button></div>`).join('')||'<div class="muted">Aucune règle. Lors de la validation d’une facture, cochez « Mémoriser cette imputation ».</div>'}</div>`}
function editRule(id){const r=id?(db.rules||[]).find(x=>x.id===id):{};$('modal').innerHTML=`<div style="position:fixed;inset:0;background:#0007;z-index:60;padding:18px"><div class="card" style="max-width:650px;margin:8vh auto"><h2>${id?'Modifier':'Nouvelle'} règle fournisseur</h2><div class="fields"><div class="full"><label>Fournisseur</label><input id="qname" value="${esc(r.supplier_name||'')}"></div><div><label>Compte de charge</label><input id="qexp" value="${esc(r.expense_account||'')}"></div><div><label>Libellé charge</label><input id="qlabel" value="${esc(r.expense_label||'')}"></div><div><label>Compte fournisseur</label><input id="qsup" value="${esc(r.supplier_account||'40100000')}"></div><div><label>Compte TVA</label><input id="qvat" value="${esc(r.vat_account||'44566000')}"></div><div><label>Journal</label><input id="qjournal" value="${esc(r.journal||'AC')}"></div></div><br><div class="actions"><button class="btn primary" onclick="saveRule()">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="ruleMsg" class="status"></div></div></div>`}
async function saveRule(){try{await api('save-rule','POST',{supplier_name:$('qname').value,expense_account:$('qexp').value,expense_label:$('qlabel').value,supplier_account:$('qsup').value,vat_account:$('qvat').value,journal:$('qjournal').value});await refresh();closeModal();render()}catch(e){$('ruleMsg').textContent=e.message}}
function renderSettings(){$('content').innerHTML=`<div class="card" style="max-width:560px"><h2>Changer le mot de passe</h2><label>Nouveau mot de passe</label><input id="newPass" type="password"><br><br><label>Confirmation</label><input id="newPass2" type="password"><br><br><button class="btn primary" onclick="changePassword()">Changer</button><div id="pwMsg" class="status"></div></div><div class="card"><b>Intégration Windows</b><p class="muted">La version web accepte le glisser-déposer. La surveillance automatique d’un dossier partagé Windows et le déplacement physique des PDF après validation nécessitent le compagnon desktop Tauri prévu par le cahier des charges.</p></div>`}
async function changePassword(){const a=$('newPass').value,b=$('newPass2').value;if(a.length<10){$('pwMsg').textContent='10 caractères minimum.';return}if(a!==b){$('pwMsg').textContent='Les mots de passe ne correspondent pas.';return}try{await api('change-password','POST',{password:a});localStorage.removeItem('college_accounting_token');alert('Mot de passe modifié. Reconnectez-vous.');location.reload()}catch(e){$('pwMsg').textContent=e.message}}
if(token)load().catch(()=>logout());
