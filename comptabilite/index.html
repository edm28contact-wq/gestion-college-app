<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comptabilité fournisseurs</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<style>
:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--bad:#a12622;--ok:#14733e}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:420px;margin:10vh auto}.hide{display:none!important}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.active{background:var(--p);color:#fff}.muted{color:#6e7983;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:28px;font-weight:800}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{background:#f7f9fa}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.warn{background:#fff3cd;color:#765500}.errb{background:#fdeaea;color:#941f1f}.okb{background:#e7f4eb;color:#176b3a}.expb{background:#e8edf1;color:#39444d}input,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}.drop{border:2px dashed #aab5bf;border-radius:12px;padding:34px;text-align:center;background:#fafbfc;cursor:pointer}.drop.drag{border-color:var(--p);background:#eef3f7}.status{min-height:22px}.ok{color:var(--ok)}.err{color:var(--bad)}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.full{grid-column:1/-1}.review{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,.9fr);gap:12px}.pdf{width:100%;height:740px;border:1px solid #dde3e8;border-radius:10px}.modal{position:fixed;inset:0;background:#0007;z-index:60;overflow:auto;padding:18px}.modal>.card{max-width:1180px;margin:auto}.rule{display:grid;grid-template-columns:1.2fr .8fr .8fr 1.2fr;gap:8px;padding:8px 0;border-bottom:1px solid #edf0f2}.charge-row{display:grid;grid-template-columns:1fr 1.5fr .8fr auto;gap:8px;margin:8px 0}.charge-total{padding:10px;background:#f7f9fa;border-radius:8px;margin-top:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.review{grid-template-columns:1fr!important}.pdf{height:500px}.fields{grid-template-columns:1fr 1fr}.charge-row{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.fields,.charge-row{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body><main class="wrap">
<section id="login" class="card login"><h1>Comptabilité fournisseurs</h1><p class="muted">Préparer, ventiler, contrôler et exporter les factures vers Charlemagne.</p><label>Identifiant</label><input id="user" value="comptabilite"><br><br><label>Mot de passe</label><input id="pass" type="password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginMsg" class="status err"></div></section>
<section id="first" class="card login hide"><h2>Changer le mot de passe</h2><input id="fp1" type="password" placeholder="Nouveau mot de passe"><br><br><input id="fp2" type="password" placeholder="Confirmation"><br><br><button class="btn primary" onclick="firstPassword()">Enregistrer</button><div id="firstMsg" class="status"></div></section>
<section id="app" class="hide"><div class="actions" style="justify-content:space-between"><div><h1>Comptabilité fournisseurs</h1><div id="who" class="muted"></div></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div class="tabs"><button id="td" class="btn active" onclick="show('dashboard')">À traiter</button><button id="ti" class="btn secondary" onclick="show('import')">Importer</button><button id="tr" class="btn secondary" onclick="show('rules')">Règles fournisseurs</button><button id="ts" class="btn secondary" onclick="show('settings')">Paramètres</button></div><br><div id="content"></div></section>
<div id="modal"></div>
</main>
<script src="../system-test-mode.js?v=2"></script>
<script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs';window.pdfjsLib=pdfjsLib;</script>
<script src="./app-v2.js?v=4"></script>
<script src="./accounting-auto-ai-ui.js?v=8"></script>
<script src="./gemini-rate-limit-fix.js?v=2"></script>
<script src="./gemini-config-fix.js?v=1"></script>
<script src="./stock-sync.js?v=1"></script>
<script src="./accounting-actions-ui.js?v=3"></script>
<script src="./rules-ui.js?v=2"></script>
<script src="./windows-folder-import.js?v=1"></script>
<script src="./control-ui.js?v=1"></script>
<script src="./control-report-ui.js?v=1"></script>
<script src="./missing-charge-state.js?v=1"></script>
<script src="./nonrecoverable-vat.js?v=1"></script>
<script src="./product-keyword-analysis-ui.js?v=2"></script>
</body></html>
