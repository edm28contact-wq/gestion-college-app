<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243447"><title>Gestion collège</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f5f6f7;--accent:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:24px;margin:0}.muted{font-size:13px;color:#68727d}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:14px;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#68727d;margin-bottom:5px}input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;padding:8px;font-size:16px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;min-height:46px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;font-weight:700}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.line{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2}.purchase-line{display:grid;grid-template-columns:minmax(0,1fr) 95px 110px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2}.line:last-child,.purchase-line:last-child{border-bottom:0}.name{font-weight:650}.unit{font-size:12px;color:#68727d}.qty{text-align:center;font-size:18px}.actions{display:flex;gap:9px}.btn{width:100%;min-height:48px;border:0;border-radius:10px;font-size:16px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#e9edf1;color:#17202a}.status{min-height:22px;margin-top:10px;font-size:14px}.ok{color:#14733e}.err{color:#a12622}.hidden{display:none!important}.loading{color:#68727d;padding:14px 0}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{font-size:24px;font-weight:800}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;min-width:620px}.history th,.history td{padding:8px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px}.history th{background:#f7f8f9}@media(max-width:520px){.wrap{padding:12px}.meta,.kpis{grid-template-columns:1fr}.line{grid-template-columns:minmax(0,1fr) 88px}.purchase-line{grid-template-columns:1fr 80px 95px}}</style>
</head>
<body><main class="wrap"><div class="top"><div><h1 id="title">Gestion collège</h1><div id="category" class="muted"></div></div></div><div class="tabs"><button id="tabInventory" class="tab active">Inventaire</button><button id="tabPurchases" class="tab">Achats</button></div>
<section id="inventoryPage"><section class="card"><div class="meta"><div><label>Date</label><input id="date" type="date"></div><div><label>Service</label><select id="service"></select></div></div></section><section class="card"><div id="products" class="loading">Chargement…</div></section><section class="card"><label>Remarque facultative</label><textarea id="note" maxlength="500"></textarea></section><div class="actions"><button id="clear" class="btn secondary">Effacer</button><button id="save" class="btn primary">Enregistrer l’inventaire</button></div><div id="status" class="status"></div></section>
<section id="purchasesPage" class="hidden"><section class="card"><div class="meta"><div><label>Date d’achat</label><input id="buyDate" type="date"></div><div><label>Fournisseur</label><input id="supplier" maxlength="200" placeholder="Fournisseur"></div></div></section><section class="card"><div id="buyProducts" class="loading">Chargement…</div></section><section class="card"><label>Remarque facultative</label><textarea id="buyNote" maxlength="500"></textarea></section><div class="actions"><button id="clearBuy" class="btn secondary">Effacer</button><button id="saveBuy" class="btn primary">Enregistrer l’achat</button></div><div id="buyStatus" class="status"></div><br><section class="card"><div class="meta"><div><label>Année suivie</label><input id="year" type="number" min="2000" max="2100"></div><div><label>&nbsp;</label><button id="loadYear" class="btn secondary">Actualiser l’année</button></div></div></section><div class="kpis"><div class="card"><div class="muted">Total achats</div><div id="yearValue" class="kpi">0,00 €</div></div><div class="card"><div class="muted">Quantité achetée</div><div id="yearQty" class="kpi">0</div></div></div><section class="card history"><table><thead><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Prix</th><th>Total</th><th>Fournisseur</th></tr></thead><tbody id="history"></tbody></table></section></section></main>
<script>(()=>{'use strict';const PROJECT='https://zreegtzfpwrjgdhhunxx.supabase.co';const q=new URLSearchParams(location.search);const id=(q.get('id')||'').trim();const BASE=PROJECT+'/functions/v1/app-api?id='+encodeURIComponent(id);const $=x=>document.getElementById(x);let cfg=null;const now=new Date();const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');$('date').value=today;$('buyDate').value=today;$('year').value=String(now.getFullYear());const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)});const msg=(el,t,ok=false)=>{el.textContent=t||'';el.className='status '+(t?(ok?'ok':'err'):'')};function tab(name){const inv=name==='inventory';$('inventoryPage').classList.toggle('hidden',!inv);$('purchasesPage').classList.toggle('hidden',inv);$('tabInventory').classList.toggle('active',inv);$('tabPurchases').classList.toggle('active',!inv);if(!inv)loadPurchases()}$('tabInventory').onclick=()=>tab('inventory');$('tabPurchases').onclick=()=>tab('purchases');function render(){ $('title').textContent=cfg.application.name;document.title=cfg.application.name+' – Gestion collège';$('category').textContent=cfg.category.name;document.documentElement.style.setProperty('--accent',cfg.application.color||cfg.category.color||'#243447');$('service').replaceChildren();(cfg.application.services?.length?cfg.application.services:['Midi']).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('service').appendChild(o)});renderInventory();renderBuyProducts()}function renderInventory(){$('products').className='';$('products').replaceChildren();cfg.products.forEach(p=>{const row=document.createElement('div');row.className='line';row.dataset.id=p.id;row.innerHTML='<div><div class="name"></div><div class="unit"></div></div><input class="qty" type="number" min="0" step="1" placeholder="Compter">';row.querySelector('.name').textContent=p.name;row.querySelector('.unit').textContent=p.unit||'pièce';$('products').appendChild(row)})}function renderBuyProducts(){$('buyProducts').className='';$('buyProducts').replaceChildren();cfg.products.forEach(p=>{const row=document.createElement('div');row.className='purchase-line';row.dataset.id=p.id;row.innerHTML='<div><div class="name"></div><div class="unit"></div></div><input class="buyQty" type="number" min="0" step="1" placeholder="Qté"><input class="buyPrice" type="number" min="0" step="0.01" placeholder="Prix €">';row.querySelector('.name').textContent=p.name;row.querySelector('.unit').textContent=p.unit||'pièce';row.querySelector('.buyPrice').value=Number(p.unit_price||0).toFixed(2);$('buyProducts').appendChild(row)})}async function load(){try{const r=await fetch(BASE,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur de chargement');cfg=j;render()}catch(e){msg($('status'),e.message||'Impossible de charger');$('save').disabled=true;$('saveBuy').disabled=true}}function resetInv(){$('products').querySelectorAll('.qty').forEach(i=>i.value='');$('note').value='';msg($('status'),'')}function resetBuy(){$('buyProducts').querySelectorAll('.buyQty').forEach(i=>i.value='');$('buyNote').value='';$('supplier').value='';msg($('buyStatus'),'')}$('clear').onclick=resetInv;$('clearBuy').onclick=resetBuy;$('save').onclick=async()=>{const items=[];let bad=false;$('products').querySelectorAll('.line').forEach(row=>{const raw=row.querySelector('.qty').value.trim();if(raw===''){bad=true;return}const quantity=Number(raw);if(!Number.isFinite(quantity)||quantity<0){bad=true;return}items.push({product_id:row.dataset.id,quantity})});if(bad){msg($('status'),'Comptez tous les produits avant d’enregistrer.');return}$('save').disabled=true;msg($('status'),'Enregistrement…',true);try{const r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),event_type:'inventaire',event_date:$('date').value,service:$('service').value,note:$('note').value,items})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetInv();msg($('status'),'Inventaire enregistré.',true)}catch(e){msg($('status'),e.message||'Erreur')}finally{$('save').disabled=false}};$('saveBuy').onclick=async()=>{const items=[];let bad=false;$('buyProducts').querySelectorAll('.purchase-line').forEach(row=>{const qv=row.querySelector('.buyQty').value.trim();if(!qv)return;const quantity=Number(qv),unit_price=Number(row.querySelector('.buyPrice').value);if(!Number.isFinite(quantity)||quantity<=0||!Number.isFinite(unit_price)||unit_price<0){bad=true;return}items.push({product_id:row.dataset.id,quantity,unit_price})});if(bad||!items.length){msg($('buyStatus'),bad?'Quantité ou prix invalide.':'Indiquez au moins un article acheté.');return}$('saveBuy').disabled=true;msg($('buyStatus'),'Enregistrement…',true);try{const r=await fetch(BASE+'&action=purchase',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),purchase_date:$('buyDate').value,supplier:$('supplier').value,note:$('buyNote').value,items})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetBuy();msg($('buyStatus'),'Achat enregistré et stock mis à jour.',true);await loadPurchases()}catch(e){msg($('buyStatus'),e.message||'Erreur')}finally{$('saveBuy').disabled=false}};async function loadPurchases(){const y=Number($('year').value);$('history').innerHTML='<tr><td colspan="6">Chargement…</td></tr>';try{const r=await fetch(BASE+'&action=purchases&year='+encodeURIComponent(y),{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');$('yearValue').textContent=Number(j.total_value||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});$('yearQty').textContent=Number(j.total_quantity||0).toLocaleString('fr-FR');$('history').innerHTML=(j.purchases||[]).map(x=>'<tr><td>'+x.purchase_date+'</td><td>'+esc(x.product_name)+'</td><td>'+Number(x.quantity).toLocaleString('fr-FR')+'</td><td>'+Number(x.unit_price).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+'</td><td>'+Number(x.total).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+'</td><td>'+esc(x.supplier||'')+'</td></tr>').join('')||'<tr><td colspan="6">Aucun achat pour cette année.</td></tr>'}catch(e){$('history').innerHTML='<tr><td colspan="6" class="err">'+esc(e.message||'Erreur')+'</td></tr>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('loadYear').onclick=loadPurchases;$('year').onchange=loadPurchases;load()})();</script></body></html>
