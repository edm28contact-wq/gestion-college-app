<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243447"><title>Gestion collège</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f5f6f7;--accent:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:16px}.top{margin-bottom:14px}h1{font-size:24px;margin:0}.muted{font-size:13px;color:#68727d}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:14px;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#68727d;margin-bottom:5px}input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;padding:8px;font-size:16px}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tab{flex:1;min-width:130px;min-height:46px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;font-weight:700}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.line{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2}.line:last-child{border-bottom:0}.name{font-weight:650}.unit{font-size:12px;color:#68727d}.qty{text-align:center;font-size:18px}.actions{display:flex;gap:9px}.btn{width:100%;min-height:48px;border:0;border-radius:10px;font-size:16px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#e9edf1;color:#17202a}.status{min-height:22px;margin-top:10px;font-size:14px}.ok{color:#14733e}.err{color:#a12622}.hidden{display:none!important}.loading{color:#68727d;padding:14px 0}.kpi{font-size:26px;font-weight:800}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;min-width:560px}.history th,.history td{padding:8px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px}.history th{background:#f7f8f9}.stock{font-weight:700}.price{font-size:13px;color:#4c5965}.empty{text-align:center;padding:28px;color:#68727d}@media(max-width:520px){.wrap{padding:12px}.meta{grid-template-columns:1fr}.line{grid-template-columns:minmax(0,1fr) 88px}.actions{flex-direction:column}}
</style>
</head>
<body><main class="wrap"><div class="top"><h1 id="title">Gestion collège</h1><div id="category" class="muted"></div></div><div id="tabs" class="tabs"></div><div id="pages"></div></main>
<script>
(()=>{'use strict';
const PROJECT='https://zreegtzfpwrjgdhhunxx.supabase.co',id=(new URLSearchParams(location.search).get('id')||'').trim(),BASE=PROJECT+'/functions/v1/app-api?id='+encodeURIComponent(id),$=x=>document.getElementById(x);let cfg=null,activePage='';
const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-'),uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=()=>cfg?.application?.site_options||{};
function msg(id,t,ok=false){const e=$(id);if(!e)return;e.textContent=t||'';e.className='status '+(t?(ok?'ok':'err'):'')}
function productInfo(p){const bits=[p.unit||'pièce'];if(opts().unit_price&&p.unit_price!==undefined)bits.push(Number(p.unit_price).toFixed(2)+' € / unité');if(opts().current_stock&&p.current_stock!==undefined)bits.push('stock actuel : '+Number(p.current_stock).toLocaleString('fr-FR'));return bits.join(' · ')}
function rows(products,cls,placeholder){return products.map(p=>`<div class="line" data-id="${p.id}"><div><div class="name">${esc(p.name)}</div><div class="unit">${esc(productInfo(p))}</div></div><input class="${cls} qty" type="number" min="0" step="1" placeholder="${esc(placeholder)}"></div>`).join('')}
function commonMeta(prefix,withService){return `<section class="card"><div class="meta"><div><label>Date</label><input id="${prefix}Date" type="date" value="${today}"></div>${withService&&opts().service?`<div><label>Service</label><select id="${prefix}Service">${(cfg.application.services?.length?cfg.application.services:['Général']).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>`:''}</div></section>`}
function noteBlock(id){return opts().note?`<section class="card"><label>Remarque facultative</label><textarea id="${id}" maxlength="500"></textarea></section>`:''}
function buildInventory(){return `<section id="page-inventory" class="page">${commonMeta('inv',true)}<section class="card">${rows(cfg.products,'invQty','Compter')}</section>${noteBlock('invNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('inventory')">Effacer</button><button id="saveInventory" class="btn primary" onclick="saveEvent('inventaire')">Enregistrer l’inventaire</button></div><div id="inventoryStatus" class="status"></div></section>`}
function buildOutgoing(){return `<section id="page-outgoing" class="page">${commonMeta('out',true)}<section class="card">${rows(cfg.products,'outQty','Sortie')}</section>${noteBlock('outNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('outgoing')">Effacer</button><button id="saveOutgoing" class="btn primary" onclick="saveEvent('sortie')">Enregistrer la sortie</button></div><div id="outgoingStatus" class="status"></div></section>`}
function buildPurchases(){const history=opts().purchase_history?`<br><section class="card"><div class="meta"><div><label>Année suivie</label><input id="year" type="number" min="2000" max="2100" value="${now.getFullYear()}"></div><div><label>&nbsp;</label><button class="btn secondary" onclick="loadPurchases()">Actualiser l’année</button></div></div></section><section class="card"><div class="muted">Quantité totale achetée sur l’année</div><div id="yearQty" class="kpi">0</div></section><section class="card history"><table><thead id="historyHead"></thead><tbody id="history"></tbody></table></section>`:'';return `<section id="page-purchases" class="page">${commonMeta('buy',false)}${opts().supplier?'<section class="card"><label>Fournisseur</label><input id="supplier" maxlength="200" placeholder="Fournisseur"></section>':''}<section class="card">${rows(cfg.products,'buyQty','Qté')}</section>${noteBlock('buyNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('purchases')">Effacer</button><button id="savePurchases" class="btn primary" onclick="savePurchase()">Enregistrer l’achat</button></div><div id="purchaseStatus" class="status"></div>${history}</section>`}
function render(){const o=opts(),defs=[];if(o.inventory)defs.push(['inventory','Inventaire',buildInventory]);if(o.outgoing)defs.push(['outgoing','Sorties',buildOutgoing]);if(o.purchases)defs.push(['purchases','Achats',buildPurchases]);$('title').textContent=cfg.application.name;$('category').textContent=cfg.category.name;document.title=cfg.application.name+' – Gestion collège';document.documentElement.style.setProperty('--accent',cfg.application.color||cfg.category.color||'#243447');if(!defs.length){$('tabs').innerHTML='';$('pages').innerHTML='<div class="card empty">Aucune fonction n’est activée sur ce site.</div>';return}$('tabs').innerHTML=defs.map(([k,n])=>`<button class="tab" data-page="${k}" onclick="showPage('${k}')">${n}</button>`).join('');$('pages').innerHTML=defs.map(x=>x[2]()).join('');activePage=defs[0][0];showPage(activePage);if(o.purchase_history&&o.purchases)loadPurchases()}
window.showPage=function(p){activePage=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!=='page-'+p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}
window.resetForm=function(kind){const map={inventory:['.invQty','invNote','inventoryStatus'],outgoing:['.outQty','outNote','outgoingStatus'],purchases:['.buyQty','buyNote','purchaseStatus']},m=map[kind];document.querySelectorAll(m[0]).forEach(i=>i.value='');if($(m[1]))$(m[1]).value='';if(kind==='purchases'&&$('supplier'))$('supplier').value='';msg(m[2],'')}
window.saveEvent=async function(type){const inv=type==='inventaire',cls=inv?'.invQty':'.outQty',items=[];let bad=false;document.querySelectorAll(cls).forEach(input=>{const row=input.closest('.line'),raw=input.value.trim();if(inv&&raw===''){bad=true;return}if(!inv&&!raw)return;const quantity=Number(raw);if(!Number.isFinite(quantity)||quantity<0||(type==='sortie'&&quantity<=0)){bad=true;return}items.push({product_id:row.dataset.id,quantity})});const statusId=inv?'inventoryStatus':'outgoingStatus';if(bad||!items.length){msg(statusId,bad?'Quantité invalide.':'Indiquez au moins un produit.');return}const btn=$(inv?'saveInventory':'saveOutgoing');btn.disabled=true;msg(statusId,'Enregistrement…',true);try{const prefix=inv?'inv':'out',r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),event_type:type,event_date:$(prefix+'Date').value,service:opts().service?($(prefix+'Service')?.value||''):'',note:opts().note?($(prefix+'Note')?.value||''):'',items})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetForm(inv?'inventory':'outgoing');msg(statusId,inv?'Inventaire enregistré.':'Sortie enregistrée.',true)}catch(e){msg(statusId,e.message||'Erreur')}finally{btn.disabled=false}}
window.savePurchase=async function(){const items=[];let bad=false;document.querySelectorAll('.buyQty').forEach(input=>{const raw=input.value.trim();if(!raw)return;const quantity=Number(raw);if(!Number.isFinite(quantity)||quantity<=0){bad=true;return}items.push({product_id:input.closest('.line').dataset.id,quantity})});if(bad||!items.length){msg('purchaseStatus',bad?'Quantité invalide.':'Indiquez au moins un article acheté.');return}const btn=$('savePurchases');btn.disabled=true;msg('purchaseStatus','Enregistrement…',true);try{const r=await fetch(BASE+'&action=purchase',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),purchase_date:$('buyDate').value,supplier:opts().supplier?($('supplier')?.value||''):'',note:opts().note?($('buyNote')?.value||''):'',items})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetForm('purchases');msg('purchaseStatus','Achat enregistré et stock mis à jour.',true);if(opts().purchase_history)await loadPurchases()}catch(e){msg('purchaseStatus',e.message||'Erreur')}finally{btn.disabled=false}}
window.loadPurchases=async function(){if(!opts().purchase_history||!$('history'))return;const y=Number($('year').value),cols=['Date','Produit','Quantité'];if(opts().unit_price)cols.push('Prix unitaire');if(opts().supplier)cols.push('Fournisseur');if(opts().note)cols.push('Remarque');$('historyHead').innerHTML='<tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';$('history').innerHTML='<tr><td colspan="'+cols.length+'">Chargement…</td></tr>';try{const r=await fetch(BASE+'&action=purchases&year='+encodeURIComponent(y),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');$('yearQty').textContent=Number(j.total_quantity||0).toLocaleString('fr-FR');$('history').innerHTML=(j.purchases||[]).map(x=>{const cells=[esc(x.purchase_date),esc(x.product_name),Number(x.quantity).toLocaleString('fr-FR')];if(opts().unit_price)cells.push(Number(x.unit_price||0).toFixed(2)+' €');if(opts().supplier)cells.push(esc(x.supplier||''));if(opts().note)cells.push(esc(x.note||''));return '<tr>'+cells.map(v=>'<td>'+v+'</td>').join('')+'</tr>'}).join('')||'<tr><td colspan="'+cols.length+'">Aucun achat pour cette année.</td></tr>'}catch(e){$('history').innerHTML='<tr><td colspan="'+cols.length+'" class="err">'+esc(e.message||'Erreur')+'</td></tr>'}}
async function load(){try{const r=await fetch(BASE,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur de chargement');cfg=j;render()}catch(e){$('tabs').innerHTML='';$('pages').innerHTML='<div class="card err">'+esc(e.message||'Impossible de charger ce site.')+'</div>'}}
load();
})();
</script></body></html>
