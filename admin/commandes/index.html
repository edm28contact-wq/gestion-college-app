<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commandes - Administration</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:white;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#e8edf1}.muted{color:#6e7983;font-size:13px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.hide{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Commandes fournisseurs</h1><div class="muted">Vue administrateur de toutes les commandes du secrétariat.</div></div><div><a class="btn secondary" href="../">← Administration</a> <button class="btn secondary" onclick="load()">Actualiser</button></div></div><br><div id="msg" class="card">Chargement…</div><section id="app" class="hide"><div id="kpis" class="grid"></div><br><div class="card table"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>État</th><th>Qté</th><th>Créée par</th><th>Mise à jour par</th><th>Réceptionnée par</th><th>Date réception</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/admin-api';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const token=localStorage.getItem('college_admin_token')||'';if(!token){$('msg').innerHTML='Vous devez d’abord vous connecter à <a href="../">l’administration</a>.';return}try{const r=await fetch(API+'?action=data',{headers:{authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');if(j.current_user?.role!=='admin')throw new Error('Accès administrateur requis');const os=j.orders||[],items=j.order_items||[];const count=s=>os.filter(o=>o.status===s).length;$('kpis').innerHTML=`<div class="card"><div class="muted">Brouillons</div><div class="kpi">${count('brouillon')}</div></div><div class="card"><div class="muted">Commandées</div><div class="kpi">${count('commandee')}</div></div><div class="card"><div class="muted">Reçues</div><div class="kpi">${count('recue')}</div></div><div class="card"><div class="muted">Total commandes</div><div class="kpi">${os.length}</div></div>`;$('rows').innerHTML=os.map(o=>`<tr><td>CMD-${String(o.order_no).padStart(6,'0')}</td><td>${o.order_date}</td><td>${esc(o.supplier||'')}</td><td>${esc(o.status)}</td><td>${items.filter(i=>i.order_id===o.id).reduce((s,i)=>s+Number(i.quantity),0)}</td><td>${esc(o.created_by)}</td><td>${esc(o.updated_by)}</td><td>${esc(o.received_by||'')}</td><td>${o.received_at?new Date(o.received_at).toLocaleString('fr-FR'):''}</td></tr>`).join('')||'<tr><td colspan="9">Aucune commande.</td></tr>';$('msg').classList.add('hide');$('app').classList.remove('hide')}catch(e){$('msg').textContent=e.message}}load();</script></body></html>
