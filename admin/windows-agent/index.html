<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Windows Comptabilité</title><style>body{font-family:system-ui,Arial;background:#f4f6f8;color:#17202a;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:16px;margin-bottom:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#243447;color:#fff}.danger{background:#fdeaea;color:#941f1f}input{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;box-sizing:border-box}.muted{color:#6e7983}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.status{min-height:22px}.ok{color:#14733e}.err{color:#a12622}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}</style></head><body><main class="wrap"><div class="card"><h1>Agent Windows Comptabilité</h1><p class="muted">PDF détecté → import automatique → validation dans Comptabilité → renommage TRAITE → lot OD groupé → confirmation Charlemagne → archivage mensuel par fournisseur.</p></div><div class="card"><h2>Créer / réinstaller l’agent</h2><label>Nom du poste</label><div class="row"><input id="deviceName" placeholder="Ex. PC-Comptabilite"><button class="btn primary" onclick="createDevice()">Créer l’installateur</button></div><div id="msg" class="status"></div><div id="downloadBox"></div></div><div class="card"><h2>Appareils autorisés</h2><div id="devices" class="muted">Chargement…</div></div></main><script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/accounting-windows-agent';
const token=localStorage.getItem('college_admin_token')||'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,method='GET',body){const u=new URL(API);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
function installerScript(deviceToken){return `$ErrorActionPreference='Stop'\nAdd-Type -AssemblyName System.Windows.Forms\n$d=New-Object System.Windows.Forms.FolderBrowserDialog\n$d.Description='Choisissez le dossier des factures PDF'\nif($d.ShowDialog() -ne [System.Windows.Forms.DialogResult]::OK){exit}\n$folder=$d.SelectedPath\n$base=Join-Path $env:LOCALAPPDATA 'GestionCollege\\AccountingAgent'\nNew-Item -ItemType Directory -Force -Path $base|Out-Null\n@{folder=$folder;token='${deviceToken}';api='${API}'}|ConvertTo-Json|Set-Content -Encoding UTF8 (Join-Path $base 'config.json')\n$agent=@'\n$ErrorActionPreference="Continue"\nAdd-Type -AssemblyName System.Net.Http\n[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12\n$base=Join-Path $env:LOCALAPPDATA 'GestionCollege\\AccountingAgent'\n$configPath=Join-Path $base 'config.json'\n$statePath=Join-Path $base 'state.json'\n$logPath=Join-Path $base 'agent.log'\nfunction Log([string]$m){Add-Content -Encoding UTF8 $logPath ((Get-Date -Format s)+' '+$m)}\nfunction LoadState(){if(Test-Path $statePath){try{return Get-Content $statePath -Raw|ConvertFrom-Json}catch{}};return [pscustomobject]@{}}\nfunction SaveState($s){$s|ConvertTo-Json -Depth 10|Set-Content -Encoding UTF8 $statePath}\nfunction Client($cfg){$c=New-Object System.Net.Http.HttpClient;$c.Timeout=[TimeSpan]::FromMinutes(2);$c.DefaultRequestHeaders.Add('X-Device-Token',[string]$cfg.token);return $c}\nfunction GetJson($cfg,$action){$c=Client $cfg;try{$r=$c.GetAsync(([string]$cfg.api+'?action='+$action)).Result;$t=$r.Content.ReadAsStringAsync().Result;if(-not $r.IsSuccessStatusCode){throw ('HTTP '+[int]$r.StatusCode+' '+$t)};return $t|ConvertFrom-Json}finally{$c.Dispose()}}\nfunction PostJson($cfg,$action,$obj){$c=Client $cfg;try{$body=New-Object System.Net.Http.StringContent(($obj|ConvertTo-Json -Depth 8),[Text.Encoding]::UTF8,'application/json');$r=$c.PostAsync(([string]$cfg.api+'?action='+$action),$body).Result;$t=$r.Content.ReadAsStringAsync().Result;if(-not $r.IsSuccessStatusCode){throw ('HTTP '+[int]$r.StatusCode+' '+$t)};return $t|ConvertFrom-Json}finally{$c.Dispose()}}\nfunction UploadPdf($file,$cfg){$c=Client $cfg;$st=$null;$m=$null;try{$m=New-Object System.Net.Http.MultipartFormDataContent;$st=[IO.File]::Open($file.FullName,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite);$ct=New-Object System.Net.Http.StreamContent($st);$ct.Headers.ContentType=New-Object System.Net.Http.Headers.MediaTypeHeaderValue('application/pdf');$m.Add($ct,'file',$file.Name);$r=$c.PostAsync(([string]$cfg.api+'?action=upload'),$m).Result;$t=$r.Content.ReadAsStringAsync().Result;if(-not $r.IsSuccessStatusCode){throw ('HTTP '+[int]$r.StatusCode+' '+$t)};return $t|ConvertFrom-Json}finally{if($st){$st.Dispose()};if($m){$m.Dispose()};$c.Dispose()}}\nfunction FindInvoice($state,$id){foreach($p in $state.PSObject.Properties){if([string]$p.Value.invoice_id -eq [string]$id){return $p.Value}};return $null}\nfunction Safe([string]$s){return (($s -replace '[\\/:*?"<>|]','_').Trim())}\nLog 'Agent demarre'\nwhile($true){try{$cfg=Get-Content $configPath -Raw|ConvertFrom-Json;if(-not(Test-Path $cfg.folder)){Log 'Dossier source introuvable';Start-Sleep 30;continue};$state=LoadState\nforeach($file in Get-ChildItem -LiteralPath $cfg.folder -Filter *.pdf -File|Sort-Object LastWriteTime){try{if($file.Name -like 'TRAITE - *'){continue};if(((Get-Date)-$file.LastWriteTime).TotalSeconds -lt 10){continue};$hash=(Get-FileHash $file.FullName -Algorithm SHA256).Hash;if($state.PSObject.Properties.Name -contains $hash){continue};$r=UploadPdf $file $cfg;$entry=[pscustomobject]@{invoice_id=[string]$r.item.id;path=$file.FullName;name=$file.Name;processed=$false;archived=$false};$state|Add-Member -NotePropertyName $hash -NotePropertyValue $entry -Force;SaveState $state;Log ('Importee: '+$file.Name)}catch{Log ('Erreur import '+$file.Name+': '+$_.Exception.Message)}}\ntry{$p=GetJson $cfg 'pending';foreach($i in @($p.items)){try{$e=FindInvoice $state $i.invoice_id;if(-not $e){continue};$src=[string]$e.path;if(-not(Test-Path -LiteralPath $src)){continue};$name=[IO.Path]::GetFileName($src);if($name -notlike 'TRAITE - *'){$target=Join-Path (Split-Path $src -Parent) ('TRAITE - '+$name);if(Test-Path $target){$target=Join-Path (Split-Path $src -Parent) ('TRAITE - '+(Get-Date -Format 'yyyyMMdd-HHmmss')+' - '+$name)};Rename-Item -LiteralPath $src -NewName ([IO.Path]::GetFileName($target));$src=$target};PostJson $cfg 'ack' @{invoice_id=$i.invoice_id;local_file_name=[IO.Path]::GetFileName($src);od_file_name=''}|Out-Null;$e.path=$src;$e.name=[IO.Path]::GetFileName($src);$e.processed=$true;SaveState $state;Log ('Facture validee: '+$e.name)}catch{Log ('Erreur renommage: '+$_.Exception.Message)}}}catch{Log ('Erreur validations: '+$_.Exception.Message)}\ntry{$a=GetJson $cfg 'archive-pending';foreach($i in @($a.items)){try{$e=FindInvoice $state $i.invoice_id;if(-not $e){continue};$src=[string]$e.path;if(-not(Test-Path -LiteralPath $src)){continue};$month=if($i.invoice_date){([string]$i.invoice_date).Substring(0,7)}else{Get-Date -Format 'yyyy-MM'};$supplier=Safe([string]$i.supplier);if(-not $supplier){$supplier='FOURNISSEUR_INCONNU'};$dir=Join-Path $cfg.folder ('FACTURES_TRAITEES\\'+$month+'\\'+$supplier);New-Item -ItemType Directory -Force -Path $dir|Out-Null;$dest=Join-Path $dir ([IO.Path]::GetFileName($src));if(Test-Path $dest){$dest=Join-Path $dir ((Get-Date -Format 'yyyyMMdd-HHmmss')+' - '+[IO.Path]::GetFileName($src))};Move-Item -LiteralPath $src -Destination $dest;PostJson $cfg 'archive-ack' @{invoice_id=$i.invoice_id;archive_path=$dest}|Out-Null;$e.path=$dest;$e.archived=$true;SaveState $state;Log ('Archivee: '+$dest)}catch{Log ('Erreur archivage: '+$_.Exception.Message)}}}catch{Log ('Erreur archive-pending: '+$_.Exception.Message)}\n}catch{Log ('Erreur boucle: '+$_.Exception.Message)};Start-Sleep -Seconds 30}\n'@\n$agentPath=Join-Path $base 'agent.ps1'\nSet-Content -Encoding UTF8 $agentPath $agent\n$startup=[Environment]::GetFolderPath('Startup')\n$vbs=Join-Path $startup 'GestionCollege-AccountingAgent.vbs'\n$escaped=$agentPath.Replace('"','""')\nSet-Content -Encoding ASCII $vbs ('Set s=CreateObject("WScript.Shell")'+[Environment]::NewLine+'s.Run "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File ""'+$escaped+'""",0,False')\nStart-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$agentPath)\n[System.Windows.Forms.MessageBox]::Show('Agent installe et surveillance active.','Gestion College')|Out-Null\n`}
function download(name,text){const b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function createDevice(){const name=$('deviceName').value.trim();if(!name)return $('msg').textContent='Nom du poste obligatoire.';try{$('msg').textContent='Création…';const j=await api('create-device','POST',{device_name:name}),script=installerScript(j.token);$('downloadBox').innerHTML='<p class="ok"><b>Nouvel installateur prêt.</b></p><button id="dl" class="btn primary">Télécharger Installer-Agent-Comptabilite.ps1</button><p class="muted">Réinstalle cet agent si une ancienne version était déjà présente. Il remplacera automatiquement le script précédent.</p>';$('dl').onclick=()=>download('Installer-Agent-Comptabilite.ps1',script);$('msg').textContent='';loadDevices()}catch(e){$('msg').className='status err';$('msg').textContent=e.message}}
async function revoke(id){if(!confirm('Révoquer cet agent Windows ?'))return;await api('revoke-device','POST',{id});loadDevices()}
async function loadDevices(){try{const j=await api('list-devices');$('devices').innerHTML=`<table><thead><tr><th>Poste</th><th>État</th><th>Dernier contact</th><th>Dernier import</th><th></th></tr></thead><tbody>${(j.devices||[]).map(d=>`<tr><td>${esc(d.device_name)}</td><td>${d.active?'<span class="ok">Actif</span>':'Révoqué'}</td><td>${d.last_seen_at?new Date(d.last_seen_at).toLocaleString('fr-FR'):'—'}</td><td>${d.last_upload_at?new Date(d.last_upload_at).toLocaleString('fr-FR'):'—'}</td><td>${d.active?`<button class="btn danger" onclick="revoke('${d.id}')">Révoquer</button>`:''}</td></tr>`).join('')}</tbody></table>`}catch(e){$('devices').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
if(token)loadDevices();else $('msg').textContent='Connecte-toi d’abord au compte Administrateur.';
</script></body></html>
