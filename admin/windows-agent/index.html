<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Windows Comptabilité</title><style>body{font-family:system-ui,Arial;background:#f4f6f8;color:#17202a;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:16px;margin-bottom:14px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#243447;color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:#941f1f}input{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;box-sizing:border-box}.muted{color:#6e7983}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.status{min-height:22px}.ok{color:#14733e}.err{color:#a12622}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}</style></head><body><main class="wrap"><div class="card"><h1>Agent Windows Comptabilité</h1><p class="muted">L’agent surveille un dossier Windows même lorsque le navigateur est fermé. Il démarre avec la session Windows et envoie les nouveaux PDF vers Comptabilité.</p></div><div class="card"><h2>Créer un agent pour ce PC</h2><label>Nom du poste</label><div class="row"><input id="deviceName" placeholder="Ex. PC-Comptabilite"><button class="btn primary" onclick="createDevice()">Créer l’installateur</button></div><div id="msg" class="status"></div><div id="downloadBox"></div></div><div class="card"><h2>Appareils autorisés</h2><div id="devices" class="muted">Chargement…</div></div></main><script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/accounting-windows-agent';
const token=localStorage.getItem('college_admin_token')||'';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,method='GET',body){const u=new URL(API);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
function installerScript(deviceToken){return `$ErrorActionPreference = 'Stop'\nAdd-Type -AssemblyName System.Windows.Forms\n$dialog = New-Object System.Windows.Forms.FolderBrowserDialog\n$dialog.Description = 'Choisissez le dossier contenant les factures PDF'\n$dialog.ShowNewFolderButton = $true\nif ($dialog.ShowDialog() -ne [System.Windows.Forms.DialogResult]::OK) { exit }\n$folder = $dialog.SelectedPath\n$base = Join-Path $env:LOCALAPPDATA 'GestionCollege\\AccountingAgent'\nNew-Item -ItemType Directory -Force -Path $base | Out-Null\n$config = @{ folder = $folder; token = '${deviceToken}'; endpoint = '${API}?action=upload' }\n$config | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $base 'config.json')\n$agent = @'\n$ErrorActionPreference = "Continue"\nAdd-Type -AssemblyName System.Net.Http\n[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12\n$base = Join-Path $env:LOCALAPPDATA 'GestionCollege\\AccountingAgent'\n$configPath = Join-Path $base 'config.json'\n$statePath = Join-Path $base 'state.json'\n$logPath = Join-Path $base 'agent.log'\nfunction Log([string]$m){ Add-Content -Encoding UTF8 -Path $logPath -Value ((Get-Date -Format s) + ' ' + $m) }\nfunction LoadState(){ if(Test-Path $statePath){ try { return (Get-Content $statePath -Raw | ConvertFrom-Json) } catch {} }; return @{} }\nfunction SaveState($s){ $s | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $statePath }\nfunction UploadPdf($file,$cfg){\n  $client = New-Object System.Net.Http.HttpClient\n  $stream = $null\n  $multi = $null\n  try {\n    $client.Timeout = [TimeSpan]::FromMinutes(2)\n    $client.DefaultRequestHeaders.Add('X-Device-Token',[string]$cfg.token)\n    $multi = New-Object System.Net.Http.MultipartFormDataContent\n    $stream = [System.IO.File]::Open($file.FullName,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Read,[System.IO.FileShare]::ReadWrite)\n    $content = New-Object System.Net.Http.StreamContent($stream)\n    $content.Headers.ContentType = New-Object System.Net.Http.Headers.MediaTypeHeaderValue('application/pdf')\n    $multi.Add($content,'file',$file.Name)\n    $resp = $client.PostAsync([string]$cfg.endpoint,$multi).Result\n    $txt = $resp.Content.ReadAsStringAsync().Result\n    if(-not $resp.IsSuccessStatusCode){ throw ('HTTP ' + [int]$resp.StatusCode + ' ' + $txt) }\n    return ($txt | ConvertFrom-Json)\n  } finally { if($stream){$stream.Dispose()}; if($multi){$multi.Dispose()}; $client.Dispose() }\n}\nLog 'Agent demarre'\nwhile($true){\n  try {\n    $cfg = Get-Content $configPath -Raw | ConvertFrom-Json\n    if(-not (Test-Path $cfg.folder)){ Log ('Dossier introuvable: ' + $cfg.folder); Start-Sleep -Seconds 30; continue }\n    $state = LoadState\n    foreach($file in Get-ChildItem -LiteralPath $cfg.folder -Filter *.pdf -File | Sort-Object LastWriteTime){\n      try {\n        if(((Get-Date)-$file.LastWriteTime).TotalSeconds -lt 10){ continue }\n        $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash\n        if($state.PSObject.Properties.Name -contains $hash){ continue }\n        $result = UploadPdf $file $cfg\n        $state | Add-Member -NotePropertyName $hash -NotePropertyValue (Get-Date).ToString('o') -Force\n        SaveState $state\n        if($result.duplicate){ Log ('Deja presente: ' + $file.Name) } else { Log ('Importee: ' + $file.Name) }\n      } catch { Log ('Erreur ' + $file.Name + ': ' + $_.Exception.Message) }\n    }\n  } catch { Log ('Erreur boucle: ' + $_.Exception.Message) }\n  Start-Sleep -Seconds 30\n}\n'@\n$agentPath = Join-Path $base 'agent.ps1'\nSet-Content -Encoding UTF8 -Path $agentPath -Value $agent\n$startup = [Environment]::GetFolderPath('Startup')\n$vbs = Join-Path $startup 'GestionCollege-AccountingAgent.vbs'\n$escaped = $agentPath.Replace('"','""')\nSet-Content -Encoding ASCII -Path $vbs -Value ('Set s=CreateObject("WScript.Shell")' + [Environment]::NewLine + 's.Run "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File ""' + $escaped + '""",0,False')\nStart-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$agentPath)\n[System.Windows.Forms.MessageBox]::Show('Agent Windows installe. Le dossier sera surveille toutes les 30 secondes.','Gestion College') | Out-Null\n`}
function downloadText(name,text){const b=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function createDevice(){const name=$('deviceName').value.trim();if(!name)return $('msg').textContent='Nom du poste obligatoire.';try{$('msg').className='status';$('msg').textContent='Création…';const j=await api('create-device','POST',{device_name:name});const script=installerScript(j.token);$('downloadBox').innerHTML=`<p class="ok"><b>Agent créé.</b> La clé est intégrée dans l’installateur et n’est affichée nulle part.</p><button class="btn primary" id="dl">Télécharger Installer-Agent-Comptabilite.ps1</button><p class="muted">Sur le PC concerné : clic droit sur le fichier → Exécuter avec PowerShell, puis choisir le dossier des factures.</p>`;$('dl').onclick=()=>downloadText('Installer-Agent-Comptabilite.ps1',script);$('msg').textContent='';await loadDevices()}catch(e){$('msg').className='status err';$('msg').textContent=e.message}}
async function revoke(id){if(!confirm('Révoquer cet agent Windows ? Il ne pourra plus importer de factures.'))return;try{await api('revoke-device','POST',{id});await loadDevices()}catch(e){alert(e.message)}}
async function loadDevices(){try{const j=await api('list-devices');$('devices').innerHTML=`<table><thead><tr><th>Poste</th><th>État</th><th>Dernier contact</th><th>Dernier import</th><th></th></tr></thead><tbody>${(j.devices||[]).map(d=>`<tr><td>${esc(d.device_name)}</td><td>${d.active?'<span class="ok">Actif</span>':'Révoqué'}</td><td>${d.last_seen_at?new Date(d.last_seen_at).toLocaleString('fr-FR'):'—'}</td><td>${d.last_upload_at?new Date(d.last_upload_at).toLocaleString('fr-FR'):'—'}</td><td>${d.active?`<button class="btn danger" onclick="revoke('${d.id}')">Révoquer</button>`:''}</td></tr>`).join('')}</tbody></table>`}catch(e){$('devices').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
if(!token){$('msg').className='status err';$('msg').textContent='Connecte-toi d’abord au compte Administrateur.'}else loadDevices();
</script></body></html>
