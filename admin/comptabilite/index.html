<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initialiser Comptabilité</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:8vh auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:14px;padding:18px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1;color:#17202a}input{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px}.muted{color:#6e7983;font-size:13px}.status{min-height:22px;margin-top:10px}.err{color:#a12622}.ok{color:#14733e}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><section class="card"><h1>Compte Comptabilité</h1><p class="muted">Cette page utilise votre session administrateur pour créer ou réinitialiser le compte <b>comptabilite</b>. L’utilisateur devra changer ce mot de passe lors de sa première connexion.</p><label>Mot de passe temporaire</label><input id="p1" type="password" autocomplete="new-password"><br><br><label>Confirmation</label><input id="p2" type="password" autocomplete="new-password"><br><br><div class="actions"><button class="btn primary" onclick="setup()">Créer / réinitialiser</button><a class="btn secondary" href="../">Retour Admin</a><a class="btn secondary" href="../../comptabilite/">Ouvrir Comptabilité</a></div><div id="msg" class="status"></div></section></main><script>const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/accounting-api',token=localStorage.getItem('college_admin_token')||'', $=x=>document.getElementById(x);async function setup(){const a=$('p1').value,b=$('p2').value,m=$('msg');m.className='status';if(!token){m.className='status err';m.textContent='Connectez-vous d’abord dans Administration.';return}if(a.length<10){m.className='status err';m.textContent='10 caractères minimum.';return}if(a!==b){m.className='status err';m.textContent='Les mots de passe ne correspondent pas.';return}m.textContent='Initialisation…';try{const r=await fetch(API+'?action=setup-account',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({password:a})}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur');m.className='status ok';m.textContent='Compte comptabilite initialisé. Ouvrez la session Comptabilité avec ce mot de passe temporaire.';$('p1').value='';$('p2').value=''}catch(e){m.className='status err';m.textContent=e.message}}</script></body></html>
