<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration - Gestion collège</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#15202b;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(400px,100%);background:#fff;border:1px solid #dde3e8;border-radius:16px;padding:24px;box-shadow:0 10px 30px #0001}h1,h2,h3{margin:0 0 12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#1f2b38;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin-bottom:18px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#dce5ed;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#314254;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px}.kpi{font-size:28px;font-weight:800}.muted{color:#6e7983;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;min-width:180px}.table-wrap{overflow:auto;background:#fff;border:1px solid #dde3e8;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px}th{background:#f7f9fa;position:sticky;top:0}.pill{padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.alert{color:#a32929;font-weight:700}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:50}.modal .box{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields .full{grid-column:1/-1}.status{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--bad)}.stats-frame{width:100%;min-height:760px;border:0;background:#f4f6f8;border-radius:12px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.row,.fields{grid-template-columns:1fr}.main{padding:12px}.top{align-items:flex-start;flex-direction:column}.stats-frame{min-height:900px}}</style></head><body>
<section id="login" class="login"><div class="box"><h1>Administration</h1><p class="muted">Gestion collège</p><label>Utilisateur</label><input id="user" value="admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Gestion collège</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div class="muted" id="serverTime"></div></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn primary" onclick="exportExcel()">Exporter Excel</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/admin-api';let token=localStorage.getItem('college_admin_token')||'';let db=null;let page='dashboard';const pages=[['dashboard','Tableau de bord'],['categories','Catégories'],['products','Produits & stocks'],['apps','Applications'],['events','Inventaires / sorties'],['purchases','Achats'],['stats','Statistiques'],['settings','Paramètres']];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
async function api(action,method='GET',body){const r=await fetch(API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function login(){try{$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('college_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message}}
function logout(){token='';db=null;localStorage.removeItem('college_admin_token');$('app').classList.add('hide');$('login').classList.remove('hide')}
function initNav(){$('nav').innerHTML=pages.map(([k,n])=>`<button data-p="${k}" onclick="show('${k}')">${n}</button>`).join('')}
async function refresh(){try{db=await api('data');$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}catch(e){alert(e.message)}}
function show(p){page=p;render()}
function render(){if(!db)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,categories:renderCategories,products:renderProducts,apps:renderApps,events:renderEvents,purchases:renderPurchases,stats:renderStats,settings:renderSettings}[page]||renderDashboard)()}
const catById=id=>db.categories.find(x=>x.id===id),prodById=id=>db.products.find(x=>x.id===id),bal=id=>Number(db.balances.find(x=>x.product_id===id)?.quantity||0);
function renderDashboard(){const active=db.products.filter(p=>p.active),value=active.reduce((s,p)=>s+bal(p.id)*Number(p.unit_price||0),0),low=active.filter(p=>bal(p.id)<Number(p.min_stock||0)).length;$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${active.length}</div></div><div class="card"><div class="muted">Valeur du stock</div><div class="kpi">${value.toFixed(2)} €</div></div><div class="card"><div class="muted">Sous le seuil mini</div><div class="kpi">${low}</div></div><div class="card"><div class="muted">Saisies récentes</div><div class="kpi">${db.events.length}</div></div></div><br><div class="card"><h3>Stocks par catégorie</h3>${db.categories.map(c=>{const ps=active.filter(p=>p.category_id===c.id);return `<p><b>${esc(c.name)}</b> — ${ps.length} produits — ${ps.reduce((s,p)=>s+bal(p.id),0)} unités <button class="btn danger" onclick="resetCat('${c.id}')">Remettre à zéro</button></p>`}).join('')}</div>`}
function renderCategories(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editCategory()">Ajouter une catégorie</button></div><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Code</th><th>Mode app</th><th>Active</th><th></th></tr></thead><tbody>${db.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.code)}</td><td>${esc(c.app_mode)}</td><td>${c.active?'Oui':'Non'}</td><td><button class="btn secondary" onclick="editCategory('${c.id}')">Modifier</button> <button class="btn danger" onclick="resetCat('${c.id}')">Stock à zéro</button></td></tr>`).join('')}</tbody></table></div>`}
function renderProducts(){const cats='<option value="">Toutes catégories</option>'+db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editProduct()">Ajouter un produit</button><select id="pf" onchange="filterProducts()">${cats}</select><input id="ps" placeholder="Rechercher" oninput="filterProducts()"></div><div class="table-wrap"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Mini</th><th>Cible</th><th>Stock actuel</th><th></th></tr></thead><tbody id="prodBody"></tbody></table></div>`;filterProducts()}
function filterProducts(){const f=$('pf')?.value||'',s=($('ps')?.value||'').toLowerCase();$('prodBody').innerHTML=db.products.filter(p=>(!f||p.category_id===f)&&(!s||p.name.toLowerCase().includes(s)||p.code.toLowerCase().includes(s))).map(p=>`<tr><td>${esc(p.name)}<div class="muted">${esc(p.code)}</div></td><td>${esc(catById(p.category_id)?.name||'')}</td><td>${Number(p.unit_price).toFixed(2)} €</td><td>${p.min_stock}</td><td>${p.target_stock}</td><td><b>${bal(p.id)}</b></td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Modifier</button> <button class="btn secondary" onclick="setStock('${p.id}')">Stock</button></td></tr>`).join('')}
function renderApps(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editApp()">Créer une application</button></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>Catégorie</th><th>Services</th><th>Produits</th><th>Lien</th><th></th></tr></thead><tbody>${db.applications.map(a=>{const n=db.application_products.filter(m=>m.application_id===a.id&&m.active).length;const url='../?id='+a.public_id;return `<tr><td>${esc(a.name)}<div class="muted">${esc(a.code)}</div></td><td>${esc(catById(a.category_id)?.name||'')}</td><td>${esc((a.services||[]).join(', '))}</td><td>${n}</td><td><a href="${url}" target="_blank">Ouvrir</a></td><td><button class="btn secondary" onclick="editApp('${a.id}')">Modifier</button></td></tr>`}).join('')}</tbody></table></div>`}
function renderEvents(){$('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Application</th><th>Type</th><th>Service</th><th>Remarque</th><th>Détails</th></tr></thead><tbody>${db.events.map(e=>{const a=db.applications.find(x=>x.id===e.application_id);const items=db.event_items.filter(i=>i.event_id===e.id);return `<tr><td>${esc(e.event_date)}<div class="muted">${new Date(e.created_at).toLocaleString('fr-FR')}</div></td><td>${esc(a?.name||'')}</td><td><span class="pill">${esc(e.event_type)}</span></td><td>${esc(e.service||'')}</td><td>${esc(e.note||'')}</td><td>${items.map(i=>esc(i.product_name_snapshot)+': '+i.quantity).join('<br>')}</td></tr>`}).join('')}</tbody></table></div>`}
function renderPurchases(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPurchase()">Ajouter un achat</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Produit</th><th>Quantité</th><th>Prix unitaire</th><th>Fournisseur</th><th>Total</th></tr></thead><tbody>${db.purchases.map(x=>`<tr><td>${x.purchase_date}</td><td>${esc(prodById(x.product_id)?.name||'')}</td><td>${x.quantity}</td><td>${Number(x.unit_price).toFixed(2)} €</td><td>${esc(x.supplier||'')}</td><td>${(Number(x.quantity)*Number(x.unit_price)).toFixed(2)} €</td></tr>`).join('')}</tbody></table></div>`}
function renderStats(){$('content').innerHTML='<iframe class="stats-frame" src="statistiques/"></iframe>'}
function renderSettings(){$('content').innerHTML=`<div class="card" style="max-width:560px"><h3>Changer le mot de passe administrateur</h3><input id="newpass" type="password" placeholder="Nouveau mot de passe (10 caractères minimum)"><br><br><button class="btn primary" onclick="changePassword()">Changer le mot de passe</button><p class="muted">Après modification, vous devrez vous reconnecter.</p></div>`}
function modal(title,body,onSave){$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${esc(title)}</h2>${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="msave">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="mstatus" class="status"></div></div></div>`;$('msave').onclick=onSave}function closeModal(){$('modal').innerHTML=''}
function editCategory(id){const c=id?db.categories.find(x=>x.id===id):{};modal(id?'Modifier la catégorie':'Nouvelle catégorie',`<div class="fields"><div><label>Nom</label><input id="cname" value="${esc(c.name||'')}"></div><div><label>Code</label><input id="ccode" value="${esc(c.code||'')}"></div><div><label>Mode</label><select id="cmode"><option value="inventaire">Inventaire</option><option value="sortie">Sortie</option><option value="sortie_inventaire">Sortie + inventaire</option></select></div><div><label>Couleur</label><input id="ccolor" type="color" value="${esc(c.color||'#243447')}"></div></div>`,async()=>{try{await api('save-category','POST',{id,name:$('cname').value,code:$('ccode').value,app_mode:$('cmode').value,color:$('ccolor').value,active:true});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}});$('cmode').value=c.app_mode||'sortie_inventaire'}
function editProduct(id){const p=id?db.products.find(x=>x.id===id):{};modal(id?'Modifier le produit':'Nouveau produit',`<div class="fields"><div><label>Nom</label><input id="pname" value="${esc(p.name||'')}"></div><div><label>Code</label><input id="pcode" value="${esc(p.code||'')}"></div><div><label>Catégorie</label><select id="pcat">${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Unité</label><input id="punit" value="${esc(p.unit||'pièce')}"></div><div><label>Prix unitaire</label><input id="pprice" type="number" step="0.01" value="${p.unit_price??0}"></div><div><label>Stock mini</label><input id="pmin" type="number" value="${p.min_stock??0}"></div><div><label>Stock cible</label><input id="ptarget" type="number" value="${p.target_stock??0}"></div><div><label>Stock de départ</label><input id="pinitial" type="number" value="${p.initial_stock??0}"></div></div>`,async()=>{try{await api('save-product','POST',{id,name:$('pname').value,code:$('pcode').value,category_id:$('pcat').value,unit:$('punit').value,unit_price:$('pprice').value,min_stock:$('pmin').value,target_stock:$('ptarget').value,initial_stock:$('pinitial').value,active:true});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}});$('pcat').value=p.category_id||db.categories[0]?.id||''}
async function setStock(id){const p=prodById(id),q=prompt('Nouveau stock pour '+p.name,bal(id));if(q===null)return;try{await api('set-stock','POST',{product_id:id,quantity:Number(q)});await refresh()}catch(e){alert(e.message)}}
async function resetCat(id){const c=catById(id);if(!confirm(`Remettre à zéro tous les stocks de la catégorie « ${c?.name} » ?\nL’historique sera conservé.`))return;try{await api('reset-category','POST',{category_id:id});await refresh()}catch(e){alert(e.message)}}
function editApp(id){const a=id?db.applications.find(x=>x.id===id):{};const cat=a.category_id||db.categories[0]?.id||'';const checked=new Set(db.application_products.filter(m=>m.application_id===id&&m.active).map(m=>m.product_id));modal(id?'Modifier l’application':'Nouvelle application',`<div class="fields"><div><label>Nom</label><input id="aname" value="${esc(a.name||'')}"></div><div><label>Code</label><input id="acode" value="${esc(a.code||'')}"></div><div><label>Catégorie</label><select id="acat" onchange="renderAppProducts()">${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Services (séparés par virgule)</label><input id="aservices" value="${esc((a.services||['Midi']).join(', '))}"></div><div class="full"><label>Description</label><textarea id="adesc">${esc(a.description||'')}</textarea></div><div class="full"><label>Produits affichés dans l’application</label><div id="aprod"></div></div></div>`,async()=>{try{const product_ids=[...document.querySelectorAll('#aprod input:checked')].map(x=>x.value);await api('save-application','POST',{id,name:$('aname').value,code:$('acode').value,category_id:$('acat').value,services:$('aservices').value,description:$('adesc').value,product_ids,active:true});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}});$('acat').value=cat;window._appChecked=checked;renderAppProducts()}
function renderAppProducts(){const cat=$('acat').value,checked=window._appChecked||new Set();$('aprod').innerHTML=db.products.filter(p=>p.category_id===cat&&p.active).map(p=>`<label style="display:block;margin:5px"><input type="checkbox" value="${p.id}" style="width:auto" ${checked.has(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}
function editPurchase(){modal('Ajouter un achat',`<div class="fields"><div><label>Produit</label><select id="buyprod">${db.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Date</label><input id="buydate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Quantité</label><input id="buyqty" type="number" min="0.001"></div><div><label>Prix unitaire</label><input id="buyprice" type="number" step="0.01"></div><div><label>Fournisseur</label><input id="buysup"></div><div><label>Note</label><input id="buynote"></div></div>`,async()=>{try{await api('save-purchase','POST',{product_id:$('buyprod').value,purchase_date:$('buydate').value,quantity:$('buyqty').value,unit_price:$('buyprice').value,supplier:$('buysup').value,note:$('buynote').value});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}})}
async function changePassword(){const p=$('newpass').value;try{await api('change-password','POST',{password:p});alert('Mot de passe modifié. Reconnectez-vous.');logout()}catch(e){alert(e.message)}}
function exportExcel(){if(typeof XLSX==='undefined'){alert('Module Excel indisponible');return}const wb=XLSX.utils.book_new();const stocks=db.products.map(p=>({Code:p.code,Produit:p.name,Catégorie:catById(p.category_id)?.name||'',Unité:p.unit,'Prix unitaire':Number(p.unit_price),'Stock mini':Number(p.min_stock),'Stock cible':Number(p.target_stock),'Stock actuel':bal(p.id),'Valeur stock':bal(p.id)*Number(p.unit_price)}));const events=db.events.map(e=>({Date:e.event_date,Application:db.applications.find(a=>a.id===e.application_id)?.name||'',Type:e.event_type,Service:e.service||'',Remarque:e.note||'',Créé:new Date(e.created_at).toLocaleString('fr-FR')}));const details=db.event_items.map(i=>{const e=db.events.find(x=>x.id===i.event_id);return {Date:e?.event_date||'',Produit:i.product_name_snapshot,Quantité:Number(i.quantity),'Prix unitaire':Number(i.unit_price_snapshot),Type:e?.event_type||''}});const purchases=db.purchases.map(x=>({Date:x.purchase_date,Produit:prodById(x.product_id)?.name||'',Quantité:Number(x.quantity),'Prix unitaire':Number(x.unit_price),Fournisseur:x.supplier||'',Note:x.note||'',Total:Number(x.quantity)*Number(x.unit_price)}));[['Stocks',stocks],['Saisies',events],['Details_Saisies',details],['Achats',purchases]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n));XLSX.writeFile(wb,'Gestion_College_'+new Date().toISOString().slice(0,10)+'.xlsx')}
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');initNav();refresh().catch(()=>logout())}
</script></body></html>
