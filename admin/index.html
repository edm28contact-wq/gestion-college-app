<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration - Gestion collège</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#15202b;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(400px,100%);background:#fff;border:1px solid #dde3e8;border-radius:16px;padding:24px;box-shadow:0 10px 30px #0001}h1,h2,h3{margin:0 0 12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1;color:#15202b}.danger{background:#fdeaea;color:var(--bad)}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#1f2b38;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin-bottom:18px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#dce5ed;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#314254;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px}.kpi{font-size:28px;font-weight:800}.muted{color:#6e7983;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;min-width:180px}.table-wrap{overflow:auto;background:#fff;border:1px solid #dde3e8;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px;vertical-align:middle}th{background:#f7f9fa;position:sticky;top:0}.pill{padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.alert{color:#a32929;font-weight:700}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:50}.modal .box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields .full{grid-column:1/-1}.status{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--bad)}.stats-frame{width:100%;min-height:760px;border:0;background:#f4f6f8;border-radius:12px}.site-link{word-break:break-all}.qr{width:96px;height:96px;border:1px solid #dde3e8;border-radius:8px;background:#fff;padding:4px}.site-actions{display:flex;gap:6px;flex-wrap:wrap}.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.check{display:flex;gap:8px;align-items:center;border:1px solid #dde3e8;border-radius:9px;padding:9px;background:#f9fafb}.check input{width:auto}.option-list{display:flex;gap:5px;flex-wrap:wrap}.product-list{max-height:220px;overflow:auto;border:1px solid #dde3e8;border-radius:9px;padding:8px}.product-list label{display:block;padding:5px}.product-list input{width:auto}.section-title{font-weight:800;margin:12px 0 8px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.check-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.row,.fields,.check-grid{grid-template-columns:1fr}.main{padding:12px}.top{align-items:flex-start;flex-direction:column}.stats-frame{min-height:900px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="box"><h1>Administration</h1><p class="muted">Gestion collège</p><label>Utilisateur</label><input id="user" value="admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Gestion collège</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div class="muted" id="serverTime"></div></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn primary" onclick="exportExcel()">Exporter Excel</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/admin-api';
const SITE_API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/site-admin-api';
const PUBLIC_ROOT='https://edm28contact-wq.github.io/gestion-college-app/';
const ADMIN_AUTH_FETCH=window.fetch.bind(window);
let token=localStorage.getItem('college_admin_token')||'',db=null,page='dashboard';
const pages=[['dashboard','Tableau de bord'],['categories','Catégories'],['products','Produits & stocks'],['apps','Sites par catégorie'],['events','Inventaires / sorties'],['purchases','Achats'],['stats','Statistiques'],['settings','Paramètres']];
const optionLabels={inventory:'Inventaire',outgoing:'Sorties de stock',purchases:'Achats',unit_price:'Prix unitaire',current_stock:'Stock actuel',supplier:'Fournisseur',service:'Service',note:'Remarque',purchase_history:'Historique achats'};
const defaultOptions={inventory:true,outgoing:false,purchases:true,unit_price:false,current_stock:false,supplier:true,service:true,note:true,purchase_history:true};
const PRODUCT_FILTER_CATEGORY_KEY='college_admin_product_filter_category',PRODUCT_FILTER_SEARCH_KEY='college_admin_product_filter_search';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,method='GET',body){const fetcher=['login','change-password'].includes(action)?ADMIN_AUTH_FETCH:window.fetch;const r=await fetcher(API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function siteApi(action='list',method='GET',body){const r=await fetch(SITE_API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function login(){try{$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('college_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message}}
function logout(){token='';db=null;localStorage.removeItem('college_admin_token');$('app').classList.add('hide');$('login').classList.remove('hide')}
function initNav(){$('nav').innerHTML=pages.map(([k,n])=>`<button data-p="${k}" onclick="show('${k}')">${n}</button>`).join('')}
async function refresh(){try{const [main,sites]=await Promise.all([api('data'),siteApi('list')]);db=main;db.applications=sites.applications||[];db.application_products=sites.application_products||[];$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}catch(e){alert(e.message)}}
function show(p){page=p;render()}
function render(){if(!db)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,categories:renderCategories,products:renderProducts,apps:renderApps,events:renderEvents,purchases:renderPurchases,stats:renderStats,settings:renderSettings}[page]||renderDashboard)()}
const catById=id=>db.categories.find(x=>x.id===id),prodById=id=>db.products.find(x=>x.id===id),bal=id=>Number(db.balances.find(x=>x.product_id===id)?.quantity||0),siteForCategory=id=>db.applications.find(a=>a.category_id===id&&a.active!==false),siteUrl=a=>PUBLIC_ROOT+'?id='+encodeURIComponent(a.public_id);
function renderDashboard(){const active=db.products.filter(p=>p.active),value=active.reduce((s,p)=>s+bal(p.id)*Number(p.unit_price||0),0),low=active.filter(p=>bal(p.id)<Number(p.min_stock||0)).length,repas=active.find(p=>String(p.code||'').trim().toUpperCase()==='REPAS'),d=new Date(db.server_time||Date.now()),year=d.getFullYear(),month=String(d.getMonth()+1).padStart(2,'0'),prefix=`${year}-${month}`,rp=(db.purchases||[]).filter(x=>repas&&x.product_id===repas.id&&x.cancelled!==true),monthTotal=rp.filter(x=>String(x.purchase_date||'').slice(0,7)===prefix).reduce((s,x)=>s+Number(x.quantity||0),0),yearTotal=rp.filter(x=>String(x.purchase_date||'').slice(0,4)===String(year)).reduce((s,x)=>s+Number(x.quantity||0),0),monthLabel=d.toLocaleDateString('fr-FR',{month:'long'});$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${active.length}</div></div><div class="card"><div class="muted">Valeur du stock</div><div class="kpi">${value.toFixed(2)} €</div></div><div class="card"><div class="muted">Sous le seuil mini</div><div class="kpi">${low}</div></div><div class="card"><div class="muted">Repas cumulés</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px"><div><div class="muted">${esc(monthLabel)}</div><div class="kpi" style="font-size:23px">${monthTotal.toLocaleString('fr-FR')}</div></div><div><div class="muted">Année ${year}</div><div class="kpi" style="font-size:23px">${yearTotal.toLocaleString('fr-FR')}</div></div></div></div></div><br><div class="card"><h3>Stocks par catégorie</h3>${db.categories.map(c=>{const ps=active.filter(p=>p.category_id===c.id);return `<p><b>${esc(c.name)}</b> — ${ps.length} produits — ${ps.reduce((s,p)=>s+bal(p.id),0)} unités <button class="btn danger" onclick="resetCat('${c.id}')">Remettre à zéro</button></p>`}).join('')}</div>`}
function renderCategories(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editCategory()">Ajouter une catégorie</button><button class="btn secondary" onclick="show('apps')">Sites et QR codes</button></div><div class="table-wrap"><table><thead><tr><th>Nom</th><th>Code</th><th>Mode app</th><th>Active</th><th>Site</th><th></th></tr></thead><tbody>${db.categories.map(c=>{const a=siteForCategory(c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.code)}</td><td>${esc(c.app_mode)}</td><td>${c.active?'Oui':'Non'}</td><td>${a?'<span class="pill">Créé</span>':'<span class="muted">Non créé</span>'}</td><td><button class="btn secondary" onclick="editCategory('${c.id}')">Modifier</button> ${a?`<button class="btn secondary" onclick="editSite('${a.id}')">Configurer le site</button>`:`<button class="btn primary" onclick="editSite(null,'${c.id}')">Créer le site</button>`} <button class="btn danger" onclick="resetCat('${c.id}')">Stock à zéro</button></td></tr>`}).join('')}</tbody></table></div>`}
function renderProducts(){let savedCat=localStorage.getItem(PRODUCT_FILTER_CATEGORY_KEY)||'',savedSearch=localStorage.getItem(PRODUCT_FILTER_SEARCH_KEY)||'';if(savedCat&&!db.categories.some(c=>c.id===savedCat)){savedCat='';localStorage.removeItem(PRODUCT_FILTER_CATEGORY_KEY)}const cats='<option value="">Toutes catégories</option>'+db.categories.map(c=>`<option value="${c.id}" ${c.id===savedCat?'selected':''}>${esc(c.name)}</option>`).join('');$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editProduct()">Ajouter un produit</button><select id="pf" onchange="filterProducts()">${cats}</select><input id="ps" placeholder="Rechercher" value="${esc(savedSearch)}" oninput="filterProducts()"></div><div class="table-wrap"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Mini</th><th>Cible</th><th>Stock actuel</th><th></th></tr></thead><tbody id="prodBody"></tbody></table></div>`;filterProducts(false)}
function filterProducts(saveState=true){const f=$('pf')?.value||'',raw=$('ps')?.value||'',s=raw.toLowerCase();if(saveState){localStorage.setItem(PRODUCT_FILTER_CATEGORY_KEY,f);localStorage.setItem(PRODUCT_FILTER_SEARCH_KEY,raw)}$('prodBody').innerHTML=db.products.filter(p=>p.active!==false&&(!f||p.category_id===f)&&(!s||p.name.toLowerCase().includes(s)||p.code.toLowerCase().includes(s))).map(p=>`<tr><td>${esc(p.name)}<div class="muted">${esc(p.code)}</div></td><td>${esc(catById(p.category_id)?.name||'')}</td><td>${Number(p.unit_price).toFixed(2)} €</td><td>${p.min_stock}</td><td>${p.target_stock}</td><td><b>${bal(p.id)}</b></td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Modifier</button> <button class="btn secondary" onclick="setStock('${p.id}')">Stock</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">Supprimer</button></td></tr>`).join('')}
function enabledLabels(a){const o={...defaultOptions,...(a.site_options||{})};return Object.entries(optionLabels).filter(([k])=>o[k]).map(([,v])=>`<span class="pill">${esc(v)}</span>`).join(' ')}
function renderApps(){const cats=db.categories.filter(c=>c.active!==false),created=cats.filter(c=>siteForCategory(c.id)).length;$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Catégories actives</div><div class="kpi">${cats.length}</div></div><div class="card"><div class="muted">Sites créés</div><div class="kpi">${created}</div></div><div class="card"><div class="muted">Sites à créer</div><div class="kpi">${cats.length-created}</div></div></div><br><div class="card"><b>Création configurable</b><div class="muted">Avant de créer un site, choisissez exactement les fonctions et informations qui seront visibles.</div></div><br><div class="table-wrap"><table><thead><tr><th>Catégorie</th><th>Configuration</th><th>Produits</th><th>Lien public</th><th>QR code</th><th>Actions</th></tr></thead><tbody>${cats.map(c=>{const a=siteForCategory(c.id);if(!a)return `<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.code)}</div></td><td class="muted">Site non créé</td><td>${db.products.filter(p=>p.category_id===c.id&&p.active).length}</td><td>—</td><td>—</td><td><button class="btn primary" onclick="editSite(null,'${c.id}')">Configurer et créer</button></td></tr>`;const n=db.application_products.filter(m=>m.application_id===a.id&&m.active&&db.products.some(p=>p.id===m.product_id&&p.active)).length,url=siteUrl(a),qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=6&data='+encodeURIComponent(url);return `<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(a.name)}</div></td><td><div class="option-list">${enabledLabels(a)}</div></td><td>${n}</td><td><a class="site-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></td><td><img class="qr" src="${esc(qr)}" alt="QR code ${esc(c.name)}"></td><td><div class="site-actions"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir</a><button class="btn secondary" onclick="copySiteUrl('${a.id}')">Copier le lien</button><button class="btn secondary" onclick="showSiteQr('${a.id}')">QR code</button><button class="btn secondary" onclick="editSite('${a.id}')">Configurer</button><button class="btn danger" onclick="deleteSite('${a.id}')">Supprimer le site</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function optionChecks(o){return Object.entries(optionLabels).map(([k,label])=>`<label class="check"><input class="site-opt" data-key="${k}" type="checkbox" ${o[k]?'checked':''} onchange="toggleSiteDeps()"> <span>${esc(label)}</span></label>`).join('')}
function editSite(id,categoryId){const a=id?db.applications.find(x=>x.id===id):null;const cat=a?.category_id||categoryId||db.categories.find(c=>c.active!==false)?.id||'';const checked=new Set(db.application_products.filter(m=>m.application_id===id&&m.active).map(m=>m.product_id));const opts={...defaultOptions,...(a?.site_options||{})};const c=catById(cat);modal(id?'Configurer le site':'Créer le site',`<div class="fields"><div><label>Nom du site</label><input id="aname" value="${esc(a?.name||c?.name||'')}"></div><div><label>Code</label><input id="acode" value="${esc(a?.code||('site-'+(c?.code||'')))}"></div><div><label>Catégorie</label><select id="acat" onchange="siteCategoryChanged()">${db.categories.filter(c=>c.active!==false).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Services (séparés par virgule)</label><input id="aservices" value="${esc((a?.services||['Général']).join(', '))}"></div><div class="full"><label>Description</label><textarea id="adesc">${esc(a?.description||'')}</textarea></div><div class="full"><div class="section-title">Ce qui sera affiché sur le site</div><div class="check-grid">${optionChecks(opts)}</div><div class="muted" style="margin-top:6px">Les fonctions non cochées seront aussi refusées côté serveur.</div></div><div class="full"><div class="section-title">Produits affichés</div><div id="aprod" class="product-list"></div></div></div>`,async()=>{try{const product_ids=[...document.querySelectorAll('#aprod input:checked')].map(x=>x.value),site_options={};document.querySelectorAll('.site-opt').forEach(x=>site_options[x.dataset.key]=x.checked);await siteApi('save','POST',{id:id||null,name:$('aname').value,code:$('acode').value,category_id:$('acat').value,services:$('aservices').value,description:$('adesc').value,product_ids,site_options});closeModal();await refresh();show('apps')}catch(e){$('mstatus').textContent=e.message}});$('acat').value=cat;window._siteChecked=checked;window._siteEditing=!!id;renderSiteProducts();toggleSiteDeps()}
function siteCategoryChanged(){const c=catById($('acat').value);if(!window._siteEditing){$('aname').value=c?.name||'';$('acode').value='site-'+(c?.code||'')}window._siteChecked=new Set(db.products.filter(p=>p.category_id===$('acat').value&&p.active).map(p=>p.id));renderSiteProducts()}
function renderSiteProducts(){const cat=$('acat').value,checked=window._siteChecked||new Set();const ps=db.products.filter(p=>p.category_id===cat&&p.active);$('aprod').innerHTML=ps.map(p=>`<label><input type="checkbox" value="${p.id}" ${checked.size===0||checked.has(p.id)?'checked':''}> ${esc(p.name)} <span class="muted">(${esc(p.unit||'')})</span></label>`).join('')||'<div class="muted">Aucun produit actif dans cette catégorie.</div>'}
function toggleSiteDeps(){const p=[...document.querySelectorAll('.site-opt')].find(x=>x.dataset.key==='purchases'),enabled=!!p?.checked;document.querySelectorAll('.site-opt').forEach(x=>{if(['supplier','purchase_history'].includes(x.dataset.key))x.disabled=!enabled})}
async function deleteSite(id){const a=db.applications.find(x=>x.id===id);if(!a)return;if(!confirm(`Supprimer le site « ${a.name} » ?\n\nLe lien public sera désactivé. L’historique des inventaires, sorties et achats sera conservé dans l’administration.`))return;try{await siteApi('delete','POST',{id});await refresh();show('apps')}catch(e){alert(e.message)}}
async function copySiteUrl(appId){const a=db.applications.find(x=>x.id===appId);if(!a)return;const url=siteUrl(a);try{await navigator.clipboard.writeText(url);alert('Lien copié.')}catch{prompt('Copiez le lien :',url)}}
function showSiteQr(appId){const a=db.applications.find(x=>x.id===appId);if(!a)return;const c=catById(a.category_id),url=siteUrl(a),qr='https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data='+encodeURIComponent(url);$('modal').innerHTML=`<div class="modal"><div class="box" style="max-width:520px;text-align:center"><h2>QR code — ${esc(c?.name||a.name)}</h2><img src="${esc(qr)}" alt="QR code" style="width:min(320px,100%);border:1px solid #dde3e8;border-radius:12px;padding:8px;background:white"><p class="site-link"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></p><div class="actions" style="justify-content:center"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir le site</a><button class="btn secondary" onclick="copySiteUrl('${a.id}')">Copier le lien</button><button class="btn secondary" onclick="closeModal()">Fermer</button></div></div></div>`}
function renderEvents(){$('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Application</th><th>Type</th><th>Service</th><th>Remarque</th><th>Détails</th></tr></thead><tbody>${db.events.map(e=>{const a=db.applications.find(x=>x.id===e.application_id);const items=db.event_items.filter(i=>i.event_id===e.id);return `<tr><td>${esc(e.event_date)}<div class="muted">${new Date(e.created_at).toLocaleString('fr-FR')}</div></td><td>${esc(a?.name||'')}</td><td><span class="pill">${esc(e.event_type)}</span></td><td>${esc(e.service||'')}</td><td>${esc(e.note||'')}</td><td>${items.map(i=>esc(i.product_name_snapshot)+': '+i.quantity).join('<br>')}</td></tr>`}).join('')}</tbody></table></div>`}
function renderPurchases(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPurchase()">Ajouter un achat</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Produit</th><th>Quantité</th><th>Prix unitaire</th><th>Fournisseur</th><th>Total</th></tr></thead><tbody>${db.purchases.map(x=>`<tr><td>${x.purchase_date}</td><td>${esc(prodById(x.product_id)?.name||'')}</td><td>${x.quantity}</td><td>${Number(x.unit_price).toFixed(2)} €</td><td>${esc(x.supplier||'')}</td><td>${(Number(x.quantity)*Number(x.unit_price)).toFixed(2)} €</td></tr>`).join('')}</tbody></table></div>`}
function renderStats(){$('content').innerHTML='<iframe class="stats-frame" src="statistiques/"></iframe>'}
function renderSettings(){$('content').innerHTML=`<div class="card" style="max-width:560px"><h3>Changer le mot de passe administrateur</h3><input id="newpass" type="password" placeholder="Nouveau mot de passe (10 caractères minimum)"><br><br><button class="btn primary" onclick="changePassword()">Changer le mot de passe</button><p class="muted">Après modification, vous devrez vous reconnecter.</p></div>`}
function modal(title,body,onSave){$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${esc(title)}</h2>${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="msave">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="mstatus" class="status"></div></div></div>`;$('msave').onclick=onSave}function closeModal(){$('modal').innerHTML=''}
function editCategory(id){const c=id?db.categories.find(x=>x.id===id):{};modal(id?'Modifier la catégorie':'Nouvelle catégorie',`<div class="fields"><div><label>Nom</label><input id="cname" value="${esc(c.name||'')}"></div><div><label>Code</label><input id="ccode" value="${esc(c.code||'')}"></div><div><label>Mode</label><select id="cmode"><option value="inventaire">Inventaire</option><option value="sortie">Sortie</option><option value="sortie_inventaire">Sortie + inventaire</option></select></div><div><label>Couleur</label><input id="ccolor" type="color" value="${esc(c.color||'#243447')}"></div></div>`,async()=>{try{await api('save-category','POST',{id,name:$('cname').value,code:$('ccode').value,app_mode:$('cmode').value,color:$('ccolor').value,active:true});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}});$('cmode').value=c.app_mode||'sortie_inventaire'}
function editProduct(id){const p=id?db.products.find(x=>x.id===id):{};modal(id?'Modifier le produit':'Nouveau produit',`<div class="fields"><div><label>Nom</label><input id="pname" value="${esc(p.name||'')}"></div><div><label>Code</label><input id="pcode" value="${esc(p.code||'')}"></div><div><label>Catégorie</label><select id="pcat">${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Unité</label><input id="punit" value="${esc(p.unit||'pièce')}"></div><div><label>Prix unitaire</label><input id="pprice" type="number" step="0.01" value="${p.unit_price??0}"></div><div><label>Stock mini</label><input id="pmin" type="number" value="${p.min_stock??0}"></div><div><label>Stock cible</label><input id="ptarget" type="number" value="${p.target_stock??0}"></div><div><label>Stock de départ</label><input id="pinitial" type="number" value="${p.initial_stock??0}"></div></div>`,async()=>{try{await api('save-product','POST',{id,name:$('pname').value,code:$('pcode').value,category_id:$('pcat').value,unit:$('punit').value,unit_price:$('pprice').value,min_stock:$('pmin').value,target_stock:$('ptarget').value,initial_stock:$('pinitial').value,active:true});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}});$('pcat').value=p.category_id||db.categories[0]?.id||''}
async function setStock(id){const p=prodById(id),q=prompt('Nouveau stock pour '+p.name,bal(id));if(q===null)return;try{await api('set-stock','POST',{product_id:id,quantity:Number(q)});await refresh()}catch(e){alert(e.message)}}
async function deleteProduct(id){const p=prodById(id);if(!p)return;if(!confirm(`Supprimer le produit « ${p.name} » ?\n\nIl sera retiré de Produits & stocks et des sites publics. L’historique des achats, inventaires et sorties sera conservé.`))return;try{await api('save-product','POST',{id:p.id,name:p.name,code:p.code,category_id:p.category_id,unit:p.unit,unit_price:p.unit_price,min_stock:p.min_stock,target_stock:p.target_stock,initial_stock:p.initial_stock,active:false});await refresh();show('products')}catch(e){alert(e.message)}}
async function resetCat(id){const c=catById(id);if(!confirm(`Remettre à zéro tous les stocks de la catégorie « ${c?.name} » ?\nL’historique sera conservé.`))return;try{await api('reset-category','POST',{category_id:id});await refresh()}catch(e){alert(e.message)}}
function editPurchase(){modal('Ajouter un achat',`<div class="fields"><div><label>Produit</label><select id="buyprod">${db.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Date</label><input id="buydate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Quantité</label><input id="buyqty" type="number" min="0.001"></div><div><label>Prix unitaire</label><input id="buyprice" type="number" step="0.01"></div><div><label>Fournisseur</label><input id="buysup"></div><div><label>Note</label><input id="buynote"></div></div>`,async()=>{try{await api('save-purchase','POST',{product_id:$('buyprod').value,purchase_date:$('buydate').value,quantity:$('buyqty').value,unit_price:$('buyprice').value,supplier:$('buysup').value,note:$('buynote').value});closeModal();await refresh()}catch(e){$('mstatus').textContent=e.message}})}
async function changePassword(){const p=$('newpass').value;try{await api('change-password','POST',{password:p});alert('Mot de passe modifié. Reconnectez-vous.');logout()}catch(e){alert(e.message)}}
function exportExcel(){if(typeof XLSX==='undefined'){alert('Module Excel indisponible');return}const wb=XLSX.utils.book_new();const stocks=db.products.filter(p=>p.active).map(p=>({Code:p.code,Produit:p.name,Catégorie:catById(p.category_id)?.name||'',Unité:p.unit,'Prix unitaire':Number(p.unit_price),'Stock mini':Number(p.min_stock),'Stock cible':Number(p.target_stock),'Stock actuel':bal(p.id),'Valeur stock':bal(p.id)*Number(p.unit_price)}));const events=db.events.map(e=>({Date:e.event_date,Application:db.applications.find(a=>a.id===e.application_id)?.name||'',Type:e.event_type,Service:e.service||'',Remarque:e.note||'',Créé:new Date(e.created_at).toLocaleString('fr-FR')}));const details=db.event_items.map(i=>{const e=db.events.find(x=>x.id===i.event_id);return {Date:e?.event_date||'',Produit:i.product_name_snapshot,Quantité:Number(i.quantity),'Prix unitaire':Number(i.unit_price_snapshot),Type:e?.event_type||''}});const purchases=db.purchases.map(x=>({Date:x.purchase_date,Produit:prodById(x.product_id)?.name||'',Quantité:Number(x.quantity),'Prix unitaire':Number(x.unit_price),Fournisseur:x.supplier||'',Note:x.note||'',Total:Number(x.quantity)*Number(x.unit_price)}));[['Stocks',stocks],['Saisies',events],['Details_Saisies',details],['Achats',purchases]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n));XLSX.writeFile(wb,'Gestion_College_'+new Date().toISOString().slice(0,10)+'.xlsx')}
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');initNav();refresh().catch(()=>logout())}
</script>
