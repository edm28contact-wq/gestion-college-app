<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#334155"><title>Marne Invest - Gestion locative</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f6f8;--p:#334155;--ok:#176b3a;--bad:#a32929;--warn:#9a6700}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#fff;border:1px solid #dce2e7;border-radius:16px;padding:24px;box-shadow:0 12px 34px #00000012}h1,h2,h3{margin:0 0 12px}label{display:block;font-size:12px;color:#64707c;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1;color:#17202a}.danger{background:#fdeaea;color:var(--bad)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:#24303d;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800}.brand-sub{font-size:12px;color:#b7c3ce;margin:2px 0 18px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#dbe3ea;padding:10px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#3b4b5c;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dce2e7;border-radius:12px;padding:14px}.kpi{font-size:27px;font-weight:800}.muted{font-size:13px;color:#6a7580}.status{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce2e7;border-radius:12px;max-height:68vh}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{padding:8px 9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px;vertical-align:top;max-width:280px;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0;z-index:2}.tenant-row{cursor:pointer}.tenant-row.selected{outline:2px solid #64748b;outline-offset:-2px;background:#f1f5f9}.clip{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.pill.bad{background:#fdeaea;color:#8a2525}.pill.ok{background:#e8f5ed;color:#176b3a}.command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.command{border:1px solid #dce2e7;border-radius:10px;padding:12px;background:#fff}.command b{display:block;margin-bottom:5px}.property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.property-card{cursor:pointer}.property-card:hover{border-color:#9aa8b5}.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 12px;padding:6px 0;border-bottom:1px solid #edf0f2}.kv:last-child{border:0}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}.editor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.section-title{font-weight:800;margin:16px 0 8px}.sticky-left{position:sticky;left:0;background:inherit;z-index:1}.note{padding:10px;border-radius:9px;background:#fff8e1;border:1px solid #f2df9d;font-size:13px}.login input{margin-bottom:12px}@media(max-width:1000px){.grid,.command-grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.property-grid{grid-template-columns:1fr}}@media(max-width:620px){.main{padding:12px}.top{flex-direction:column}.grid,.command-grid,.fields,.editor-grid{grid-template-columns:1fr}.fields .full{grid-column:auto}}

:root{--p:#1764eb}body{background:#f8fafc;color:#172033}.shell{grid-template-columns:220px minmax(0,1fr)}

.mail-split{display:grid;grid-template-columns:minmax(270px,38%) minmax(0,1fr);min-height:300px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;overflow:hidden}
.mail-list{border-right:1px solid #e2e8f0;overflow:auto;max-height:475px}
.mail-item{border:0;border-bottom:1px solid #e2e8f0;background:white;text-align:left;width:100%;padding:13px 16px;cursor:pointer}
.mail-item.unread{border-left:4px solid #1764eb;background:#f7fbff}.mail-item:hover{background:#eff6ff}

.mail-banner{margin-bottom:15px}

.config-layout{display:grid;gap:15px}.config-section{padding:20px}
.config-section .fields{margin-top:15px;margin-bottom:15px}.config-section .fields p{margin-top:5px;line-height:1.45}

.release-mini{padding:10px 13px;margin:8px 10px;border:1px solid #dae4f0;border-radius:10px;background:#f7faff;font-size:12px;color:#31445b}
.release-mini-button{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.release-track{height:8px;background:#dfe7f4;border-radius:999px;overflow:hidden;margin:9px 0 6px}
.release-fill{height:100%;background:#1764eb;border-radius:999px;transition:width .2s ease}
.release-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}
.release-progress-card{padding:17px;border:1px solid #e2e8f0;background:#fff;border-radius:10px}
.release-progress-card .metric{font-size:23px;font-weight:800;margin:7px 0}
.release-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
.release-entry{display:flex;gap:12px;align-items:flex-start;border:1px solid #e2e8f0;padding:14px;border-radius:10px;background:#fff}
.release-state{display:inline-block;padding:4px 9px;border-radius:12px;background:#eef2f7;color:#475569;font-size:11px;white-space:nowrap}

@media(max-width:700px){.release-list{grid-template-columns:1fr}}

.bank-box{padding:20px;border:1px solid #dce6f1;border-radius:12px;background:white;margin:18px 0 24px}
.bank-box .kpis{margin-top:13px}.bank-preview{max-height:260px;overflow:auto;margin-top:12px}
.bank-preview-lines{max-height:120px;overflow:auto;font-size:12px}

.irl-block .note{margin:12px 0}.irl-block .data-table{margin-top:12px}

<body>
<section id="login" class="login"><div class="box"><h1>Marne Invest</h1><p class="muted">Administration — gestion locative IRL</p><label>Utilisateur</label><input id="user" value="holding-admin" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Marne Invest</div><div class="brand-sub">Gestion locative</div><div id="nav" class="nav"></div><div id="releaseMini" class="release-mini"></div><div class="side-profile"><b>Marne Invest</b>Gestion immobilière</div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div id="serverTime" class="muted"></div></div><div class="actions"><input id="globalSearch" type="search" class="top-search" placeholder="⌕ Rechercher..." aria-label="Rechercher" oninput="searchAll(this.value)"><a class="btn secondary" href="../holding/">Holding</a><a class="btn secondary" href="./comptabilite/">Comptabilité</a><a class="btn secondary" href="./locataires/">Gestion locataire</a><a class="btn secondary" href="./studios/">Gestion studio</a><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
(()=>{'use strict';
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/rental-admin-api';
const requestedPage=new URLSearchParams(location.search).get('page');let token=localStorage.getItem('marne_invest_admin_token')||localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',db=null,page=['dashboard','tenants','properties','config','guide','contracts','transactions','works','documents','reports','emails','mail','pilotage'].includes(requestedPage||'')?requestedPage:'dashboard',selectedRow=null,searchQuery='',irlLive=null,irlChecked=false,documentPropertyFilter='';
const pages=[['dashboard','Dashboard','⌂'],['pilotage','Version finale','◉'],['properties','Mes Biens','▥'],['tenants','Locataires','♙'],['contracts','Contrats','▤'],['transactions','Transactions','↗'],['emails','Relances et e-mails','✉'],['mail','Messagerie Free','✉'],['works','Travaux','⚒'],['documents','Documents','▱'],['reports','Rapports','▥'],['config','Paramètres','⚙']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0),fmt=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),short=v=>{const s=String(v??'');return s.length>80?s.slice(0,77)+'…':s};
async function api(action,method='GET',body){const r=await fetch(API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
window.login=async()=>{try{$('loginStatus').className='status';$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('marne_invest_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message||'Erreur'}};
window.logout=()=>{token='';db=null;selectedRow=null;localStorage.removeItem('marne_invest_admin_token');$('app').classList.add('hide');$('login').classList.remove('hide')};
function initNav(){$('nav').innerHTML=pages.map(([k,l,i])=>`<button data-p="${k}" onclick="showPage('${k}')"><span class="nav-icon">${i}</span>${l}</button>`).join('')}
window.showPage=p=>{page=p;searchQuery='';$('globalSearch').value='';render()};window.searchAll=q=>{searchQuery=String(q||'').trim().toLocaleLowerCase('fr');render()};
window.refresh=async()=>{try{db=await api('data');$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render();if(!irlChecked)fetchIrl()}catch(e){alert(e.message)}};
function render(){if(!db)return;if($('releaseMini'))$('releaseMini').innerHTML=releaseMini();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,tenants:renderTenants,properties:renderProperties,config:renderConfig,guide:renderGuide,contracts:renderContracts,transactions:renderTransactions,emails:renderEmails,mail:renderMail,works:renderWorks,documents:renderDocuments,reports:renderReports,pilotage:renderPilotage}[page]||renderDashboard)()}
function setting(key,fallback){return db.settings.find(x=>x.setting_key===key)?.value??fallback}

function renderModule(title,message,link){$('content').innerHTML='<div class="card"><h2>'+esc(title)+'</h2><p class="muted">'+esc(message)+'</p>'+(link?'<a class="btn primary" href="'+link+'">Ouvrir la comptabilité</a>':'')+'</div>'}
function valueOf(data,keys){for(const k of keys){let v=data?.[k];if(typeof v==='number'&&Number.isFinite(v))return v;if(typeof v==='string'&&v.trim()){v=Number(v.replace(/[\s\u00a0\u202f€]/g,'').replace(',','.'));if(Number.isFinite(v))return v}}return null}
function bars(items,green){if(!items.length)return '<div class="chart-empty">Données non disponibles pour ce graphique.</div>';const max=Math.max(1,...items.map(x=>x[1]));return '<div class="chart-bars">'+items.slice(0,8).map(x=>'<div class="chart-bar '+(green?'green':'')+'" title="'+esc(x[0])+' : '+fmt(x[1])+'"><i style="height:'+Math.max(2,Math.round(x[1]/max*90))+'%"></i><small>'+esc(x[0])+'</small></div>').join('')+'</div>'}
function pie(items){const total=items.reduce((n,x)=>n+x[1],0);if(!total)return '<div class="chart-empty">Type des logements non renseigné.</div>';const colors=['#1764eb','#60a5fa','#3b82f6','#a8c9ff','#93c5fd'];let pct=0;const seg=items.slice(0,5).map((x,i)=>{const a=pct;pct+=x[1]/total*100;return colors[i]+' '+a+'% '+pct+'%'});return '<div class="donut" style="background:conic-gradient('+seg.join(',')+')"></div><div class="legend">'+items.slice(0,5).map((x,i)=>'<span><i style="background:'+colors[i]+'"></i>'+esc(x[0])+' ('+Math.round(x[1]/total*100)+' %)</span>').join('')+'</div>'}


const releaseMilestones=[
 ['Portefeuille et liaison des logements','done','13 biens reliés au suivi locatif'],
 ['Fiches locataires et recherche','done','Consultation et modification des dossiers'],
 ['Validation des baux','done','Brouillons et confirmation explicite des conditions'],
 ['Échéances mensuelles automatiques','done','Mois complets, sans doublons, chaque jour'],
 ['Registre financier des paiements','done','Règlements partiels, affectations et annulations'],
 ['Reçus et aperçus de quittances','done','Impression depuis les règlements vérifiés'],
 ['Brouillons de relances programmés','done','J+7 et J+14 sans envoi automatique'],
 ['Paramètres centralisés et secrets','done','Coordonnées communes et chiffrement des mots de passe'],
 ['Messagerie Free opérationnelle','partial','Module installé ; authentification et test réel à effectuer'],
 ['Synchronisation IMAP récurrente','partial','Planification toutes les heures installée ; activation après test réel Free'],
 ['Import bancaire CSV et rapprochement','done','Import idempotent, suggestions et confirmation des écritures de loyer'],
 ['Connexion bancaire directe','todo','Accès bancaire automatisé non connecté'],
 ['Suivi des travaux et prestataires','done','Tickets, devis, validation et historique ; aucune commande automatique'],
 ['Propositions IRL encadrées par bail','done','Calcul Insee avec clause, DPE et trimestre ; aucun loyer modifié'],
 ['Application IRL après notification vérifiée','done','Courrier préparé, date d’envoi attestée, prise d’effet différée ; aucun envoi automatique'],
 ['Archivage privé des PDF et pièces','done','PDF et images déposés par logement, accès contrôlé et téléchargements temporaires'],
 ['Recette de bout en bout en production','partial','18 tests de régression et contrôles SQL ; recette navigateur authentifiée à réaliser']
];
function releaseStatus(){
 const total=releaseMilestones.length,done=releaseMilestones.filter(x=>x[1]==='done').length,partial=releaseMilestones.filter(x=>x[1]==='partial').length;
 return {total,done,partial,percent:Math.round(done/total*100)};
}
function releaseMini(){
 const x=releaseStatus();
 return '<button class="release-mini-button" onclick="showPage(&quot;pilotage&quot;)" aria-label="Voir l’avancement vers la version finale"><b>Version finale · '+x.percent+' %</b>'+
 '<div class="release-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+x.percent+'"><div class="release-fill" style="width:'+x.percent+'%"></div></div>'+
 '<span>'+x.done+'/'+x.total+' lots livrés · '+x.partial+' partiel(s)</span></button>';
}

window.approveIrlCandidate=async id=>{
 if(!db.current_user?.payment_void_access)return;
 const c=(db.irl_candidates||[]).find(x=>x.id===id);
 if(!c||c.status!=='pending')return;
 const date=prompt('Date officielle de publication de l’indice T'+c.quarter+' '+c.year+
   ' selon la page Insee (AAAA-MM-JJ) :');
 if(date===null)return;
 if(!/^20\d{2}-\d{2}-\d{2}$/.test(date)){alert('Saisissez une date AAAA-MM-JJ valide.');return}
 if(!confirm('Confirmez-vous avoir consulté la publication Insee et vérifié la valeur '+c.value+
   ' pour le trimestre '+c.quarter+' de '+c.year+' ? La validation de l’indice ne changera aucun loyer.'))return;
 try{await api('irl-approve','POST',{candidate_id:id,published_on:date,confirmed:true});
  await refresh();alert('Indice validé dans le référentiel. Aucun contrat ni échéance n’a été modifié.');
 }catch(e){alert(e.message||'Validation impossible')}
};

window.saveCentralConfig=async()=>{
 if(!db.current_user?.mail_access||db.current_user?.read_only)return;
 const keys=['landlord_name','landlord_address','owner_email','sender_email','bank_account_label'];
 const settings=Object.fromEntries(keys.map(k=>[k,String($('central-'+k)?.value||'').trim()]));
 const password=$('central-mail-password')?.value||'',status=$('central-config-status'),button=$('central-config-save');
 if(!status||!button)return;
 if(!/^[^\s@]+@free\.fr$/i.test(settings.sender_email)){status.className='status err';status.textContent='Une adresse @free.fr valide est obligatoire.';return}
 if(settings.owner_email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(settings.owner_email)){status.className='status err';status.textContent='Adresse du propriétaire invalide.';return}
 if(password&&password.length<6){status.className='status err';status.textContent='Le mot de passe Free est trop court.';return}
 button.disabled=true;status.className='status';status.textContent='Enregistrement des coordonnées…';
 let saved=false;
 try{
  await api('save-site-config','POST',{settings});saved=true;
  if(password){
   status.textContent='Coordonnées enregistrées. Chiffrement du mot de passe…';
   await api('mail-configure','POST',{password});
   $('central-mail-password').value='';
  }
  await refresh();
  const done=$('central-config-status');if(done){done.className='status ok';done.textContent='Paramètres enregistrés. Les pages concernées utilisent maintenant ces informations. Testez IMAP / SMTP avant tout envoi.'}
 }catch(e){
  status.className='status err';
  status.textContent=(saved?'Les coordonnées sont enregistrées, mais la messagerie reste à configurer : ':'Enregistrement impossible : ')+(e.message||'Erreur serveur');
 }finally{const latest=$('central-config-save');if(latest)latest.disabled=false}
};
function lookup(data,keys){for(const k of keys){const v=data?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v)}return ''}
function money(n){return Number.isFinite(n)?fmt(n)+' €':'—'}
function tenantName(t){return lookup(t.data,['Locataire','Nom locataire','Nom du locataire','Locataire actuel','Nom','Nom et prénom','Prénom Nom','Corps locataire'])||'Locataire ligne '+t.row_number}
function dwellingName(t){return lookup(t.data,['Nom du logement','Logement','Studio','Bien','Adresse','Adresse du logement'])||'Non renseigné'}
function filtered(items,fn){return !searchQuery?items:items.filter(x=>fn(x).toLocaleLowerCase('fr').includes(searchQuery))}
function section(title,description,tools=''){return '<div class="section-head"><div><h2>'+esc(title)+'</h2><p class="muted">'+esc(description)+'</p></div><div class="section-tools">'+tools+'</div></div>'}
function stats(items){return '<div class="summary-strip">'+items.map(([name,value,sub])=>'<div class="card"><div class="muted">'+esc(name)+'</div><div class="kpi">'+esc(String(value))+'</div>'+(sub?'<div class="muted">'+esc(sub)+'</div>':'')+'</div>').join('')+'</div>'}
function dataTable(headings,rows){if(!rows.length)return '<div class="card empty-state">Aucun élément à afficher.</div>';return '<div class="table-wrap"><table class="data-table"><thead><tr>'+headings.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function csvExport(filename,headings,rows){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const content='\uFEFF'+[headings,...rows].map(row=>row.map(quote).join(';')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvSnapshot(type){const tenants=db.tenants||[],props=(db.properties||[]).filter(p=>!p.is_example);if(type==='tenants'){const h=db.tenant_headers;csvExport('marne-invest-locataires.csv',h,tenants.map(t=>h.map(k=>t.data?.[k]??'')));return}if(type==='properties'){const keys=[...new Set(props.flatMap(p=>Object.keys(p.data||{})))];csvExport('marne-invest-biens.csv',keys,props.map(p=>keys.map(k=>p.data?.[k]??'')));return}if(type==='payments'){csvExport('marne-invest-paiements.csv',['Locataire','Bien','Paiement dû','Paiement reçu','Solde','Retard'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Paiement dû']),lookup(t.data,['Paiement reçu']),lookup(t.data,['Solde']),lookup(t.data,['Retard'])]));return}if(type==='contracts'){csvExport('marne-invest-contrats.csv',['Locataire','Bien','Début bail','Fin bail','Loyer de base','Charges'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Date entrée locataire']),lookup(t.data,['Date fin de bail']),lookup(t.data,['Loyer de base']),lookup(t.data,['Charge'])]));return}if(type==='reports'){csvExport('marne-invest-rapport.csv',['Indicateur','Valeur'],[['Biens réels',props.length],['Lignes locataires',tenants.length],['Paiements dus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement dû'])||0),0)],['Paiements reçus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement reçu'])||0),0)],['Lignes en retard',tenants.filter(t=>t.data?.['Retard']==='OUI').length]]);return}}
const originalCsvSnapshot=csvSnapshot;

window.saveIrlRule=async id=>{
 const status=$('modalStatus');if(!status)return;
 if(!$('irl-verified')?.checked){status.className='status err';status.textContent='Vous devez confirmer la vérification des documents contractuels.';return}
 const body={lease_id:id,has_revision_clause:!!$('irl-clause')?.checked,
   is_mobility_lease:!!$('irl-mobility')?.checked,dpe_rating:$('irl-dpe')?.value,
   geographic_scope:$('irl-region')?.value,revision_due_on:$('irl-date')?.value,
   reference_quarter:Number($('irl-quarter')?.value),confirmed:true};
 status.className='status';status.textContent='Enregistrement sécurisé des règles IRL…';
 try{await api('save-irl-rule','POST',body);closeModal();await refresh();openIrlLease(id)}
 catch(e){status.className='status err';status.textContent=e.message||'Erreur'}
};
window.prepareIrlProposal=async id=>{
 const status=$('modalStatus');if(!status)return;
 if(!$('irl-verified')?.checked){status.className='status err';status.textContent='Confirmez d’abord la vérification des clauses du bail.';return}
 if(!confirm('Calculer la proposition IRL avec les indices Insee, sans modifier le loyer actuel ?'))return;
 status.className='status';status.textContent='Contrôle des conditions et calcul officiel…';
 try{
  const result=await api('prepare-irl','POST',{lease_id:id,confirmed:true});
  closeModal();await refresh();openIrlLease(id);
  const st=$('modalStatus');
  if(st){st.className='status ok';st.textContent='Simulation : '+money(Number(result.base_rent))+' → '+money(Number(result.proposed_rent))+'. '+(result.created?'Proposition créée.':'Proposition existante, sans doublon.')+' Aucun loyer ni courriel modifié.'}
 }catch(e){status.className='status err';status.textContent=e.message||'Calcul refusé'}
};

let bankCsvPreview=null;
function bankNormalizeHeader(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function bankCsvRows(csv){
 const clean=String(csv||'').replace(/^\uFEFF/,'');
 const first=clean.split(/\r?\n/,1)[0];
 const score=sep=>first.split(sep).length-1;
 const sep=[';','\t',','].sort((a,b)=>score(b)-score(a))[0];
 if(!score(sep))throw Error('Séparateur CSV non reconnu (; , ou tabulation).');
 let rows=[],row=[],field='',quoted=false;
 for(let i=0;i<clean.length;i++){
  const c=clean[i];
  if(c==='"'){
   if(quoted&&clean[i+1]==='"'){field+='"';i++}
   else if(!quoted&&field.trim()!=='')throw Error('Guillemet CSV mal placé.');
   else quoted=!quoted;
  }else if(c===sep&&!quoted){row.push(field.trim());field=''}
  else if((c==='\r'||c==='\n')&&!quoted){
   if(c==='\r'&&clean[i+1]==='\n')i++;
   row.push(field.trim());
   if(row.some(v=>v!==''))rows.push(row);
   row=[];field='';
   if(rows.length>202)throw Error('Un relevé doit contenir au maximum 200 mouvements.');
  }else{field+=c}
 }
 if(quoted)throw Error('Fichier CSV : guillemets non fermés.');
 row.push(field.trim());if(row.some(v=>v!==''))rows.push(row);
 if(rows.length<2)throw Error('Le CSV doit contenir une ligne d’en-tête et au moins un mouvement.');
 if(rows.length>201)throw Error('Maximum 200 mouvements par relevé.');
 const headers=rows.shift().map(bankNormalizeHeader);
 const index=aliases=>headers.findIndex(h=>aliases.includes(h));
 const dateIdx=index(['date','dateoperation','datedoperation','datedeoperation','datecomptable','datecomptabilisation','datevaleur','datedecriture','bookingdate']);
 const labelIdx=index(['libelle','libelleoperation','libelledeloperation','description','details','operation','intitule','motif','objet']);
 const amountIdx=index(['montant','montanteur','montantoperation','amount']);
 const creditIdx=index(['credit','crediteur','crediteneuros','montantcredit','recette','entree','versement']);
 const debitIdx=index(['debit','debiteur','debiteneuros','montantdebit','depense','sortie','retrait']);
 const refIdx=index(['reference','ref','referenceoperation','idoperation','identifiant','transactionid']);
 if(dateIdx<0||labelIdx<0||(amountIdx<0&&(creditIdx<0||debitIdx<0)))
  throw Error('Colonnes obligatoires : Date, Libellé et Montant, ou Date, Libellé, Débit et Crédit.');
 function parseDate(v){
  const raw=String(v||'').trim();
  let y,m,d,match;
  if(match=raw.match(/^(20\d{2})-(\d{2})-(\d{2})$/)){y=+match[1];m=+match[2];d=+match[3]}
  else if(match=raw.match(/^(\d{2})[\/-](\d{2})[\/-](20\d{2})$/)){d=+match[1];m=+match[2];y=+match[3]}
  else throw Error('Date non reconnue : '+raw+'. Utilisez JJ/MM/AAAA ou AAAA-MM-JJ.');
  const date=new Date(Date.UTC(y,m-1,d));
  if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)
   throw Error('Date bancaire inexistante : '+raw);
  return [y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
 }
 function parseMoney(v){
  let raw=String(v??'').trim().replace(/[\u00a0\u202f\s€]/g,'');
  if(!raw)return null;
  let negative=false;
  if(/^\(.*\)$/.test(raw)){negative=true;raw=raw.slice(1,-1)}
  if(raw.startsWith('-')){negative=true;raw=raw.slice(1)}
  else if(raw.startsWith('+'))raw=raw.slice(1);
  if(raw.includes(',')&&raw.includes('.')){
   const comma=raw.lastIndexOf(','),dot=raw.lastIndexOf('.');
   raw=comma>dot?raw.replace(/\./g,'').replace(',','.'):raw.replace(/,/g,'');
  }else if(raw.includes(','))raw=raw.replace(',','.');
  if(!/^\d{1,9}(\.\d{1,2})?$/.test(raw))throw Error('Montant ambigu : '+String(v)+'. Vérifiez le format décimal.');
  const amount=Number(raw)*(negative?-1:1);
  if(!Number.isFinite(amount))throw Error('Montant invalide.');
  return amount;
 }
 return rows.map((cells,i)=>{
  const get=n=>n>=0?String(cells[n]??'').trim():'';
  const booking_date=parseDate(get(dateIdx));
  const description=get(labelIdx).replace(/\s+/g,' ').trim();
  const reference=get(refIdx);
  let amount;
  if(amountIdx>=0 && get(amountIdx)!==''){amount=parseMoney(get(amountIdx))}
  else{
   const credit=parseMoney(get(creditIdx)),debit=parseMoney(get(debitIdx));
   if((credit!==null&&credit!==0)&&(debit!==null&&debit!==0))
    throw Error('Ligne '+(i+2)+' : débit et crédit présents simultanément.');
   amount=credit!==null&&credit!==0?Math.abs(credit):debit!==null?-Math.abs(debit):null;
  }
  if(amount===null||amount===0||description.length<2||description.length>500||reference.length>120)
   throw Error('Ligne '+(i+2)+' : montant, libellé ou référence invalide.');
  return {booking_date,amount:amount.toFixed(2),description,reference};
 });
}
function bankImportLabel(id){return (db.bank_imports||[]).find(x=>x.id===id)?.account_label||'Compte non identifié'}
function bankOverlappingLines(line){
 const account=bankImportLabel(line.import_id).toLowerCase().trim();
 return (db.bank_lines||[]).filter(other=>other.id!==line.id
  &&bankImportLabel(other.import_id).toLowerCase().trim()===account
  &&other.booking_date===line.booking_date
  &&Math.abs(Number(other.amount)-Number(line.amount))<0.005
  &&String(other.description||'').trim().toLowerCase()===String(line.description||'').trim().toLowerCase());
}
function bankUniqueSuggestion(line){
 const leases=(db.leases||[]).filter(l=>l.status==='active'&&l.verified_at);
 const normalized=String(line.description||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const candidates=leases.filter(l=>{
  const name=String(l.tenant_name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const rent=Number(l.monthly_rent||0)+Number(l.charges_amount||0);
  return name.length>=5&&normalized.includes(name)&&Math.abs(rent-Number(line.amount))<0.005;
 });
 return candidates.length===1?candidates[0]:null;
}

 stats([['Mouvements importés',lines.length],['Crédits à vérifier',pendingCredit],['Rapprochements valides',matches],['Paiements annulés à vérifier',anomalies]])+
 dataTable(['Date','Compte','Libellé','Montant','État','Action'],rows.map(l=>{

  (l.bank_reference?'<div class="muted">Réf. '+esc(l.bank_reference)+'</div>':'')+'</td><td><b>'+money(amount)+'</b></td>'+
  '<td><span class="mini-tag '+(l.status==='pending'?'warn':'')+'">'+esc(source)+'</span></td>'+
  '<td class="item-actions">'+(canWrite&&l.status==='pending'&&amount>0&&!alreadyMatched?

  (canWrite&&l.status==='pending'?'<button class="btn secondary" data-id="'+esc(l.id)+'" onclick="ignoreBankLine(this.dataset.id)">Ignorer</button>':'')+

window.analyseBankCsv=async()=>{
 const state=$('modalStatus'),file=$('bank-csv-file')?.files?.[0];
 bankCsvPreview=null;$('bank-import-save').disabled=true;
 if(!file){state.className='status err';state.textContent='Sélectionnez un fichier CSV.';return}
 if(file.size>550000||file.size<1){state.className='status err';state.textContent='Fichier vide ou supérieur à 550 Ko.';return}
 try{
  const rows=bankCsvRows(await file.text());

window.uploadRentalDocument=async()=>{
 const status=$('modalStatus'),button=$('document-upload-button');

 const label=$('document-label')?.value?.trim()||'',category=$('document-category')?.value;
 if(!file){status.className='status err';status.textContent='Choisissez un fichier PDF, JPEG ou PNG.';return}
 if(file.size>4194304||file.size<1){status.className='status err';status.textContent='Le fichier doit contenir entre 1 octet et 4 Mo.';return}
 if(label.length<3){status.className='status err';status.textContent='Un intitulé de trois caractères minimum est requis.';return}
 const data=new FormData();
 data.append('property_id',property_id);
 data.append('lease_id',$('document-lease')?.value||'');

 data.append('label',label);
 data.append('file',file,file.name);
 button.disabled=true;status.className='status';status.textContent='Contrôle du format et archivage sécurisé…';
 try{
  const r=await fetch(API+'?action=document-upload',{
    method:'POST',headers:{authorization:'Bearer '+token},body:data,cache:'no-store'
  });
  const result=await r.json().catch(()=>({error:'Réponse serveur illisible'}));

 try{
  const result=await fetch(API+'?action=document-download&id='+encodeURIComponent(id),{

 if(!isEmailAddress(to)){alert('Adresse e-mail du locataire manquante ou invalide.');return}
 const subject=lookup(t.data,['Sujet locataire'])||'Suivi de votre logement — Marne Invest';
 const body=lookup(t.data,['Corps locataire'])||['Bonjour,','','Nous vous contactons au sujet de votre logement.','','Cordialement,','Marne Invest'].join('\n');
 if(db.current_user?.mail_access){showPage('mail');composeMail(to,subject,body)}
 else location.href=mailUrl(to,subject,body);
};
function isEmailAddress(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||''))}
function reminderDayDiff(due,today){return Math.floor((Date.parse(today+'T00:00:00Z')-Date.parse(due+'T00:00:00Z'))/86400000)}
function reminderPlan(i,ledger,today){
 const l=(db.leases||[]).find(x=>x.id===i.lease_id);
 const t=(db.tenants||[]).find(x=>x.id===l?.tenant_row_id),p=(db.properties||[]).find(x=>x.id===i.property_id);
 const outstanding=Math.max(0,Number(i.total_due)-(ledger.byInstallment.get(i.id)||0));
 const pending=[...ledger.valid.values()].filter(x=>x.lease_id===i.lease_id).reduce((sum,x)=>sum+Math.max(0,Number(x.amount)-(ledger.byPayment.get(x.id)||0)),0);
 const days=reminderDayDiff(i.due_on,today);
 const drafts=(db.reminder_drafts||[]).filter(x=>x.installment_id===i.id);
 const first=drafts.find(x=>x.stage===7),second=drafts.find(x=>x.stage===14);
 const canAdvance=first?.status==='declared_sent'&&first.declared_sent_at&&reminderDayDiff(new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(first.declared_sent_at)),today)>=7;
 let stage=0,reason='';
 if(!l||l.status!=='active'||!l.verified_at)reason='Bail non vérifié';
 else if(outstanding<=0.005)reason='Échéance soldée';
 else if(pending>0.005)reason='Règlement à rapprocher';
 else if(days<7)reason='Délai J+7 non atteint';
 else if(!isEmailAddress(t?.data?.['Mail locataire']))reason='E-mail manquant';
 else if(!first){stage=7;reason='Rappel J+7 prêt à préparer'}
 else if(first.status==='prepared')reason='Brouillon J+7 préparé';
 else if(first.status==='declared_sent'&&days>=14&&canAdvance&&!second){stage=14;reason='Rappel J+14 prêt à préparer'}
 else if(second?.status==='prepared')reason='Brouillon J+14 préparé';
 else if(second?.status==='declared_sent')reason='Rappel J+14 déclaré envoyé';
 else if(first.status==='declared_sent'&&!canAdvance)reason='Attente de 7 jours après le premier rappel';
 else reason='Premier rappel déclaré envoyé';
 return {i,l,t,p,outstanding,pending,days,stage,reason,drafts};
}
function renderEmails(){

 }
 const ledger=rentalLedger(),today=todayParis();
 const plans=(db.installments||[]).filter(i=>i.status==='scheduled').map(i=>reminderPlan(i,ledger,today));
 const cases=filtered(plans.filter(x=>x.outstanding>0.005),x=>[(x.p?.name||''),x.l?.tenant_name,x.reason].join(' '));
 const drafts=db.reminder_drafts||[],ready=plans.filter(x=>x.stage>0).length;
 const withPending=plans.filter(x=>x.outstanding>0.005&&x.pending>0.005).length;
 const verified=plans.filter(x=>x.outstanding>0.005&&x.days>=7&&x.stage===0).length;
 const output=section('Relances locatives','Les délais J+7 et J+14 créent des propositions, jamais un envoi automatique.','<button class="btn secondary" onclick="refresh()">Actualiser les règlements</button>')+
 stats([['Échéances à suivre',plans.filter(x=>x.outstanding>0.005).length],['Rappels préparables',ready],['Règlements à rapprocher',withPending],['Relances en attente',verified]])+
 '<div class="note">Le logiciel ne relance pas un locataire lorsque des paiements non affectés existent sur son bail. Il bloque aussi les rappels avant l’échéance et exige sept jours entre deux relances. Aucun SMTP Free n’est connecté : seules des préparations et des déclarations manuelles sont possibles.</div>'+
 '<div class="section-head" style="margin-top:18px"><div><h2>Échéances et situations</h2></div></div>'+
 dataTable(['Bien / locataire','Échéance','En retard de','Reste dû','Situation','Action'],cases.sort((a,b)=>a.i.due_on.localeCompare(b.i.due_on)).map(x=>
 '<tr><td><b>'+esc(x.p?.name||'—')+'</b><div class="muted">'+esc(x.l?.tenant_name||'—')+'</div></td><td>'+esc(x.i.due_on)+'</td><td>'+Math.max(0,x.days)+' j</td><td><b>'+money(x.outstanding)+'</b></td><td><span class="mini-tag '+(x.stage>0?'warn':'')+'">'+esc(x.reason)+'</span></td><td>'+
 (x.stage>0&&!db.current_user?.read_only?'<button class="btn primary" data-id="'+esc(x.i.id)+'" data-stage="'+x.stage+'" onclick="prepareRentalReminder(this.dataset.id,Number(this.dataset.stage))">Préparer J+'+x.stage+'</button>':'—')+
 '</td></tr>'))+
 '<div class="section-head" style="margin-top:22px"><div><h2>Brouillons et relances déclarées</h2><p class="muted">Les confirmations manuelles ne constituent pas une preuve technique de distribution.</p></div></div>'+
 dataTable(['Bien','Niveau','Destinataire','Préparé le','Statut','Action'],drafts.map(r=>{
  const l=(db.leases||[]).find(x=>x.id===r.lease_id);
  const p=(db.properties||[]).find(x=>x.id===l?.property_id);
  const plan=plans.find(x=>x.i.id===r.installment_id);
  const safe=plan&&plan.outstanding>0.005&&plan.pending<=0.005;
  return '<tr><td>'+esc(p?.name||'—')+'</td><td>J+'+esc(r.stage)+'</td><td>'+esc(r.recipient_email||'—')+'</td><td>'+esc(r.prepared_at?.slice(0,10)||'—')+'</td><td><span class="mini-tag '+(r.status==='declared_sent'?'':'warn')+'">'+esc(r.status==='prepared'?(safe?'À envoyer manuellement':'À revérifier'):r.status==='declared_sent'?'Déclaré envoyé':'Annulé')+'</span></td><td><div class="item-actions">'+
 (r.status==='prepared'&&safe?'<button class="btn secondary" data-id="'+esc(r.id)+'" onclick="composeRentalReminder(this.dataset.id)">Ouvrir le brouillon</button><button class="btn secondary" data-id="'+esc(r.id)+'" onclick="confirmRentalReminderSent(this.dataset.id)">Déclarer envoyé</button>':'—')+
 '</div></td></tr>';
 }))+
 '<div class="section-head" style="margin-top:22px"><div><h2>Courriels ponctuels</h2><p class="muted">Ouvrir une rédaction manuelle, sans envoi automatique.</p></div></div>'+
 dataTable(['Locataire','Logement','Adresse e-mail','Action'],filtered(db.tenants||[],t=>[tenantName(t),dwellingName(t),t.data?.['Mail locataire']].join(' ')).map(t=>
 '<tr><td>'+esc(tenantName(t))+'</td><td>'+esc(dwellingName(t))+'</td><td>'+esc(t.data?.['Mail locataire']||'À renseigner')+'</td><td><button class="btn secondary" onclick="openTenantEmail('+t.row_number+')" '+(isEmailAddress(t.data?.['Mail locataire'])?'':'disabled')+'>Rédiger</button></td></tr>'));
 $('content').innerHTML=output;
}
window.prepareRentalReminder=async(id,stage)=>{
 try{
  const reply=await api('prepare-reminder','POST',{installment_id:id,stage});
  await refresh();
  alert(reply.already_exists?'Ce rappel existe déjà, aucun doublon créé.':'Brouillon J+'+stage+' préparé. Aucun e-mail n’a été envoyé.');
 }catch(e){alert(e.message||'Relance indisponible')}
};
window.composeRentalReminder=async(id)=>{
 const draft=(db.reminder_drafts||[]).find(r=>r.id===id);if(!draft||draft.status!=='prepared')return;
 try{
  await api('prepare-reminder','POST',{installment_id:draft.installment_id,stage:draft.stage});
  const to=draft.recipient_email;
  if(!isEmailAddress(to)){alert('Adresse e-mail invalide.');return;}
  if(db.current_user?.mail_access){showPage('mail');composeMail(to,draft.subject,draft.body)}
  else location.href=mailUrl(to,draft.subject,draft.body);
 }catch(e){alert('Brouillon non utilisable : '+(e.message||'situation à vérifier'))}
};
window.confirmRentalReminderSent=async id=>{
 const draft=(db.reminder_drafts||[]).find(r=>r.id===id);if(!draft||draft.status!=='prepared')return;
 if(!confirm('Avez-vous réellement envoyé ce courriel depuis votre messagerie ? Le logiciel ne peut pas vérifier sa distribution.'))return;
 try{
  await api('declare-reminder-sent','POST',{id,confirmed:true});
  await refresh();
 }catch(e){alert(e.message||'Confirmation impossible')}
};

 '<div class="note mail-banner"><b>Connexion à effectuer :</b> ouvre <b>Paramètres</b>, saisis l’adresse du compte Free et son mot de passe, puis enregistre. Le mot de passe est chiffré dans Vault. <button class="btn primary" onclick="showPage(&quot;config&quot;)">Configurer la messagerie</button></div>';
 $('content').innerHTML=section('Messagerie Free',esc(db.current_user?.mail_account||setting('sender_email','ph.danglade@free.fr'))+' — réception IMAP 993 et envoi SMTP 465.',tools)+
 stats([['Reçus importés',(db.mail_inbox||[]).length],['Non lus',(db.mail_inbox||[]).filter(m=>!m.is_seen).length],['Brouillons',(db.mail_outbox||[]).filter(m=>m.status==='draft').length],['Connexion',imapVerified?'IMAP vérifié':connected?'Test requis':'À configurer']])+setup+
 '<div class="section-head"><div><h2>Boîte de réception</h2><p class="muted">Lecture en texte seul ; les pièces jointes ne sont pas encore téléchargeables.</p></div></div>'+
 '<div class="mail-split"><div class="mail-list">'+(inbox.length?inbox.map(m=>
 '<button class="mail-item '+(m.is_seen?'':'unread')+'" data-id="'+esc(m.id)+'" onclick="openFreeInboxMail(this.dataset.id)"><b>'+esc(m.sender_email||'Expéditeur inconnu')+'</b><b>'+esc(m.subject||'(Sans objet)')+'</b><small>'+esc(m.received_at?new Date(m.received_at).toLocaleString('fr-FR'):'Date inconnue')+(m.has_attachments?' · Pièces jointes':'')+'</small></button>').join(''):'<div class="empty-state">Aucun courriel synchronisé.</div>')+
 '</div><div class="mail-reader" id="mailReader"><p class="muted">Sélectionnez un message pour le lire. Aucun contenu reçu ne déclenche d’action automatiquement.</p></div></div>'+
 '<div class="section-head" style="margin-top:20px"><div><h2>Brouillons et messages envoyés</h2><p class="muted">Envoi manuel explicite ; aucun renvoi automatique des messages incertains.</p></div></div>'+
 dataTable(['Date','Destinataire','Objet','Statut','Actions'],outbox.map(m=>{
 const labels={draft:'Brouillon',sending:'En cours',sent:'Envoyé',uncertain:'À vérifier',cancelled:'Annulé'};
 return '<tr><td>'+esc(m.created_at?.slice(0,10)||'—')+'</td><td>'+esc(m.recipient_email)+'</td><td>'+esc(m.subject)+'</td><td><span class="mini-tag '+(m.status==='uncertain'?'warn':'')+'">'+esc(labels[m.status]||m.status)+'</span></td>'+
 '<td class="item-actions"><button class="btn secondary" data-id="'+esc(m.id)+'" onclick="viewMailDraft(this.dataset.id)">Lire</button>'+
 (m.status==='draft'?'<button class="btn primary" data-id="'+esc(m.id)+'" onclick="sendFreeMail(this.dataset.id)" '+(connected?'':'disabled')+'>Envoyer</button><button class="btn secondary" data-id="'+esc(m.id)+'" onclick="cancelFreeMailDraft(this.dataset.id)">Annuler</button>':'')+'</td></tr>';
 }))+
 '<p class="module-note">Les 150 derniers courriels sont affichés. Après authentification IMAP réussie, la boîte est consultée chaque heure entre 06h et 21h UTC. Les messages restent conservés sur Free ; aucun message reçu ne déclenche une opération comptable ou un envoi automatique.</p>';
}
