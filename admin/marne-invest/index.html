<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#334155"><title>Marne Invest - Gestion locative</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f6f8;--p:#334155;--ok:#176b3a;--bad:#a32929;--warn:#9a6700}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#fff;border:1px solid #dce2e7;border-radius:16px;padding:24px;box-shadow:0 12px 34px #00000012}h1,h2,h3{margin:0 0 12px}label{display:block;font-size:12px;color:#64707c;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1;color:#17202a}.danger{background:#fdeaea;color:var(--bad)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:#24303d;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800}.brand-sub{font-size:12px;color:#b7c3ce;margin:2px 0 18px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#dbe3ea;padding:10px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#3b4b5c;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dce2e7;border-radius:12px;padding:14px}.kpi{font-size:27px;font-weight:800}.muted{font-size:13px;color:#6a7580}.status{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce2e7;border-radius:12px;max-height:68vh}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{padding:8px 9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px;vertical-align:top;max-width:280px;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0;z-index:2}.tenant-row{cursor:pointer}.tenant-row.selected{outline:2px solid #64748b;outline-offset:-2px;background:#f1f5f9}.clip{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.pill.bad{background:#fdeaea;color:#8a2525}.pill.ok{background:#e8f5ed;color:#176b3a}.command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.command{border:1px solid #dce2e7;border-radius:10px;padding:12px;background:#fff}.command b{display:block;margin-bottom:5px}.property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.property-card{cursor:pointer}.property-card:hover{border-color:#9aa8b5}.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 12px;padding:6px 0;border-bottom:1px solid #edf0f2}.kv:last-child{border:0}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}.editor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.section-title{font-weight:800;margin:16px 0 8px}.sticky-left{position:sticky;left:0;background:inherit;z-index:1}.note{padding:10px;border-radius:9px;background:#fff8e1;border:1px solid #f2df9d;font-size:13px}.login input{margin-bottom:12px}@media(max-width:1000px){.grid,.command-grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.property-grid{grid-template-columns:1fr}}@media(max-width:620px){.main{padding:12px}.top{flex-direction:column}.grid,.command-grid,.fields,.editor-grid{grid-template-columns:1fr}.fields .full{grid-column:auto}}

:root{--p:#1764eb}body{background:#f8fafc;color:#172033}.shell{grid-template-columns:220px minmax(0,1fr)}
.side{background:#fff;color:#42526b;border-right:1px solid #e2e8f0;padding:0;display:flex;flex-direction:column}
.brand{padding:20px 17px 2px;color:#1764eb;font-size:19px}.brand:before{content:'▥';margin-right:8px}
.brand-sub{padding:0 17px 16px;margin:0;color:#94a3b8;border-bottom:1px solid #e2e8f0}
.nav{padding:10px 0;flex:1}.nav button{color:#53627a;border-radius:0;padding:12px 15px;border-right:3px solid transparent;margin:0}
.nav button.active,.nav button:hover{color:#125be0;background:#eaf1ff;border-right-color:#1764eb}
.nav-icon{display:inline-block;width:28px;font-size:17px}.side-profile{border-top:1px solid #e2e8f0;padding:15px;font-size:12px}.side-profile b{display:block}
.main{padding:0 20px 24px}.top{background:#fff;margin:0 -20px 20px;padding:16px 20px;border-bottom:1px solid #e2e8f0;align-items:center}
.top h1{font-size:24px;margin:0}.top .actions{align-items:center}.top-search{width:min(225px,28vw);background:#f1f5f9;border:0}
.card{border-color:#e2e8f0}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stat{min-height:132px;position:relative}.stat .kpi{margin:12px 0 7px;font-size:22px;overflow-wrap:anywhere}.stat .symbol{position:absolute;top:12px;right:14px;font-size:24px;color:#1764eb}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:16px}.chart-card{min-height:285px}.chart-card h3{font-size:16px}
.chart-empty{height:204px;display:grid;place-items:center;text-align:center;padding:25px;border:1px dashed #d6dfeb;border-radius:8px;color:#718096;font-size:13px}
.chart-bars{height:200px;border-bottom:1px solid #94a3b8;display:flex;align-items:end;gap:10px;padding:8px}
.chart-bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:4px;min-width:0}
.chart-bar i{display:block;background:#1764eb;width:75%;max-width:85px;border-radius:5px 5px 0 0;min-height:2px}.chart-bar.green i{background:#1dc465}
.chart-bar small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.donut{width:165px;height:165px;border-radius:50%;margin:13px auto}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:1fr}.side{position:relative}.nav{display:flex;flex:none;overflow-x:auto}.nav button{white-space:nowrap}.side-profile{display:none}.top-search{width:100%}}

/* Menus de gestion immobiliere */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:19px;margin:0}.section-head p{margin:4px 0 0}
.section-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section-tools input,.section-tools select{width:auto;min-width:150px}
.summary-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.summary-strip .card{min-height:96px}.summary-strip .kpi{font-size:21px;margin-top:8px}
.data-table{width:100%;min-width:650px}.data-table td,.data-table th{white-space:normal;max-width:none;padding:12px}
.data-table th{white-space:nowrap}.data-table tr:hover td{background:#f8fbff}
.empty-state{padding:35px;text-align:center;color:#64748b}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}.item-actions .btn{font-size:12px;padding:7px 10px}
.mini-tag{display:inline-flex;border-radius:20px;padding:4px 9px;background:#eff6ff;color:#175bd4;font-size:12px;font-weight:700}
.mini-tag.warn{background:#fff7e7;color:#a56500}.mini-tag.bad{background:#fff1f2;color:#b91c1c}
.module-note{margin-top:14px;font-size:12px;color:#64748b}
.module-select{max-width:220px}
@media(max-width:850px){.summary-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.summary-strip{grid-template-columns:1fr}.section-tools input,.section-tools select{width:100%}}

.payment-confirm{display:flex;gap:10px;align-items:center;margin:14px 0;color:#334155;font-size:14px;font-weight:600}
.payment-confirm input[type=checkbox]{width:auto;flex:none;min-width:18px;height:18px}
#payment-save:disabled{opacity:.55;cursor:wait}
@media print {.side,.top,.section-tools,.item-actions,.modal{display:none!important}.main{padding:0}}
</style>
</head>
<body>
<section id="login" class="login"><div class="box"><h1>Marne Invest</h1><p class="muted">Administration — gestion locative IRL</p><label>Utilisateur</label><input id="user" value="holding-admin" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Marne Invest</div><div class="brand-sub">Gestion locative</div><div id="nav" class="nav"></div><div class="side-profile"><b>Marne Invest</b>Gestion immobilière</div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div id="serverTime" class="muted"></div></div><div class="actions"><input id="globalSearch" type="search" class="top-search" placeholder="⌕ Rechercher..." aria-label="Rechercher" oninput="searchAll(this.value)"><a class="btn secondary" href="../holding/">Holding</a><a class="btn secondary" href="./comptabilite/">Comptabilité</a><a class="btn secondary" href="./locataires/">Gestion locataire</a><a class="btn secondary" href="./studios/">Gestion studio</a><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
(()=>{'use strict';
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/rental-admin-api';
const requestedPage=new URLSearchParams(location.search).get('page');let token=localStorage.getItem('marne_invest_admin_token')||localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',db=null,page=['dashboard','tenants','properties','config','guide','contracts','transactions','works','documents','reports','emails'].includes(requestedPage||'')?requestedPage:'dashboard',selectedRow=null,searchQuery='',irlLive=null,irlChecked=false;
const pages=[['dashboard','Dashboard','⌂'],['properties','Mes Biens','▥'],['tenants','Locataires','♙'],['contracts','Contrats','▤'],['transactions','Transactions','↗'],['emails','Emails automatiques','✉'],['works','Travaux','⚒'],['documents','Documents','▱'],['reports','Rapports','▥'],['config','Paramètres','⚙']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0),fmt=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),short=v=>{const s=String(v??'');return s.length>80?s.slice(0,77)+'…':s};
async function api(action,method='GET',body){const r=await fetch(API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
window.login=async()=>{try{$('loginStatus').className='status';$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('marne_invest_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message||'Erreur'}};
window.logout=()=>{token='';db=null;selectedRow=null;localStorage.removeItem('marne_invest_admin_token');$('app').classList.add('hide');$('login').classList.remove('hide')};
function initNav(){$('nav').innerHTML=pages.map(([k,l,i])=>`<button data-p="${k}" onclick="showPage('${k}')"><span class="nav-icon">${i}</span>${l}</button>`).join('')}
window.showPage=p=>{page=p;searchQuery='';$('globalSearch').value='';render()};window.searchAll=q=>{searchQuery=String(q||'').trim().toLocaleLowerCase('fr');render()};
window.refresh=async()=>{try{db=await api('data');$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render();if(!irlChecked)fetchIrl()}catch(e){alert(e.message)}};
function render(){if(!db)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,tenants:renderTenants,properties:renderProperties,config:renderConfig,guide:renderGuide,contracts:renderContracts,transactions:renderTransactions,emails:renderEmails,works:renderWorks,documents:renderDocuments,reports:renderReports}[page]||renderDashboard)()}
function setting(key,fallback){return db.settings.find(x=>x.setting_key===key)?.value??fallback}

function renderModule(title,message,link){$('content').innerHTML='<div class="card"><h2>'+esc(title)+'</h2><p class="muted">'+esc(message)+'</p>'+(link?'<a class="btn primary" href="'+link+'">Ouvrir la comptabilité</a>':'')+'</div>'}
function valueOf(data,keys){for(const k of keys){let v=data?.[k];if(typeof v==='number'&&Number.isFinite(v))return v;if(typeof v==='string'&&v.trim()){v=Number(v.replace(/[\\s\\u00a0\\u202f€]/g,'').replace(',','.'));if(Number.isFinite(v))return v}}return null}
function bars(items,green){if(!items.length)return '<div class="chart-empty">Données non disponibles pour ce graphique.</div>';const max=Math.max(1,...items.map(x=>x[1]));return '<div class="chart-bars">'+items.slice(0,8).map(x=>'<div class="chart-bar '+(green?'green':'')+'" title="'+esc(x[0])+' : '+fmt(x[1])+'"><i style="height:'+Math.max(2,Math.round(x[1]/max*90))+'%"></i><small>'+esc(x[0])+'</small></div>').join('')+'</div>'}
function pie(items){const total=items.reduce((n,x)=>n+x[1],0);if(!total)return '<div class="chart-empty">Type des logements non renseigné.</div>';const colors=['#1764eb','#60a5fa','#3b82f6','#a8c9ff','#93c5fd'];let pct=0;const seg=items.slice(0,5).map((x,i)=>{const a=pct;pct+=x[1]/total*100;return colors[i]+' '+a+'% '+pct+'%'});return '<div class="donut" style="background:conic-gradient('+seg.join(',')+')"></div><div class="legend">'+items.slice(0,5).map((x,i)=>'<span><i style="background:'+colors[i]+'"></i>'+esc(x[0])+' ('+Math.round(x[1]/total*100)+' %)</span>').join('')+'</div>'}

function renderDashboard(){
 const properties=(db.properties||[]).filter(p=>!p.is_example),ledger=rentalLedger(),today=todayParis(),currentMonth=today.slice(0,7);
 const receivedThisMonth=[...ledger.valid.values()].filter(p=>String(p.received_on).slice(0,7)===currentMonth).reduce((sum,p)=>sum+Number(p.amount||0),0);
 const activeLeases=(db.leases||[]).filter(l=>l.status==='active'&&l.verified_at),annualRent=activeLeases.reduce((sum,l)=>sum+Number(l.monthly_rent||0)*12,0);
 const types=new Map(),cities=new Map();
 for(const p of properties){const d=p.data||{},type=String(d['Type de bien']||d['Type logement']||'').trim(),city=String(d['Ville']||'').trim();if(type)types.set(type,(types.get(type)||0)+1);if(city)cities.set(city,(cities.get(city)||0)+1)}
 const rentItems=activeLeases.map(l=>[(db.properties||[]).find(p=>p.id===l.property_id)?.name||'Logement',Number(l.monthly_rent||0)]);
 const statsData=[['Total Biens',String(properties.length),'▥','Biens réels'],['Valeur Patrimoine','—','€','Valorisations non renseignées'],['Revenus Mensuels',money(receivedThisMonth),'↗','Paiements saisis en '+currentMonth],['Rendement Moyen','—','◷','Valorisation et charges nécessaires'],['Revenus Annuels Projetés',activeLeases.length?money(annualRent):'—','▦','Loyers hors charges des baux vérifiés × 12']];
 const [y,m]=currentMonth.split('-').map(Number);
 const periods=Array.from({length:6},(_,i)=>{const d=new Date(Date.UTC(y,m-1-(5-i),1));return d.toISOString().slice(0,7)});
 const months=periods.map(k=>[k,[...ledger.valid.values()].filter(p=>String(p.received_on).slice(0,7)===k).reduce((sum,p)=>sum+Number(p.amount||0),0)]);
 const chart=(label,html)=>'<section class="card chart-card"><h3>'+label+'</h3>'+html+'</section>';
 const monthlyChart=months.some(x=>x[1]>0)?bars(months,false):'<div class="chart-empty">Aucun paiement saisi dans le nouveau registre pour ces six mois.</div>';
 $('content').innerHTML='<div class="kpis">'+statsData.map(([label,value,icon,sub])=>'<div class="card stat"><div class="muted">'+esc(label)+'</div><div class="symbol">'+icon+'</div><div class="kpi">'+esc(String(value))+'</div><div class="muted">'+esc(sub)+'</div></div>').join('')+'</div><div class="charts">'+
 chart('Encaissements enregistrés — 6 derniers mois',monthlyChart)+
 chart('Répartition par Type de Bien',pie([...types]))+
 chart('Répartition Géographique',bars([...cities],false))+
 chart('Loyers contractuels vérifiés par bien',bars(rentItems,true))+
 '</div><div class="note" style="margin-top:15px">Les indicateurs financiers utilisent le nouveau registre des paiements et les baux validés. Ils n’incluent pas les anciens soldes ou montants du tableur. <button class="btn secondary" onclick="showPage(&quot;transactions&quot;)" style="margin-left:8px">Voir les transactions</button></div>';
}

function cellHtml(h,v){if(v===undefined||v===null||v==='')return '<span class="muted">—</span>';if(h==='Retard'||h==='Révision détectée'||h==='Visal')return `<span class="pill ${v==='OUI'?'bad':'ok'}">${esc(v)}</span>`;return `<span class="clip" title="${esc(v)}">${esc(short(v))}</span>`}
function renderTenants(){const heads=db.tenant_headers;const filteredTenants=db.tenants.filter(r=>!searchQuery||Object.values(r.data||{}).some(v=>String(v??'').toLocaleLowerCase('fr').includes(searchQuery)));$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="runSystem()">Actualiser système</button><button class="btn secondary" onclick="editTenant()">Nouveau locataire</button><button class="btn secondary" onclick="newProperty()">Nouveau logement</button><button class="btn secondary" onclick="createPropertySheet()" ${selectedRow?'':'disabled'}>Créer fiche logement</button></div><div class="muted" style="margin-bottom:8px">Cliquez une ligne pour la sélectionner. Double-cliquez pour la modifier.</div><div class="table-wrap"><table><thead><tr><th class="sticky-left">Ligne</th>${heads.map(h=>`<th title="${esc(db.comments?.[h]||'')}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${filteredTenants.map(r=>`<tr class="tenant-row ${selectedRow===r.row_number?'selected':''}" onclick="selectRow(${r.row_number})" ondblclick="editTenant(${r.row_number})"><td class="sticky-left">${r.row_number}</td>${heads.map(h=>`<td>${cellHtml(h,r.data?.[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
window.selectRow=r=>{selectedRow=r;renderTenants()};
function fieldType(h){if(['Loyer de base','Charge','IRL','Écart révision','Montant révisé','Loyer actualisé','Paiement dû','Paiement reçu','Solde précédent','Solde'].includes(h))return 'number';if(h.startsWith('Date ')||h==='Dernière nouvelle'||h==='Dernier run'||h==='Date entrée locataire'||h==='Date fin de bail')return 'text';return 'text'}
window.editTenant=rowNumber=>{const row=rowNumber?db.tenants.find(x=>x.row_number===rowNumber):null,data={...(row?.data||{})};$('modal').innerHTML=`<div class="modal"><div class="box"><div class="top"><div><h2>${row?'Modifier le locataire':'Nouveau locataire'}</h2><div class="muted">Colonnes identiques à Suivi_Locataires</div></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div><div class="editor-grid">${db.tenant_headers.map(h=>`<div class="${h==='Corps locataire'||h==='Notes'?'full':''}"><label>${esc(h)}</label>${h==='Corps locataire'||h==='Notes'?`<textarea data-field="${esc(h)}">${esc(data[h]??'')}</textarea>`:`<input data-field="${esc(h)}" type="${fieldType(h)}" step="any" value="${esc(data[h]??'')}">`}${db.comments?.[h]?`<div class="muted">${esc(db.comments[h])}</div>`:''}</div>`).join('')}</div><br><div class="actions"><button class="btn primary" onclick="saveTenant('${row?.id||''}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="modalStatus" class="status"></div></div></div>`};
window.saveTenant=async id=>{try{const data={};document.querySelectorAll('#modal [data-field]').forEach(el=>{let v=el.value;if(v==='')return;if(el.type==='number'){const x=Number(v);v=Number.isFinite(x)?x:v}data[el.dataset.field]=v});$('modalStatus').textContent='Enregistrement…';await api('save-tenant','POST',{id,data});closeModal();await refresh()}catch(e){$('modalStatus').className='status err';$('modalStatus').textContent=e.message}};
window.newProperty=()=>{$('modal').innerHTML=`<div class="modal"><div class="box" style="max-width:600px"><h2>Nouveau logement</h2><div class="fields"><div><label>Nom du logement</label><input id="npName"></div><div><label>Adresse</label><input id="npAddress"></div></div><br><div class="actions"><button class="btn primary" onclick="saveNewProperty()">Créer le logement et sa ligne</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="modalStatus" class="status"></div></div></div>`};

const props=(db.properties||[]).filter(p=>!p.is_example),filteredProperties=props.filter(p=>{const t=linkedTenant(p.id);return !searchQuery||JSON.stringify([p.name,p.data,t?.data]).toLocaleLowerCase('fr').includes(searchQuery)});

window.openProperty=id=>{const p=db.properties.find(x=>x.id===id);if(!p)return;const t=linkedTenant(p.id),quality=propertyCompleteness(p,t),current=t?{'Locataire actuel':t.data?.['Locataire']||'','Mail locataire':t.data?.['Mail locataire']||'','Date entrée locataire':t.data?.['Date entrée locataire']||'','Date fin de bail':t.data?.['Date fin de bail']||'','Loyer de base':t.data?.['Loyer de base']??'','Charges':t.data?.['Charge']??'','Solde':t.data?.['Solde']??''}:p.current_tenant;$('modal').innerHTML=`<div class="modal"><div class="box"><div class="top"><div><h2>${esc(p.data?.['Nom du logement']||p.name)}</h2><div class="muted">${esc(p.source_sheet||'')}</div></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div><div class="section-title">Informations logement</div><div class="card">${kv(p.data)}</div><div class="section-title">Locataire actuel</div><div class="card">${kv(current)}</div>${quality.missing.length?`<div class="note" style="margin-top:8px">Informations à compléter : ${esc(quality.missing.join(', '))}</div>`:''}${t?`<div class="actions" style="margin-top:10px"><button class="btn primary" onclick="closeModal();editTenant(${t.row_number})">Modifier la fiche locataire</button></div>`:''}<div class="section-title">Historique anciens locataires</div>${renderObjectTable(p.tenant_history)}<div class="section-title">Échéancier des paiements du logement</div>${renderObjectTable(p.payment_schedule)}</div></div>`};

function lookup(data,keys){for(const k of keys){const v=data?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v)}return ''}
function money(n){return Number.isFinite(n)?fmt(n)+' €':'—'}
function tenantName(t){return lookup(t.data,['Locataire','Nom locataire','Nom du locataire','Locataire actuel','Nom','Nom et prénom','Prénom Nom','Corps locataire'])||'Locataire ligne '+t.row_number}
function dwellingName(t){return lookup(t.data,['Nom du logement','Logement','Studio','Bien','Adresse','Adresse du logement'])||'Non renseigné'}
function filtered(items,fn){return !searchQuery?items:items.filter(x=>fn(x).toLocaleLowerCase('fr').includes(searchQuery))}
function section(title,description,tools=''){return '<div class="section-head"><div><h2>'+esc(title)+'</h2><p class="muted">'+esc(description)+'</p></div><div class="section-tools">'+tools+'</div></div>'}
function stats(items){return '<div class="summary-strip">'+items.map(([name,value,sub])=>'<div class="card"><div class="muted">'+esc(name)+'</div><div class="kpi">'+esc(String(value))+'</div>'+(sub?'<div class="muted">'+esc(sub)+'</div>':'')+'</div>').join('')+'</div>'}
function dataTable(headings,rows){if(!rows.length)return '<div class="card empty-state">Aucun élément à afficher.</div>';return '<div class="table-wrap"><table class="data-table"><thead><tr>'+headings.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function csvExport(filename,headings,rows){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const content='\uFEFF'+[headings,...rows].map(row=>row.map(quote).join(';')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvSnapshot(type){const tenants=db.tenants||[],props=(db.properties||[]).filter(p=>!p.is_example);if(type==='tenants'){const h=db.tenant_headers;csvExport('marne-invest-locataires.csv',h,tenants.map(t=>h.map(k=>t.data?.[k]??'')));return}if(type==='properties'){const keys=[...new Set(props.flatMap(p=>Object.keys(p.data||{})))];csvExport('marne-invest-biens.csv',keys,props.map(p=>keys.map(k=>p.data?.[k]??'')));return}if(type==='payments'){csvExport('marne-invest-paiements.csv',['Locataire','Bien','Paiement dû','Paiement reçu','Solde','Retard'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Paiement dû']),lookup(t.data,['Paiement reçu']),lookup(t.data,['Solde']),lookup(t.data,['Retard'])]));return}if(type==='contracts'){csvExport('marne-invest-contrats.csv',['Locataire','Bien','Début bail','Fin bail','Loyer de base','Charges'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Date entrée locataire']),lookup(t.data,['Date fin de bail']),lookup(t.data,['Loyer de base']),lookup(t.data,['Charge'])]));return}if(type==='reports'){csvExport('marne-invest-rapport.csv',['Indicateur','Valeur'],[['Biens réels',props.length],['Lignes locataires',tenants.length],['Paiements dus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement dû'])||0),0)],['Paiements reçus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement reçu'])||0),0)],['Lignes en retard',tenants.filter(t=>t.data?.['Retard']==='OUI').length]]);return}}
const originalCsvSnapshot=csvSnapshot;
window.exportMarne=type=>{
 if(type!=='ledger')return originalCsvSnapshot(type);
 const ledger=rentalLedger(),payments=db.payments||[],leases=db.leases||[];

 ['Réception','Logement','Locataire','Montant','Mode','Référence','Émetteur','Affecté','Non affecté','Statut','Saisie par','Date de saisie','Motif annulation'],
 payments.map(p=>{const lease=leases.find(l=>l.id===p.lease_id)||{},property=(db.properties||[]).find(x=>x.id===p.property_id);const allocated=p.status==='recorded'?(ledger.byPayment.get(p.id)||0):0;return [p.received_on,property?.name||'',lease.tenant_name||'',p.amount,p.payment_method,p.reference||'',p.payer_name||'',allocated,p.status==='recorded'?Math.max(0,Number(p.amount)-allocated):0,p.status,p.recorded_by||'',p.recorded_at||'',p.void_reason||''];}));

function rentalLedger(){
 const payments=db.payments||[],valid=new Map(payments.filter(p=>p.status==='recorded').map(p=>[p.id,p]));
 const byPayment=new Map(),byInstallment=new Map();
 for(const a of db.payment_allocations||[]){
  if(!valid.has(a.payment_id))continue;
  const amount=Number(a.amount)||0;
  byPayment.set(a.payment_id,(byPayment.get(a.payment_id)||0)+amount);
  byInstallment.set(a.installment_id,(byInstallment.get(a.installment_id)||0)+amount);
 }
 return {payments,valid,byPayment,byInstallment};
}
function todayParis(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function activeLeaseName(lease){const p=(db.properties||[]).find(x=>x.id===lease.property_id);return (p?.name||'Logement')+' — '+(lease.tenant_name||'Locataire')}
function pendingInstallments(leaseId,ledger){return (db.installments||[]).filter(i=>i.lease_id===leaseId&&i.status==='scheduled'&&Number(i.total_due)-(ledger.byInstallment.get(i.id)||0)>0.005).sort((a,b)=>a.period.localeCompare(b.period))}
function renderTransactions(){
 if(!db.current_user?.payment_access){$('content').innerHTML=section('Transactions','Accès financier réservé aux gestionnaires autorisés.')+'<div class="card empty-state">Votre compte ne dispose pas du droit de consultation du registre des paiements.</div>';return}
 const ledger=rentalLedger(),active=[...ledger.valid.values()],payments=filtered(ledger.payments,p=>[activeLeaseName((db.leases||[]).find(l=>l.id===p.lease_id)||{}),p.reference,p.received_on,p.payment_method].join(' '));
 const installments=(db.installments||[]).filter(i=>i.status==='scheduled');
 const due=installments.reduce((s,i)=>s+Number(i.total_due||0),0);
 const allocated=installments.reduce((s,i)=>s+(ledger.byInstallment.get(i.id)||0),0);
 const received=active.reduce((s,p)=>s+Number(p.amount||0),0);
 const unallocated=active.reduce((s,p)=>s+Math.max(0,Number(p.amount)- (ledger.byPayment.get(p.id)||0)),0);
 const canWrite=!db.current_user?.read_only,canVoid=!!db.current_user?.payment_void_access;
 const actions=(canWrite?'<button class="btn primary" onclick="openPaymentModal()">+ Enregistrer un paiement</button>':'')+
 '<button class="btn secondary" onclick="exportMarne(&quot;ledger&quot;)">Exporter le registre CSV</button>';
 $('content').innerHTML=section('Paiements et rapprochement','Registre autonome. Les anciens paiements du tableur ne sont pas importés automatiquement.',actions)+
 stats([['Encaissements saisis',money(received),'Depuis la création du registre'],['Échéances enregistrées',money(due),'Baux validés uniquement'],['Solde des échéances',money(Math.max(0,due-allocated)),'Sans les anciens impayés'],['Paiements à affecter',money(unallocated),'Avances et montants en attente']])+
 '<div class="section-head" style="margin-top:20px"><div><h2>Règlements enregistrés</h2><p class="muted">Les montants ne sont pris en compte que lorsqu’un paiement est confirmé.</p></div></div>'+
 dataTable(['Réception','Logement / locataire','Montant','Mode','Référence','Affectation','Statut','Actions'],payments.map(p=>{
  const lease=(db.leases||[]).find(l=>l.id===p.lease_id)||{};
  const used=ledger.byPayment.get(p.id)||0,amount=Number(p.amount),available=Math.max(0,amount-used);
  const tag=p.status==='void'?'<span class="mini-tag bad">Annulé</span>':available>0.005?'<span class="mini-tag warn">À affecter</span>':'<span class="mini-tag">Affecté</span>';
  const buttons=p.status==='recorded'&&canWrite?'<button class="btn secondary" data-id="'+esc(p.id)+'" onclick="openAllocationModal(this.dataset.id)" '+(available<0.005?'disabled':'')+'>Affecter</button>':'';
  const cancel=p.status==='recorded'&&canVoid?'<button class="btn danger" data-id="'+esc(p.id)+'" onclick="voidRentalPayment(this.dataset.id)">Annuler</button>':'';
  return '<tr><td>'+esc(p.received_on)+'</td><td>'+esc(activeLeaseName(lease))+'</td><td><b>'+money(amount)+'</b></td><td>'+esc(p.payment_method)+'</td><td>'+esc(p.reference||'—')+'</td><td>'+money(used)+' / '+money(amount)+'</td><td>'+tag+'</td><td><div class="item-actions">'+buttons+cancel+'</div></td></tr>';
 }))+
 '<div class="section-head" style="margin-top:22px"><div><h2>Échéances et montants restants</h2><p class="muted">Rapprochement uniquement à partir des paiements saisis dans ce registre.</p></div></div>'+
 dataTable(['Mois','Logement','Date d’échéance','Attendu','Affecté','Reste','État'],filtered(installments,i=>[i.period,activeLeaseName((db.leases||[]).find(l=>l.id===i.lease_id)||{})].join(' ')).sort((a,b)=>a.due_on.localeCompare(b.due_on)).map(i=>{
  const done=ledger.byInstallment.get(i.id)||0,remaining=Math.max(0,Number(i.total_due)-done);
  return '<tr><td>'+esc(i.period)+'</td><td>'+esc(activeLeaseName((db.leases||[]).find(l=>l.id===i.lease_id)||{}))+'</td><td>'+esc(i.due_on)+'</td><td>'+money(Number(i.total_due))+'</td><td>'+money(done)+'</td><td>'+money(remaining)+'</td><td><span class="mini-tag '+(remaining>0.005?'warn':'')+'">'+(remaining>0.005?'À régler':'Soldée')+'</span></td></tr>';
 }))+
 '<div class="note" style="margin-top:14px">La liaison bancaire automatique n’est pas encore activée. Un paiement saisi manuellement doit correspondre à une réception réellement constatée. Une avance non affectée n’est pas une quittance. Les montants « Paiement reçu » du tableur sont conservés séparément et ne sont jamais additionnés à ce registre.</div>'+
 ((ledger.payments.length>=1000||(db.payment_allocations||[]).length>=1000)?'<div class="note">Seuls les 1 000 derniers mouvements sont chargés ; les totaux présentés ici peuvent être incomplets. Une pagination serveur sera nécessaire.</div>':'');
}
window.openPaymentModal=()=>{
 if(!db.current_user?.payment_access||db.current_user?.read_only)return;
 const active=(db.leases||[]).filter(l=>l.status==='active'&&l.verified_at);
 if(!active.length){alert('Aucun bail actif vérifié. Validez d’abord un bail dans Contrats.');showPage('contracts');return;}
 const options=active.map(l=>'<option value="'+esc(l.id)+'">'+esc(activeLeaseName(l))+'</option>').join('');
 const today=todayParis(),key=crypto.randomUUID();
 $('modal').innerHTML='<div class="modal"><div class="box" style="max-width:750px"><div class="top"><h2>Enregistrer un règlement reçu</h2><button class="btn secondary" onclick="closeModal()">Fermer</button></div>'+
 '<div class="note">Saisir uniquement un paiement effectivement constaté sur le compte ou reçu. Aucune connexion bancaire n’est encore active.</div>'+
 '<div class="fields" style="margin-top:14px"><div><label>Bail et logement</label><select id="payment-lease" onchange="updatePaymentInstallments()">'+options+'</select></div>'+
 '<div><label>Échéance à rapprocher (facultatif)</label><select id="payment-installment"></select></div>'+
 '<div><label>Date de réception</label><input id="payment-date" type="date" max="'+today+'" value="'+today+'"></div>'+
 '<div><label>Montant réellement reçu (€)</label><input id="payment-amount" type="number" min="0.01" step="0.01" placeholder="0,00"></div>'+
 '<div><label>Mode de règlement</label><select id="payment-method"><option value="virement">Virement</option><option value="cheque">Chèque</option><option value="especes">Espèces</option><option value="carte">Carte</option><option value="autre">Autre</option></select></div>'+
 '<div><label>Référence du paiement</label><input id="payment-reference" maxlength="120" placeholder="Référence bancaire ou de chèque"></div>'+
 '<div><label>Émetteur (facultatif)</label><input id="payment-payer" maxlength="180"></div></div>'+
 '<label style="margin-top:10px">Commentaire (facultatif)</label><textarea id="payment-note" maxlength="2000"></textarea>'+
 '<label class="payment-confirm"><input id="payment-confirmed" type="checkbox"> Je confirme avoir vérifié que ce règlement a réellement été reçu.</label>'+
 '<input id="payment-key" type="hidden" value="'+key+'">'+
 '<div class="actions"><button id="payment-save" class="btn primary" onclick="saveRentalPayment()">Enregistrer le règlement</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div>'+
 '<div id="modalStatus" class="status"></div></div></div>';
 updatePaymentInstallments();
};
window.updatePaymentInstallments=()=>{
 const lease=$('payment-lease')?.value,selector=$('payment-installment');if(!selector)return;
 const items=pendingInstallments(lease,rentalLedger());
 selector.innerHTML='<option value="">Non affecté — avance ou attente</option>'+items.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.period)+' — reste '+money(Number(i.total_due)- (rentalLedger().byInstallment.get(i.id)||0))+'</option>').join('');
};
window.saveRentalPayment=async()=>{
 const status=$('modalStatus'),button=$('payment-save');
 if(!$('payment-confirmed')?.checked){status.className='status err';status.textContent='Confirmez la réception réelle du paiement.';return;}
 const body={idempotency_key:$('payment-key')?.value,lease_id:$('payment-lease')?.value,installment_id:$('payment-installment')?.value||null,received_on:$('payment-date')?.value,amount:$('payment-amount')?.value,payment_method:$('payment-method')?.value,reference:$('payment-reference')?.value,payer_name:$('payment-payer')?.value,note:$('payment-note')?.value,confirmed:true};
 if(!body.amount||Number(body.amount)<=0){status.className='status err';status.textContent='Montant positif obligatoire.';return;}
 button.disabled=true;status.className='status';status.textContent='Enregistrement sécurisé…';
 try{const result=await api('record-payment','POST',body);closeModal();await refresh();alert(result.duplicate?'Paiement déjà enregistré : aucun doublon créé.':'Paiement enregistré : '+money(Number(result.allocated||0))+' affecté(s), '+money(Number(result.unallocated||0))+' en attente.');}
 catch(e){button.disabled=false;status.className='status err';status.textContent=e.message||'Erreur du serveur';}
};
window.openAllocationModal=id=>{
 if(!db.current_user?.payment_access||db.current_user?.read_only)return;
 const ledger=rentalLedger(),payment=ledger.valid.get(id);if(!payment)return;
 const available=Math.max(0,Number(payment.amount)-(ledger.byPayment.get(id)||0));
 const installments=pendingInstallments(payment.lease_id,ledger);
 if(!installments.length){alert('Aucune échéance non soldée pour ce bail. Le montant reste une avance ou un paiement à affecter.');return;}
 $('modal').innerHTML='<div class="modal"><div class="box" style="max-width:580px"><div class="top"><h2>Affecter un paiement</h2><button class="btn secondary" onclick="closeModal()">Fermer</button></div>'+
 '<p>Montant non affecté : <b>'+money(available)+'</b></p><label>Échéance</label><select id="allocation-installment" onchange="updateAllocationAmount()">'+installments.map(i=>'<option value="'+esc(i.id)+'">'+esc(i.period)+' — reste '+money(Number(i.total_due)-(ledger.byInstallment.get(i.id)||0))+'</option>').join('')+'</select>'+
 '<label style="margin-top:12px">Montant à affecter (€)</label><input type="number" min="0.01" step="0.01" id="allocation-amount">'+
 '<div class="note" style="margin:12px 0">Le total affecté ne peut dépasser ni le paiement disponible ni le montant restant sur l’échéance.</div>'+
 '<button class="btn primary" data-id="'+esc(id)+'" onclick="submitPaymentAllocation(this.dataset.id)">Confirmer l’affectation</button><div id="modalStatus" class="status"></div></div></div>';
 updateAllocationAmount();
};
window.updateAllocationAmount=()=>{
 const i=(db.installments||[]).find(x=>x.id===$('allocation-installment')?.value);
 const paymentId=$('modal')?.querySelector('button[data-id]')?.dataset.id;
 const p=(db.payments||[]).find(x=>x.id===paymentId);
 const ledger=rentalLedger();
 if(!i||!p)return;
 const remaining=Math.max(0,Number(i.total_due)-(ledger.byInstallment.get(i.id)||0));
 const available=Math.max(0,Number(p.amount)-(ledger.byPayment.get(p.id)||0));
 $('allocation-amount').value=Math.min(available,remaining).toFixed(2);
};
window.submitPaymentAllocation=async(id)=>{
 const status=$('modalStatus'),amount=$('allocation-amount')?.value,installment_id=$('allocation-installment')?.value;
 if(!amount||Number(amount)<=0){status.className='status err';status.textContent='Montant invalide.';return;}
 if(!confirm('Confirmer cette affectation sur l’échéance sélectionnée ?'))return;
 status.className='status';status.textContent='Enregistrement…';
 try{await api('allocate-payment','POST',{payment_id:id,installment_id,amount,confirmed:true});closeModal();await refresh();}
 catch(e){status.className='status err';status.textContent=e.message||'Erreur du serveur';}
};
window.voidRentalPayment=async(id)=>{
 if(!db.current_user?.payment_void_access)return;
 const reason=prompt('Motif précis de l’annulation (obligatoire) :');if(reason===null)return;
 if(reason.trim().length<6){alert('Motif trop court.');return;}
 if(!confirm('Annuler ce règlement ? Il restera visible dans l’historique, mais ses affectations ne compteront plus.'))return;
 try{await api('void-payment','POST',{payment_id:id,reason:reason.trim(),confirmed:true});await refresh();}catch(e){alert(e.message||'Erreur du serveur')}
};

function renderWorks(){
 const props=(db.properties||[]).filter(p=>!p.is_example),rows=filtered(props,p=>JSON.stringify([p.name,p.data,p.current_tenant]));
 $('content').innerHTML=section('Travaux et entretien','Vue des biens pour préparer le suivi des interventions, sans inventer d’historique de travaux.','<button class="btn primary" onclick="newProperty()">Ajouter un bien</button>')+stats([['Biens suivis',props.length],['Travaux enregistrés','—','Aucune API travaux confirmée'],['Dépenses travaux','—','Aucune écriture associée']])+dataTable(['Bien','Adresse','Statut','Locataire','Dossier'],rows.map(p=>'<tr><td><b>'+esc(p.data?.['Nom du logement']||p.name)+'</b></td><td>'+esc(p.data?.['Adresse']||'—')+'</td><td>'+esc(p.data?.['Statut logement']||'—')+'</td><td>'+esc(p.current_tenant?.['Locataire actuel']||'—')+'</td><td><button class="btn secondary" onclick="openProperty(\''+esc(p.id)+'\')">Consulter</button></td></tr>'))+'<p class="module-note">L’ajout d’une intervention, de devis ou de factures exigera un stockage permanent côté serveur.</p>';
}
function renderDocuments(){
 const tenants=db.tenants||[],props=(db.properties||[]).filter(p=>!p.is_example);
 $('content').innerHTML=section('Documents et exports','Exports des données réellement disponibles. Les pièces justificatives PDF ne sont pas encore stockées dans ce module.')+stats([['Locataires',tenants.length],['Biens',props.length],['Exports disponibles',5],['Documents PDF hébergés','—']])+'<div class="property-grid">'+[['Locataires','Données du suivi locataire','tenants'],['Biens','Inventaire et informations des biens','properties'],['Paiements historiques','Anciennes valeurs du suivi locataire — sans rapprochement','payments'],['Registre des paiements','Paiements saisis, affectations et annulations','ledger'],['Contrats','Champs disponibles sur les baux','contracts']].map(([name,desc,id])=>'<div class="card"><h3>'+name+'</h3><p class="muted">'+desc+'</p><button class="btn primary" onclick="exportMarne(\''+id+'\')">Télécharger CSV</button></div>').join('')+'</div>';
}

function renderReports(){
 const tenants=db.tenants||[],props=(db.properties||[]).filter(p=>!p.is_example),ledger=rentalLedger(),active=[...ledger.valid.values()];
 const due=(db.installments||[]).filter(i=>i.status==='scheduled').reduce((n,i)=>n+Number(i.total_due),0);
 const paid=active.reduce((n,p)=>n+Number(p.amount),0);
 const applied=[...ledger.byInstallment.values()].reduce((n,v)=>n+v,0);
 const unallocated=active.reduce((n,p)=>n+Math.max(0,Number(p.amount)-(ledger.byPayment.get(p.id)||0)),0);
 const perProperty=props.map(p=>{const lease=(db.leases||[]).find(l=>l.property_id===p.id&&l.status==='active');const payments=active.filter(x=>x.property_id===p.id);return [p.name,lease?Number(lease.monthly_rent):null,payments.reduce((sum,x)=>sum+Number(x.amount),0)];});
 $('content').innerHTML=section('Rapports et statistiques','Baux vérifiés et registre des paiements, sans reconstitution des anciens mouvements.','<button class="btn secondary" onclick="exportMarne(&quot;reports&quot;)">Exporter le rapport historique CSV</button><button class="btn primary" onclick="window.print()">Imprimer</button>')+
 stats([['Biens',props.length],['Lignes locataires',tenants.length],['Échéances du registre',money(due)],['Paiements saisis',money(paid)]])+
 stats([['Affecté aux échéances',money(applied)],['Reste sur échéances',money(Math.max(0,due-applied))],['Avances ou non affectés',money(unallocated)],['Baux validés',(db.leases||[]).filter(l=>l.status==='active').length]])+
 dataTable(['Bien','Loyer contractuel validé','Paiements saisis dans le registre'],filtered(perProperty,x=>x.join(' ')).map(x=>'<tr><td><b>'+esc(x[0])+'</b></td><td>'+money(x[1])+'</td><td>'+money(x[2])+'</td></tr>'))+
 '<div class="note" style="margin-top:15px">Les montants historiques du tableur ne sont pas intégrés dans ces totaux. Les règlements annulés sont exclus. Le rapprochement bancaire et les quittances automatisées ne sont pas encore activés.</div>';
}

async function fetchIrl(){irlChecked=true;irlLive={loading:true};if(page==='config')render();try{const r=await fetch('https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/marne-irl',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok||!Number.isFinite(d.index))throw Error(d.error||'IRL non disponible');irlLive=d}catch(e){irlLive={error:e.message||'IRL non disponible'}}if(page==='config')render()}
window.refreshIrl=()=>{irlChecked=false;fetchIrl()};
function irlPanel(){const ok=irlLive?.ok;const live=ok?'Indice INSEE vérifié : '+fmt(irlLive.index)+' — '+irlLive.period:irlLive?.loading?'Vérification INSEE en cours…':'Dernière valeur vérifiée publiquement : 148,06 — T3 2026 (métropole)';const source='<a href="https://www.insee.fr/fr/statistiques/serie/001515333" target="_blank" rel="noopener noreferrer">Consulter la série officielle INSEE</a>';return '<div class="card" style="margin-bottom:15px"><div class="section-head"><div><h3>Indice de référence des loyers (IRL)</h3><p class="muted">Consultation de la dernière publication INSEE, sans modification des baux.</p></div><button class="btn primary" onclick="refreshIrl()">Actualiser depuis l’INSEE</button></div><div class="kpi">'+esc(live)+'</div><p class="muted">'+(ok?'Dernier contrôle : '+esc(new Date(irlLive.checked_at).toLocaleString('fr-FR')):irlLive?.error?'Actualisation indisponible : '+esc(irlLive.error):'Référence du 15 octobre 2026. Actualisation en ligne non confirmée.')+'</p><p>'+source+'</p><div class="note"><b>Révision des loyers :</b> l’indice de base dépend du trimestre prévu au bail, avec contrôle de la date de révision, du DPE et des restrictions applicables. Le recalcul automatique des loyers reste désactivé pour éviter des montants erronés.</div></div>'}
function emailAutomationPanel(){const sender=setting('sender_email','');return '<div class="card" style="margin-bottom:15px"><h3>Envois automatiques de courriels</h3><p><span class="mini-tag warn">Envoi automatique désactivé</span></p><p class="muted">Adresse d’expédition prévue : <b>'+esc(String(sender||'Non configurée'))+'</b>. Cette adresse n’est pas encore connectée à un service SMTP et aucune identité d’expéditeur n’a été vérifiée.</p><button class="btn secondary" onclick="showPage(\'emails\')">Voir les courriels à préparer</button></div>'}
function mailUrl(to,subject,body){return 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
window.openTenantEmail=row=>{const t=(db.tenants||[]).find(x=>x.row_number===row);if(!t)return;const to=lookup(t.data,['Mail locataire']);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){alert('Adresse e-mail du locataire manquante ou invalide');return}const subject=lookup(t.data,['Sujet locataire'])||'Suivi de votre logement — Marne Invest';const body=lookup(t.data,['Corps locataire'])||'Bonjour,\n\nNous vous contactons au sujet de votre logement.\\n\\nCordialement,\\nMarne Invest';location.href=mailUrl(to,subject,body)};
function renderEmails(){const tenants=db.tenants||[],withEmail=tenants.filter(t=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lookup(t.data,['Mail locataire']))),rows=filtered(tenants,t=>[tenantName(t),dwellingName(t),...Object.values(t.data||{})].join(' '));$('content').innerHTML=section('Courriels et relances','Préparation des messages locataires. Aucun envoi automatique n’est actuellement déclenché.')+stats([['Locataires',tenants.length],['Adresses valides',withEmail.length],['En retard',tenants.filter(t=>t.data?.['Retard']==='OUI').length],['Automatisation','Désactivée']])+dataTable(['Locataire','Adresse e-mail','Situation','Relance 7 jours','Relance 14 jours','Message'],rows.map(t=>'<tr><td><b>'+esc(tenantName(t))+'</b></td><td>'+esc(lookup(t.data,['Mail locataire'])||'—')+'</td><td><span class="mini-tag '+(t.data?.['Retard']==='OUI'?'bad':'')+'">'+esc(lookup(t.data,['Type d’alerte'])||'—')+'</span></td><td>'+esc(lookup(t.data,['Relance 7 jours envoyée'])||'Non renseigné')+'</td><td>'+esc(lookup(t.data,['Relance 14 jours envoyée'])||'Non renseigné')+'</td><td><button class="btn secondary" onclick="openTenantEmail('+t.row_number+')">Préparer un e-mail</button></td></tr>'))+'<div class="note" style="margin-top:15px">Les liens de rédaction ouvrent votre logiciel de messagerie et demandent une validation humaine. Ils ne déclenchent pas d’envoi ni ne marquent un message comme envoyé. Une programmation serveur avec journal et anti-doublon sera nécessaire pour les relances automatiques.</div>'}
function renderGuide(){$('content').innerHTML=`<div class="card"><h3>Commandes reproduites</h3>${db.commands.map(c=>`<div class="kv"><b>${esc(c.label)}</b><div><code>${esc(c.function)}</code><div class="muted">${esc(c.description)}</div></div></div>`).join('')}</div><br><div class="card"><h3>Organisation du classeur reproduite</h3><p>Suivi_Locataires : ${db.tenant_headers.length} colonnes, avec les listes OUI/NON et les états d’alerte conservés dans les données.</p><p>Config : paramètres IRL, seuil de révision, délais de relance, liens INSEE et préfixe des dossiers.</p><p>Modele_Dossier_Logement : informations logement, locataire actuel, historique, échéancier et synthèse.</p><p>Dossier_Exemple : les valeurs du classeur sont présentes dans l’onglet « Dossiers logement ».</p></div>`}
window.closeModal=()=>{$('modal').innerHTML=''};
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');initNav();refresh()}else $('login').classList.remove('hide');
})();
</script>
