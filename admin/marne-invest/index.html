-radius:12px;max-height:68vh}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{padding:8px 9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px;vertical-align:top;max-width:280px;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0;z-index:2}.tenant-row{cursor:pointer}.tenant-row.selected{outline:2px solid #64748b;outline-offset:-2px;background:#f1f5f9}.clip{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.pill.bad{background:#fdeaea;color:#8a2525}.pill.ok{background:#e8f5ed;color:#176b3a}.command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.command{border:1px solid #dce2e7;border-radius:10px;padding:12px;background:#fff}.command b{display:block;margin-bottom:5px}.property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.property-card{cursor:pointer}.property-card:hover{border-color:#9aa8b5}.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 12px;padding:6px 0;border-bottom:1px solid #edf0f2}.kv:last-child{border:0}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}.editor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.section-title{font-weight:800;margin:16px 0 8px}.sticky-left{position:sticky;left:0;background:inherit;z-index:1}.note{padding:10px;border-radius:9px;background:#fff8e1;border:1px solid #f2df9d;font-size:13px}.login input{margin-bottom:12px}@media(max-width:1000px){.grid,.command-grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav butt @media(max-width:1000px){.shell{grid-template-columns:minmax(0,1fr)}.side{min-width:0}.nav{max-width:100%}}
@media(max-width:620px){.main{padding:0 12px 20px}.top{margin:0 -12px 16px;padding:14px 12px}.top .actions{width:100%}.kv{grid-template-columns:minmax(0,1fr)}.health-item>div,.release-entry>div{min-width:0;overflow-wrap:anywhere}}

.property-edit-section{border:1px solid #dce5ef;border-radius:10px;padding:14px;margin:13px 0;background:#fbfdff}

.property-charge-list,.property-custom-list{display:grid;gap:8px;margin:12px 0}

@media(max-width:620px){.property-custom-row,.property-charge-row{grid-template-columns:1fr}.property-charge-row>*{grid-column:auto!important}}

<body>
<section id="login" class="login"><div class="box"><h1>Marne Invest</h1><p class="muted">Administration — gestion locative IRL</p><label>Utilisateur</label><input id="user" value="holding-admin" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Marne Invest</div><div class="brand-sub">Gestion locative</div><div id="nav" class="nav"></div><div id="releaseMini" class="release-mini"></div><div class="side-profile"><b>Marne Invest</b>Gestion immobilière</div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div id="serverTime" class="muted"></div></div><div class="actions"><input id="globalSearch" type="search" class="top-search" placeholder="⌕ Rechercher..." aria-label="Rechercher" oninput="searchAll(this.value)"><a class="btn secondary" href="../holding/">Holding</a><a class="btn secondary" href="./comptabilite/">Comptabilité</a><a class="btn secondary" href="./locataires/">Gestion locataire</a><a class="btn secondary" href="./studios/">Gestion studio</a><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
(()=>{'use strict';
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/rental-admin-api';
const requestedPage=new URLSearchParams(location.search).get('page');let token=localStorage.getItem('marne_invest_logged_out')==='1'?'':localStorage.getItem('marne_invest_admin_token')||localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',db=null,page=['dashboard','tenants','properties','config','guide','contracts','transactions','works','documents','reports','emails','mail','pilotage'].includes(requestedPage||'')?requestedPage:'dashboard',selectedRow=null,searchQuery='',irlLive=null,irlChecked=false,documentPropertyFilter='',refreshGeneration=0,sessionGeneration=0,mailReaderGeneration=0;
const pages=[['dashboard','Dashboard','⌂'],['pilotage','Mise en service','◉'],['properties','Mes Biens','▥'],['tenants','Locataires','♙'],['contracts','Contrats','▤'],['transactions','Transactions','↗'],['emails','Relances et e-mails','✉'],['mail','Messagerie Free','✉'],['works','Travaux','⚒'],['documents','Documents','▱'],['reports','Rapports','▥'],['config','Paramètres','⚙']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0),fmt=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),short=v=>{const s=String(v??'');return s.length>80?s.slice(0,77)+'…':s};
async function api(action,method='GET',body,query={}){
 const session=token,generation=sessionGeneration,multipart=body instanceof FormData;
 const r=await fetch(API+'?'+new URLSearchParams({...query,action}),{
  method,headers:{...(!multipart?{'content-type':'application/json'}:{}),...(session?{authorization:'Bearer '+session}:{})},
  body:multipart?body:body?JSON.stringify(body):undefined,cache:'no-store'
 }),j=await r.json().catch(()=>({error:'Réponse invalide'}));
 if(generation!==sessionGeneration||session!==token)throw new Error('Session modifiée');
 if(r.status===401&&action!=='login'){logout();$('loginStatus').className='status err';$('loginStatus').textContent='Session expirée';throw new Error('Session expirée')}
 if(!r.ok)throw new Error(j.error||'Erreur serveur');return j
}
window.login=async()=>{const generation=++sessionGeneration;try{$('loginStatus').className='status';$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});if(generation!==sessionGeneration)return;token=j.token;localStorage.setItem('marne_invest_admin_token',token);localStorage.removeItem('marne_invest_logged_out');$('pass').value='';$('loginStatus').textContent='';$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){if(generation!==sessionGeneration)return;$('loginStatus').className='status err';$('loginStatus').textContent=e.message||'Erreur'}};
window.logout=()=>{sessionGeneration++;token='';db=null;selectedRow=null;bankCsvPreview=null;irlLive=null;irlChecked=false;refreshGeneration++;localStorage.removeItem('marne_invest_admin_token');localStorage.setItem('marne_invest_logged_out','1');for(const id of ['modal','content','releaseMini','serverTime'])$(id).textContent='';$('pass').value='';$('app').classList.add('hide');$('login').classList.remove('hide')};
function marneCanPage(k){const a=db?.current_user;if(!a)return false;const p=a.permissions||{};if(a.role==='admin'||p.marne_admin===true||p.marne_invest===true)return true;if(['dashboard','guide'].includes(k))return true;if(k==='properties')return p.marne_studios===true;if(k==='tenants')return p.marne_tenants===true;if(['contracts','transactions','emails','reports'].includes(k))return a.payment_access===true;if(k==='works')return a.work_access===true;if(k==='documents')return a.document_access===true;if(k==='mail')return a.mail_access===true;return false}
function initNav(){$('nav').innerHTML=pages.filter(([k])=>marneCanPage(k)).map(([k,l,i])=>`<button data-p="${k}" onclick="showPage('${k}')"><span class="nav-icon">${i}</span>${l}</button>`).join('')}
window.showPage=p=>{if(db&&!marneCanPage(p)){alert('Cette fenêtre n’est pas autorisée pour votre compte.');return}page=p;searchQuery='';$('globalSearch').value='';render()};window.searchAll=q=>{searchQuery=String(q||'').trim().toLocaleLowerCase('fr');render()};
window.refresh=async()=>{
 const generation=++refreshGeneration,session=token;
 try{
  const data=await api('data');
  if(generation!==refreshGeneration||!token||token!==session)return false;
  db=data;$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render();if(!irlChecked)fetchIrl();return true;
 }catch(e){
  if(generation!==refreshGeneration){if(!token){$('loginStatus').className='status err';$('loginStatus').textContent=e.message||'Session expirée'}return false}
  db=null;$('modal').textContent='';$('releaseMini').textContent='';$('serverTime').textContent='Données indisponibles — actualisation nécessaire';
  $('content').innerHTML='<section class="card" role="alert"><h2>Actualisation impossible</h2><p>'+esc(e.message||'Erreur serveur')+'</p><p class="muted">Les anciens soldes sont masqués jusqu’au prochain chargement réussi.</p><button class="btn primary" onclick="refresh()">Réessayer</button></section>';return false;
 }
};
function render(){if(!db)return;if(!marneCanPage(page))page='dashboard';initNav();if($('releaseMini'))$('releaseMini').innerHTML=releaseMini();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,tenants:renderTenants,properties:renderProperties,config:renderConfig,guide:renderGuide,contracts:renderContracts,transactions:renderTransactions,emails:renderEmails,mail:renderMail,works:renderWorks,documents:renderDocuments,reports:renderReports,pilotage:renderPilotage}[page]||renderDashboard)()}
function setting(key,fallback){return db.settings.find(x=>x.setting_key===key)?.value??fallback}

function setupState(){
 const props=(db.properties||[]).filter(p=>!p.is_example),leases=db.leases||[],today=todayParis();
 const parameters=['landlord_name','landlord_address'].filter(key=>!String(setting(key,'')).trim());
 const addresses=props.filter(p=>!String(p.data?.Adresse||'').trim()).length;
 const drafts=leases.filter(l=>l.status==='draft').length;
 const current=leases.filter(l=>l.status==='active'&&l.verified_at&&l.start_date<=today&&(!l.end_date||l.end_date>=today)).length;
 return {props,parameters,addresses,drafts,current};
}

function healthReportState(report,now=Date.now()){
 if(!report)return {tone:'warn',title:'Contrôle à lancer',message:'Aucun diagnostic enregistré. Lancez un contrôle pour obtenir un résultat.'};
 const checked=Date.parse(report.checked_at),age=now-checked;
 if(!['ok','attention','anomaly'].includes(report.status)||!Number.isFinite(checked)||age< -300000)
  return {tone:'warn',title:'Résultat à vérifier',message:'Le résultat ou la date du dernier diagnostic est invalide. Relancez le contrôle.'};
 if(age>26*60*60*1000)return {tone:'warn',title:'Diagnostic à actualiser',message:'Le dernier contrôle remonte à plus de 26 heures. Il ne permet pas de confirmer l’état actuel du système.'};
 if(report.status==='anomaly'||Number(report.critical_count)>0)return {tone:'bad',title:'Anomalies à traiter',message:'Consultez les anomalies du dernier contrôle.'};
 if(report.status==='attention'||Number(report.warning_count)>0)return {tone:'warn',title:'Points de vigilance',message:'Des vérifications restent nécessaires.'};
 return {tone:'',title:'Aucune anomalie détectée',message:'Aucune anomalie détectée dans le dernier contrôle. Les opérations non encore configurées sont suivies dans « À compléter » ci-dessous.'};
}

window.runMarneHealth=async()=>{
 if(!db.current_user?.payment_void_access||db.current_user?.read_only)return;
 const button=$('health-run-button'),state=$('healthRunStatus');
 if(button)button.disabled=true;
 if(state){state.className='status';state.textContent='Contrôle serveur en cours…'}
 try{
  const result=await api('health-run','POST',{confirmed:true});
  await refresh();
  const next=$('healthRunStatus');
  if(next){next.className=result.report?.critical_count?'status err':result.report?.warning_count?'status warn':'status ok';
    next.textContent='Diagnostic terminé : '+Number(result.report?.critical_count||0)+' anomalie(s) critique(s), '+
    Number(result.report?.warning_count||0)+' point(s) à vérifier.'}
 }catch(e){
  const next=$('healthRunStatus');
  if(next){next.className='status err';next.textContent=e.message||'Diagnostic impossible'}
  else alert(e.message||'Diagnostic impossible');
 }finally{const btn=$('health-run-button');if(btn)btn.disabled=false}
};

function formDate(value){
 const text=String(value??'').trim(),match=text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/),iso=match?match[3]+'-'+match[2]+'-'+match[1]:text;
 return /^(?!0000)\d{4}-\d{2}-\d{2}$/.test(iso)&&!Number.isNaN(Date.parse(iso+'T00:00:00Z'))&&new Date(iso+'T00:00:00Z').toISOString().slice(0,10)===iso?iso:'';
}

function leaseForTenant(tenant){
 if(!tenant)return null;
 const rows=(db.leases||[]).filter(l=>l.tenant_row_id===tenant.id);
 return rows.find(l=>l.status==='active')||rows.find(l=>l.status==='draft')||rows.filter(l=>l.status==='closed').sort((a,b)=>String(b.end_date||'').localeCompare(String(a.end_date||'')))[0]||null;
}
function leaseFields(lease,locked,history={},property=null){
 const field=(key,title,value,type,attrs='')=>'<div><label for="lease-'+key+'">'+esc(title)+'</label><input id="lease-'+key+'" type="'+type+'" value="'+esc(value??'')+'" '+(locked?'disabled':'')+' '+attrs+'></div>';
 const kinds=[['unverified','À renseigner'],['residential','Habitation'],['parking','Parking / garage indépendant'],['commercial','Commercial'],['other','Autre']];
 const value=(key,legacy)=>{
  const actual=lease?.[key],historical=history?.[legacy];
  if(actual!==null&&actual!==undefined&&actual!=='')return actual;
  if(historical!==null&&historical!==undefined&&historical!=='')return historical;
  return !lease||lease.status==='draft'?propertyDefault(property,key):'';
 };
 const amount=(key,legacy)=>formMoney(value(key,legacy))?String(value(key,legacy)).trim().replace(',','.'):'';
 return '<div class="fields">'+
 field('start','Date de début du bail',formDate(value('start_date','Date entrée locataire')),'date')+
 field('end','Date de fin prévue (facultative)',formDate(value('end_date','Date fin de bail')),'date')+
 field('rent','Loyer mensuel hors charges (€)',amount('monthly_rent','Loyer de base'),'number','min="0" step="0.01"')+
 field('charges','Charges mensuelles (€)',amount('charges_amount','Charge'),'number','min="0" step="0.01"')+
 field('day','Jour d’échéance (1 à 31)',value('due_day','Jour d’échéance'),'number','min="1" max="31" step="1"')+
 '<div><label for="lease-kind">Nature du bail</label><select id="lease-kind" '+(locked?'disabled':'')+'>'+kinds.map(([v,label])=>'<option value="'+v+'" '+((value('lease_kind','Nature du bail')||'unverified')===v?'selected':'')+'>'+label+'</option>').join('')+'</select></div>'+
 field('issuer-name','Bailleur / mandataire',value('issuer_name','Bailleur du bail')||(locked?'':String(setting('landlord_name',''))),'text','maxlength="200"')+
 field('issuer-address','Adresse du bailleur / mandataire',value('issuer_address','Adresse du bailleur')||(locked?'':String(setting('landlord_address',''))),'text','maxlength="500"')+
 '</div><label class="payment-confirm"><input type="checkbox" id="lease-email-consent" '+(value('receipt_email_consent','Quittance par e-mail acceptée')===true?'checked':'')+' '+(locked?'disabled':'')+'> Accord du locataire vérifié pour recevoir ses quittances par e-mail</label>'+
 '<label for="lease-notes">Notes du bail</label><textarea id="lease-notes" maxlength="2000" '+(locked?'disabled':'')+'>'+esc(value('notes','Notes du bail'))+'</textarea>';
}
function readLeaseFields(){
 const raw=key=>$('lease-'+key)?.value??'';
 return {start_date:raw('start'),end_date:raw('end'),monthly_rent:raw('rent'),charges_amount:raw('charges'),due_day:raw('day'),lease_kind:raw('kind'),issuer_name:raw('issuer-name').trim(),issuer_address:raw('issuer-address').trim(),receipt_email_consent:!!$('lease-email-consent')?.checked,notes:raw('notes')};
}
function leaseMissing(lease,property,tenant){
 const missing=[];
 if(!String(tenant?.data?.Locataire||'').trim())missing.push('nom du locataire');
 if(!property||property.is_example)missing.push('bien associé');
 if(!String(property?.data?.Adresse||'').trim())missing.push('adresse du bien');
 if(!formDate(lease?.start_date))missing.push('date de début du bail');
 if(!formMoney(lease?.monthly_rent))missing.push('loyer mensuel');
 if(!formMoney(lease?.charges_amount))missing.push('charges mensuelles (0 si aucune)');
 const day=Number(lease?.due_day);
 if(!Number.isInteger(day)||day<1||day>31)missing.push('jour d’échéance');
 if(!['residential','parking','commercial','other'].includes(lease?.lease_kind))missing.push('nature du bail');
 if(!String(lease?.issuer_name||'').trim())missing.push('nom du bailleur');
 if(!String(lease?.issuer_address||'').trim())missing.push('adresse du bailleur');
 if(lease?.end_date&&(!formDate(lease.end_date)||lease.end_date<lease.start_date))missing.push('date de fin cohérente');
 return missing;
}

 leaseFields(lease,contractLocked,data,props.find(p=>p.id===property)):'';
 $('modal').innerHTML='<div class="modal"><div class="box"><div class="top"><div><h2>'+(row?'Fiche locataire':'Nouveau locataire')+'</h2><p class="muted">Coordonnées et préparation de la location</p></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div>'+
 '<div class="fields">'+field('name','Nom et prénom / dénomination',data.Locataire,'text','maxlength="200"')+
 field('email','E-mail du locataire',data['Mail locataire'],'email','maxlength="254"')+
 field('phone','Téléphone du locataire',data['Téléphone locataire'],'tel','maxlength="40"')+

 (property?'<button class="btn secondary" data-property="'+esc(property)+'" onclick="showPropertyDocuments(this.dataset.property)">Documents du bien</button>':'')+'</div>'+
 '<details style="margin-top:16px"><summary>Données historiques conservées</summary>'+kv(data)+'</details><div class="status" id="modalStatus" role="status"></div></div></div>';

window.applyPropertyLeaseDefaults=id=>{
 const property=(db?.properties||[]).find(x=>x.id===id);
 const mapping=[['rent','monthly_rent'],['charges','charges_amount'],['day','due_day'],['kind','lease_kind']];
 for(const [field,key] of mapping){
  const input=$('lease-'+field),value=String(propertyDefault(property,key)||'');
  if(input&&!input.disabled&&(!input.value||input.dataset.propertyAutofill==='1'||input.value==='unverified')){
   input.value=value||(field==='kind'?'unverified':'');
   input.dataset.propertyAutofill='1';
  }
 }
};
window.saveTenant=async(id,activate=false)=>{
 const status=$('modalStatus');if(!status||db.current_user?.read_only)return;
 const original=(db.tenants||[]).find(t=>t.id===id),lease=leaseForTenant(original);
 const financial=!!db.current_user?.payment_access,saveContract=financial&&(!lease||lease.status==='draft');
 const property_id=$('tenant-property')?.value||null,property=(db.properties||[]).find(p=>p.id===property_id);
 const data={Locataire:$('tenant-name').value.trim(),'Mail locataire':$('tenant-email').value.trim(),'Téléphone locataire':$('tenant-phone').value.trim(),Notes:$('tenant-notes').value};
 const fields=[...$('modal').querySelectorAll('input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];
 const invalid=fields.find(input=>!input.checkValidity());
 if(invalid){status.className='status err';status.textContent='Corrigez le champ « '+($('modal').querySelector('label[for="'+invalid.id+'"]')?.textContent||'valeur saisie')+' ».';invalid.focus();return}
 const contract=saveContract?readLeaseFields():null;
 if(contract){
  data['Date entrée locataire']=contract.start_date;data['Date fin de bail']=contract.end_date;
  data['Loyer de base']=contract.monthly_rent;data.Charge=contract.charges_amount;
  if(!lease)Object.assign(data,{'Jour d’échéance':contract.due_day,'Nature du bail':contract.lease_kind,'Bailleur du bail':contract.issuer_name,'Adresse du bailleur':contract.issuer_address,'Quittance par e-mail acceptée':contract.receipt_email_consent,'Notes du bail':contract.notes});
 }
 if(activate){
  const missing=leaseMissing(contract,property,{data});
  if(missing.length){status.className='status err';status.textContent='À compléter avant activation : '+missing.join(', ')+'.';return}
  if(!confirm('Confirmez-vous avoir vérifié l’identité, les dates, les montants et les clauses dans le bail signé ?'))return;
 }
 const buttons=[...$('modal').querySelectorAll('#tenant-save,#tenant-activate')];buttons.forEach(b=>b.disabled=true);
 let saved=false;
 try{
  status.className='status';status.textContent='Enregistrement de la fiche…';
  const result=await api('save-tenant','POST',{id,property_id,data});saved=true;
  if(!db)return;const index=db.tenants.findIndex(t=>t.id===result.item.id);if(index<0)db.tenants.push(result.item);else db.tenants[index]=result.item;
  buttons.forEach(b=>{if(b.isConnected)b.dataset.id=result.item.id});
  let leaseResult=null;
  if(saveContract&&property_id&&data.Locataire){
   status.textContent='Préparation du bail lié à cette fiche…';
   const prepared=await api('prepare-lease','POST',{tenant_row_id:result.item.id});
   if(!db)return;const leaseIndex=db.leases.findIndex(l=>l.id===prepared.lease.id);if(leaseIndex<0)db.leases.push(prepared.lease);else db.leases[leaseIndex]=prepared.lease;
   leaseResult=await api('save-lease','POST',{...contract,id:prepared.lease.id,activate});
  }
  if(!await refresh())return;
  editTenant(result.item.row_number);
  const next=$('modalStatus');if(next){next.className='status ok';next.textContent=activate?'Fiche enregistrée et bail activé. '+Number(leaseResult?.installments_created||0)+' échéance(s) créée(s).'+(leaseResult?.skipped_partial_months?' Les mois incomplets restent à vérifier.':''):saveContract&&property_id&&data.Locataire?'Fiche et brouillon de bail enregistrés. Les informations manquantes peuvent être complétées plus tard.':'Fiche enregistrée.'}
 }catch(e){if(status.isConnected){status.className='status err';status.textContent=(saved?'Fiche enregistrée ; la préparation du bail reste à terminer : ':'Enregistrement impossible : ')+(e.message||'Erreur serveur')}}
 finally{buttons.forEach(b=>{if(b.isConnected)b.disabled=false})}
};

function linkedTenant(propertyId){
 const tenants=(db.tenants||[]).filter(t=>t.property_id===propertyId);
 const active=(db.leases||[]).find(l=>l.property_id===propertyId&&l.status==='active');
 if(active)return tenants.find(t=>t.id===active.tenant_row_id)||null;
 const drafts=(db.leases||[]).filter(l=>l.property_id===propertyId&&l.status==='draft'&&tenants.some(t=>t.id===l.tenant_row_id));
 if(drafts.length===1)return tenants.find(t=>t.id===drafts[0].tenant_row_id);
 const current=tenants.filter(t=>String(t.data?.Locataire||'').trim()&&!leaseForTenant(t)?.end_date);
 if(current.length===1)return current[0];
 const named=tenants.filter(t=>String(t.data?.Locataire||'').trim()&&leaseForTenant(t)?.status!=='closed');
 return named.length===1?named[0]:tenants.length===1?tenants[0]:null;
}
function propertyCompleteness(p,t){
 const lease=leaseForTenant(t),data=t?.data||{};
 const needed=[
 ['Adresse du bien',!!String(p.data?.Adresse||'').trim()],
 ['Loyer valide',formMoney(lease?.monthly_rent??data['Loyer de base']??p.data?.['Loyer mensuel de référence'])],
 ['Date d’entrée valide',!!formDate(lease?.start_date||data['Date entrée locataire'])],
 ['E-mail locataire valide',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(data['Mail locataire']||''))],
 ['Charges valides',formMoney(lease?.charges_amount??data.Charge??p.data?.['Charges mensuelles de référence'])]
 ];
 return {missing:needed.filter(([,valid])=>!valid).map(([label])=>label),complete:needed.filter(([,valid])=>valid).length};
}

function propertyChargeValues(){
 const rows=[...document.querySelectorAll('#property-charge-rows [data-charge-row]')],lines=[];
 let tenantMonth=0,ownerMonth=0;
 for(const row of rows){
  const libelle=row.querySelector('[data-charge-label]').value.trim(),montant=row.querySelector('[data-charge-amount]').value.trim();
  if(!libelle&&!montant)continue;
  if(!libelle||!formMoney(montant))throw Error('Chaque charge doit comporter un libellé et un montant positif ou nul à deux décimales maximum.');
  const periodicite=row.querySelector('.charge-frequency').value,affectation=row.querySelector('.charge-payer').value;
  if(!['mensuel','trimestriel','annuel'].includes(periodicite)||!['locataire','bailleur'].includes(affectation))throw Error('Affectation ou périodicité des charges invalide.');
  const factor=periodicite==='annuel'?12:periodicite==='trimestriel'?3:1;
  const monthly=Math.round(Number(montant)*100/factor)/100;
  if(affectation==='locataire')tenantMonth+=monthly;else ownerMonth+=monthly;
  lines.push({libelle,montant:Number(montant).toFixed(2),periodicite,affectation});
 }
 return {lines,tenantMonth:Math.round(tenantMonth*100)/100,ownerMonth:Math.round(ownerMonth*100)/100};
}

};

window.saveProperty=async id=>{
 const status=$('modalStatus'),button=$('property-save');if(!status||!button||db.current_user?.read_only)return;
 const original=(db.properties||[]).find(x=>x.id===id),name=$('property-name')?.value.trim();
 if(!original||!name){status.className='status err';status.textContent='Renseignez le nom du bien.';return}
 const fail=message=>{status.className='status err';status.textContent=message;return false};
 const data={Notes:$('property-notes').value};
 for(const input of document.querySelectorAll('[data-property-key]')){
  const key=input.dataset.propertyKey,type=input.dataset.propertyType,value=input.value.trim();
  if(!input.checkValidity())return void fail('Corrigez le champ « '+key+' ».');
  if(type==='money'&&value!==''&&!formMoney(value))return void fail('Montant incorrect pour « '+key+' » (deux décimales maximum).');
  if(['decimal','integer'].includes(type)&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0||(type==='integer'&&!Number.isInteger(Number(value)))))return void fail('Valeur numérique incorrecte pour « '+key+' ».');
  if(type==='date'&&value!==''&&!formDate(value))return void fail('Date incorrecte pour « '+key+' ».');
  if(key==='Jour d’échéance'&&value!==''&&!(Number.isInteger(Number(value))&&Number(value)>=1&&Number(value)<=31))return void fail('Le jour de paiement doit être compris entre 1 et 31.');
  data[key]=value;
 }
 let charges;
 try{charges=propertyChargeValues()}catch(e){return void fail(e.message)}
 data['Charges affectées']=charges.lines;
 if(charges.lines.length)data['Charges mensuelles de référence']=charges.tenantMonth.toFixed(2);
 const custom=Object.create(null);
 for(const row of document.querySelectorAll('#property-custom-rows [data-custom-row]')){
  const key=row.querySelector('[data-custom-key]').value.trim(),value=row.querySelector('[data-custom-value]').value.trim();
  if(!key&&!value)continue;
  if(!key||['__proto__','constructor','prototype'].includes(key)||Object.hasOwn(custom,key))return void fail('Nom de paramètre personnalisé vide, interdit ou déjà utilisé : '+key);
  custom[key]=value;
 }
 data['Paramètres personnalisés']=custom;
 for(const input of document.querySelectorAll('[data-legacy-key]')){
  const key=input.dataset.legacyKey,raw=input.value,originalValue=original.data?.[key];
  if(raw===propertyLegacyValue(originalValue))continue;
  try{
   const type=input.dataset.legacyType;
   data[key]=type==='json'?JSON.parse(raw):type==='number'?(raw.trim()===''?null:Number(raw)):type==='boolean'?(raw.trim()==='true'?true:raw.trim()==='false'?false:(()=>{throw Error('Booléen attendu : true ou false')})()):raw;
   if(type==='number'&&data[key]!==null&&!Number.isFinite(data[key]))throw Error('Nombre invalide');
  }catch(e){return void fail('Donnée historique « '+key+' » invalide : '+e.message)}
 }
 button.disabled=true;status.className='status';status.textContent='Enregistrement de tous les paramètres du bien…';
 try{
  await api('save-property','POST',{id,name,data});
  if(!await refresh())return;
  openProperty(id);
  const next=$('modalStatus');if(next){next.className='status ok';next.textContent='Tous les paramètres du bien ont été enregistrés. Les contrats actifs et leur historique restent inchangés.'}
 }catch(e){if(status.isConnected){status.className='status err';status.textContent=e.message||'Enregistrement impossible'}}
 finally{if(button.isConnected)button.disabled=false}
};

function lookup(data,keys){for(const k of keys){const v=data?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v)}return ''}

function tenantName(t){return lookup(t.data,['Locataire','Nom locataire','Nom du locataire','Locataire actuel','Nom','Nom et prénom','Prénom Nom','Corps locataire'])||'Locataire ligne '+t.row_number}
function dwellingName(t){return (db.properties||[]).find(p=>p.id===t.property_id)?.name||lookup(t.data,['Nom du logement','Logement','Studio','Bien','Adresse','Adresse du logement'])||'Non renseigné'}
function filtered(items,fn){return !searchQuery?items:items.filter(x=>fn(x).toLocaleLowerCase('fr').includes(searchQuery))}
function section(title,description,tools=''){return '<div class="section-head"><div><h2>'+esc(title)+'</h2><p class="muted">'+esc(description)+'</p></div><div class="section-tools">'+tools+'</div></div>'}

function dataTable(headings,rows){if(!rows.length)return '<div class="card empty-state">Aucun élément à afficher.</div>';return '<div class="table-wrap"><table class="data-table"><thead><tr>'+headings.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function csvExport(filename,headings,rows){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const content='\uFEFF'+[headings,...rows].map(row=>row.map(quote).join(';')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvSnapshot(type){const tenants=db.tenants||[],props=(db.properties||[]).filter(p=>!p.is_example);if(type==='tenants'){const h=db.tenant_headers;csvExport('marne-invest-locataires.csv',h,tenants.map(t=>h.map(k=>t.data?.[k]??'')));return}if(type==='properties'){const keys=[...new Set(props.flatMap(p=>Object.keys(p.data||{})))];csvExport('marne-invest-biens.csv',keys,props.map(p=>keys.map(k=>p.data?.[k]??'')));return}if(type==='payments'){csvExport('marne-invest-paiements.csv',['Locataire','Bien','Paiement dû','Paiement reçu','Solde','Retard'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Paiement dû']),lookup(t.data,['Paiement reçu']),lookup(t.data,['Solde']),lookup(t.data,['Retard'])]));return}if(type==='contracts'){csvExport('marne-invest-contrats.csv',['Locataire','Bien','Début bail','Fin bail','Loyer de base','Charges'],tenants.map(t=>[tenantName(t),dwellingName(t),lookup(t.data,['Date entrée locataire']),lookup(t.data,['Date fin de bail']),lookup(t.data,['Loyer de base']),lookup(t.data,['Charge'])]));return}if(type==='reports'){csvExport('marne-invest-rapport.csv',['Indicateur','Valeur'],[['Biens réels',props.length],['Lignes locataires',tenants.length],['Paiements dus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement dû'])||0),0)],['Paiements reçus',tenants.reduce((s,t)=>s+(valueOf(t.data,['Paiement reçu'])||0),0)],['Lignes en retard',tenants.filter(t=>t.data?.['Retard']==='OUI').length]]);return}}

}

let bankCsvPreview=null;
function bankNormalizeHeader(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function bankCsvRows(csv){
 const clean=String(csv||'').replace(/^\uFEFF/,'');
 const first=clean.split(/\r?\n/,1)[0];
 const score=sep=>first.split(sep).length-1;
 const sep=[';','\t',','].sort((a,b)=>score(b)-score(a))[0];
 if(!score(sep))throw Error('Séparateur CSV non reconnu (; , ou tabulation).');
 let rows=[],row=[],field='',quoted=false,closedQuote=false;
 for(let i=0;i<clean.length;i++){
  const c=clean[i];
  if(c==='"'){
   if(quoted&&clean[i+1]==='"'){field+='"';i++}
   else if(!quoted&&(closedQuote||field.trim()!==''))throw Error('Guillemet CSV mal placé.');
   else{quoted=!quoted;if(!quoted)closedQuote=true}
  }else if(c===sep&&!quoted){row.push(field.trim());field='';closedQuote=false}
  else if((c==='\r'||c==='\n')&&!quoted){
   if(c==='\r'&&clean[i+1]==='\n')i++;
   row.push(field.trim());
   if(row.some(v=>v!==''))rows.push(row);
   row=[];field='';closedQuote=false;
   if(rows.length>202)throw Error('Un relevé doit contenir au maximum 200 mouvements.');
  }else{if(closedQuote&&!quoted&&!/[ \t]/.test(c))throw Error('Caractère inattendu après un champ CSV entre guillemets.');field+=c}
 }
 if(quoted)throw Error('Fichier CSV : guillemets non fermés.');
 row.push(field.trim());if(row.some(v=>v!==''))rows.push(row);
 if(rows.length<2)throw Error('Le CSV doit contenir une ligne d’en-tête et au moins un mouvement.');
 if(rows.length>201)throw Error('Maximum 200 mouvements par relevé.');
 const headers=rows.shift().map(bankNormalizeHeader);
 if(new Set(headers.filter(Boolean)).size!==headers.filter(Boolean).length)throw Error('Colonnes CSV en doublon : vérifiez les en-têtes.');
 const index=aliases=>{for(const name of aliases){const found=headers.indexOf(name);if(found>=0)return found}return -1};
 const dateIdx=index(['bookingdate','datecomptable','datecomptabilisation','datedecriture','dateoperation','datedoperation','datedeoperation','date','datevaleur']);
 const labelIdx=index(['libelle','libelleoperation','libelledeloperation','description','details','operation','intitule','motif','objet']);
 const amountIdx=index(['montant','montanteur','montantoperation','amount']);
 const creditIdx=index(['credit','crediteur','crediteneuros','montantcredit','recette','entree','versement']);
 const debitIdx=index(['debit','debiteur','debiteneuros','montantdebit','depense','sortie','retrait']);
 const refIdx=index(['reference','ref','referenceoperation','idoperation','identifiant','transactionid']);
 if(dateIdx<0||labelIdx<0||(amountIdx<0&&(creditIdx<0||debitIdx<0)))
  throw Error('Colonnes obligatoires : Date, Libellé et Montant, ou Date, Libellé, Débit et Crédit.');
 function parseDate(v){
  const raw=String(v||'').trim();
  let y,m,d,match;
  if(match=raw.match(/^(20\d{2})-(\d{2})-(\d{2})$/)){y=+match[1];m=+match[2];d=+match[3]}
  else if(match=raw.match(/^(\d{2})[\/-](\d{2})[\/-](20\d{2})$/)){d=+match[1];m=+match[2];y=+match[3]}
  else throw Error('Date non reconnue : '+raw+'. Utilisez JJ/MM/AAAA ou AAAA-MM-JJ.');
  const date=new Date(Date.UTC(y,m-1,d));
  if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)
   throw Error('Date bancaire inexistante : '+raw);
  return [y,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
 }
 function parseMoney(v){
  let raw=String(v??'').trim();
  if(!raw)return null;
  let negative=false;
  const parentheses=/^\(.*\)$/.test(raw);
  if(parentheses){negative=true;raw=raw.slice(1,-1).trim()}
  raw=raw.replace(/^€\s*|\s*€$/g,'').trim();
  if(parentheses&&/^[+-]/.test(raw))throw Error('Montant ambigu : signe et parenthèses combinés.');
  if(raw.startsWith('-')){negative=true;raw=raw.slice(1)}
  else if(raw.startsWith('+'))raw=raw.slice(1);
  if(/[ \u00a0\u202f]/.test(raw)){
   if(!/^\d{1,3}(?:[ \u00a0\u202f]\d{3})+(?:[.,]\d{1,2})?$/.test(raw))throw Error('Montant ambigu : groupement des milliers incorrect.');
   raw=raw.replace(/[ \u00a0\u202f]/g,'');
  }
  if(raw.includes(',')&&raw.includes('.')){
   if(/^\d{1,3}(?:\.\d{3})+,\d{1,2}$/.test(raw))raw=raw.replace(/\./g,'').replace(',','.');
   else if(/^\d{1,3}(?:,\d{3})+\.\d{1,2}$/.test(raw))raw=raw.replace(/,/g,'');
   else throw Error('Montant ambigu : groupement des milliers incorrect.');
  }else if(raw.includes(','))raw=raw.replace(',','.');
  if(!/^\d{1,9}(\.\d{1,2})?$/.test(raw))throw Error('Montant ambigu : '+String(v)+'. Vérifiez le format décimal.');
  const amount=Number(raw)*(negative?-1:1);
  if(!Number.isFinite(amount))throw Error('Montant invalide.');
  return amount;
 }
 return rows.map((cells,i)=>{
  if(cells.length!==headers.length)throw Error('Ligne '+(i+2)+' : nombre de colonnes différent des en-têtes. Placez les montants avec virgule entre guillemets dans un CSV séparé par des virgules.');
  const get=n=>n>=0?String(cells[n]??'').trim():'';
  const booking_date=parseDate(get(dateIdx));
  const description=get(labelIdx).replace(/\s+/g,' ').trim();
  const reference=get(refIdx);
  const credit=parseMoney(get(creditIdx)),debit=parseMoney(get(debitIdx));
  if(credit!==null&&credit<0)throw Error('Ligne '+(i+2)+' : crédit négatif, vérifiez le sens du mouvement.');
  if((credit!==null&&credit!==0)&&(debit!==null&&debit!==0))
   throw Error('Ligne '+(i+2)+' : débit et crédit présents simultanément.');
  const splitAmount=credit!==null&&credit!==0?credit:debit!==null?-Math.abs(debit):null;
  const amount=amountIdx>=0&&get(amountIdx)!==''?parseMoney(get(amountIdx)):splitAmount;
  if(amountIdx>=0&&get(amountIdx)!==''&&splitAmount!==null&&splitAmount!==0&&Math.abs(amount-splitAmount)>0.005)
   throw Error('Ligne '+(i+2)+' : montant et colonnes débit/crédit contradictoires.');
  if(amount===null||amount===0||description.length<2||description.length>500||reference.length>120)
   throw Error('Ligne '+(i+2)+' : montant, libellé ou référence invalide.');
  return {booking_date,amount:amount.toFixed(2),description,reference};
 });
}
function bankImportLabel(id){return (db.bank_imports||[]).find(x=>x.id===id)?.account_label||'Compte non identifié'}
function bankOverlappingLines(line){
 const account=bankImportLabel(line.import_id).toLowerCase().trim();
 return (db.bank_lines||[]).filter(other=>other.id!==line.id
  &&bankImportLabel(other.import_id).toLowerCase().trim()===account
  &&other.booking_date===line.booking_date
  &&Math.abs(Number(other.amount)-Number(line.amount))<0.005
  &&String(other.description||'').trim().toLowerCase()===String(line.description||'').trim().toLowerCase());
}
function bankUniqueSuggestion(line){
 const leases=(db.leases||[]).filter(l=>l.status==='active'&&l.verified_at);
 const normalized=String(line.description||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const candidates=leases.filter(l=>{
  const name=String(l.tenant_name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const rent=Number(l.monthly_rent||0)+Number(l.charges_amount||0);
  return name.length>=5&&normalized.includes(name)&&Math.abs(rent-Number(line.amount))<0.005;
 });
 return candidates.length===1?candidates[0]:null;
}

 try{
  const rows=bankCsvRows(await file.text());

  if(bankCsvPreview.account.length<2||bankCsvPreview.account.length>80)throw Error('Nommez le compte bancaire (2 à 80 caractères).');

window.updateAllocationAmount=()=>{

window.uploadRentalDocument=async()=>{

function isEmailAddress(value){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value||''))}
function reminderDayDiff(due,today){return Math.floor((Date.parse(today+'T00:00:00Z')-Date.parse(due+'T00:00:00Z'))/86400000)}
function reminderPlan(i,ledger,today){
 const l=(db.leases||[]).find(x=>x.id===i.lease_id);
 const t=(db.tenants||[]).find(x=>x.id===l?.tenant_row_id),p=(db.properties||[]).find(x=>x.id===i.property_id);
 const outstanding=Math.max(0,Number(i.total_due)-(ledger.byInstallment.get(i.id)||0));
 const pending=[...ledger.valid.values()].filter(x=>x.lease_id===i.lease_id).reduce((sum,x)=>sum+Math.max(0,Number(x.amount)-(ledger.byPayment.get(x.id)||0)),0);
 const days=reminderDayDiff(i.due_on,today);
 const drafts=(db.reminder_drafts||[]).filter(x=>x.installment_id===i.id);
 const first=drafts.find(x=>x.stage===7),second=drafts.find(x=>x.stage===14);
 const stale=r=>r&&(Math.abs(Number(r.due_at_preparation)-outstanding)>=0.005||String(r.recipient_email||'').trim().toLowerCase()!==String(t?.data?.['Mail locataire']||'').trim().toLowerCase());
 const canAdvance=first?.status==='declared_sent'&&first.declared_sent_at&&reminderDayDiff(new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(first.declared_sent_at)),today)>=7;
 let stage=0,reason='';
 if(!l||!l.verified_at)reason='Bail non vérifié';
 else if(l.status!=='active')reason=l.status==='closed'?'Bail clôturé · suivi manuel du solde':'Bail non actif';
 else if(outstanding<=0.005)reason='Échéance soldée';
 else if(pending>0.005)reason='Règlement à rapprocher';
 else if(days<7)reason='Délai J+7 non atteint';
 else if(!isEmailAddress(t?.data?.['Mail locataire']))reason='E-mail manquant';
 else if(!first||first.status==='cancelled'&&!first.declared_sent_at){stage=7;reason=first?'Rappel J+7 à repréparer':'Rappel J+7 prêt à préparer'}
 else if(first.status==='prepared'&&stale(first)){stage=7;reason='Solde ou destinataire modifié · rappel J+7 à repréparer'}
 else if(first.status==='prepared')reason='Brouillon J+7 préparé';
 else if(first.status==='declared_sent'&&days>=14&&canAdvance&&(!second||second.status==='cancelled'&&!second.declared_sent_at||second.status==='prepared'&&stale(second))){stage=14;reason=second?'Rappel J+14 à repréparer':'Rappel J+14 prêt à préparer'}
 else if(second?.status==='prepared')reason='Brouillon J+14 préparé';
 else if(second?.status==='declared_sent')reason='Rappel J+14 déclaré envoyé';
 else if(first.status==='declared_sent'&&!canAdvance)reason='Attente de 7 jours après le premier rappel';
 else reason='Premier rappel déclaré envoyé';
 return {i,l,t,p,outstanding,pending,days,stage,reason,drafts};
}

 '</td></tr>'))+
 '<div class="section-head" style="margin-top:22px"><div><h2>Brouillons et relances déclarées</h2><p class="muted">Les confirmations manuelles ne constituent pas une preuve technique de distribution.</p></div></div>'+
 dataTable(['Bien','Niveau','Destinataire','Préparé le','Statut','Action'],drafts.map(r=>{
  const l=(db.leases||[]).find(x=>x.id===r.lease_id);

  const plan=plans.find(x=>x.i.id===r.installment_id);
  const safe=plan&&plan.l?.status==='active'&&plan.l.verified_at&&plan.outstanding>0.005&&plan.pending<=0.005&&Math.abs(Number(r.due_at_preparation)-plan.outstanding)<0.005&&String(r.recipient_email||'').trim().toLowerCase()===String(plan.t?.data?.['Mail locataire']||'').trim().toLowerCase();
  return '<tr><td>'+esc(p?.name||'—')+'</td><td>J+'+esc(r.stage)+'</td><td>'+esc(r.recipient_email||'—')+'</td><td>'+esc(r.prepared_at?.slice(0,10)||'—')+'</td><td><span class="mini-tag '+(r.status==='declared_sent'?'':'warn')+'">'+esc(r.status==='prepared'?(safe?'À envoyer manuellement':'À revérifier'):r.status==='declared_sent'?'Déclaré envoyé':'Annulé')+'</span></td><td><div class="item-actions">'+
 (r.status==='prepared'&&safe&&!db.current_user?.read_only?'<button class="btn secondary" data-id="'+esc(r.id)+'" onclick="composeRentalReminder(this.dataset.id)">Ouvrir le brouillon</button><button class="btn secondary" data-id="'+esc(r.id)+'" onclick="confirmRentalReminderSent(this.dataset.id)">Déclarer envoyé</button>':'—')+
 '</div></td></tr>';
 }))+
 '<div class="section-head" style="margin-top:22px"><div><h2>Courriels ponctuels</h2><p class="muted">Ouvrir une rédaction manuelle, sans envoi automatique.</p></div></div>'+
 dataTable(['Locataire','Logement','Adresse e-mail','Action'],filtered(db.tenants||[],t=>[tenantName(t),dwellingName(t),t.data?.['Mail locataire']].join(' ')).map(t=>
 '<tr><td>'+esc(tenantName(t))+'</td><td>'+esc(dwellingName(t))+'</td><td>'+esc(t.data?.['Mail locataire']||'À renseigner')+'</td><td><button class="btn secondary" onclick="openTenantEmail('+t.row_number+')" '+(isEmailAddress(t.data?.['Mail locataire'])?'':'disabled')+'>Rédiger</button></td></tr>'));
 $('content').innerHTML=output;
}
window.prepareRentalReminder=async(id,stage)=>{
 try{
  const reply=await api('prepare-reminder','POST',{installment_id:id,stage});
  await refresh();
  alert(reply.already_exists?'Ce rappel existe déjà, aucun doublon créé.':reply.reprepared?'Brouillon J+'+stage+' repréparé avec le solde vérifié. Aucun e-mail n’a été envoyé.':'Brouillon J+'+stage+' préparé. Aucun e-mail n’a été envoyé.');
 }catch(e){alert(e.message||'Relance indisponible');await refresh()}
};
window.composeRentalReminder=async(id)=>{
 const draft=(db.reminder_drafts||[]).find(r=>r.id===id);if(!draft||draft.status!=='prepared')return;
 try{
  await api('prepare-reminder','POST',{installment_id:draft.installment_id,stage:draft.stage});
  if(!await refresh())return;
  const current=(db.reminder_drafts||[]).find(r=>r.id===id);if(!current||current.status!=='prepared')return;
  const to=current.recipient_email;
  if(!isEmailAddress(to)){alert('Adresse e-mail invalide.');return;}
  if(db.current_user?.mail_access){showPage('mail');composeMail(to,current.subject,current.body)}
  else location.href=mailUrl(to,current.subject,current.body);
 }catch(e){alert('Brouillon non utilisable : '+(e.message||'situation à vérifier'));await refresh()}
};
window.confirmRentalReminderSent=async id=>{
 const draft=(db.reminder_drafts||[]).find(r=>r.id===id);if(!draft||draft.status!=='prepared')return;
 if(!confirm('Avez-vous réellement envoyé ce courriel depuis votre messagerie ? Le logiciel ne peut pas vérifier sa distribution.'))return;
 try{
  await api('declare-reminder-sent','POST',{id,prepared_at:draft.prepared_at,confirmed:true});
  await refresh();
 }catch(e){alert(e.message||'Confirmation impossible');await refresh()}
};

function renderMail(){
 if(!db.current_user?.mail_access){$('content').innerHTML=section('Messagerie Free','Accès restreint')+'<div class="card empty-state">Compte non autorisé à consulter cette boîte.</div>';return}
 const inbox=filtered(db.mail_inbox||[],m=>m.subject+' '+m.sender_email),outbox=filtered(db.mail_outbox||[],m=>m.subject+' '+m.recipient_email);
 const connected=!!db.current_user.mail_configured;
 const sync=db.mail_sync_state||null;
 const imapVerified=!!sync?.imap_verified_at&&connected;
 const smtpVerified=!!sync?.smtp_verified_at&&connected;
 const recentSync=sync?.last_sync_at?new Date(sync.last_sync_at).toLocaleString('fr-FR'):'Aucune synchronisation vérifiée';
 const catchup=sync?.catchup_pending===true?'<p class="note">Rattrapage en cours : d’autres messages restent à examiner. Les prochains passages reprendront au dernier message traité.</p>':sync?.catchup_pending===false?'<p class="muted">Rattrapage terminé pour les messages disponibles au début du dernier passage.</p>':'';
 const tools=db.current_user?.read_only?'<span class="mini-tag">Lecture seule</span>':'<button class="btn secondary" onclick="testMailConnection()">Tester IMAP / SMTP</button><button class="btn secondary" onclick="syncFreeMail()">Synchroniser</button><button class="btn primary" onclick="composeMail()">+ Rédiger</button>';
 const setup=connected?'<div class="note mail-banner">Identifiants enregistrés côté serveur. IMAP : <b>'+(imapVerified?'Vérifié':'À tester')+'</b> · SMTP : <b>'+(smtpVerified?'Vérifié':'À tester')+'</b>.<p class="muted">Réception automatique programmée de 06h à 21h UTC, une fois par heure, et déclenchée uniquement après vérification IMAP. Dernière réception réussie : '+esc(recentSync)+'. Aucun envoi automatique.</p></div>':
 '<div class="note mail-banner"><b>Connexion à effectuer :</b> ouvre <b>Paramètres</b>, saisis l’adresse du compte Free et son mot de passe, puis enregistre. Le mot de passe est chiffré dans Vault. <button class="btn primary" onclick="showPage(&quot;config&quot;)">Configurer la messagerie</button></div>';
 $('content').innerHTML=section('Messagerie Free',esc(db.current_user?.mail_account||setting('sender_email','')||'Adresse à renseigner')+' — réception IMAP 993 et envoi SMTP 465.',tools)+
 stats([['Reçus affichés',(db.mail_inbox||[]).length],['Non lus affichés',(db.mail_inbox||[]).filter(m=>!m.is_seen).length],['Brouillons affichés',(db.mail_outbox||[]).filter(m=>m.status==='draft').length],['Connexion',imapVerified?'IMAP vérifié':connected?'Test requis':'À configurer']])+setup+catchup+
 '<div class="section-head"><div><h2>Boîte de réception</h2><p class="muted">Lecture en texte seul ; les pièces jointes ne sont pas encore téléchargeables.</p></div></div>'+
 '<div class="mail-split"><div class="mail-list">'+(inbox.length?inbox.map(m=>
 '<button class="mail-item '+(m.is_seen?'':'unread')+'" data-id="'+esc(m.id)+'" onclick="openFreeInboxMail(this.dataset.id)"><b>'+esc(m.sender_email||'Expéditeur inconnu')+'</b><b>'+esc(m.subject||'(Sans objet)')+'</b><small>'+esc(m.received_at?new Date(m.received_at).toLocaleString('fr-FR'):'Date inconnue')+(m.body_status==='metadata_only'?' · En-têtes seuls':m.body_status==='truncated'?' · Texte tronqué':'')+(m.has_attachments?' · Pièces jointes':'')+'</small></button>').join(''):'<div class="empty-state">Aucun courriel synchronisé.</div>')+
 '</div><div class="mail-reader" id="mailReader"><p class="muted">Sélectionnez un message pour le lire. Aucun contenu reçu ne déclenche d’action automatiquement.</p></div></div>'+
 '<div class="section-head" style="margin-top:20px"><div><h2>Brouillons et messages envoyés</h2><p class="muted">Envoi manuel explicite ; aucun renvoi automatique des messages incertains.</p></div></div>'+
 dataTable(['Date','Destinataire','Objet','Statut','Actions'],outbox.map(m=>{
 const labels={draft:'Brouillon',sending:'En cours',sent:'Envoyé',uncertain:'À vérifier',cancelled:'Annulé'};
 return '<tr><td>'+esc(m.created_at?.slice(0,10)||'—')+'</td><td>'+esc(m.recipient_email)+'</td><td>'+esc(m.subject)+'</td><td><span class="mini-tag '+(m.status==='uncertain'?'warn':'')+'">'+esc(labels[m.status]||m.status)+'</span></td>'+
 '<td class="item-actions"><button class="btn secondary" data-id="'+esc(m.id)+'" onclick="viewMailDraft(this.dataset.id)">Lire</button>'+
 (m.status==='draft'&&!db.current_user?.read_only?'<button class="btn primary" data-id="'+esc(m.id)+'" onclick="sendFreeMail(this.dataset.id)" '+(connected?'':'disabled')+'>Envoyer</button><button class="btn secondary" data-id="'+esc(m.id)+'" onclick="cancelFreeMailDraft(this.dataset.id)">Annuler</button>':'')+'</td></tr>';
 }))+
 '<p class="module-note">Les 150 derniers courriels importés sont affichés. Le rattrapage progresse par lots de 30 messages au maximum et reprend au dernier message traité. Au-delà de 700 Ko, ou si leur texte est indisponible, seuls les en-têtes sont importés. Un texte dépassant 30 000 caractères est signalé comme tronqué. Consultez Free pour le contenu complet et les pièces jointes. Après authentification IMAP réussie, la boîte est consultée chaque heure entre 06h et 21h UTC. Les messages restent conservés sur Free ; aucun message reçu ne déclenche une opération comptable ou un envoi automatique.</p>';
}
window.testMailConnection=async()=>{
 if(!db?.current_user?.mail_access||db.current_user?.read_only)return;
 try{const x=await api('mail-test','POST',{});await refresh();alert('Réception IMAP : '+(x.imap_authenticated?'OK':'Non vérifiée')+'\nEnvoi SMTP : '+(x.smtp_authenticated?'OK':'Non vérifié')+'\nMessages sur Free : '+(x.mailbox_total??'—'))}
 catch(e){alert('Test non abouti : '+e.message)}
};
window.syncFreeMail=async()=>{
 if(!db?.current_user?.mail_access||db.current_user?.read_only)return;
 if(!db.current_user?.mail_configured){alert('Renseignez le compte Free et son mot de passe dans Paramètres, puis testez IMAP / SMTP.');showPage('config');return}
 if(!confirm('Importer le prochain lot de courriels depuis Free, en lecture seule ?'))return;
 try{const x=await api('mail-sync','POST',{});if(!await refresh())return;if(x.busy){alert('Une synchronisation est déjà en cours. Réessayez une fois terminée.');return}alert('Messages ajoutés : '+(x.imported||0)+'. Contenus limités à leurs en-têtes dans ce lot : '+(x.metadata_only||0)+'.'+(x.has_more===true?' Rattrapage en cours ; le prochain passage reprendra la suite.':x.has_more===false?' Tous les messages disponibles au début de ce passage ont été examinés.':''))}
 catch(e){alert('Synchronisation indisponible : '+e.message)}
};
function mailContentNote(m){
 const notes={size_limit:'Message trop volumineux : seuls les en-têtes ont été importés. Consultez le contenu dans Free.',invalid_size:'La taille du message est inconnue : seuls les en-têtes ont été importés. Consultez le contenu dans Free.',parse_failed:'Le contenu du message n’a pas pu être lu. Seuls les en-têtes ont été importés ; consultez le message dans Free.',no_text_part:'Ce message ne contient pas de version texte. Seuls les en-têtes sont affichés ; consultez sa version HTML dans Free.',text_limit:'Texte tronqué après 30 000 caractères. Consultez le message complet dans Free.'};
 const message=notes[m.body_note]||(m.body_status==='metadata_only'?'Seuls les en-têtes ont été importés. Consultez le message complet dans Free.':m.body_status==='truncated'?'Texte tronqué. Consultez le message complet dans Free.':'');
 return message?'<p class="note">'+esc(message)+'</p>':'';
}
window.openFreeInboxMail=async id=>{
 const pane=$('mailReader'),generation=++mailReaderGeneration,session=sessionGeneration;if(!pane)return;pane.textContent='Chargement…';
 const current=()=>generation===mailReaderGeneration&&session===sessionGeneration&&pane.isConnected;
 try{
  const j=await api('mail-message','GET',undefined,{id});if(!current())return;const m=j.item;
  pane.innerHTML='<h3>'+esc(m.subject||'(Sans objet)')+'</h3><p class="muted">De : '+esc(m.sender_email||'')+'</p>'+
  mailContentNote(m)+(m.body_status==='metadata_only'?'':'<pre class="mail-text">'+esc(m.plain_body||'Corps texte non disponible')+'</pre>')+
  (m.has_attachments?'<p class="note">'+Number(m.attachment_count||0)+' pièce(s) jointe(s) détectée(s), téléchargement non activé.</p>':'')+
  '<button class="btn primary" id="reply-free-mail">Répondre</button>';
  $('reply-free-mail').onclick=()=>composeMail(m.sender_email,'Re: '+m.subject,'',m.id);
  if(!m.is_seen){await api('mail-mark-read','POST',{id});if(!current())return;const local=(db.mail_inbox||[]).find(x=>x.id===id);if(local)local.is_seen=true;}
 }catch(e){if(current())pane.innerHTML='<p class="muted">'+esc(e.message||'Erreur')+'</p>'}
};
window.composeMail=(to='',subject='',body='',replyId='')=>{
 const key=crypto.randomUUID();
 $('modal').innerHTML='<div class="modal"><div class="box" style="max-width:740px"><div class="top"><h2>Rédiger un courriel</h2><button class="btn secondary" onclick="closeModal()">Fermer</button></div>'+
 '<p class="muted">De : '+esc(db.current_user?.mail_account||setting('sender_email','')||'Adresse à renseigner')+' — Enregistrement en brouillon, sans envoi.</p>'+
 '<label>À</label><input id="mailTo" type="email" value="'+esc(to)+'" maxlength="254">'+
 '<label style="margin-top:12px">Objet</label><input id="mailSubject" value="'+esc(subject)+'" maxlength="250">'+
 '<label style="margin-top:12px">Message</label><textarea id="mailBody" maxlength="20000" rows="12">'+esc(body)+'</textarea>'+
 '<input type="hidden" id="mailKey" value="'+key+'"><input type="hidden" id="mailReplyId" value="'+esc(replyId)+'">'+
 '<div class="actions"><button class="btn primary" id="mailSave" onclick="saveFreeMailDraft()">Enregistrer brouillon</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div>'+
 '<p id="modalStatus" class="status"></p></div></div>';
};
window.saveFreeMailDraft=async()=>{
 const b=$('mailSave'),status=$('modalStatus');b.disabled=true;status.textContent='Enregistrement…';
 try{
  await api('mail-create-draft','POST',{client_key:$('mailKey').value,recipient_email:$('mailTo').value,subject:$('mailSubject').value,plain_body:$('mailBody').value,in_reply_to_message_id:$('mailReplyId').value||null});
  closeModal();await refresh();alert('Brouillon créé. Aucun courriel envoyé.');
 }catch(e){b.disabled=false;status.className='status err';status.textContent=e.message||'Erreur'}
};
window.viewMailDraft=id=>{
 const m=(db.mail_outbox||[]).find(x=>x.id===id);if(!m)return;
 $('modal').innerHTML='<div class="modal"><div class="box"><div class="top"><h2>'+esc(m.subject)+'</h2><button class="btn secondary" onclick="closeModal()">Fermer</button></div><p class="muted">À : '+esc(m.recipient_email)+' · '+esc(m.status)+'</p><pre class="mail-text">'+esc(m.plain_body)+'</pre></div></div>';
};
window.sendFreeMail=async id=>{
 const m=(db.mail_outbox||[]).find(x=>x.id===id);
 if(!m||m.status!=='draft')return;
 if(!confirm('Envoyer maintenant « '+m.subject+' » à '+m.recipient_email+' depuis '+(db.current_user?.mail_account||setting('sender_email','')||'Adresse à renseigner')+' ?'))return;
 try{await api('mail-send','POST',{id,confirmed:true});await refresh();alert('Envoi accepté par le serveur SMTP.');}
 catch(e){await refresh();alert('Envoi non confirmé : '+e.message)}
};
window.cancelFreeMailDraft=async id=>{
 if(!confirm('Annuler ce brouillon sans l’envoyer ?'))return;
 try{await api('mail-cancel-draft','POST',{id});await refresh()}catch(e){alert(e.message||'Erreur')}
};

function renderGuide(){$('content').innerHTML=`<div class="card"><h3>Commandes reproduites</h3>${db.commands.map(c=>`<div class="kv"><b>${esc(c.label)}</b><div><code>${esc(c.function)}</code><div class="muted">${esc(c.description)}</div></div></div>`).join('')}</div><br><div class="card"><h3>Organisation du classeur reproduite</h3><p>Suivi_Locataires : ${db.tenant_headers.length} colonnes, avec les listes OUI/NON et les états d’alerte conservés dans les données.</p><p>Config : paramètres IRL, seuil de révision, délais de relance, liens INSEE et préfixe des dossiers.</p><p>Modele_Dossier_Logement : informations logement, locataire actuel, historique, échéancier et synthèse.</p><p>Dossier_Exemple : les valeurs du classeur sont présentes dans l’onglet « Dossiers logement ».</p></div>`}
window.closeModal=()=>{$('modal').innerHTML=''};
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');initNav();refresh()}else $('login').classList.remove('hide');
})();
</script>
