<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#334155"><title>Marne Invest - Gestion locative</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f6f8;--p:#334155;--ok:#176b3a;--bad:#a32929;--warn:#9a6700}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#fff;border:1px solid #dce2e7;border-radius:16px;padding:24px;box-shadow:0 12px 34px #00000012}h1,h2,h3{margin:0 0 12px}label{display:block;font-size:12px;color:#64707c;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;background:#fff}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1;color:#17202a}.danger{background:#fdeaea;color:var(--bad)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:#24303d;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800}.brand-sub{font-size:12px;color:#b7c3ce;margin:2px 0 18px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#dbe3ea;padding:10px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#3b4b5c;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dce2e7;border-radius:12px;padding:14px}.kpi{font-size:27px;font-weight:800}.muted{font-size:13px;color:#6a7580}.status{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce2e7;border-radius:12px;max-height:68vh}table{border-collapse:collapse;width:max-content;min-width:100%}th,td{padding:8px 9px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px;vertical-align:top;max-width:280px;white-space:nowrap}th{background:#f7f9fa;position:sticky;top:0;z-index:2}.tenant-row{cursor:pointer}.tenant-row.selected{outline:2px solid #64748b;outline-offset:-2px;background:#f1f5f9}.clip{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2f5;font-size:12px}.pill.bad{background:#fdeaea;color:#8a2525}.pill.ok{background:#e8f5ed;color:#176b3a}.command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.command{border:1px solid #dce2e7;border-radius:10px;padding:12px;background:#fff}.command b{display:block;margin-bottom:5px}.property-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.property-card{cursor:pointer}.property-card:hover{border-color:#9aa8b5}.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 12px;padding:6px 0;border-bottom:1px solid #edf0f2}.kv:last-child{border:0}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields .full{grid-column:1/-1}.editor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.section-title{font-weight:800;margin:16px 0 8px}.sticky-left{position:sticky;left:0;background:inherit;z-index:1}.note{padding:10px;border-radius:9px;background:#fff8e1;border:1px solid #f2df9d;font-size:13px}.login input{margin-bottom:12px}@media(max-width:1000px){.grid,.command-grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.property-grid{grid-template-columns:1fr}}@media(max-width:620px){.main{padding:12px}.top{flex-direction:column}.grid,.command-grid,.fields,.editor-grid{grid-template-columns:1fr}.fields .full{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login"><div class="box"><h1>Marne Invest</h1><p class="muted">Administration — gestion locative IRL</p><label>Utilisateur</label><input id="user" value="marne-invest" autocomplete="username"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section>
<section id="app" class="shell hide"><aside class="side"><div class="brand">Marne Invest</div><div class="brand-sub">Gestion locative</div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><div id="serverTime" class="muted"></div></div><div class="actions"><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main></section><div id="modal"></div>
<script>
(()=>{'use strict';
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/rental-admin-api';
let token=localStorage.getItem('marne_invest_admin_token')||'',db=null,page='dashboard',selectedRow=null;
const pages=[['dashboard','Tableau de bord'],['tenants','Suivi locataires'],['properties','Dossiers logement'],['config','Configuration'],['guide','Guide / commandes']];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0),fmt=v=>Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),short=v=>{const s=String(v??'');return s.length>80?s.slice(0,77)+'…':s};
async function api(action,method='GET',body){const r=await fetch(API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
window.login=async()=>{try{$('loginStatus').className='status';$('loginStatus').textContent='Connexion…';const j=await api('login','POST',{username:$('user').value,password:$('pass').value});token=j.token;localStorage.setItem('marne_invest_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');initNav();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message||'Erreur'}};
window.logout=()=>{token='';db=null;selectedRow=null;localStorage.removeItem('marne_invest_admin_token');$('app').classList.add('hide');$('login').classList.remove('hide')};
function initNav(){$('nav').innerHTML=pages.map(([k,l])=>`<button data-p="${k}" onclick="showPage('${k}')">${l}</button>`).join('')}
window.showPage=p=>{page=p;render()};
window.refresh=async()=>{try{db=await api('data');$('serverTime').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}catch(e){alert(e.message)}};
function render(){if(!db)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('pageTitle').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard:renderDashboard,tenants:renderTenants,properties:renderProperties,config:renderConfig,guide:renderGuide}[page]||renderDashboard)()}
function setting(key,fallback){return db.settings.find(x=>x.setting_key===key)?.value??fallback}
function renderDashboard(){const rows=db.tenants,late=rows.filter(x=>x.data?.['Retard']==='OUI').length,due=rows.reduce((s,x)=>s+n(x.data?.['Paiement dû']),0),balance=rows.reduce((s,x)=>s+n(x.data?.['Solde']),0);$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Locataires / lignes</div><div class="kpi">${rows.length}</div></div><div class="card"><div class="muted">IRL courant</div><div class="kpi">${esc(setting('current_irl',145.78))}</div><div class="muted">${esc(setting('irl_label',''))}</div></div><div class="card"><div class="muted">Paiements dus</div><div class="kpi">${fmt(due)} €</div></div><div class="card"><div class="muted">Solde / impayés</div><div class="kpi">${fmt(balance)} €</div><div class="muted">${late} ligne(s) en retard</div></div></div><br><div class="card"><h3>Commandes du tableur</h3><div class="command-grid">${db.commands.map(c=>`<div class="command"><b>${esc(c.label)}</b><div class="muted">${esc(c.description)}</div></div>`).join('')}</div></div>`}
function cellHtml(h,v){if(v===undefined||v===null||v==='')return '<span class="muted">—</span>';if(h==='Retard'||h==='Révision détectée'||h==='Visal')return `<span class="pill ${v==='OUI'?'bad':'ok'}">${esc(v)}</span>`;return `<span class="clip" title="${esc(v)}">${esc(short(v))}</span>`}
function renderTenants(){const heads=db.tenant_headers;$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="runSystem()">Actualiser système</button><button class="btn secondary" onclick="editTenant()">Nouveau locataire</button><button class="btn secondary" onclick="newProperty()">Nouveau logement</button><button class="btn secondary" onclick="createPropertySheet()" ${selectedRow?'':'disabled'}>Créer fiche logement</button></div><div class="muted" style="margin-bottom:8px">Cliquez une ligne pour la sélectionner. Double-cliquez pour la modifier.</div><div class="table-wrap"><table><thead><tr><th class="sticky-left">Ligne</th>${heads.map(h=>`<th title="${esc(db.comments?.[h]||'')}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${db.tenants.map(r=>`<tr class="tenant-row ${selectedRow===r.row_number?'selected':''}" onclick="selectRow(${r.row_number})" ondblclick="editTenant(${r.row_number})"><td class="sticky-left">${r.row_number}</td>${heads.map(h=>`<td>${cellHtml(h,r.data?.[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
window.selectRow=r=>{selectedRow=r;renderTenants()};
function fieldType(h){if(['Loyer de base','Charge','IRL','Écart révision','Montant révisé','Loyer actualisé','Paiement dû','Paiement reçu','Solde précédent','Solde'].includes(h))return 'number';if(h.startsWith('Date ')||h==='Dernière nouvelle'||h==='Dernier run'||h==='Date entrée locataire'||h==='Date fin de bail')return 'text';return 'text'}
window.editTenant=rowNumber=>{const row=rowNumber?db.tenants.find(x=>x.row_number===rowNumber):null,data={...(row?.data||{})};$('modal').innerHTML=`<div class="modal"><div class="box"><div class="top"><div><h2>${row?'Modifier le locataire':'Nouveau locataire'}</h2><div class="muted">Colonnes identiques à Suivi_Locataires</div></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div><div class="editor-grid">${db.tenant_headers.map(h=>`<div class="${h==='Corps locataire'||h==='Notes'?'full':''}"><label>${esc(h)}</label>${h==='Corps locataire'||h==='Notes'?`<textarea data-field="${esc(h)}">${esc(data[h]??'')}</textarea>`:`<input data-field="${esc(h)}" type="${fieldType(h)}" step="any" value="${esc(data[h]??'')}">`}${db.comments?.[h]?`<div class="muted">${esc(db.comments[h])}</div>`:''}</div>`).join('')}</div><br><div class="actions"><button class="btn primary" onclick="saveTenant('${row?.id||''}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="modalStatus" class="status"></div></div></div>`};
window.saveTenant=async id=>{try{const data={};document.querySelectorAll('#modal [data-field]').forEach(el=>{let v=el.value;if(v==='')return;if(el.type==='number'){const x=Number(v);v=Number.isFinite(x)?x:v}data[el.dataset.field]=v});$('modalStatus').textContent='Enregistrement…';await api('save-tenant','POST',{id,data});closeModal();await refresh()}catch(e){$('modalStatus').className='status err';$('modalStatus').textContent=e.message}};
window.newProperty=()=>{$('modal').innerHTML=`<div class="modal"><div class="box" style="max-width:600px"><h2>Nouveau logement</h2><div class="fields"><div><label>Nom du logement</label><input id="npName"></div><div><label>Adresse</label><input id="npAddress"></div></div><br><div class="actions"><button class="btn primary" onclick="saveNewProperty()">Créer le logement et sa ligne</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="modalStatus" class="status"></div></div></div>`};
window.saveNewProperty=async()=>{try{$('modalStatus').textContent='Création…';const j=await api('new-property','POST',{name:$('npName').value,address:$('npAddress').value});selectedRow=j.row.row_number;closeModal();await refresh();page='properties';render()}catch(e){$('modalStatus').className='status err';$('modalStatus').textContent=e.message}};
window.createPropertySheet=async()=>{if(!selectedRow)return;try{await api('create-property-sheet','POST',{row_number:selectedRow});await refresh();page='properties';render()}catch(e){alert(e.message)}};
window.runSystem=async()=>{if(!confirm('Recalculer les lignes à partir de l’IRL et du seuil configurés ?'))return;try{const j=await api('update-system','POST',{});await refresh();alert(`${j.updated} ligne(s) recalculée(s) avec l’IRL ${j.irl}.`)}catch(e){alert(e.message)}};
function renderProperties(){$('content').innerHTML=`<div class="property-grid">${db.properties.map(p=>`<div class="card property-card" onclick="openProperty('${p.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(p.data?.['Nom du logement']||p.name)}</h3>${p.is_example?'<span class="pill">Exemple Excel</span>':''}</div><div class="muted">${esc(p.data?.['Adresse']||'Adresse non renseignée')}</div><br><div><b>${esc(p.current_tenant?.['Locataire actuel']||'Aucun locataire')}</b> · ${esc(p.data?.['Statut logement']||'')}</div><div class="muted">Loyer appliqué : ${p.data?.['Loyer appliqué']!=null?fmt(p.data['Loyer appliqué'])+' €':'—'} · Solde : ${fmt(p.data?.['Solde cumulé logement']||0)} €</div></div>`).join('')||'<div class="card">Aucun dossier logement.</div>'}</div>`}
function kv(obj){return Object.entries(obj||{}).map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><span>${esc(v??'')}</span></div>`).join('')}
window.openProperty=id=>{const p=db.properties.find(x=>x.id===id);if(!p)return;$('modal').innerHTML=`<div class="modal"><div class="box"><div class="top"><div><h2>${esc(p.data?.['Nom du logement']||p.name)}</h2><div class="muted">${esc(p.source_sheet||'')}</div></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div><div class="section-title">Informations logement</div><div class="card">${kv(p.data)}</div><div class="section-title">Locataire actuel</div><div class="card">${kv(p.current_tenant)}</div><div class="section-title">Historique anciens locataires</div>${renderObjectTable(p.tenant_history)}<div class="section-title">Échéancier des paiements du logement</div>${renderObjectTable(p.payment_schedule)}</div></div>`};
function renderObjectTable(rows){if(!rows?.length)return '<div class="card muted">Aucune ligne.</div>';const hs=[...new Set(rows.flatMap(Object.keys))];return `<div class="table-wrap" style="max-height:320px"><table><thead><tr>${hs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${hs.map(h=>`<td>${cellHtml(h,r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderConfig(){$('content').innerHTML=`<div class="card"><div class="note">Les valeurs ci-dessous proviennent directement de la feuille Config du classeur importé.</div><br>${db.settings.map(s=>`<div class="kv"><div><b>${esc(s.label)}</b><div class="muted">${esc(s.comment||'')}</div></div><div><input id="cfg-${esc(s.setting_key)}" value="${esc(s.value??'')}"><button class="btn secondary" style="margin-top:6px" onclick="saveSetting('${esc(s.setting_key)}')">Enregistrer</button></div></div>`).join('')}</div>`}
window.saveSetting=async key=>{try{const el=$('cfg-'+key),raw=el.value;let value=raw;if(['current_irl','revision_threshold','reminder_7_days','reminder_14_days'].includes(key)){const x=Number(raw);if(!Number.isFinite(x))throw new Error('Valeur numérique invalide');value=x}await api('save-setting','POST',{setting_key:key,value});await refresh()}catch(e){alert(e.message)}};
function renderGuide(){$('content').innerHTML=`<div class="card"><h3>Commandes reproduites</h3>${db.commands.map(c=>`<div class="kv"><b>${esc(c.label)}</b><div><code>${esc(c.function)}</code><div class="muted">${esc(c.description)}</div></div></div>`).join('')}</div><br><div class="card"><h3>Organisation du classeur reproduite</h3><p>Suivi_Locataires : ${db.tenant_headers.length} colonnes, avec les listes OUI/NON et les états d’alerte conservés dans les données.</p><p>Config : paramètres IRL, seuil de révision, délais de relance, liens INSEE et préfixe des dossiers.</p><p>Modele_Dossier_Logement : informations logement, locataire actuel, historique, échéancier et synthèse.</p><p>Dossier_Exemple : les valeurs du classeur sont présentes dans l’onglet « Dossiers logement ».</p></div>`}
window.closeModal=()=>{$('modal').innerHTML=''};
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');initNav();refresh()}else $('login').classList.remove('hide');
})();
</script>
</body></html>
