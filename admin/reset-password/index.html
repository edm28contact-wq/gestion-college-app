<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réinitialiser le mot de passe administrateur</title>
<style>
:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(460px,100%);background:#fff;border:1px solid #d7dee5;border-radius:14px;padding:20px}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;padding:11px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.btn{width:100%;margin-top:18px;border:0;border-radius:9px;padding:11px 14px;font-weight:700;background:#1f2b38;color:#fff;cursor:pointer}.muted{color:#6b7785;font-size:13px}.status{margin-top:14px;min-height:22px}.ok{color:#176b3a}.err{color:#a32929}.hide{display:none}</style>
</head>
<body>
<div class="box">
  <h1>Nouveau mot de passe admin</h1>
  <p class="muted">Choisissez un nouveau mot de passe d’au moins 14 caractères. Il ne sera pas enregistré dans GitHub.</p>
  <div id="form">
    <label for="p1">Nouveau mot de passe</label>
    <input id="p1" type="password" autocomplete="new-password">
    <label for="p2">Confirmer le mot de passe</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button class="btn" id="submit">Enregistrer le nouveau mot de passe</button>
  </div>
  <div id="status" class="status"></div>
</div>
<script>
const ENDPOINT='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/admin-password-reset';
const token=new URLSearchParams(location.search).get('token')||'';
const status=document.getElementById('status');
const form=document.getElementById('form');
if(!token){form.classList.add('hide');status.className='status err';status.textContent='Lien de réinitialisation invalide.'}
document.getElementById('submit').addEventListener('click',async()=>{
  const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1.length<14){status.className='status err';status.textContent='Le mot de passe doit contenir au moins 14 caractères.';return}
  if(p1!==p2){status.className='status err';status.textContent='Les deux mots de passe ne correspondent pas.';return}
  const button=document.getElementById('submit');button.disabled=true;status.className='status';status.textContent='Enregistrement…';
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:p1,password_confirmation:p2}),cache:'no-store'});
    const j=await r.json().catch(()=>({error:'Réponse du service invalide'}));
    if(!r.ok)throw new Error(j.error||'Erreur serveur');
    document.getElementById('p1').value='';document.getElementById('p2').value='';form.classList.add('hide');
    status.className='status ok';status.innerHTML='Mot de passe modifié. <a href="../holding/">Ouvrir Administration Holding</a>';
    history.replaceState({},'',location.pathname);
  }catch(e){button.disabled=false;status.className='status err';status.textContent=e.message}
});
</script>
</body>
</html>
