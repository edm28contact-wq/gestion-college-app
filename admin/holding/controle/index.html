<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centre de supervision</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#1f2b38;--ok:#176b3a;--bad:#a32929;--warn:#8a5a00;--muted:#6b7785}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1320px;margin:auto;padding:18px}.top,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:#8a2525}.success{background:#e8f5ed;color:#176b3a}.warnb{background:#fff4d6;color:#7a5600}.card{background:#fff;border:1px solid #d7dee5;border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:27px;font-weight:800}.muted{color:var(--muted);font-size:13px}.status{min-height:22px;margin:8px 0}.ok{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}.table{overflow:auto;background:#fff;border:1px solid #d7dee5;border-radius:12px}.table table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{background:#f7f9fa}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f5;font-size:12px;margin:2px}.crit{background:#fdeaea;color:#8a2525}.wa{background:#fff4d6;color:#7a5600}.go{background:#e8f5ed;color:#176b3a}.hide{display:none!important}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-all}.section-title{margin:0 0 10px}.tabs .btn.active{background:var(--p);color:#fff}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.wrap{padding:10px}.top{align-items:flex-start}}@media(max-width:560px){.grid{grid-template-columns:1fr}.btn{width:100%;text-align:center}}</style></head><body><main class="wrap"><div class="top"><div><h1>Centre de supervision Holding</h1><div class="muted">Supervision, alertes, journal, corbeille, sauvegarde et environnement de test.</div></div><div class="actions"><a class="btn secondary" href="../">Retour Holding</a><a class="btn secondary" href="../../../college/admin/">Administration Collège</a><button class="btn primary" onclick="refreshAll()">Actualiser</button></div></div><div id="status" class="status"></div><div class="tabs"><button id="tdash" class="btn active" onclick="show('dash')">Supervision</button><button id="talerts" class="btn secondary" onclick="show('alerts')">Alertes</button><button id="tactivity" class="btn secondary" onclick="show('activity')">Journal</button><button id="ttrash" class="btn secondary" onclick="show('trash')">Corbeille</button><button id="tbackup" class="btn secondary" onclick="show('backup')">Sauvegarde</button><button id="ttest" class="btn secondary" onclick="show('test')">Mode test</button></div><br><div id="content"></div></main><script>
const B='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1',D=B+'/admin-dashboard-api',T=B+'/admin-trash-api',M=B+'/system-mode',BK=B+'/admin-backup-api';let token=localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',page='dash',cache={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(json=true){return {...(json?{'content-type':'application/json'}:{}),'authorization':'Bearer '+token,'x-admin-session':token}}async function api(base,action,method='GET',body){const u=new URL(base);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:headers(),body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401||r.status===403&&j.error?.includes('administrateur principal')){location.href='../';throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}function pill(v){return `<span class="pill ${v==='critical'?'crit':v==='warning'?'wa':'go'}">${esc(v)}</span>`}
function show(p){page=p;['dash','alerts','activity','trash','backup','test'].forEach(k=>$("t"+k).className='btn '+(k===p?'active':'secondary'));render()}
async function refreshAll(){try{$('status').className='status';$('status').textContent='Actualisation…';const [dash,alerts,activity,trash,test]=await Promise.all([api(D,'dashboard'),api(D,'anomalies'),api(D,'activity'),api(T,'list'),api(M,'admin-status')]);cache={dash,alerts,activity,trash,test};$('status').className='status ok';$('status').textContent='Données actualisées.';render()}catch(e){$('status').className='status err';$('status').textContent=e.message}}
function render(){if(page==='dash')dash();else if(page==='alerts')alerts();else if(page==='activity')activity();else if(page==='trash')trash();else if(page==='backup')backup();else testMode()}
function dash(){const k=cache.dash?.kpis||{};$('content').innerHTML=`<section class="grid"><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${k.products??'—'}</div></div><div class="card"><div class="muted">Stock sous minimum</div><div class="kpi">${k.low_stock??'—'}</div></div><div class="card"><div class="muted">Valeur stock</div><div class="kpi">${Number(k.stock_value||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} €</div></div><div class="card"><div class="muted">Applications actives</div><div class="kpi">${k.applications_active??'—'}</div></div><div class="card"><div class="muted">Achats du mois</div><div class="kpi">${Number(k.purchases_month||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} €</div></div><div class="card"><div class="muted">Prévision du mois</div><div class="kpi">${Number(k.forecast_month||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} €</div></div><div class="card"><div class="muted">Factures comptables à contrôler</div><div class="kpi">${k.accounting_to_control??0}</div></div><div class="card"><div class="muted">Factures secrétariat en attente</div><div class="kpi">${k.secretariat_pending??0}</div></div></section><div class="card"><h2 class="section-title">État global</h2><p>${Number(k.negative_stock||0)>0?'<span class="pill crit">Stock négatif détecté</span>':'<span class="pill go">Aucun stock négatif</span>'} ${cache.test?.test_mode?'<span class="pill wa">Mode test actif</span>':'<span class="pill go">Production active</span>'}</p><p class="muted">Les alertes détaillées sont disponibles dans l’onglet Alertes.</p></div>`}
function alerts(){const rows=cache.alerts?.rows||[];$('content').innerHTML=`<div class="card"><h2 class="section-title">Alertes et anomalies</h2><p class="muted">Stocks, prix inhabituels, applications, factures et incohérences détectées automatiquement.</p></div><div class="table"><table><thead><tr><th>Niveau</th><th>Domaine</th><th>Problème</th><th>Détail</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${pill(x.severity)}</td><td>${esc(x.domain)}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.reason)}</td><td><button class="btn secondary" onclick="ack('${esc(x.key)}')">Marquer vu</button></td></tr>`).join('')||'<tr><td colspan="5">Aucune anomalie détectée.</td></tr>'}</tbody></table></div>`}async function ack(key){try{await api(D,'ack-anomaly','POST',{key});await refreshAll();show('alerts')}catch(e){alert(e.message)}}
function activity(){const rows=cache.activity?.rows||[];$('content').innerHTML=`<div class="card"><h2 class="section-title">Journal d’activité</h2><p class="muted">Historique des connexions et modifications enregistrées par le backend.</p></div><div class="table"><table><thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Type</th><th>Élément</th><th>Détails</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('fr-FR')}</td><td>${esc(x.username||'')}</td><td>${esc(x.action||'')}</td><td>${esc(x.entity_type||'')}</td><td class="mono">${esc(x.entity_id||'')}</td><td class="mono">${esc(JSON.stringify(x.details||{})).slice(0,350)}</td></tr>`).join('')||'<tr><td colspan="6">Aucune activité.</td></tr>'}</tbody></table></div>`}
function trash(){const rows=cache.trash?.rows||[];$('content').innerHTML=`<div class="card"><h2 class="section-title">Corbeille</h2><p class="muted">Les éléments désactivés après snapshot peuvent être restaurés avant leur purge.</p></div><div class="table"><table><thead><tr><th>Type</th><th>Élément</th><th>Supprimé par</th><th>Date</th><th>Purge</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.entity_type)}</td><td class="mono">${esc(x.entity_id)}</td><td>${esc(x.deleted_by||'')}</td><td>${new Date(x.deleted_at).toLocaleString('fr-FR')}</td><td>${new Date(x.purge_after).toLocaleDateString('fr-FR')}</td><td><button class="btn success" onclick="restoreTrash('${x.id}')">Restaurer</button></td></tr>`).join('')||'<tr><td colspan="6">Corbeille vide.</td></tr>'}</tbody></table></div>`}async function restoreTrash(id){if(!confirm('Restaurer cet élément ?'))return;try{await api(T,'restore','POST',{id});await refreshAll();show('trash')}catch(e){alert(e.message)}}
function backup(){$('content').innerHTML=`<div class="two"><div class="card"><h2 class="section-title">Sauvegarde de production</h2><p>Exporte les principales données métier dans un fichier JSON. Les mots de passe, jetons et secrets ne sont pas exportés.</p><button class="btn primary" onclick="downloadBackup()">Télécharger une sauvegarde maintenant</button></div><div class="card"><h2 class="section-title">Restauration</h2><p class="muted">La restauration est réservée au super-admin. Elle réinjecte les lignes de la sauvegarde sans supprimer les lignes plus récentes absentes du fichier.</p><input id="backupFile" type="file" accept="application/json,.json"><br><br><button class="btn danger" onclick="restoreBackup()">Restaurer depuis le fichier</button><div id="backupStatus" class="status"></div></div></div>`}async function downloadBackup(){try{const r=await fetch(BK+'?action=export',{headers:headers(false),cache:'no-store'});if(!r.ok){const j=await r.json();throw new Error(j.error||'Erreur sauvegarde')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gestion-college-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){alert(e.message)}}async function restoreBackup(){const s=$('backupStatus'),f=$('backupFile').files?.[0];if(!f)return s.textContent='Choisissez un fichier JSON.';if(!confirm('Cette opération va réinjecter les données de la sauvegarde en production. Continuer ?'))return;try{const backup=JSON.parse(await f.text());s.className='status';s.textContent='Restauration…';const j=await api(BK,'restore','POST',{confirm:'RESTAURER',backup});s.className='status ok';s.textContent='Restauration terminée : '+JSON.stringify(j.counts)}catch(e){s.className='status err';s.textContent=e.message}}
function testMode(){const t=cache.test||{};$('content').innerHTML=`<div class="two"><div class="card"><h2 class="section-title">Environnement de test</h2><p>${t.test_mode?'<span class="pill wa">Mode test actif</span>':'<span class="pill go">Mode test désactivé</span>'}</p><p class="muted">Quand il est activé, les données de production sont copiées dans les tables sandbox. Les essais se font ensuite sur ces copies.</p><label>Motif d’activation</label><input id="reason" placeholder="Ex. test nouvelle version"><br><br>${t.test_mode?'<button class="btn secondary" onclick="refreshSandbox()">Recopier la production vers le test</button> <button class="btn danger" onclick="setTest(false)">Désactiver le mode test</button>':'<button class="btn primary" onclick="setTest(true)">Activer le mode test</button>'}</div><div class="card"><h2 class="section-title">Principe</h2><p>Production et données de test sont séparées. Une activation ou une actualisation du sandbox copie catégories, produits, stocks, applications et règles comptables vers l’environnement de test.</p><p class="muted">L’activation ne modifie pas les données de production.</p></div></div>`}async function setTest(on){const reason=on?$('reason').value:'';if(on&&reason.trim().length<3)return alert('Indiquez un motif.');if(!confirm(on?'Activer le mode test ?':'Désactiver le mode test ?'))return;try{await api(M,'set','POST',{enabled:on,reason});await refreshAll();show('test')}catch(e){alert(e.message)}}async function refreshSandbox(){if(!confirm('Recopier les données de production dans le sandbox ? Les essais précédents seront remplacés.'))return;try{await api(M,'refresh-sandbox','POST',{});await refreshAll();show('test')}catch(e){alert(e.message)}}
if(!token)location.href='../';else refreshAll();
</script></body></html>
