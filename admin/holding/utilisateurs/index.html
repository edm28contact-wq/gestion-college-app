<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion utilisateurs</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#1f2b38;--ok:#176b3a;--bad:#a32929;--muted:#6b7785}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:22px}.top,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.success{background:#e8f5ed;color:var(--ok)}.card{background:#fff;border:1px solid #d7dee5;border-radius:14px;padding:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}.status{min-height:22px;margin:10px 0}.ok{color:var(--ok)}.err{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:27px;font-weight:800}.table{overflow:auto;background:#fff;border:1px solid #d7dee5;border-radius:14px}.table table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{background:#f7f9fa}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f5;font-size:12px;margin:2px}.pill.ok{background:#e8f5ed;color:#176b3a}.pill.off{background:#fdeaea;color:#8a2525}.pill.warn{background:#fff4d6;color:#7a5600}.pill.view{background:#fff3cd;color:#765500}.pill.edit{background:#e8f5ed;color:#176b3a}input,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.filters input{max-width:330px}.filters select{max-width:230px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.perm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.perm label{border:1px solid #dde3e8;border-radius:9px;padding:9px}.perm input,.inline{width:auto}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.fields,.perm{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><div class="top"><div><h1>Gestion utilisateurs</h1><div class="muted">Administration Holding · droits et niveau d'accès de chaque compte</div></div><div class="actions"><a class="btn secondary" href="../">Retour Holding</a><button class="btn primary" onclick="edit({},false)">Créer un utilisateur</button><button class="btn secondary" onclick="load()">Actualiser</button></div></div><div id="status" class="status"></div><section class="grid"><div class="card"><div class="muted">Comptes</div><div id="kt" class="kpi">0</div></div><div class="card"><div class="muted">Actifs</div><div id="ka" class="kpi">0</div></div><div class="card"><div class="muted">Visiteurs</div><div id="kv" class="kpi">0</div></div><div class="card"><div class="muted">Modificateurs</div><div id="km" class="kpi">0</div></div></section><section class="card"><div class="filters"><input id="q" placeholder="Rechercher…" oninput="render()"><select id="rf" onchange="render()"><option value="">Tous les rôles</option><option value="admin_limited">Administration Collège</option><option value="secretariat">Secrétariat</option><option value="comptabilite">Comptabilité</option><option value="marne_invest">Marne Invest</option></select><select id="af" onchange="render()"><option value="">Tous les niveaux</option><option value="editor">Modificateur</option><option value="visitor">Visiteur</option></select><select id="sf" onchange="render()"><option value="">Tous les états</option><option value="1">Actifs</option><option value="0">Désactivés</option></select></div></section><section id="list" class="table"></section></main><div id="modal"></div><script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/holding-admin-api';let token=localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',accounts=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roles={admin:'Administration Holding',admin_limited:'Administration Collège',secretariat:'Secrétariat',comptabilite:'Comptabilité',marne_invest:'Marne Invest'};const perms={college_admin:'Administration Collège',secretariat:'Secrétariat Collège',accounting:'Comptabilité Collège',marne:'Administration Marne Invest',marne_invest:'Marne Invest',marne_accounting:'Comptabilité Marne Invest'};
async function req(action,method='GET',body){const u=new URL(API);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:{'content-type':'application/json','x-admin-session':token,'authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw Object.assign(new Error(j.error||'Erreur serveur'),{status:r.status,data:j});return j}
async function load(){try{const j=await req('accounts');accounts=j.accounts||[];render();$('status').className='status ok';$('status').textContent=`${accounts.length} compte(s) chargé(s).`}catch(e){if(e.status===401){location.href='../';return}$('status').className='status err';$('status').textContent=e.message}}
function isVisitor(a){return a.username!=='admin'&&a.permissions?.readonly===true}function badges(a){if(a.username==='admin')return '<span class="pill">Tous les accès</span>';const p=Object.keys(a.permissions||{}).filter(k=>k!=='readonly'&&a.permissions[k]);return p.length?p.map(k=>`<span class="pill">${esc(perms[k]||k)}</span>`).join(''):'<span class="pill off">Aucun droit</span>'}
function render(){const q=$('q').value.toLowerCase(),rf=$('rf').value,af=$('af').value,sf=$('sf').value;const list=accounts.filter(a=>(!q||(`${a.username} ${a.display_name||''}`).toLowerCase().includes(q))&&(!rf||a.role===rf)&&(!af||(af==='visitor')===isVisitor(a))&&(!sf||(sf==='1')===!!a.active));$('kt').textContent=accounts.length;$('ka').textContent=accounts.filter(a=>a.active).length;$('kv').textContent=accounts.filter(isVisitor).length;$('km').textContent=accounts.filter(a=>!isVisitor(a)).length;$('list').innerHTML=`<table><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Niveau</th><th>Droits</th><th>État</th><th>Actions</th></tr></thead><tbody>${list.map(a=>`<tr><td><b>${esc(a.display_name||a.username)}</b><div class="muted">${esc(a.username)}</div></td><td>${esc(roles[a.role]||a.role||'')}</td><td>${a.username==='admin'?'<span class="pill edit">Super-admin</span>':isVisitor(a)?'<span class="pill view">Visiteur</span>':'<span class="pill edit">Modificateur</span>'}</td><td>${badges(a)}</td><td><span class="pill ${a.active?'ok':'off'}">${a.active?'Actif':'Désactivé'}</span>${a.must_change_password?'<span class="pill warn">Mot de passe à changer</span>':''}</td><td>${a.username==='admin'?'<span class="pill">Compte protégé</span>':`<div class="actions"><button class="btn secondary" onclick="editBy('${a.username}')">Modifier</button><button class="btn secondary" onclick="password('${a.username}')">Mot de passe</button><button class="btn ${a.active?'danger':'success'}" onclick="active('${a.username}',${!a.active})">${a.active?'Désactiver':'Activer'}</button></div>`}</td></tr>`).join('')||'<tr><td colspan="6">Aucun compte.</td></tr>'}</tbody></table>`}
function checks(a){return Object.entries(perms).map(([k,n])=>`<label><input class="pc inline" type="checkbox" value="${k}" ${a.permissions?.[k]?'checked':''}> ${esc(n)}</label>`).join('')}function editBy(u){const a=accounts.find(x=>x.username===u);if(a)edit(a,true)}
function edit(a={},existing=false){$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${existing?'Modifier':'Créer'} un utilisateur</h2><div class="fields"><div><label>Identifiant</label><input id="fu" value="${esc(a.username||'')}" ${existing?'disabled':''}></div><div><label>Nom affiché</label><input id="fn" value="${esc(a.display_name||'')}"></div><div><label>Rôle</label><select id="fr"><option value="admin_limited">Administration Collège</option><option value="secretariat">Secrétariat</option><option value="comptabilite">Comptabilité</option><option value="marne_invest">Marne Invest</option></select></div><div><label>Niveau d'accès</label><select id="faccess"><option value="editor">Modificateur</option><option value="visitor">Visiteur — lecture seule</option></select></div><div><label>${existing?'Nouveau mot de passe (facultatif)':'Mot de passe provisoire'}</label><input id="fp" type="password"></div><div class="full"><label>Autorisations</label><div class="perm">${checks(a)}</div><p class="muted">Les autorisations déterminent les espaces accessibles. Le niveau Visiteur permet de consulter ces espaces mais bloque les modifications.</p></div><div class="full"><label><input id="fa" class="inline" type="checkbox" ${a.active!==false?'checked':''}> Compte actif</label></div><div class="full"><label><input id="fm" class="inline" type="checkbox" ${a.must_change_password!==false?'checked':''}> Changement du mot de passe au prochain accès</label></div></div><br><div class="actions"><button class="btn primary" onclick="save(${existing})">Enregistrer</button><button class="btn secondary" onclick="closeM()">Annuler</button></div><div id="ms" class="status"></div></div></div>`;$('fr').value=a.role||'admin_limited';$('faccess').value=isVisitor(a)?'visitor':'editor'}
async function save(existing){try{const p=$('fp').value,u=$('fu').value.trim().toLowerCase();if(!existing&&p.length<10)throw new Error('Mot de passe : 10 caractères minimum.');if(p&&p.length<10)throw new Error('Mot de passe : 10 caractères minimum.');const permissions={};document.querySelectorAll('.pc:checked').forEach(x=>permissions[x.value]=true);if($('faccess').value==='visitor')permissions.readonly=true;await req('save-account','POST',{username:u,display_name:$('fn').value,role:$('fr').value,password:p,active:$('fa').checked,must_change_password:$('fm').checked,permissions});closeM();await load()}catch(e){$('ms').className='status err';$('ms').textContent=e.message}}
function password(u){$('modal').innerHTML=`<div class="modal"><div class="box"><h2>Réinitialiser le mot de passe</h2><p>${esc(u)}</p><input id="rp" type="password" placeholder="10 caractères minimum"><br><br><label><input id="rm" class="inline" type="checkbox" checked> Changement obligatoire au prochain accès</label><br><br><div class="actions"><button class="btn primary" onclick="reset('${u}')">Enregistrer</button><button class="btn secondary" onclick="closeM()">Annuler</button></div><div id="ms" class="status"></div></div></div>`}async function reset(u){try{const p=$('rp').value;if(p.length<10)throw new Error('10 caractères minimum.');await req('reset-password','POST',{username:u,password:p,must_change_password:$('rm').checked});closeM();await load()}catch(e){$('ms').className='status err';$('ms').textContent=e.message}}async function active(u,v){if(!confirm(`${v?'Activer':'Désactiver'} ${u} ?`))return;try{await req('set-active','POST',{username:u,active:v});await load()}catch(e){$('status').className='status err';$('status').textContent=e.message}}function closeM(){$('modal').innerHTML=''}if(!token)location.href='../';else load();
</script></body></html>
