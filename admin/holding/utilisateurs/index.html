<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion utilisateurs - Administration Holding</title>
<style>
:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#1f2b38;--ok:#176b3a;--bad:#a32929;--muted:#6b7785}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:22px}.top,.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.success{background:#e8f5ed;color:var(--ok)}.card{background:#fff;border:1px solid #d7dee5;border-radius:14px;padding:16px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px}.status{min-height:22px;margin:10px 0}.ok{color:var(--ok)}.err{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:27px;font-weight:800}.table{overflow:auto;background:#fff;border:1px solid #d7dee5;border-radius:14px}.table table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:10px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}th{background:#f7f9fa}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f5;font-size:12px;margin:2px}.pill.ok{background:#e8f5ed;color:#176b3a}.pill.off{background:#fdeaea;color:#8a2525}.pill.warn{background:#fff4d6;color:#7a5600}input,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit;background:#fff}.filters input{max-width:330px}.filters select{max-width:230px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modal .box{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.perm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.perm label{border:1px solid #dde3e8;border-radius:9px;padding:9px}.perm input,.inline-check{width:auto}.hide{display:none!important}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.fields,.perm{grid-template-columns:1fr}.wrap{padding:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><h1>Gestion utilisateurs</h1><div class="muted">Administration Holding · création et gestion centralisée de tous les comptes</div></div>
    <div class="actions"><a class="btn secondary" href="../">Retour Holding</a><button class="btn primary" onclick="openCreate()">Créer un utilisateur</button><button class="btn secondary" onclick="loadAccounts()">Actualiser</button><button class="btn secondary" onclick="logoutAll()">Déconnexion globale</button></div>
  </div>
  <div id="status" class="status"></div>
  <section class="grid">
    <div class="card"><div class="muted">Comptes</div><div id="kTotal" class="kpi">0</div></div>
    <div class="card"><div class="muted">Actifs</div><div id="kActive" class="kpi">0</div></div>
    <div class="card"><div class="muted">Désactivés</div><div id="kInactive" class="kpi">0</div></div>
    <div class="card"><div class="muted">Mot de passe à changer</div><div id="kPassword" class="kpi">0</div></div>
  </section>
  <section class="card">
    <div class="filters"><input id="search" placeholder="Rechercher un nom ou identifiant…" oninput="render()"><select id="roleFilter" onchange="render()"><option value="">Tous les rôles</option><option value="holding_admin">Holding</option><option value="admin">Administration Collège</option><option value="secretariat">Secrétariat</option><option value="comptabilite">Comptabilité</option><option value="marne_admin">Administration Marne Invest</option><option value="user">Utilisateur</option></select><select id="stateFilter" onchange="render()"><option value="">Tous les états</option><option value="active">Actifs</option><option value="inactive">Désactivés</option></select></div>
  </section>
  <section id="accounts" class="table"></section>
</main>
<div id="modal"></div>
<script>
const BASE='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1',HOLDING=BASE+'/holding-admin-api';
const TOKEN_KEYS=['holding_admin_token','college_admin_token','college_secretariat_token','college_accounting_token','edm_admin_token'];
let token=localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'',accounts=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleLabels={holding_admin:'Administration Holding',admin:'Administration Collège',secretariat:'Secrétariat',comptabilite:'Comptabilité',marne_admin:'Administration Marne Invest',user:'Utilisateur'};
const permissionLabels={college_admin:'Administration Collège',secretariat:'Secrétariat Collège',accounting:'Comptabilité Collège',marne:'Administration Marne Invest',marne_invest:'Marne Invest',marne_accounting:'Comptabilité Marne Invest'};
const roleDefaults={admin:['college_admin'],secretariat:['secretariat'],comptabilite:['accounting'],marne_admin:['marne','marne_invest','marne_accounting'],user:[]};
async function req(action,method='GET',body){const u=new URL(HOLDING);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:{'content-type':'application/json','x-admin-session':token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse du service invalide.'}));if(!r.ok)throw Object.assign(new Error(j.error||'Erreur serveur'),{status:r.status,data:j});return j}
function clearTokens(){TOKEN_KEYS.forEach(k=>localStorage.removeItem(k))}
function logoutAll(){clearTokens();location.href='../'}
function roleLabel(v){return roleLabels[v]||v||'Utilisateur'}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-FR')}
function accountScope(a){if(a.username==='holding-admin')return ['Holding','Collège','Marne Invest'];const p=a.permissions||{},out=[];if(p.college_admin||p.secretariat||p.accounting)out.push('Société Collège');if(p.marne||p.marne_invest||p.marne_accounting)out.push('Marne Invest');return out.length?out:['Aucun accès applicatif']}
function permissionBadges(a){if(a.username==='holding-admin')return '<span class="pill">Tous les accès</span>';const p=Object.keys(a.permissions||{}).filter(k=>a.permissions[k]);return p.length?p.map(k=>`<span class="pill">${esc(permissionLabels[k]||k)}</span>`).join(''):'<span class="pill off">Aucun droit</span>'}
async function loadAccounts(){const s=$('status');try{s.className='status';s.textContent='Chargement…';const j=await req('accounts');accounts=j.accounts||[];render();s.className='status ok';s.textContent=`${accounts.length} compte(s) chargé(s). Tous les utilisateurs sont gérés depuis cette page.`}catch(e){if(e.status===401||e.data?.must_change_password){clearTokens();location.href='../';return}s.className='status err';s.textContent=e.message}}
function render(){const q=String($('search')?.value||'').trim().toLowerCase(),rf=$('roleFilter')?.value||'',sf=$('stateFilter')?.value||'';const list=accounts.filter(a=>{const text=`${a.username||''} ${a.display_name||''} ${roleLabel(a.role)}`.toLowerCase();if(q&&!text.includes(q))return false;if(rf&&a.role!==rf)return false;if(sf==='active'&&a.active!==true)return false;if(sf==='inactive'&&a.active===true)return false;return true});$('kTotal').textContent=accounts.length;$('kActive').textContent=accounts.filter(a=>a.active===true).length;$('kInactive').textContent=accounts.filter(a=>a.active!==true).length;$('kPassword').textContent=accounts.filter(a=>a.must_change_password===true).length;$('accounts').innerHTML=`<table><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Périmètre</th><th>Autorisations</th><th>État</th><th>Dernière connexion</th><th>Actions</th></tr></thead><tbody>${list.length?list.map(a=>`<tr><td><b>${esc(a.display_name||a.username)}</b><div class="muted">${esc(a.username)}</div></td><td>${esc(roleLabel(a.role))}</td><td>${accountScope(a).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td><td>${permissionBadges(a)}</td><td><span class="pill ${a.active?'ok':'off'}">${a.active?'Actif':'Désactivé'}</span>${a.must_change_password?'<span class="pill warn">Mot de passe à changer</span>':''}${a.locked_until&&new Date(a.locked_until)>new Date()?'<span class="pill warn">Verrouillé temporairement</span>':''}</td><td>${esc(fmtDate(a.last_login_at))}</td><td>${a.username==='holding-admin'?'<span class="pill">Compte protégé</span>':`<div class="actions"><button class="btn secondary" onclick="editAccount('${a.username}')">Modifier</button><button class="btn secondary" onclick="resetPassword('${a.username}')">Mot de passe</button><button class="btn ${a.active?'danger':'success'}" onclick="setActive('${a.username}',${!a.active})">${a.active?'Désactiver':'Activer'}</button></div>`}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">Aucun compte ne correspond aux filtres.</td></tr>'}</tbody></table>`}
function permissionChecks(a={}){return Object.entries(permissionLabels).map(([k,n])=>`<label><input class="permcb" type="checkbox" value="${k}" ${a.permissions?.[k]?'checked':''}> ${esc(n)}</label>`).join('')}
window.openCreate=()=>editor({username:'',display_name:'',role:'user',permissions:{},active:true,must_change_password:true},false);
window.editAccount=u=>{const a=accounts.find(x=>x.username===u);if(a)editor(a,true)};
function editor(a,existing){$('modal').innerHTML=`<div class="modal"><div class="box"><div class="top"><div><h2>${existing?'Modifier':'Créer'} un utilisateur</h2><div class="muted">Les droits cochés déterminent les espaces auxquels le compte peut accéder.</div></div><button class="btn secondary" onclick="closeModal()">Fermer</button></div><br><div class="fields"><div><label>Identifiant</label><input id="fu" value="${esc(a.username||'')}" ${existing?'disabled':''} placeholder="ex. jean.dupont"></div><div><label>Nom affiché</label><input id="fn" value="${esc(a.display_name||'')}"></div><div><label>Rôle principal</label><select id="fr" onchange="applyRoleDefaults(${existing?'false':'true'})"><option value="user">Utilisateur</option><option value="admin">Administration Collège</option><option value="secretariat">Secrétariat</option><option value="comptabilite">Comptabilité</option><option value="marne_admin">Administration Marne Invest</option></select></div><div><label>${existing?'Nouveau mot de passe facultatif':'Mot de passe provisoire'}</label><input id="fp" type="password" autocomplete="new-password" placeholder="10 caractères minimum"></div><div class="full"><label>Autorisations</label><div class="perm">${permissionChecks(a)}</div></div><div class="full"><label><input id="fa" class="inline-check" type="checkbox" ${a.active!==false?'checked':''}> Compte actif</label></div><div class="full"><label><input id="fm" class="inline-check" type="checkbox" ${a.must_change_password!==false?'checked':''}> Obliger l’utilisateur à changer son mot de passe à la prochaine connexion</label></div></div><br><div class="actions"><button class="btn primary" onclick="saveAccount(${existing})">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="ms" class="status"></div></div></div>`;$('fr').value=a.role||'user'}
window.applyRoleDefaults=force=>{if(!force)return;const defaults=new Set(roleDefaults[$('fr').value]||[]);document.querySelectorAll('.permcb').forEach(cb=>cb.checked=defaults.has(cb.value))};
window.saveAccount=async existing=>{const s=$('ms');try{const username=$('fu').value.trim().toLowerCase(),password=$('fp').value;if(!/^[a-z0-9._-]{3,50}$/.test(username))throw new Error('Identifiant invalide : 3 à 50 caractères, lettres minuscules, chiffres, point, tiret ou underscore.');if(!existing&&password.length<10)throw new Error('Le mot de passe provisoire doit contenir au moins 10 caractères.');if(password&&password.length<10)throw new Error('Le mot de passe doit contenir au moins 10 caractères.');const permissions={};document.querySelectorAll('.permcb:checked').forEach(x=>permissions[x.value]=true);s.className='status';s.textContent='Enregistrement…';await req('save-account','POST',{username,display_name:$('fn').value,role:$('fr').value,password,active:$('fa').checked,must_change_password:$('fm').checked,permissions});closeModal();await loadAccounts()}catch(e){s.className='status err';s.textContent=e.message}};
window.resetPassword=u=>{$('modal').innerHTML=`<div class="modal"><div class="box"><h2>Réinitialiser le mot de passe</h2><p class="muted">Compte : ${esc(u)}</p><label>Nouveau mot de passe provisoire</label><input id="rp" type="password" autocomplete="new-password" placeholder="10 caractères minimum"><br><br><label><input id="rpm" class="inline-check" type="checkbox" checked> Changement obligatoire à la prochaine connexion</label><br><br><div class="actions"><button class="btn primary" onclick="doReset('${u}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="ms" class="status"></div></div></div>`};
window.doReset=async u=>{const s=$('ms');try{const p=$('rp').value;if(p.length<10)throw new Error('Le mot de passe doit contenir au moins 10 caractères.');s.textContent='Enregistrement…';await req('reset-password','POST',{username:u,password:p,must_change_password:$('rpm').checked});closeModal();await loadAccounts()}catch(e){s.className='status err';s.textContent=e.message}};
window.setActive=async(u,active)=>{if(!confirm(`${active?'Activer':'Désactiver'} le compte ${u} ?`))return;try{await req('set-active','POST',{username:u,active});await loadAccounts()}catch(e){$('status').className='status err';$('status').textContent=e.message}};
window.closeModal=()=>{$('modal').innerHTML=''};
if(!token)location.href='../';else loadAccounts();
</script>
</body>
</html>
