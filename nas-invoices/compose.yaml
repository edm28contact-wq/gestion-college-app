services:
  invoices:
    build: .
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - .env
    volumes:
      - type: bind
        source: "${NAS_SOURCE_HOST_PATH:?Definir le chemin Linux absolu du dossier source sur le NAS}"
        target: /data/ENTREE_FACTURES
        read_only: true
        bind:
          create_host_path: false
      - ./FACTURES_CLASSEES:/data/FACTURES_CLASSEES:rw
      - ./A_VERIFIER:/data/A_VERIFIER:rw
