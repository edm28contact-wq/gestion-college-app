<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration Collège</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#fff;border:1px solid #dce2e8;border-radius:14px;padding:22px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#1f2b38;color:white;padding:16px}.brand{font-size:19px;font-weight:800;margin-bottom:15px}.nav button{display:block;width:100%;border:0;background:transparent;color:#dce5ed;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.nav button.active{background:#314254;color:#fff}.main{padding:18px;min-width:0}.top,.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.card{background:#fff;border:1px solid #dce2e8;border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:28px;font-weight:800}.muted{color:#6b7785;font-size:13px}.table{overflow:auto;background:#fff;border:1px solid #dce2e8;border-radius:12px}.table table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:8px;font:inherit}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px}.modal .box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f5;font-size:12px}.status{min-height:22px;margin-top:8px}.ok{color:var(--ok)}.err{color:var(--bad)}@media(max-width:800px){.shell{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}}</style></head><body><section id="login" class="login"><div class="box"><h1>Administration Collège</h1><p class="muted">Connexion via les comptes centralisés de la Holding.</p><label>Utilisateur</label><input id="user" value="holding-admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div></section><section id="app" class="shell hide"><aside class="side"><div class="brand">Collège</div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Tableau de bord</h1><div id="server" class="muted"></div></div><div class="actions"><a class="btn secondary" href="../../admin/holding/">Holding</a><a class="btn secondary" href="../../secretariat/">Secrétariat</a><a class="btn secondary" href="../../comptabilite/">Comptabilité</a><button class="btn secondary" onclick="refresh()">Actualiser</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div id="content"></div></main></section><div id="modal"></div><script>
const ROOT='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1',ADMIN=ROOT+'/admin-api',SITE=ROOT+'/site-admin-api';let token=localStorage.getItem('college_admin_token')||'',db=null,page='dashboard';const pages=[['dashboard','Tableau de bord'],['categories','Catégories'],['products','Produits & stocks'],['apps','Applications'],['events','Mouvements'],['purchases','Achats']];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(base,action,method='GET',body){const r=await fetch(base+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json','x-admin-session':token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401&&action!=='login'){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}async function login(){try{$('loginStatus').textContent='Connexion…';const r=await fetch(ADMIN+'?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('user').value.trim().toLowerCase(),password:$('pass').value}),cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Connexion refusée');if(!(j.role==='holding_admin'||j.role==='admin'||j.is_super_admin===true||j.permissions?.college_admin===true||j.permissions?.['*']===true))throw new Error('Accès Administration Collège non autorisé');token=j.token;localStorage.setItem('college_admin_token',token);$('pass').value='';$('login').classList.add('hide');$('app').classList.remove('hide');init();await refresh()}catch(e){$('loginStatus').className='status err';$('loginStatus').textContent=e.message}}function logout(){localStorage.removeItem('college_admin_token');token='';db=null;$('app').classList.add('hide');$('login').classList.remove('hide')}function init(){$('nav').innerHTML=pages.map(([k,n])=>`<button data-p="${k}" onclick="show('${k}')">${n}</button>`).join('')}async function refresh(){const [main,sites]=await Promise.all([call(ADMIN,'data'),call(SITE,'list')]);db=main;db.applications=sites.applications||[];db.application_products=sites.application_products||[];$('server').textContent='Actualisé : '+new Date(db.server_time).toLocaleString('fr-FR');render()}function show(p){page=p;render()}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('title').textContent=pages.find(x=>x[0]===page)?.[1]||'';({dashboard, categories, products, apps, events, purchases}[page]||dashboard)()}const bal=id=>Number(db.balances.find(x=>x.product_id===id)?.quantity||0),cat=id=>db.categories.find(x=>x.id===id),prod=id=>db.products.find(x=>x.id===id);function dashboard(){const ps=db.products.filter(p=>p.active!==false),low=ps.filter(p=>bal(p.id)<Number(p.min_stock||0)),value=ps.reduce((s,p)=>s+bal(p.id)*Number(p.unit_price||0),0);$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Catégories</div><div class="kpi">${db.categories.length}</div></div><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${ps.length}</div></div><div class="card"><div class="muted">Sous seuil</div><div class="kpi">${low.length}</div></div><div class="card"><div class="muted">Valeur stock</div><div class="kpi">${value.toFixed(2)} €</div></div></div><br><div class="card"><b>État de mise en service</b><div class="muted" style="margin-top:6px">Ajoutez les catégories et produits, puis créez une application publique par catégorie depuis l’onglet Applications.</div></div>`}function categories(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editCategory()">Ajouter catégorie</button></div><div class="table"><table><thead><tr><th>Nom</th><th>Code</th><th>Mode</th><th>Active</th><th></th></tr></thead><tbody>${db.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.code)}</td><td>${esc(c.app_mode)}</td><td>${c.active?'Oui':'Non'}</td><td><button class="btn secondary" onclick="editCategory('${c.id}')">Modifier</button></td></tr>`).join('')}</tbody></table></div>`}window.editCategory=id=>{const c=id?db.categories.find(x=>x.id===id):{};$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${id?'Modifier':'Ajouter'} une catégorie</h2><div class="fields"><div><label>Nom</label><input id="cname" value="${esc(c.name||'')}"></div><div><label>Code</label><input id="ccode" value="${esc(c.code||'')}"></div><div><label>Mode</label><select id="cmode"><option value="sortie_inventaire">Inventaire + sorties</option><option value="inventaire">Inventaire</option><option value="sortie">Sorties</option></select></div><div><label>Couleur</label><input id="ccolor" value="${esc(c.color||'#243447')}"></div><div class="full"><label><input id="cactive" style="width:auto" type="checkbox" ${c.active!==false?'checked':''}> Active</label></div></div><br><div class="actions"><button class="btn primary" onclick="saveCategory('${id||''}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="mstatus" class="status"></div></div></div>`;$('cmode').value=c.app_mode||'sortie_inventaire'};window.saveCategory=async id=>{try{await call(ADMIN,'save-category','POST',{id:id||null,name:$('cname').value,code:$('ccode').value,app_mode:$('cmode').value,color:$('ccolor').value,active:$('cactive').checked});closeModal();await refresh()}catch(e){$('mstatus').className='status err';$('mstatus').textContent=e.message}};function products(){$('content').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editProduct()">Ajouter produit</button></div><div class="table"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Mini</th><th>Cible</th><th></th></tr></thead><tbody>${db.products.filter(p=>p.active!==false).map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code)}</div></td><td>${esc(cat(p.category_id)?.name||'')}</td><td>${Number(p.unit_price||0).toFixed(2)} €</td><td>${bal(p.id)}</td><td>${Number(p.min_stock||0)}</td><td>${Number(p.target_stock||0)}</td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Modifier</button> <button class="btn secondary" onclick="stock('${p.id}')">Stock</button></td></tr>`).join('')}</tbody></table></div>`}window.editProduct=id=>{const p=id?db.products.find(x=>x.id===id):{};$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${id?'Modifier':'Ajouter'} un produit</h2><div class="fields"><div><label>Nom</label><input id="pname" value="${esc(p.name||'')}"></div><div><label>Code</label><input id="pcode" value="${esc(p.code||'')}"></div><div><label>Catégorie</label><select id="pcat">${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Unité</label><input id="punit" value="${esc(p.unit||'pièce')}"></div><div><label>Prix unitaire</label><input id="pprice" type="number" step="0.01" value="${Number(p.unit_price||0)}"></div><div><label>Stock initial</label><input id="pinitial" type="number" step="0.001" value="${Number(p.initial_stock||0)}"></div><div><label>Stock mini</label><input id="pmin" type="number" step="0.001" value="${Number(p.min_stock||0)}"></div><div><label>Stock cible</label><input id="ptarget" type="number" step="0.001" value="${Number(p.target_stock||0)}"></div></div><br><div class="actions"><button class="btn primary" onclick="saveProduct('${id||''}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="mstatus" class="status"></div></div></div>`;if(p.category_id)$('pcat').value=p.category_id};window.saveProduct=async id=>{try{await call(ADMIN,'save-product','POST',{id:id||null,name:$('pname').value,code:$('pcode').value,category_id:$('pcat').value,unit:$('punit').value,unit_price:Number($('pprice').value||0),initial_stock:Number($('pinitial').value||0),min_stock:Number($('pmin').value||0),target_stock:Number($('ptarget').value||0),active:true});closeModal();await refresh()}catch(e){$('mstatus').className='status err';$('mstatus').textContent=e.message}};window.stock=id=>{const p=prod(id);const q=prompt('Nouveau stock pour '+p.name,bal(id));if(q===null)return;const n=Number(q);if(!Number.isFinite(n)||n<0)return alert('Stock invalide');call(ADMIN,'set-stock','POST',{product_id:id,quantity:n}).then(refresh).catch(e=>alert(e.message))};function apps(){$('content').innerHTML=`<div class="card"><b>Applications publiques</b><div class="muted">Chaque site public utilise le nouveau backend EDM.</div></div>${db.categories.map(c=>{const a=db.applications.find(x=>x.category_id===c.id&&x.active!==false),url=a?'https://edm28contact-wq.github.io/gestion-college-app/college/?id='+encodeURIComponent(a.public_id):'';return `<div class="card"><b>${esc(c.name)}</b><div class="muted">${a?esc(a.name):'Aucun site créé'}</div><div class="actions" style="margin-top:10px">${a?`<a class="btn primary" target="_blank" href="${url}">Ouvrir</a><button class="btn secondary" onclick="editSite('${a.id}','${c.id}')">Configurer</button>`:`<button class="btn primary" onclick="editSite('','${c.id}')">Créer le site</button>`}</div></div>`}).join('')}`}window.editSite=(id,cid)=>{const a=id?db.applications.find(x=>x.id===id):null,c=cat(cid),selected=new Set(db.application_products.filter(m=>m.application_id===id&&m.active).map(m=>m.product_id));$('modal').innerHTML=`<div class="modal"><div class="box"><h2>${id?'Configurer':'Créer'} le site</h2><div class="fields"><div><label>Nom</label><input id="sname" value="${esc(a?.name||c?.name||'')}"></div><div><label>Code</label><input id="scode" value="${esc(a?.code||('site-'+(c?.code||'')))}"></div><div><label>Services</label><input id="sservices" value="${esc((a?.services||['Général']).join(', '))}"></div><div class="full"><label>Description</label><textarea id="sdesc">${esc(a?.description||'')}</textarea></div><div class="full"><label>Fonctions</label><label><input class="so" data-k="inventory" type="checkbox" checked> Inventaire</label> <label><input class="so" data-k="outgoing" type="checkbox"> Sorties</label> <label><input class="so" data-k="purchases" type="checkbox" checked> Achats</label> <label><input class="so" data-k="supplier" type="checkbox" checked> Fournisseur</label> <label><input class="so" data-k="service" type="checkbox" checked> Service</label> <label><input class="so" data-k="note" type="checkbox" checked> Remarque</label> <label><input class="so" data-k="purchase_history" type="checkbox" checked> Historique achats</label></div><div class="full"><label>Produits</label>${db.products.filter(p=>p.category_id===cid&&p.active!==false).map(p=>`<label style="display:block"><input class="sp" style="width:auto" type="checkbox" value="${p.id}" ${!id||selected.has(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')||'<div class="muted">Aucun produit</div>'}</div></div><br><div class="actions"><button class="btn primary" onclick="saveSite('${id}','${cid}')">Enregistrer</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div><div id="mstatus" class="status"></div></div></div>`;if(a){const o=a.site_options||{};document.querySelectorAll('.so').forEach(x=>x.checked=o[x.dataset.k]!==false)}};window.saveSite=async(id,cid)=>{try{const site_options={unit_price:false,current_stock:false};document.querySelectorAll('.so').forEach(x=>site_options[x.dataset.k]=x.checked);await call(SITE,'save','POST',{id:id||null,name:$('sname').value,code:$('scode').value,category_id:cid,services:$('sservices').value,description:$('sdesc').value,site_options,product_ids:[...document.querySelectorAll('.sp:checked')].map(x=>x.value)});closeModal();await refresh()}catch(e){$('mstatus').className='status err';$('mstatus').textContent=e.message}};function events(){$('content').innerHTML=`<div class="table"><table><thead><tr><th>Date</th><th>Type</th><th>Application</th><th>Détails</th></tr></thead><tbody>${db.events.map(e=>`<tr><td>${esc(e.event_date)}</td><td><span class="pill">${esc(e.event_type)}</span></td><td>${esc(db.applications.find(a=>a.id===e.application_id)?.name||'')}</td><td>${db.event_items.filter(i=>i.event_id===e.id).map(i=>esc(i.product_name_snapshot)+': '+Number(i.quantity)).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`}function purchases(){$('content').innerHTML=`<div class="table"><table><thead><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Prix</th><th>Fournisseur</th></tr></thead><tbody>${db.purchases.map(x=>`<tr><td>${esc(x.purchase_date)}</td><td>${esc(prod(x.product_id)?.name||'')}</td><td>${Number(x.quantity)}</td><td>${Number(x.unit_price||0).toFixed(2)} €</td><td>${esc(x.supplier||'')}</td></tr>`).join('')}</tbody></table></div>`}window.closeModal=()=>{$('modal').innerHTML=''};if(token){$('login').classList.add('hide');$('app').classList.remove('hide');init();refresh().catch(()=>logout())}
</script></body></html>
