<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-lancement Collège</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929;--warn:#8a5b00}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce2e8;border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.login{max-width:420px;margin:10vh auto}.row{display:flex;gap:8px;flex-wrap:wrap}input{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section id="login" class="card login"><h1>Pré-lancement Collège</h1><p class="muted">Diagnostic de la production actuelle.</p><label>Compte Administration Collège</label><input id="user" value="admin"><br><br><label>Mot de passe</label><input id="pass" type="password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><p id="msg"></p></section><section id="app" class="hide"><div class="row" style="justify-content:space-between;align-items:center"><div><h1>Pré-lancement Collège</h1><div id="server" class="muted"></div></div><div class="row"><a class="btn secondary" href="../admin/">Administration Collège</a><a class="btn secondary" href="../../admin/acces.html">Accès & liens</a><button class="btn primary" onclick="refresh()">Actualiser</button></div></div><br><div id="summary"></div><div id="details"></div></section></main><script>
const ROOT='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1',ADMIN=ROOT+'/admin-api',SITE=ROOT+'/site-admin-api';let token=localStorage.getItem('college_admin_token')||localStorage.getItem('edm_admin_token')||localStorage.getItem('holding_admin_token')||'';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(base,action,method='GET',body){const u=new URL(base);u.searchParams.set('action',action);const r=await fetch(u,{method,headers:{'content-type':'application/json','x-admin-session':token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function login(){try{$('msg').textContent='Connexion…';const j=await call(ADMIN,'login','POST',{username:$('user').value.trim().toLowerCase(),password:$('pass').value});token=j.token;localStorage.setItem('college_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');await refresh()}catch(e){$('msg').className='bad';$('msg').textContent=e.message}}
async function refresh(){try{const [d,s]=await Promise.all([call(ADMIN,'data'),call(SITE,'list')]);const products=(d.products||[]).filter(p=>p.active!==false),apps=(s.applications||[]).filter(a=>a.active!==false),missing=products.filter(p=>!String(p.image_path||'').trim()).length,internal=apps.filter(a=>a.site_options?.internal===true).length;$('server').textContent='Contrôle effectué : '+new Date(d.server_time||Date.now()).toLocaleString('fr-FR');$('summary').innerHTML='<div class="grid"><div class="card"><div class="muted">Produits actifs</div><div class="kpi">'+products.length+'</div></div><div class="card"><div class="muted">Applications actives</div><div class="kpi">'+apps.length+'</div></div><div class="card"><div class="muted">Photos manquantes</div><div class="kpi '+(missing?'bad':'ok')+'">'+missing+'</div></div></div>';$('details').innerHTML='<div class="card"><b>État</b><p>Production connectée au projet Supabase actuel.</p><p>'+internal+' application(s) système interne(s) détectée(s).</p><p class="muted">Pour les tests fonctionnels détaillés, utilisez Administration Collège → Outils avancés → Manuel d’utilisation.</p></div>'}catch(e){$('details').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');refresh()}
</script></body></html>
