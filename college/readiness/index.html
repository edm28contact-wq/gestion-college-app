<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pré-lancement Collège</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929;--warn:#8a5b00}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce2e8;border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.login{max-width:420px;margin:10vh auto}.row{display:flex;gap:8px;flex-wrap:wrap}input{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f5;font-size:12px;font-weight:800}.pill.ok{background:#e8f5ed;color:#176b3a}.pill.bad{background:#fdeaea;color:#8a2525}.pill.warn{background:#fff5d8;color:#8a5b00}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section id="login" class="card login"><h1>Pré-lancement Collège</h1><p class="muted">Contrôle de l’infrastructure et des comptes avant mise en service.</p><label>Compte d’administration centrale</label><input id="user" value="holding-admin"><br><br><label>Mot de passe</label><input id="pass" type="password"><br><br><button class="btn primary" style="width:100%" onclick="login()">Se connecter</button><p id="msg"></p></section><section id="app" class="hide"><div class="row" style="justify-content:space-between;align-items:center"><div><h1>Pré-lancement Collège</h1><div id="server" class="muted"></div></div><div class="row"><a class="btn secondary" href="../admin/">Administration Collège</a><a class="btn secondary" href="../../secretariat/">Secrétariat</a><a class="btn secondary" href="../../comptabilite/">Comptabilité</a><a class="btn secondary" href="../../admin/holding/">Administration centrale</a><button class="btn primary" onclick="refresh()">Actualiser</button></div></div><br><div id="summary"></div><div id="accounts"></div><div id="data"></div></section></main><script>const ROOT='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1',ADMIN=ROOT+'/admin-api',READY=ROOT+'/college-readiness-api';let token=localStorage.getItem('holding_admin_token')||'';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const roleLabels={holding_admin:'Administration centrale',admin:'Administration Collège',secretariat:'Secrétariat',comptabilite:'Comptabilité'};async function login(){try{$('msg').textContent='Connexion…';const r=await fetch(ADMIN+'?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value}),cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Connexion refusée');if(!(j.role==='holding_admin'||j.is_super_admin===true||j.permissions?.['*']===true))throw new Error('Compte d’administration centrale requis');token=j.token;localStorage.setItem('holding_admin_token',token);$('login').classList.add('hide');$('app').classList.remove('hide');await refresh()}catch(e){$('msg').className='bad';$('msg').textContent=e.message}}async function refresh(){try{const r=await fetch(READY,{headers:{'x-admin-session':token},cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');render(j)}catch(e){alert(e.message)}}function badge(ok,labelYes='Conforme',labelNo='À faire'){return `<span class="pill ${ok?'ok':'bad'}">${ok?labelYes:labelNo}</span>`}function render(j){$('server').textContent='Contrôle effectué : '+new Date(j.server_time).toLocaleString('fr-FR');$('summary').innerHTML=`<div class="grid"><div class="card"><div class="muted">Infrastructure</div><div class="kpi ${j.infrastructure_ready?'ok':'bad'}">${j.infrastructure_ready?'PRÊTE':'À CORRIGER'}</div></div><div class="card"><div class="muted">Comptes Collège</div><div class="kpi ${j.accounts_ready?'ok':'warn'}">${j.accounts_ready?'PRÊTS':'INCOMPLETS'}</div></div><div class="card"><div class="muted">Données métier</div><div class="kpi ${j.data_configured?'ok':'warn'}">${j.data_configured?'CONFIGURÉES':'0 / À RENSEIGNER'}</div></div></div>`;const wanted=['holding-admin','admin-college','secretariat','comptabilite'],by=new Map((j.accounts||[]).map(a=>[a.username,a]));$('accounts').innerHTML=`<div class="card"><h2>Comptes de lancement</h2><div class="table"><table><thead><tr><th>Compte</th><th>Rôle</th><th>Actif</th><th>Autorisation attendue</th><th>Changement de mot de passe</th></tr></thead><tbody>${wanted.map(u=>{const a=by.get(u),ok=j.account_checks?.[u]===true;return `<tr><td><b>${esc(u)}</b></td><td>${esc(roleLabels[a?.role]||a?.role||'—')}</td><td>${a?badge(a.active&&a.central_active,'Oui','Non'):badge(false,'Oui','Non')}</td><td>${badge(ok)}</td><td>${a?.must_change_password?'<span class="pill warn">Requis</span>':'<span class="pill ok">Non requis</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`;const counts=[['Catégories','gh_categories'],['Produits','gh_products'],['Applications','gh_applications'],['Commandes','gh_stock_orders'],['Factures du secrétariat','gh_supplier_invoices'],['Factures de comptabilité','gh_accounting_invoices']];$('data').innerHTML=`<div class="card"><h2>État initial des données</h2><div class="table"><table><thead><tr><th>Élément</th><th>Nombre</th><th>État</th></tr></thead><tbody>${counts.map(([n,k])=>{const c=j.tables?.[k]?.count??0;return `<tr><td>${esc(n)}</td><td>${c}</td><td>${c===0?'<span class="pill warn">Normal pendant la préparation</span>':'<span class="pill ok">Configuré</span>'}</td></tr>`}).join('')}</tbody></table></div><p class="muted">Le lancement n’exige pas de données préremplies. Ce tableau vérifie que l’infrastructure, les comptes et les modules sont opérationnels avant la saisie réelle.</p></div><div class="card"><h2>Stockage des factures</h2><p>${badge(j.storage?.present&&j.storage?.private&&j.storage?.pdf_only,'Privé · PDF uniquement','À corriger')}</p></div>`}if(token){$('login').classList.add('hide');$('app').classList.remove('hide');refresh().catch(()=>{})}</script></body></html>
