<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243447"><title>Gestion collège</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f5f6f7;--accent:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:16px}h1{font-size:24px;margin:0}.muted{font-size:13px;color:#68727d}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:14px;margin-bottom:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#68727d;margin-bottom:5px}input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;padding:8px;font-size:16px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tab{flex:1;min-width:130px;min-height:46px;border:1px solid #cbd2d9;border-radius:9px;background:#fff;font-weight:700}.tab.active{background:var(--accent);color:#fff}.line{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2}.name{font-weight:650}.unit{font-size:12px;color:#68727d}.qty{text-align:center;font-size:18px}.btn{flex:1;min-height:48px;border:0;border-radius:10px;font-size:16px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#e9edf1}.status{min-height:22px;margin-top:10px}.ok{color:#14733e}.err{color:#a12622}.hidden{display:none!important}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;min-width:560px}.history th,.history td{padding:8px;border-bottom:1px solid #edf0f2;text-align:left}.empty{text-align:center;padding:28px;color:#68727d}@media(max-width:520px){.meta{grid-template-columns:1fr}.line{grid-template-columns:minmax(0,1fr) 88px}.actions{flex-direction:column}}</style></head><body><main class="wrap"><div style="margin-bottom:14px"><h1 id="title">Gestion collège</h1><div id="category" class="muted"></div></div><div id="tabs" class="tabs"></div><div id="pages"><div class="card">Chargement…</div></div></main><script>(()=>{'use strict';const ROOT='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1/app-api',id=(new URLSearchParams(location.search).get('id')||'').trim(),BASE=ROOT+'?id='+encodeURIComponent(id),$=x=>document.getElementById(x);let cfg=null,activePage='',inventoryLocked=false;const DRAFT='college-inventory:'+id,now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-'),uuid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=()=>cfg?.application?.site_options||{};function msg(i,t,ok=false){const e=$(i);if(!e)return;e.textContent=t||'';e.className='status '+(t?(ok?'ok':'err'):'')}function info(p){const a=[p.unit||'pièce'];if(opts().unit_price)a.push(Number(p.unit_price||0).toFixed(2)+' €');if(opts().current_stock)a.push('stock : '+Number(p.current_stock||0).toLocaleString('fr-FR'));return a.join(' · ')}function rows(cls,ph){return cfg.products.map(p=>`<div class="line" data-id="${p.id}"><div><div class="name">${esc(p.name)}</div><div class="unit">${esc(info(p))}</div></div><input class="${cls} qty" type="number" min="0" step="0.001" placeholder="${ph}"></div>`).join('')}function meta(p,service=true){return `<section class="card"><div class="meta"><div><label>Date</label><input id="${p}Date" type="date" value="${today}"></div>${service&&opts().service?`<div><label>Service</label><select id="${p}Service">${(cfg.application.services||['Général']).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>`:''}</div></section>`}function note(id){return opts().note?`<section class="card"><label>Remarque</label><textarea id="${id}" maxlength="500"></textarea></section>`:''}function inventory(){return `<section id="page-inventory">${meta('inv')}<section class="card">${rows('invQty','Compter')}</section>${note('invNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('inventory')">Effacer</button><button id="lockInventory" class="btn primary" onclick="lockInv()">Valider</button><button id="saveInventory" class="btn primary hidden" onclick="saveEvent('inventaire')">Enregistrer</button></div><div id="inventoryStatus" class="status"></div></section>`}function outgoing(){return `<section id="page-outgoing">${meta('out')}<section class="card">${rows('outQty','Sortie')}</section>${note('outNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('outgoing')">Effacer</button><button id="saveOutgoing" class="btn primary" onclick="saveEvent('sortie')">Enregistrer</button></div><div id="outgoingStatus" class="status"></div></section>`}function purchases(){return `<section id="page-purchases">${meta('buy',false)}${opts().supplier?'<section class="card"><label>Fournisseur</label><input id="supplier"></section>':''}<section class="card">${rows('buyQty','Qté')}</section>${note('buyNote')}<div class="actions"><button class="btn secondary" onclick="resetForm('purchases')">Effacer</button><button id="savePurchases" class="btn primary" onclick="savePurchase()">Enregistrer achat</button></div><div id="purchaseStatus" class="status"></div>${opts().purchase_history?'<section class="card"><label>Année</label><input id="year" type="number" value="'+now.getFullYear()+'"><button class="btn secondary" style="margin-top:8px" onclick="loadPurchases()">Actualiser</button></section><section class="card history"><table><thead><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Fournisseur</th></tr></thead><tbody id="history"></tbody></table></section>':''}</section>`}function render(){const defs=[];if(opts().inventory)defs.push(['inventory','Inventaire',inventory]);if(opts().outgoing)defs.push(['outgoing','Sorties',outgoing]);if(opts().purchases)defs.push(['purchases','Achats',purchases]);$('title').textContent=cfg.application.name;$('category').textContent=cfg.category.name;document.documentElement.style.setProperty('--accent',cfg.application.color||'#243447');if(!defs.length){$('pages').innerHTML='<div class="card empty">Aucune fonction activée.</div>';return}$('tabs').innerHTML=defs.map(([k,n])=>`<button class="tab" data-page="${k}" onclick="showPage('${k}')">${n}</button>`).join('');$('pages').innerHTML=defs.map(x=>x[2]).join('');showPage(defs[0][0]);restore();if(opts().purchase_history&&opts().purchases)loadPurchases()}window.showPage=p=>{activePage=p;document.querySelectorAll('[id^="page-"]').forEach(x=>x.classList.toggle('hidden',x.id!=='page-'+p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===p))};async function load(){if(!/^[0-9a-f-]{36}$/i.test(id)){$('pages').innerHTML='<div class="card err">Lien application invalide.</div>';return}try{const r=await fetch(BASE,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');cfg=j;render()}catch(e){$('pages').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}function invItems(){let bad=false;const items=[...document.querySelectorAll('.invQty')].map(i=>{const raw=i.value.trim(),q=Number(raw);if(raw===''||!Number.isFinite(q)||q<0)bad=true;return {product_id:i.closest('.line').dataset.id,quantity:q}});return {items,bad}}window.lockInv=()=>{const x=invItems();if(x.bad){msg('inventoryStatus','Complétez toutes les quantités.');return}localStorage.setItem(DRAFT,JSON.stringify({items:x.items,date:$('invDate').value,service:$('invService')?.value||'',note:$('invNote')?.value||''}));inventoryLocked=true;document.querySelectorAll('.invQty').forEach(i=>i.disabled=true);$('lockInventory').classList.add('hidden');$('saveInventory').classList.remove('hidden');msg('inventoryStatus','Inventaire validé. Cliquez sur Enregistrer.',true)};function restore(){try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(!d)return;const m=new Map(d.items.map(x=>[x.product_id,x.quantity]));document.querySelectorAll('.invQty').forEach(i=>{const v=m.get(i.closest('.line').dataset.id);if(v!==undefined)i.value=v});if($('invDate'))$('invDate').value=d.date||today;if($('invService'))$('invService').value=d.service||'';if($('invNote'))$('invNote').value=d.note||''}catch{}}window.resetForm=k=>{const cls=k==='inventory'?'.invQty':k==='outgoing'?'.outQty':'.buyQty';document.querySelectorAll(cls).forEach(i=>{i.value='';i.disabled=false});if(k==='inventory'){localStorage.removeItem(DRAFT);inventoryLocked=false;$('lockInventory')?.classList.remove('hidden');$('saveInventory')?.classList.add('hidden')}if(k==='purchases'&&$('supplier'))$('supplier').value=''};window.saveEvent=async type=>{const inv=type==='inventaire',cls=inv?'.invQty':'.outQty',items=[];let bad=false;if(inv&&!inventoryLocked){msg('inventoryStatus','Validez d’abord l’inventaire.');return}document.querySelectorAll(cls).forEach(i=>{const raw=i.value.trim();if(inv&&raw===''){bad=true;return}if(!inv&&!raw)return;const q=Number(raw);if(!Number.isFinite(q)||q<0||(!inv&&q<=0)){bad=true;return}items.push({product_id:i.closest('.line').dataset.id,quantity:q})});const sid=inv?'inventoryStatus':'outgoingStatus';if(bad||!items.length)return msg(sid,'Quantités invalides.');try{const p=inv?'inv':'out',r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),event_type:type,event_date:$(p+'Date').value,service:$(p+'Service')?.value||'',note:$(p+'Note')?.value||'',items})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetForm(inv?'inventory':'outgoing');msg(sid,inv?'Inventaire enregistré.':'Sortie enregistrée.',true)}catch(e){msg(sid,e.message)}};window.savePurchase=async()=>{const items=[];document.querySelectorAll('.buyQty').forEach(i=>{const q=Number(i.value||0);if(q>0)items.push({product_id:i.closest('.line').dataset.id,quantity:q})});if(!items.length)return msg('purchaseStatus','Indiquez au moins un article.');try{const r=await fetch(BASE+'&action=purchase',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),purchase_date:$('buyDate').value,supplier:$('supplier')?.value||'',note:$('buyNote')?.value||'',items})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');resetForm('purchases');msg('purchaseStatus','Achat enregistré.',true);if(opts().purchase_history)loadPurchases()}catch(e){msg('purchaseStatus',e.message)}};window.loadPurchases=async()=>{if(!$('history'))return;try{const y=Number($('year').value),r=await fetch(BASE+'&action=purchases&year='+y),j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');const by=new Map(cfg.products.map(p=>[p.id,p]));$('history').innerHTML=(j.purchases||[]).map(x=>`<tr><td>${esc(x.purchase_date)}</td><td>${esc(by.get(x.product_id)?.name||x.product_name||'')}</td><td>${Number(x.quantity).toLocaleString('fr-FR')}</td><td>${esc(x.supplier||'')}</td></tr>`).join('')||'<tr><td colspan="4">Aucun achat.</td></tr>'}catch(e){$('history').innerHTML='<tr><td colspan="4" class="err">'+esc(e.message)+'</td></tr>'}};load()})();</script></body></html>
