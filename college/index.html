<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243447">
<title>Gestion collège</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f6f8;--accent:#243447;--ok:#176b3a;--bad:#a32929;--muted:#68727d}*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.wrap{max-width:920px;margin:auto;padding:16px 16px 110px}.header{margin-bottom:14px}.header h1{font-size:25px;line-height:1.15;margin:0 0 4px}.muted{font-size:13px;color:var(--muted)}.description{margin-top:7px;color:#42505c}.card{background:#fff;border:1px solid #dfe5ea;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #00000008}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.progress{font-weight:800;white-space:nowrap}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:12px}.tab{flex:1;min-width:130px;min-height:48px;border:1px solid #cbd2d9;border-radius:10px;background:#fff;font-size:15px;font-weight:800;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:650}input,select,textarea{width:100%;min-height:46px;border:1px solid #c5ced6;border-radius:10px;background:#fff;padding:9px 10px;font:inherit;font-size:16px}textarea{min-height:88px;resize:vertical}.products{padding:4px 14px}.product{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f2}.product:last-child{border-bottom:0}.product.hidden{display:none}.name{font-weight:750;line-height:1.25}.code{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;color:#52606c;background:#eef2f5;border-radius:999px;padding:2px 7px}.unit{font-size:12px;color:var(--muted);margin-top:5px}.qtybox{display:grid;grid-template-columns:44px minmax(72px,1fr) 44px;gap:6px;align-items:center}.qtybox.inventory{grid-template-columns:52px minmax(85px,1fr)}.qty{font-size:19px;font-weight:800;text-align:center;min-width:0}.mini{min-height:46px;border:1px solid #cbd2d9;border-radius:10px;background:#eef2f5;font-weight:900;font-size:18px;cursor:pointer}.zero{font-size:14px}.btn{flex:1;min-height:50px;border:0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled,.mini:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--accent);color:#fff}.success{background:#1fbd61;color:#fff}.secondary{background:#e8edf1;color:#17202a}.danger-lite{background:#fff0f0;color:#942323}.status{min-height:22px;margin-top:10px;font-weight:650}.ok{color:var(--ok)}.err{color:var(--bad)}.hidden{display:none!important}.reviewbox{border:2px solid var(--accent);background:#f8fafb}.reviewtitle{font-size:18px;font-weight:850;margin-bottom:4px}.sticky{position:sticky;bottom:10px;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border:1px solid #dfe5ea;border-radius:14px;padding:10px;box-shadow:0 8px 30px #0002}.summary{font-size:13px;color:var(--muted);margin-bottom:8px}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;min-width:600px}.history th,.history td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.empty{text-align:center;padding:30px;color:var(--muted)}.saved{font-size:12px;color:var(--ok);font-weight:700;margin-top:5px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:650px){.wrap{padding:12px 10px 100px}.meta,.toolbar{grid-template-columns:1fr}.product{grid-template-columns:minmax(0,1fr) 154px;gap:8px}.qtybox{grid-template-columns:40px minmax(64px,1fr) 40px}.qtybox.inventory{grid-template-columns:46px minmax(70px,1fr)}.mini{min-height:44px}.header h1{font-size:23px}}
@media(max-width:420px){.product{grid-template-columns:1fr}.qtybox,.qtybox.inventory{grid-template-columns:46px minmax(90px,1fr) 46px}.qtybox.inventory{grid-template-columns:54px minmax(100px,1fr)}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <header class="header">
    <h1 id="title">Gestion collège</h1>
    <div id="category" class="muted"></div>
    <div id="description" class="description"></div>
  </header>
  <div id="tabs" class="tabs"></div>
  <div id="pages"><div class="card">Chargement…</div></div>
</main>
<script>
(()=>{
'use strict';
const ROOT='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1/app-api';
const id=(new URLSearchParams(location.search).get('id')||'').trim();
const BASE=ROOT+'?id='+encodeURIComponent(id);
const $=x=>document.getElementById(x);
let cfg=null,activePage='',inventoryReview=false,submitting=false;
const DRAFT_INV='college-inventory:'+id,DRAFT_OUT='college-outgoing:'+id;
const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
const uuid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const opts=()=>cfg?.application?.site_options||{};
function msg(i,t,ok=false){const e=$(i);if(!e)return;e.textContent=t||'';e.className='status '+(t?(ok?'ok':'err'):'')}
function setSubmitting(v,buttonId,label){submitting=v;const b=$(buttonId);if(!b)return;b.disabled=v;b.innerHTML=v?'<span class="spinner"></span>Enregistrement…':label}
function displayUnit(p,kind){if(kind==='inventory')return p.inventory_unit_label||p.conditionnement||p.unit||'unité';return p.conditionnement||p.unit||'unité'}
function productInfo(p,kind){const parts=[];const unit=displayUnit(p,kind);if(unit)parts.push(unit);if(p.colisage&&p.colisage!==unit)parts.push('colisage : '+p.colisage);if(opts().unit_price)parts.push(Number(p.unit_price||0).toFixed(2)+' €');if(opts().current_stock)parts.push('stock : '+Number(p.current_stock||0).toLocaleString('fr-FR'));return parts.join(' · ')}
function meta(prefix,service=true,kind='inventory'){return `<section class="card"><div class="meta"><div><label>Date</label><input id="${prefix}Date" type="date" value="${today}" onchange="saveDraft('${kind}')"></div>${service&&opts().service?`<div><label>Service</label><select id="${prefix}Service" onchange="saveDraft('${kind}')">${(cfg.application.services||['Général']).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>`:''}</div></section>`}
function note(id,kind){return opts().note?`<section class="card"><label>Remarque facultative</label><textarea id="${id}" maxlength="500" placeholder="Ajouter une remarque…" oninput="saveDraft('${kind}')"></textarea></section>`:''}
function productRows(kind){const inventory=kind==='inventory',cls=inventory?'invQty':'outQty';return cfg.products.map(p=>{const searchable=esc(norm([p.name,p.code,p.conditionnement,p.inventory_unit_label].filter(Boolean).join(' ')));return `<div class="product" data-kind="${kind}" data-id="${p.id}" data-search="${searchable}"><div><div class="name">${esc(p.name)}</div>${p.code?`<span class="code">${esc(p.code)}</span>`:''}<div class="unit">${esc(productInfo(p,kind))}</div></div>${inventory?`<div class="qtybox inventory"><button class="mini zero invZero" type="button" onclick="setExactQty('inventory','${p.id}',0)">0</button><input class="${cls} qty" inputmode="decimal" type="number" min="0" step="0.001" placeholder="Compter" aria-label="Quantité ${esc(p.name)}" oninput="onQtyInput('inventory')"></div>`:`<div class="qtybox"><button class="mini" type="button" onclick="stepQty('outgoing','${p.id}',-1)">−</button><input class="${cls} qty" inputmode="decimal" type="number" min="0" step="0.001" placeholder="0" aria-label="Quantité ${esc(p.name)}" oninput="onQtyInput('outgoing')"><button class="mini" type="button" onclick="stepQty('outgoing','${p.id}',1)">+</button></div>`}</div>`}).join('')}
function inventory(){return `<section id="page-inventory">${meta('inv',true,'inventory')}<section class="card"><div class="toolbar"><div><label>Rechercher un produit</label><input id="inventorySearch" type="search" placeholder="Nom ou référence…" oninput="filterProducts('inventory',this.value)"></div><div><div class="muted">Avancement</div><div id="inventoryProgress" class="progress">0 / ${cfg.products.length}</div><div id="inventorySaved" class="saved"></div></div></div></section><section class="card products">${productRows('inventory')}</section>${note('invNote','inventory')}<section id="inventoryReviewBox" class="card reviewbox hidden"><div class="reviewtitle">Inventaire prêt à enregistrer</div><div id="inventoryReviewText" class="muted"></div></section><div class="sticky"><div id="inventoryActionSummary" class="summary">Renseignez tous les produits, y compris ceux à zéro.</div><div class="actions" id="inventoryNormalActions"><button class="btn secondary" onclick="resetForm('inventory')">Effacer</button><button class="btn success" onclick="verifyInventory()">Vérifier l’inventaire</button></div><div class="actions hidden" id="inventoryReviewActions"><button class="btn secondary" onclick="editInventory()">Modifier</button><button id="saveInventory" class="btn success" onclick="saveEvent('inventaire')">Enregistrer l’inventaire</button></div><div id="inventoryStatus" class="status"></div></div></section>`}
function outgoing(){return `<section id="page-outgoing">${meta('out',true,'outgoing')}<section class="card"><div class="toolbar"><div><label>Rechercher un produit</label><input id="outgoingSearch" type="search" placeholder="Nom ou référence…" oninput="filterProducts('outgoing',this.value)"></div><div><div class="muted">Sélection</div><div id="outgoingProgress" class="progress">0 produit</div><div id="outgoingSaved" class="saved"></div></div></div></section><section class="card products">${productRows('outgoing')}</section>${note('outNote','outgoing')}<div class="sticky"><div id="outgoingActionSummary" class="summary">Indiquez uniquement les produits réellement sortis.</div><div class="actions"><button class="btn secondary" onclick="resetForm('outgoing')">Effacer</button><button id="saveOutgoing" class="btn success" onclick="saveEvent('sortie')">Enregistrer les sorties</button></div><div id="outgoingStatus" class="status"></div></div></section>`}
function purchaseRows(){return cfg.products.map(p=>`<div class="product" data-kind="purchases" data-id="${p.id}"><div><div class="name">${esc(p.name)}</div>${p.code?`<span class="code">${esc(p.code)}</span>`:''}<div class="unit">${esc(productInfo(p,'purchase'))}</div></div><input class="buyQty qty" type="number" min="0" step="0.001" placeholder="0"></div>`).join('')}
function purchases(){return `<section id="page-purchases">${meta('buy',false,'purchases')}${opts().supplier?'<section class="card"><label>Fournisseur</label><input id="supplier"></section>':''}<section class="card products">${purchaseRows()}</section>${note('buyNote','purchases')}<div class="sticky"><div class="actions"><button class="btn secondary" onclick="resetForm('purchases')">Effacer</button><button id="savePurchases" class="btn success" onclick="savePurchase()">Enregistrer l’achat</button></div><div id="purchaseStatus" class="status"></div></div>${opts().purchase_history?'<section class="card"><label>Année</label><input id="year" type="number" value="'+now.getFullYear()+'"><button class="btn secondary" style="margin-top:8px" onclick="loadPurchases()">Actualiser</button></section><section class="card history"><table><thead><tr><th>Date</th><th>Produit</th><th>Quantité</th><th>Fournisseur</th></tr></thead><tbody id="history"></tbody></table></section>':''}</section>`}
function render(){const defs=[];if(opts().inventory)defs.push({key:'inventory',name:'Inventaire',render:inventory});if(opts().outgoing)defs.push({key:'outgoing',name:'Sorties',render:outgoing});if(opts().purchases)defs.push({key:'purchases',name:'Achats',render:purchases});$('title').textContent=cfg.application.name;$('category').textContent=cfg.category.name;$('description').textContent=cfg.application.description||'';document.documentElement.style.setProperty('--accent',cfg.application.color||'#243447');if(!defs.length){$('pages').innerHTML='<div class="card empty">Aucune fonction activée.</div>';return}$('tabs').innerHTML=defs.length>1?defs.map(d=>`<button class="tab" data-page="${d.key}" onclick="showPage('${d.key}')">${d.name}</button>`).join(''):'';$('pages').innerHTML=defs.map(d=>d.render()).join('');showPage(defs[0].key);restoreDraft('inventory');restoreDraft('outgoing');updateInventoryProgress();updateOutgoingProgress();if(opts().purchase_history&&opts().purchases)loadPurchases()}
window.showPage=p=>{activePage=p;document.querySelectorAll('[id^="page-"]').forEach(x=>x.classList.toggle('hidden',x.id!=='page-'+p));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===p));window.scrollTo({top:0,behavior:'smooth'})};
async function load(){if(!/^[0-9a-f-]{36}$/i.test(id)){$('pages').innerHTML='<div class="card err">Lien application invalide.</div>';return}try{const r=await fetch(BASE,{cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Impossible de charger l’application.');cfg=j;render()}catch(e){$('pages').innerHTML='<div class="card err">'+esc(e.message||'Erreur de chargement')+'</div>'}}
function draftKey(kind){return kind==='inventory'?DRAFT_INV:DRAFT_OUT}
function currentDraftId(kind){try{return JSON.parse(localStorage.getItem(draftKey(kind))||'null')?.client_event_id||uuid()}catch{return uuid()}}
window.saveDraft=kind=>{if(!cfg||!['inventory','outgoing'].includes(kind))return;const prefix=kind==='inventory'?'inv':'out',cls=kind==='inventory'?'.invQty':'.outQty',values={};document.querySelectorAll(cls).forEach(i=>{const v=i.value.trim();if(v!=='')values[i.closest('.product').dataset.id]=v});const d={client_event_id:currentDraftId(kind),date:$(prefix+'Date')?.value||today,service:$(prefix+'Service')?.value||'',note:$(prefix+'Note')?.value||'',values,updated_at:Date.now()};localStorage.setItem(draftKey(kind),JSON.stringify(d));const e=$(kind==='inventory'?'inventorySaved':'outgoingSaved');if(e)e.textContent='Saisie sauvegardée sur cet appareil.'};
function restoreDraft(kind){try{const d=JSON.parse(localStorage.getItem(draftKey(kind))||'null');if(!d)return;const prefix=kind==='inventory'?'inv':'out',cls=kind==='inventory'?'.invQty':'.outQty';document.querySelectorAll(cls).forEach(i=>{const v=d.values?.[i.closest('.product').dataset.id];if(v!==undefined)i.value=v});if($(prefix+'Date'))$(prefix+'Date').value=d.date||today;if($(prefix+'Service')&&d.service)$(prefix+'Service').value=d.service;if($(prefix+'Note'))$(prefix+'Note').value=d.note||'';const e=$(kind==='inventory'?'inventorySaved':'outgoingSaved');if(e)e.textContent='Brouillon restauré.'}catch{}}
window.filterProducts=(kind,value)=>{const q=norm(value).trim();document.querySelectorAll(`.product[data-kind="${kind}"]`).forEach(row=>row.classList.toggle('hidden',!!q&&!row.dataset.search.includes(q)))};
function qtyInput(kind,pid){return document.querySelector(`.product[data-kind="${kind}"][data-id="${pid}"] input.qty`)}
window.setExactQty=(kind,pid,value)=>{if(inventoryReview||submitting)return;const i=qtyInput(kind,pid);if(!i)return;i.value=String(value);onQtyInput(kind);i.focus()};
window.stepQty=(kind,pid,delta)=>{if(submitting)return;const i=qtyInput(kind,pid);if(!i)return;const cur=Number(i.value||0),next=Math.max(0,Math.round((cur+delta)*1000)/1000);i.value=next?String(next):'';onQtyInput(kind);i.focus()};
window.onQtyInput=kind=>{if(kind==='inventory')updateInventoryProgress();else updateOutgoingProgress();saveDraft(kind)};
function inventoryData(){let bad=false,missing=0;const items=[...document.querySelectorAll('.invQty')].map(i=>{const raw=i.value.trim(),q=Number(raw);if(raw===''||!Number.isFinite(q)||q<0){bad=true;if(raw==='')missing++}return {product_id:i.closest('.product').dataset.id,quantity:q}});return {items,bad,missing}}
function outgoingData(){let bad=false;const items=[];document.querySelectorAll('.outQty').forEach(i=>{const raw=i.value.trim();if(!raw)return;const q=Number(raw);if(!Number.isFinite(q)||q<0){bad=true;return}if(q>0)items.push({product_id:i.closest('.product').dataset.id,quantity:q})});return {items,bad}}
function updateInventoryProgress(){if(!cfg||!$('inventoryProgress'))return;const all=[...document.querySelectorAll('.invQty')],done=all.filter(i=>i.value.trim()!==''&&Number.isFinite(Number(i.value))&&Number(i.value)>=0).length;$('inventoryProgress').textContent=done+' / '+all.length;$('inventoryActionSummary').textContent=done===all.length&&all.length?'Toutes les quantités sont renseignées. Vous pouvez vérifier l’inventaire.':(all.length-done)+' produit(s) restent à compter.'}
function updateOutgoingProgress(){if(!cfg||!$('outgoingProgress'))return;const x=outgoingData(),total=x.items.reduce((s,i)=>s+i.quantity,0);$('outgoingProgress').textContent=x.items.length+(x.items.length>1?' produits':' produit');$('outgoingActionSummary').textContent=x.items.length?`${x.items.length} produit(s) sélectionné(s) · quantité totale ${total.toLocaleString('fr-FR')}`:'Indiquez uniquement les produits réellement sortis.'}
window.verifyInventory=()=>{const x=inventoryData();if(x.bad){msg('inventoryStatus',x.missing?`Il reste ${x.missing} produit(s) à compter.`:'Une quantité est invalide.');return}inventoryReview=true;document.querySelectorAll('.invQty,.invZero').forEach(e=>e.disabled=true);$('inventoryReviewBox').classList.remove('hidden');$('inventoryReviewText').textContent=`${x.items.length} produit(s) compté(s). Vérifiez les quantités puis enregistrez l’inventaire.`;$('inventoryNormalActions').classList.add('hidden');$('inventoryReviewActions').classList.remove('hidden');msg('inventoryStatus','Inventaire vérifié. Vous pouvez maintenant l’enregistrer.',true);saveDraft('inventory')};
window.editInventory=()=>{inventoryReview=false;document.querySelectorAll('.invQty,.invZero').forEach(e=>e.disabled=false);$('inventoryReviewBox').classList.add('hidden');$('inventoryNormalActions').classList.remove('hidden');$('inventoryReviewActions').classList.add('hidden');msg('inventoryStatus','')};
window.resetForm=kind=>{if(submitting)return;if(!confirm('Effacer la saisie en cours ?'))return;const cls=kind==='inventory'?'.invQty':kind==='outgoing'?'.outQty':'.buyQty';document.querySelectorAll(cls).forEach(i=>{i.value='';i.disabled=false});if(kind==='inventory'){localStorage.removeItem(DRAFT_INV);inventoryReview=false;document.querySelectorAll('.invZero').forEach(e=>e.disabled=false);$('inventoryReviewBox')?.classList.add('hidden');$('inventoryNormalActions')?.classList.remove('hidden');$('inventoryReviewActions')?.classList.add('hidden');$('inventorySaved').textContent='';updateInventoryProgress();msg('inventoryStatus','')}if(kind==='outgoing'){localStorage.removeItem(DRAFT_OUT);$('outgoingSaved').textContent='';updateOutgoingProgress();msg('outgoingStatus','')}if(kind==='purchases'&&$('supplier'))$('supplier').value=''};
function clearAfterSuccess(kind){const cls=kind==='inventory'?'.invQty':'.outQty';document.querySelectorAll(cls).forEach(i=>{i.value='';i.disabled=false});localStorage.removeItem(draftKey(kind));if(kind==='inventory'){inventoryReview=false;document.querySelectorAll('.invZero').forEach(e=>e.disabled=false);$('inventoryReviewBox').classList.add('hidden');$('inventoryNormalActions').classList.remove('hidden');$('inventoryReviewActions').classList.add('hidden');$('inventorySaved').textContent='';updateInventoryProgress()}else{$('outgoingSaved').textContent='';updateOutgoingProgress()}}
window.saveEvent=async type=>{if(submitting)return;const inv=type==='inventaire',data=inv?inventoryData():outgoingData(),sid=inv?'inventoryStatus':'outgoingStatus';if(inv&&!inventoryReview)return msg(sid,'Vérifiez d’abord l’inventaire.');if(data.bad)return msg(sid,'Une ou plusieurs quantités sont invalides.');if(!data.items.length)return msg(sid,inv?'Aucun produit à enregistrer.':'Indiquez au moins une sortie.');const prefix=inv?'inv':'out',kind=inv?'inventory':'outgoing',date=$(prefix+'Date')?.value||'';if(!date)return msg(sid,'La date est obligatoire.');const wording=inv?`Enregistrer l’inventaire de ${data.items.length} produit(s) ?`:`Enregistrer les sorties de ${data.items.length} produit(s) ?`;if(!confirm(wording))return;const buttonId=inv?'saveInventory':'saveOutgoing',buttonLabel=inv?'Enregistrer l’inventaire':'Enregistrer les sorties';setSubmitting(true,buttonId,buttonLabel);try{saveDraft(kind);const d=JSON.parse(localStorage.getItem(draftKey(kind))||'{}'),clientId=d.client_event_id||uuid();const r=await fetch(BASE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:clientId,event_type:type,event_date:date,service:$(prefix+'Service')?.value||'',note:$(prefix+'Note')?.value||'',items:data.items})}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Enregistrement impossible.');clearAfterSuccess(kind);msg(sid,inv?'Inventaire enregistré avec succès.':'Sorties enregistrées avec succès.',true)}catch(e){msg(sid,e.message||'Enregistrement impossible.')}finally{setSubmitting(false,buttonId,buttonLabel)}};
window.savePurchase=async()=>{if(submitting)return;const items=[];document.querySelectorAll('.buyQty').forEach(i=>{const q=Number(i.value||0);if(q>0)items.push({product_id:i.closest('.product').dataset.id,quantity:q})});if(!items.length)return msg('purchaseStatus','Indiquez au moins un article.');setSubmitting(true,'savePurchases','Enregistrer l’achat');try{const r=await fetch(BASE+'&action=purchase',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_event_id:uuid(),purchase_date:$('buyDate').value,supplier:$('supplier')?.value||'',note:$('buyNote')?.value||'',items})}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Enregistrement impossible.');document.querySelectorAll('.buyQty').forEach(i=>i.value='');if($('supplier'))$('supplier').value='';if($('buyNote'))$('buyNote').value='';msg('purchaseStatus','Achat enregistré avec succès.',true);if(opts().purchase_history)loadPurchases()}catch(e){msg('purchaseStatus',e.message||'Enregistrement impossible.')}finally{setSubmitting(false,'savePurchases','Enregistrer l’achat')}};
window.loadPurchases=async()=>{if(!$('history'))return;try{const y=Number($('year').value),r=await fetch(BASE+'&action=purchases&year='+encodeURIComponent(y)),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur');const by=new Map(cfg.products.map(p=>[p.id,p]));$('history').innerHTML=(j.purchases||[]).map(x=>`<tr><td>${esc(x.purchase_date)}</td><td>${esc(by.get(x.product_id)?.name||x.product_name||'')}</td><td>${Number(x.quantity).toLocaleString('fr-FR')}</td><td>${esc(x.supplier||'')}</td></tr>`).join('')||'<tr><td colspan="4">Aucun achat.</td></tr>'}catch(e){$('history').innerHTML='<tr><td colspan="4" class="err">'+esc(e.message||'Erreur')+'</td></tr>'}};
