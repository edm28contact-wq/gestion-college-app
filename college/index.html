<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243447"><title>Gestion collège</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f6f8;--accent:#243447;--ok:#176b3a;--bad:#a32929;--muted:#68727d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border:1px solid #dfe5ea;border-radius:14px;padding:14px;margin-bottom:12px}.muted{font-size:13px;color:var(--muted)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}.tab{background:#fff;border:1px solid #cbd2d9;flex:1}.tab.active,.primary{background:var(--accent);color:#fff}.secondary{background:#e8edf1}.success{background:#1fbd61;color:#fff}.hidden{display:none!important}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}input,select,textarea{width:100%;min-height:46px;border:1px solid #c5ced6;border-radius:10px;padding:9px;font:inherit}.product{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2}.product:last-child{border:0}.name{font-weight:750}.qty{font-size:18px;text-align:center}.status{min-height:22px;margin-top:8px;font-weight:650}.ok{color:var(--ok)}.err{color:var(--bad)}.history{overflow:auto}.history table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:8px;border-bottom:1px solid #edf0f2;text-align:left}@media(max-width:620px){.meta,.product{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><header><h1 id="title">Gestion collège</h1><div id="category" class="muted"></div><p id="description"></p></header><div id="tabs" class="tabs"></div><div id="content"><div class="card">Chargement…</div></div></main><script>
const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/app-api';const id=(new URLSearchParams(location.search).get('id')||'').trim();let cfg=null,page='';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10);function u(action='config',extra={}){const x=new URL(API);x.searchParams.set('id',id);x.searchParams.set('action',action);Object.entries(extra).forEach(([k,v])=>x.searchParams.set(k,String(v)));return x}async function api(action='config',method='GET',body,extra={}){const r=await fetch(u(action,extra),{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}function opts(){return cfg?.application?.site_options||{}}function meta(prefix,service=true){return `<div class="card meta"><div><label>Date</label><input id="${prefix}date" type="date" value="${today()}"></div>${service&&opts().service?`<div><label>Service</label><select id="${prefix}service">${(cfg.application.services||['Général']).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>`:''}</div>`}function rows(kind){return `<div class="card">${cfg.products.map(p=>`<div class="product"><div><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.code||'')} · ${esc(p.conditionnement||p.unit||'unité')}</div></div><input class="qty" data-id="${p.id}" type="number" min="0" step="0.001" placeholder="${kind==='inventory'?'Compter':'0'}"></div>`).join('')}</div>`}function note(prefix){return opts().note?`<div class="card"><label>Remarque</label><textarea id="${prefix}note" maxlength="500"></textarea></div>`:''}function show(p){page=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='inventory')inventory();else if(p==='outgoing')outgoing();else purchases()}function values(){return [...document.querySelectorAll('.qty')].map(x=>({product_id:x.dataset.id,quantity:Number(x.value||0)}))}function inventory(){$('content').innerHTML=meta('i')+rows('inventory')+note('i')+`<div class="card"><button class="btn success" onclick="saveEvent('inventaire')">Enregistrer l’inventaire</button><div id="msg" class="status"></div></div>`}function outgoing(){$('content').innerHTML=meta('o')+rows('outgoing')+note('o')+`<div class="card"><button class="btn success" onclick="saveEvent('sortie')">Enregistrer les sorties</button><div id="msg" class="status"></div></div>`}async function saveEvent(type){const m=$('msg');try{let items=values();if(type==='inventaire'&&items.length!==cfg.products.length)throw new Error('Inventaire incomplet.');if(type==='sortie')items=items.filter(x=>x.quantity>0);if(type==='sortie'&&!items.length)throw new Error('Indiquez au moins une sortie.');const pre=type==='inventaire'?'i':'o';await api('config','POST',{event_type:type,event_date:$(pre+'date').value,service:$(pre+'service')?.value||'',note:$(pre+'note')?.value||'',client_event_id:crypto.randomUUID(),items});m.className='status ok';m.textContent='Enregistrement effectué.';document.querySelectorAll('.qty').forEach(x=>x.value='')}catch(e){m.className='status err';m.textContent=e.message}}function purchases(){$('content').innerHTML=meta('p',false)+(opts().supplier?'<div class="card"><label>Fournisseur</label><input id="supplier"></div>':'')+rows('purchase')+note('p')+`<div class="card"><button class="btn success" onclick="savePurchase()">Enregistrer l’achat</button><div id="msg" class="status"></div></div>${opts().purchase_history?'<div class="card"><button class="btn secondary" onclick="history()">Afficher les achats de l’année</button><div id="hist"></div></div>':''}`}async function savePurchase(){const m=$('msg');try{const items=values().filter(x=>x.quantity>0);if(!items.length)throw new Error('Indiquez au moins un achat.');await api('purchase','POST',{purchase_date:$('pdate').value,supplier:$('supplier')?.value||'',note:$('pnote')?.value||'',client_event_id:crypto.randomUUID(),items});m.className='status ok';m.textContent='Achat enregistré.';document.querySelectorAll('.qty').forEach(x=>x.value='')}catch(e){m.className='status err';m.textContent=e.message}}async function history(){const y=new Date().getFullYear(),j=await api('purchases','GET',null,{year:y});$('hist').innerHTML=`<div class="history"><table><thead><tr><th>Date</th><th>Produit</th><th>Quantité</th><th>Fournisseur</th></tr></thead><tbody>${(j.purchases||[]).map(x=>`<tr><td>${esc(x.purchase_date)}</td><td>${esc(x.product_name)}</td><td>${x.quantity}</td><td>${esc(x.supplier||'')}</td></tr>`).join('')}</tbody></table></div>`}async function load(){if(!/^[0-9a-f-]{36}$/i.test(id)){location.replace('../admin/acces.html');return}try{cfg=await api();$('title').textContent=cfg.application.name;$('category').textContent=cfg.category.name;$('description').textContent=cfg.application.description||'';document.documentElement.style.setProperty('--accent',cfg.application.color||'#243447');const tabs=[];if(opts().inventory)tabs.push(['inventory','Inventaire']);if(opts().outgoing)tabs.push(['outgoing','Sorties']);if(opts().purchases)tabs.push(['purchases','Achats']);$('tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab" data-p="${k}" onclick="show('${k}')">${n}</button>`).join('');if(!tabs.length)$('content').innerHTML='<div class="card">Aucune fonction activée.</div>';else show(tabs[0][0])}catch(e){$('content').innerHTML=`<div class="card err">${esc(e.message)}</div>`}}load();
</script></body></html>
