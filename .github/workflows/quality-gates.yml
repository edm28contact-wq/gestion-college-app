name: Contrôles Gestion Collège
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification de syntaxe
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            node --check "$source"
          done < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs')
      - name: Tester les invariants métier
        run: node --test tests/*.test.cjs tests/js/*.test.mjs
