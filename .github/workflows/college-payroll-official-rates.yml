name: Barèmes officiels des salaires - vérification du 20

on:
  schedule:
    - cron: "15 4 20-22 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/college-payroll-official-rates.yml"
      - "scripts/update-payroll-official-rates.mjs"
      - "supabase/functions/college-payroll-rates-sync/rates.mjs"

permissions:
  contents: write

concurrency:
  group: official-payroll-rates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Lire les publications officielles et vérifier les tableaux
        run: node scripts/update-payroll-official-rates.mjs
      - name: Enregistrer uniquement le cache des barèmes publics vérifiés
        run: |
          if git diff --quiet -- college/admin/official-rates-cache.json && git ls-files --error-unmatch college/admin/official-rates-cache.json >/dev/null 2>&1; then
            echo "No new officially verified rates"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add college/admin/official-rates-cache.json
          git commit -m "chore: archive independently verified monthly official payroll rates"
          git push origin HEAD:main
