<!doctype html><html lang="fr"><head><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secrétariat commandes</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:390px;margin:12vh auto}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.active{background:var(--p);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.line{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.reorder{background:#fde8e8;color:#8d1717}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge-red{background:#b42318;color:#fff}.badge-ok{background:#e8f4ec;color:#176b39}.badge-view{background:#fff3cd;color:#765500}.status{min-height:22px;margin-top:8px}.supplier-suggestions{max-height:235px;overflow:auto;border:1px solid #d6dfe7;border-radius:8px;margin-top:4px;background:#fff}.supplier-suggestions:empty{display:none}.supplier-choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px;border:0;border-bottom:1px solid #edf0f2;background:#fff;cursor:pointer}.supplier-choice:hover,.supplier-choice:focus{background:#e8edf1}.supplier-choice small{font-size:12px;color:#667480}.ok{color:var(--ok)}.err{color:var(--bad)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}

</head><body><main class="wrap"><form id="login" class="card login" onsubmit="event.preventDefault();doLogin()"><h1>Secrétariat commandes</h1><p class="muted">Connexion avec <b>admin</b> ou avec un compte Secrétariat créé depuis la Holding.</p><label>Identifiant</label><input id="user" value="admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" type="submit" style="width:100%">Se connecter</button><p id="loginMsg" class="status"></p></form><section id="app" class="hide"><div class="actions" style="justify-content:space-between;align-items:center"><div><h1>Secrétariat</h1><div id="who" class="muted"></div><div id="syncInfo" class="muted"></div></div><div class="actions"><a id="secretariatAdminSpace" class="btn secondary" href="../college/admin/">Administration Collège</a><a id="secretariatHoldingSpace" class="btn secondary" href="../admin/holding/">Holding</a><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div class="tabs"><button id="tStocks" class="btn active" onclick="show('stocks')">Stocks et produits</button><button id="tOrders" class="btn secondary" onclick="show('orders')">Commandes</button><button id="tInvoices" class="btn secondary" onclick="show('invoices')">Factures</button><button id="tPlanning" class="btn secondary" onclick="show('planning')">Planning</button><button id="tSettings" class="btn secondary" onclick="show('settings')">Paramètres</button><button id="tPassword" class="btn secondary" onclick="show('password')">Mot de passe</button></div><br><div id="content"></div><div id="embeddedContent" hidden>
<iframe id="embeddedInvoices" title="Lecteur de factures du Secrétariat" data-src="../lecteur-veryfi/?origine=secretariat&amp;embed=secretariat" hidden></iframe>
<iframe id="embeddedPlanning" title="Planning du personnel du Secrétariat" data-src="planning/?embed=secretariat" hidden></iframe>
</div></section></main><script>
const ROOT='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1',ADMIN=ROOT+'/admin-api',SEC=ROOT+'/secretariat-api',GEMINI_CONFIG=ROOT+'/secretariat-gemini-config';let token=localStorage.getItem('college_secretariat_token')||localStorage.getItem('edm_admin_token')||'',db=null,page='stocks';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(){return {'content-type':'application/json','x-admin-session':token,'authorization':'Bearer '+token}}
async function loginApi(body){const r=await fetch(ADMIN+'?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Connexion refusée');return j}async function api(action,method='GET',body){const r=await fetch(SEC+'?action='+encodeURIComponent(action),{method,headers:headers(),body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}async function adminAction(action,body){const r=await fetch(ADMIN+'?action='+encodeURIComponent(action),{method:'POST',headers:headers(),body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function doLogin(){try{$('loginMsg').textContent='Connexion…';const username=$('user').value.trim().toLowerCase(),j=await loginApi({username,password:$('pass').value});if(!(j.role==='admin'||j.role==='secretariat'||j.permissions?.secretariat===true))throw new Error('Accès secrétariat non autorisé');token=j.token;localStorage.setItem('college_secretariat_token',token);if(username==='admin')localStorage.setItem('edm_admin_token',token);$('pass').value='';await load()}catch(e){$('loginMsg').className='status err';$('loginMsg').textContent=e.message}}
function isSecretary(){return db?.current_user?.role==='secretariat'}
function applySecretariatVisibility(){
 const restricted=isSecretary();
 for(const id of ['secretariatAdminSpace','secretariatHoldingSpace','tSettings','tPassword']){
  const element=$(id);if(element)element.hidden=restricted;
 }
 document.querySelector('#app')?.setAttribute('data-school-role',db?.current_user?.role||'');document.dispatchEvent(new CustomEvent('college:secretariat-role',{detail:{role:db?.current_user?.role||'',restricted}}));
}

function resizeEmbeddedFrame(frame){
 try{
  const main=frame.contentDocument?.querySelector('main.shell');
  if(!main)return;
  const next=Math.max(850,Math.min(30000,Math.ceil(main.scrollHeight+12)));
  if(Math.abs((parseInt(frame.style.height,10)||0)-next)>3)frame.style.height=next+'px';
 }catch{frame.style.height='1100px'}
}
function showEmbeddedSection(section){
 const embedded=section==='invoices'||section==='planning';
 $('content').hidden=embedded;
 $('embeddedContent').hidden=!embedded;
 for(const [tab,id] of [['invoices','embeddedInvoices'],['planning','embeddedPlanning']]){
  const frame=$(id);
  frame.hidden=section!==tab;
  if(section!==tab)continue;
  if(!frame.dataset.loaded){
   frame.dataset.loaded='1';
   frame.addEventListener('load',()=>{
    resizeEmbeddedFrame(frame);
    try{
     const node=frame.contentDocument?.querySelector('main.shell');
     if(node&&typeof ResizeObserver!=='undefined'){
      const observer=new ResizeObserver(()=>resizeEmbeddedFrame(frame));
      observer.observe(node);
     }
    }catch{}
   });
   frame.src=frame.dataset.src;
  }else resizeEmbeddedFrame(frame);
 }
}
function readOnly(){return db?.current_user?.read_only===true}function logout(){token='';db=null;localStorage.removeItem('college_secretariat_token');$('app').classList.add('hide');$('login').classList.remove('hide')}async function load(){db=await api('data');$('login').classList.add('hide');$('app').classList.remove('hide');applySecretariatVisibility();if(isSecretary()&&!['stocks','orders','invoices','planning'].includes(page))page='stocks';$('who').innerHTML=esc(db.current_user?.display_name||db.current_user?.username||'')+' · '+esc(db.current_user?.username||'')+(readOnly()?' · <span class="badge badge-view">Visiteur</span>':' · <span class="badge badge-ok">Modificateur</span>');$('syncInfo').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');if(new URLSearchParams(location.search).get('return')==='veryfi')page='invoices';
 for(const [key,id] of [['stocks','tStocks'],['orders','tOrders'],['invoices','tInvoices'],['planning','tPlanning'],['settings','tSettings'],['password','tPassword']])$(id).className='btn '+(page===key?'active':'secondary');
 render()}function bal(id){return Number(db.balances.find(x=>x.product_id===id)?.quantity||0)}function low(p){return p.active!==false&&bal(p.id)<Number(p.min_stock||0)}function need(p){return low(p)?Math.max(0,Number(p.target_stock||0)-bal(p.id)):0}function show(p){
 if(isSecretary()&&!['stocks','orders','invoices','planning'].includes(p))return;
 page=p;
 for(const [key,id] of [['stocks','tStocks'],['orders','tOrders'],['invoices','tInvoices'],['planning','tPlanning'],['settings','tSettings'],['password','tPassword']]){
  $(id).className='btn '+(p===key?'active':'secondary');
 }
 render();
}function render(){
 if(isSecretary()&&!['stocks','orders','invoices','planning'].includes(page))page='stocks';
 showEmbeddedSection(page);
 if(page==='invoices'||page==='planning')return;
 if(page==='stocks')stocks();else if(page==='orders')orders();else if(page==='settings')settingsPage();else passwordPage();
}
function stocks(){
 const ps=(db.products||[]).filter(p=>p.active!==false).sort((a,b)=>Number(low(b))-Number(low(a))||String(a.name).localeCompare(String(b.name),'fr'));
 const categories=db.categories||[];
 $('content').innerHTML=`<div class="secretariat-section-heading"><div><h2>Stocks et produits</h2><p class="muted">Consultez les disponibilités et les produits à recommander.</p></div><button class="btn secondary" onclick="refresh()">Actualiser</button></div><div class="grid stock-kpis"><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${ps.length}</div></div><div class="card"><div class="muted">À recommander</div><div class="kpi">${ps.filter(low).length}</div></div><div class="card"><div class="muted">Catégories</div><div class="kpi">${categories.length}</div></div></div><div class="card stock-filter-card"><div class="stock-filters"><div><label>Rechercher un produit</label><input id="stockSearch" placeholder="Nom ou référence" oninput="filterSecretariatStocks()"></div><div><label>Catégorie</label><select id="stockCategory" onchange="filterSecretariatStocks()"><option value="">Toutes les catégories</option>${categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.active===false?' (catégorie désactivée)':''}</option>`).join('')}</select></div><div><label>État du stock</label><select id="stockStatus" onchange="filterSecretariatStocks()"><option value="">Tous les états</option><option value="low">À recommander</option><option value="ok">Stock suffisant</option></select></div></div><div class="stock-filter-summary"><strong id="stockCountShown" aria-live="polite">Produits affichés</strong><span class="muted">Tous les produits actifs sont visibles, même si leur catégorie est désactivée.</span></div></div><div class="card table stock-table-card"><div class="stock-table-heading"><h2>État des stocks</h2><span class="muted">Quantités exprimées dans l’unité de stock de chaque produit.</span></div><table class="stock-table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Quantité en stock</th><th>Seuils</th><th>État</th></tr></thead><tbody id="stockProductRows">${ps.map(p=>{const c=categories.find(x=>x.id===p.category_id);return `<tr data-name="${esc((p.name+' '+p.code).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())}" data-category="${esc(p.category_id||'')}" data-status="${low(p)?'low':'ok'}" class="${low(p)?'reorder':''}"><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'')}</div></td><td>${esc(c?.name||'—')}${c?.active===false?' (désactivée)':''}</td><td><strong>${bal(p.id)}</strong><div class="muted">${esc(p.stock_count_mode==='litre'?'L':p.inventory_unit_label||p.unit||'unité')}</div></td><td>Mini : ${Number(p.min_stock||0)}<div class="muted">Cible : ${Number(p.target_stock||0)}</div></td><td>${low(p)?'<span class="badge badge-red">À recommander</span>':'<span class="badge badge-ok">OK</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
 filterSecretariatStocks();
}
function filterSecretariatStocks(){
 const q=String($('stockSearch')?.value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),cat=$('stockCategory')?.value||'',status=$('stockStatus')?.value||'';
 let visible=0;document.querySelectorAll('#stockProductRows tr').forEach(tr=>{tr.hidden=(!!q&&!String(tr.dataset.name).includes(q))||(!!cat&&tr.dataset.category!==cat)||(!!status&&tr.dataset.status!==status);if(!tr.hidden)visible++});
 if($('stockCountShown'))$('stockCountShown').textContent=visible+' produit'+(visible>1?'s':'')+' affiché'+(visible>1?'s':'');
}
function orders(){const os=db.orders||[];$('content').innerHTML=`<div class="actions">${readOnly()?'':`<button class="btn primary" onclick="newOrder()">Nouvelle commande</button>`}<button class="btn secondary" onclick="refresh()">Actualiser</button></div>${readOnly()?'<p class="muted">Mode Visiteur : consultation uniquement.</p>':''}<br><div class="card table"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>État</th><th>Articles</th><th></th></tr></thead><tbody>${os.map(o=>{const items=(db.order_items||[]).filter(i=>i.order_id===o.id);return `<tr><td>CMD-${String(o.order_no).padStart(6,'0')}</td><td>${esc(o.order_date)}</td><td>${esc(o.supplier||'')}</td><td>${esc(o.status)}</td><td>${items.reduce((s,i)=>s+Number(i.quantity||0),0)}</td><td>${!readOnly()&&o.status==='commandee'?`<button class="btn primary" onclick="receive('${o.id}')">Réceptionner</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
let selectedSupplierKey="",savingOrder=false;
function supplierMatches(){
 const q=String($('os')?.value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 return (db.suppliers||[]).filter(s=>String(s.name).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(q)).slice(0,15);
}
function supplierSuggestions(){
 const container=$('supplierSuggestions');if(!container)return;
 const suppliers=supplierMatches();
 container.innerHTML=suppliers.map(s=>'<button type="button" class="supplier-choice" onclick="chooseSupplier(\''+esc(s.key)+'\')"><b>'+esc(s.name)+'</b><small>'+Number(s.product_count||0)+' produit(s)</small></button>').join('')||
 '<p class="muted">Aucun fournisseur correspondant. Ajoutez ses produits dans le catalogue ou vérifiez ses factures.</p>';
}
function searchSupplier(){
 selectedSupplierKey="";
 $('supplierProducts').innerHTML='<p class="muted">Choisissez un fournisseur proposé pour afficher ses produits.</p>';
 supplierSuggestions();
}
function chooseFirstSupplier(){const first=supplierMatches()[0];if(first)chooseSupplier(first.key)}
function chooseSupplier(key){
 const supplier=(db.suppliers||[]).find(s=>s.key===key);
 if(!supplier)return;
 selectedSupplierKey=key;$('os').value=supplier.name;
 $('supplierSuggestions').innerHTML="";
 const related=(db.supplier_products||[]).filter(x=>x.supplier_key===key);
 const mapping=new Map(related.map(x=>[x.product_id,x]));
 const products=(db.order_products||[]).filter(x=>mapping.has(x.id)).sort((a,b)=>Number(low(b))-Number(low(a))||String(a.name).localeCompare(String(b.name),'fr'));
 $('supplierProducts').innerHTML=products.length?
 '<p class="muted"><b>'+products.length+' produit(s)</b> liés à '+esc(supplier.name)+' — les produits historiques non confirmés sont signalés.</p>'+
 products.map(p=>{
  const link=mapping.get(p.id),unverified=link.source==="historique_a_confirmer";
  const fractional=p.stock_count_mode==="litre"||["kg","litre","l","g","ml"].includes(String(p.unit||"").toLowerCase());
  return '<div class="line '+(low(p)?'reorder':'')+'"><div><b>'+esc(p.name)+'</b>'+
   '<div class="muted">'+esc(p.code)+' · stock '+bal(p.id)+' '+esc(p.unit||'')+' · conseillé '+need(p)+'</div>'+
   '<div class="muted">'+(unverified?'Association historique : à vérifier':link.source==="verifie"?'Fournisseur et produit vérifiés':'Lien confirmé par facture, achat ou commande')+'</div></div>'+
   '<input class="oq" data-id="'+esc(p.id)+'" type="number" min="0" step="'+(fractional?'0.001':'1')+'" value="" placeholder="0" aria-label="Quantité à commander : '+esc(p.name)+'"></div>';
 }).join(''):
 '<p class="muted">Aucun produit actif lié à ce fournisseur. Vérifiez d’abord le catalogue et les associations de ses factures.</p>';
}
function newOrder(){
 if(readOnly())return alert('Compte visiteur : modification interdite.');
 selectedSupplierKey="";
 $('content').innerHTML='<div class="card"><h2>Nouvelle commande</h2>'+
 '<div class="grid"><div><label>Date</label><input id="od" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
 '<div><label>Date prévue</label><input id="oe" type="date"></div>'+
 '<div><label>Fournisseur</label><input id="os" placeholder="Commencez à saisir le nom..." autocomplete="off" oninput="searchSupplier()" onfocus="supplierSuggestions()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();chooseFirstSupplier()}">'+
 '<div id="supplierSuggestions" class="supplier-suggestions" role="listbox"></div></div>'+
 '<div><label>État</label><select id="ost"><option value="brouillon">Brouillon</option><option value="commandee">Commandée</option></select></div></div><br>'+
 '<div id="supplierProducts"><p class="muted">Sélectionnez un fournisseur pour afficher uniquement ses produits.</p></div>'+
 '<br><label>Remarque</label><textarea id="on"></textarea><br><br>'+
 '<button id="saveOrderButton" class="btn primary" onclick="saveOrder()">Enregistrer</button> '+
 '<button class="btn secondary" onclick="show(\'orders\')">Annuler</button><div id="msg" class="status"></div></div>';
}
async function saveOrder(){
 if(savingOrder)return;
 const msg=$('msg'),supplier=(db.suppliers||[]).find(x=>x.key===selectedSupplierKey);
 if(!supplier)return void(msg.className='status err',msg.textContent='Sélectionnez un fournisseur dans les propositions.');
 const related=new Set((db.supplier_products||[]).filter(x=>x.supplier_key===selectedSupplierKey).map(x=>x.product_id));
 const values=[...document.querySelectorAll('.oq')];
 if(values.some(x=>!Number.isFinite(Number(x.value))||Number(x.value)<0||Number(x.value)>1000000))return void(msg.className='status err',msg.textContent='Quantité invalide.');
 const items=values.map(x=>({product_id:x.dataset.id,quantity:Number(x.value||0)})).filter(x=>x.quantity>0);
 if(!items.length)return void(msg.className='status err',msg.textContent='Renseignez au moins une quantité.');
 if(items.some(x=>!related.has(x.product_id)))return void(msg.className='status err',msg.textContent='Un article ne correspond pas au fournisseur sélectionné.');
 savingOrder=true;const button=$('saveOrderButton');button.disabled=true;
 try{
  await api('save-order','POST',{supplier:supplier.name,order_date:$('od').value,expected_date:$('oe').value||null,status:$('ost').value,note:$('on').value,items});
  await refresh();show('orders');
 }catch(e){msg.className='status err';msg.textContent=e.message;button.disabled=false}
 finally{savingOrder=false}
}
async function receive(id){if(readOnly())return alert('Compte visiteur : modification interdite.');if(!confirm('Confirmer la réception ?'))return;try{await api('receive-order','POST',{id});await refresh()}catch(e){alert(e.message)}}async function refresh(){db=await api('data');$('syncInfo').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}
async function geminiConfig(method='GET',body=null){const r=await fetch(GEMINI_CONFIG,{method,headers:{'content-type':'application/json','authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse Gemini invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Configuration Gemini impossible');return j}
async function loadSecretariatGeminiConfig(){const box=$('sgState');if(!box)return;try{const c=await geminiConfig('GET'),n=Number(c.key_count||0),m=Number(c.max_keys||10);if(n>0){box.className='status ok';box.textContent='ACTIVE · '+n+'/'+m+' clé(s) Gemini Secrétariat enregistrée(s). Bascule automatique entre les clés.'}else{box.className='status err';box.textContent='INACTIVE · 0/'+m+' clé Gemini Secrétariat enregistrée. Le lecteur utilise temporairement le pool Comptabilité en secours.'}}catch(e){box.className='status err';box.textContent=e.message}}
async function saveSecretariatGeminiKey(){const input=$('sgKey'),msg=$('sgMsg'),btn=$('sgSave'),key=String(input?.value||'').trim();if(key.length<20){msg.className='status err';msg.textContent='Entre la clé Gemini complète.';return}try{btn.disabled=true;msg.className='status';msg.textContent='Test réel de la clé Gemini…';const r=await geminiConfig('POST',{action:'save_test',api_key:key});if(r.active&&r.saved){input.value='';msg.className='status ok';msg.textContent='Clé '+(r.key_count||'?')+'/'+(r.max_keys||10)+' enregistrée et active.';await loadSecretariatGeminiConfig()}else{msg.className='status err';msg.textContent='Clé non enregistrée. '+(r.reason||'Le test Gemini a échoué.')}}catch(e){msg.className='status err';msg.textContent=e.message}finally{btn.disabled=false}}
async function testSecretariatGemini(){const msg=$('sgMsg');try{msg.className='status';msg.textContent='Test du pool Gemini Secrétariat…';const r=await geminiConfig('POST',{action:'test'});if(r.active){msg.className='status ok';msg.textContent='ACTIVE · test Gemini réussi.'}else{msg.className='status err';msg.textContent='INACTIVE · '+(r.reason||'Aucune clé utilisable.')}}catch(e){msg.className='status err';msg.textContent=e.message}}
function settingsPage(){if(isSecretary()){show('stocks');return}const ro=readOnly();$('content').innerHTML='<div class="card"><h2>Clés API Gemini · Secrétariat</h2><p class="muted">Pool indépendant de la Comptabilité. Jusqu’à <b>10 clés API Gemini</b>. Chaque clé est testée avant enregistrement et stockée chiffrée dans <b>Supabase Vault</b>. Les clés ne sont jamais réaffichées ni enregistrées dans GitHub.</p><div id="sgState" class="status">Vérification…</div><div style="max-width:720px;margin-top:12px"><label>Clé API Gemini Secrétariat</label><input id="sgKey" type="password" autocomplete="off" placeholder="Colle ici la clé du projet Gemini Secrétariat" '+(ro?'disabled':'')+'><div class="actions" style="margin-top:10px">'+(ro?'':'<button id="sgSave" class="btn primary" onclick="saveSecretariatGeminiKey()">Enregistrer et tester</button>')+'<button class="btn secondary" onclick="testSecretariatGemini()">Tester le pool</button></div><div id="sgMsg" class="status"></div></div></div>';loadSecretariatGeminiConfig()}
function passwordPage(){if(isSecretary()){show('stocks');return}$('content').innerHTML=`<div class="card"><h2>Changer le mot de passe</h2><p class="muted">10 caractères minimum.</p><input id="p1" type="password" placeholder="Nouveau mot de passe"><br><br><input id="p2" type="password" placeholder="Confirmation"><br><br><button class="btn primary" onclick="changePassword()">Enregistrer</button><div id="pm" class="status"></div></div>`}async function changePassword(){if(isSecretary())return;const a=$('p1').value,b=$('p2').value,m=$('pm');if(a.length<10)return m.textContent='10 caractères minimum.';if(a!==b)return m.textContent='Les mots de passe ne correspondent pas.';try{await adminAction('change-password',{password:a});if(localStorage.getItem('edm_admin_token')===token)localStorage.removeItem('edm_admin_token');logout()}catch(e){m.className='status err';m.textContent=e.message}}
if(new URLSearchParams(location.search).get('reauth')==='1'){token='';localStorage.removeItem('college_secretariat_token');localStorage.removeItem('edm_admin_token');$('login').classList.remove('hide');$('app').classList.add('hide')}else if(token)load().catch(()=>{const own=localStorage.getItem('college_secretariat_token')||'';if(!own&&localStorage.getItem('edm_admin_token')===token)localStorage.removeItem('edm_admin_token');logout()});
</script><script defer src="../college/workspace-layout.js?v=8" data-area="secretariat" data-target="#app"></script>
