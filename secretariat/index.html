<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secrétariat commandes</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:white;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:390px;margin:12vh auto}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:white}.secondary{background:#e8edf1}.active{background:var(--p);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.line{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.narrow{max-width:520px}.reorder{background:#fde8e8;color:#8d1717}.reorder td{border-bottom-color:#f7caca}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge-red{background:#b42318;color:#fff}.badge-ok{background:#e8f4ec;color:#176b39}.badge-off{background:#eceff1;color:#66717a}.inactive-row{opacity:.62}.sync{font-size:12px;color:#6e7983}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section id="login" class="card login"><h1>Secrétariat commandes</h1><p class="muted">Accès réservé aux stocks, commandes et factures fournisseurs.</p><label>Identifiant</label><input id="user" value="secretariat"><br><br><label>Mot de passe</label><input id="pass" type="password"><br><br><button class="btn primary" style="width:100%" onclick="doLogin()">Se connecter</button><p id="loginMsg"></p></section><section id="app" class="hide"><div class="actions" style="justify-content:space-between;align-items:center"><div><h1>Secrétariat commandes</h1><div id="who" class="muted"></div><div id="syncInfo" class="sync"></div></div><button class="btn secondary" onclick="logout()">Déconnexion</button></div><br><div class="tabs"><button id="tStocks" class="btn active" onclick="show('stocks')">Stocks</button><button id="tOrders" class="btn secondary" onclick="show('orders')">Commandes</button><a class="btn secondary" href="factures/">Factures</a><button id="tPassword" class="btn secondary" onclick="show('password')">Mot de passe</button></div><br><div id="content"></div></section></main><script>const API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/admin-api',ACCOUNT_API='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1/secretariat-account-api';let token=localStorage.getItem('college_secretariat_token')||'',db=null,page='stocks',syncing=false;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,method='GET',body){const r=await fetch(API+'?action='+action,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur');return j}async function doLogin(){try{const j=await api('login','POST',{username:$('user').value,password:$('pass').value});if(j.role!=='secretariat')throw new Error('Ce compte n’est pas un compte secrétariat');token=j.token;localStorage.setItem('college_secretariat_token',token);await load()}catch(e){$('loginMsg').textContent=e.message}}function logout(){token='';localStorage.removeItem('college_secretariat_token');location.reload()}async function load(){try{db=await api('data');if(db.current_user?.role!=='secretariat')throw new Error('Accès secrétariat requis');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=db.current_user.display_name;setSyncInfo();render()}catch(e){logout()}}function setSyncInfo(){if($('syncInfo'))$('syncInfo').textContent='Données communes synchronisées · dernière actualisation '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}function bal(id){return Number(db.balances.find(x=>x.product_id===id)?.quantity||0)}function needsReorder(p){return p.active&&bal(p.id)<=Number(p.min_stock||0)}function show(p){page=p;$('tStocks').className='btn '+(p==='stocks'?'active':'secondary');$('tOrders').className='btn '+(p==='orders'?'active':'secondary');$('tPassword').className='btn '+(p==='password'?'active':'secondary');render()}function render(){if(page==='stocks')return renderStocks();if(page==='orders')return renderOrders();renderPassword()}function renderStocks(){const products=[...db.products].sort((a,b)=>Number(needsReorder(b))-Number(needsReorder(a))||Number(b.active)-Number(a.active)||String(a.name).localeCompare(String(b.name),'fr'));const reorder=products.filter(needsReorder),active=products.filter(p=>p.active);$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Tous les produits</div><div class="kpi">${products.length}</div></div><div class="card"><div class="muted">Produits actifs</div><div class="kpi">${active.length}</div></div><div class="card ${reorder.length?'reorder':''}"><div class="muted">À recommander</div><div class="kpi">${reorder.length}</div></div></div><div class="card"><div class="actions" style="justify-content:space-between;align-items:center"><div><b>Liste complète des produits</b><div class="muted">Une ligne rouge signifie que le stock est inférieur ou égal au minimum défini dans l’administration.</div></div><button class="btn secondary" onclick="refresh()">Actualiser</button></div></div><div class="card table"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Stock</th><th>Minimum</th><th>Cible</th><th>État</th></tr></thead><tbody>${products.map(p=>{const low=needsReorder(p),cat=db.categories.find(c=>c.id===p.category_id)?.name||'';return `<tr class="${low?'reorder ':''}${!p.active?'inactive-row':''}"><td><b>${esc(p.name)}</b>${!p.active?' <span class="badge badge-off">Inactif</span>':''}</td><td>${esc(cat)}</td><td><b>${bal(p.id)}</b> ${esc(p.unit||'')}</td><td>${Number(p.min_stock||0)}</td><td>${Number(p.target_stock||0)}</td><td>${!p.active?'<span class="badge badge-off">Inactif</span>':low?'<span class="badge badge-red">À recommander</span>':'<span class="badge badge-ok">Stock OK</span>'}</td></tr>`}).join('')}</tbody></table></div>`}function renderOrders(){const os=db.orders||[];$('content').innerHTML=`<div class="actions"><button class="btn primary" onclick="newOrder()">Nouvelle commande</button><button class="btn secondary" onclick="refresh()">Actualiser</button></div><br><div class="card table"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>État</th><th>Articles</th><th>Créée par</th><th></th></tr></thead><tbody>${os.map(o=>{const items=db.order_items.filter(i=>i.order_id===o.id);return `<tr><td>CMD-${String(o.order_no).padStart(6,'0')}</td><td>${o.order_date}</td><td>${esc(o.supplier||'')}</td><td>${esc(o.status)}</td><td>${items.reduce((s,i)=>s+Number(i.quantity),0)}</td><td>${esc(o.created_by)}</td><td>${o.status==='commandee'?`<button class="btn primary" onclick="receive('${o.id}')">Réceptionner</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}function renderPassword(){$('content').innerHTML=`<div class="card narrow"><h2>Changer le mot de passe</h2><p class="muted">10 caractères minimum. Après validation, vous serez déconnectée et devrez vous reconnecter avec le nouveau mot de passe.</p><label>Nouveau mot de passe</label><input id="newPass" type="password" autocomplete="new-password"><br><br><label>Confirmer le mot de passe</label><input id="newPass2" type="password" autocomplete="new-password"><br><br><button id="changePassBtn" class="btn primary" onclick="changePassword()">Changer le mot de passe</button><p id="pwMsg"></p></div>`}async function changePassword(){const p=$('newPass').value,p2=$('newPass2').value,msg=$('pwMsg');if(p.length<10){msg.textContent='Le mot de passe doit contenir au moins 10 caractères.';return}if(p!==p2){msg.textContent='Les deux mots de passe ne correspondent pas.';return}if(!confirm('Confirmer le changement de mot de passe ?'))return;$('changePassBtn').disabled=true;msg.textContent='Modification en cours…';try{const r=await fetch(ACCOUNT_API,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({password:p})});const j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur');localStorage.removeItem('college_secretariat_token');alert('Mot de passe modifié. Reconnectez-vous avec le nouveau mot de passe.');location.reload()}catch(e){msg.textContent=e.message;$('changePassBtn').disabled=false}}async function refresh(silent=false){if(syncing)return;syncing=true;try{db=await api('data');setSyncInfo();if(!silent||page==='stocks'||page==='orders')render()}catch(e){if(!silent)alert(e.message)}finally{syncing=false}}function newOrder(){const products=db.products.filter(p=>p.active).sort((a,b)=>Number(needsReorder(b))-Number(needsReorder(a))||String(a.name).localeCompare(String(b.name),'fr'));$('content').innerHTML=`<div class="card"><h2>Nouvelle commande</h2><div class="grid"><div><label>Date</label><input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Date prévue</label><input id="oe" type="date"></div><div><label>Fournisseur</label><input id="os"></div><div><label>État</label><select id="ost"><option value="brouillon">Brouillon</option><option value="commandee">Commandée</option></select></div></div><br><div>${products.map(p=>`<div class="line ${needsReorder(p)?'reorder':''}"><div>${esc(p.name)} <span class="muted">stock ${bal(p.id)} / mini ${Number(p.min_stock||0)} / cible ${Number(p.target_stock||0)}</span>${needsReorder(p)?' <span class="badge badge-red">À recommander</span>':''}</div><input class="oq" data-id="${p.id}" type="number" min="0" step="1" placeholder="Qté"></div>`).join('')}</div><br><label>Remarque</label><textarea id="on"></textarea><br><br><div class="actions"><button class="btn primary" onclick="saveOrder()">Enregistrer</button><button class="btn secondary" onclick="show('orders')">Annuler</button></div><p id="msg"></p></div>`}async function saveOrder(){const items=[...document.querySelectorAll('.oq')].map(x=>({product_id:x.dataset.id,quantity:Number(x.value||0)})).filter(x=>x.quantity>0);try{await api('save-order','POST',{supplier:$('os').value,order_date:$('od').value,expected_date:$('oe').value||null,status:$('ost').value,note:$('on').value,items});await refresh();show('orders')}catch(e){$('msg').textContent=e.message}}async function receive(id){if(!confirm('Confirmer la réception ? Le stock sera augmenté avec les quantités commandées.'))return;try{await api('receive-order','POST',{id});await refresh()}catch(e){alert(e.message)}}setInterval(()=>{if(token&&!document.hidden)refresh(true)},30000);document.addEventListener('visibilitychange',()=>{if(token&&!document.hidden)refresh(true)});if(token)load();</script></body></html>
