<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secrétariat commandes</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:390px;margin:12vh auto}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.active{background:var(--p);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.line{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.reorder{background:#fde8e8;color:#8d1717}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge-red{background:#b42318;color:#fff}.badge-ok{background:#e8f4ec;color:#176b39}.badge-view{background:#fff3cd;color:#765500}.status{min-height:22px;margin-top:8px}.ok{color:var(--ok)}.err{color:var(--bad)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><form id="login" class="card login" onsubmit="event.preventDefault();doLogin()"><h1>Secrétariat commandes</h1><p class="muted">Connexion avec <b>admin</b> ou avec un compte Secrétariat créé depuis la Holding.</p><label>Identifiant</label><input id="user" value="admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" type="submit" style="width:100%">Se connecter</button><p id="loginMsg" class="status"></p></form><section id="app" class="hide"><div class="actions" style="justify-content:space-between;align-items:center"><div><h1>Secrétariat commandes</h1><div id="who" class="muted"></div><div id="syncInfo" class="muted"></div></div><div class="actions"><a class="btn secondary" href="../college/admin/">Administration Collège</a><a class="btn secondary" href="../admin/holding/">Holding</a><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div class="tabs"><button id="tStocks" class="btn active" onclick="show('stocks')">Stocks</button><button id="tOrders" class="btn secondary" onclick="show('orders')">Commandes</button><a class="btn secondary" href="factures-v25/">Factures</a><button id="tSettings" class="btn secondary" onclick="show('settings')">Paramètres</button><button id="tPassword" class="btn secondary" onclick="show('password')">Mot de passe</button></div><br><div id="content"></div></section></main><script>
const ROOT='https://zreegtzfpwrjgdhhunxx.supabase.co/functions/v1',ADMIN=ROOT+'/admin-api',SEC=ROOT+'/secretariat-api',GEMINI_CONFIG=ROOT+'/secretariat-gemini-config';let token=localStorage.getItem('edm_admin_token')||localStorage.getItem('college_secretariat_token')||'',db=null,page='stocks';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(){return {'content-type':'application/json','x-admin-session':token,'authorization':'Bearer '+token}}
async function loginApi(body){const r=await fetch(ADMIN+'?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Connexion refusée');return j}async function api(action,method='GET',body){const r=await fetch(SEC+'?action='+encodeURIComponent(action),{method,headers:headers(),body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}async function adminAction(action,body){const r=await fetch(ADMIN+'?action='+encodeURIComponent(action),{method:'POST',headers:headers(),body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function doLogin(){try{$('loginMsg').textContent='Connexion…';const username=$('user').value.trim().toLowerCase(),j=await loginApi({username,password:$('pass').value});if(!(j.role==='admin'||j.role==='secretariat'||j.permissions?.secretariat===true))throw new Error('Accès secrétariat non autorisé');token=j.token;localStorage.setItem('college_secretariat_token',token);if(username==='admin')localStorage.setItem('edm_admin_token',token);$('pass').value='';await load()}catch(e){$('loginMsg').className='status err';$('loginMsg').textContent=e.message}}
function readOnly(){return db?.current_user?.read_only===true}function logout(){token='';db=null;localStorage.removeItem('college_secretariat_token');$('app').classList.add('hide');$('login').classList.remove('hide')}async function load(){db=await api('data');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').innerHTML=esc(db.current_user?.display_name||db.current_user?.username||'')+' · '+esc(db.current_user?.username||'')+(readOnly()?' · <span class="badge badge-view">Visiteur</span>':' · <span class="badge badge-ok">Modificateur</span>');$('syncInfo').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}function bal(id){return Number(db.balances.find(x=>x.product_id===id)?.quantity||0)}function low(p){return p.active!==false&&bal(p.id)<Number(p.min_stock||0)}function need(p){return low(p)?Math.max(0,Number(p.target_stock||0)-bal(p.id)):0}function show(p){page=p;$('tStocks').className='btn '+(p==='stocks'?'active':'secondary');$('tOrders').className='btn '+(p==='orders'?'active':'secondary');$('tSettings').className='btn '+(p==='settings'?'active':'secondary');$('tPassword').className='btn '+(p==='password'?'active':'secondary');render()}function render(){if(page==='stocks')stocks();else if(page==='orders')orders();else if(page==='settings')settingsPage();else passwordPage()}
function stocks(){const ps=[...db.products].sort((a,b)=>Number(low(b))-Number(low(a))||String(a.name).localeCompare(String(b.name),'fr'));$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Produits</div><div class="kpi">${ps.length}</div></div><div class="card"><div class="muted">Actifs</div><div class="kpi">${ps.filter(p=>p.active!==false).length}</div></div><div class="card"><div class="muted">À recommander</div><div class="kpi">${ps.filter(low).length}</div></div></div><div class="card table"><table><thead><tr><th>Produit</th><th>Stock</th><th>Mini</th><th>Cible</th><th>À commander</th><th>État</th></tr></thead><tbody>${ps.map(p=>`<tr class="${low(p)?'reorder':''}"><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'')}</div></td><td>${bal(p.id)} ${esc(p.unit||'')}</td><td>${Number(p.min_stock||0)}</td><td>${Number(p.target_stock||0)}</td><td>${low(p)?need(p):'—'}</td><td>${low(p)?'<span class="badge badge-red">À recommander</span>':'<span class="badge badge-ok">OK</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function orders(){const os=db.orders||[];$('content').innerHTML=`<div class="actions">${readOnly()?'':`<button class="btn primary" onclick="newOrder()">Nouvelle commande</button>`}<button class="btn secondary" onclick="refresh()">Actualiser</button></div>${readOnly()?'<p class="muted">Mode Visiteur : consultation uniquement.</p>':''}<br><div class="card table"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>État</th><th>Articles</th><th></th></tr></thead><tbody>${os.map(o=>{const items=(db.order_items||[]).filter(i=>i.order_id===o.id);return `<tr><td>CMD-${String(o.order_no).padStart(6,'0')}</td><td>${esc(o.order_date)}</td><td>${esc(o.supplier||'')}</td><td>${esc(o.status)}</td><td>${items.reduce((s,i)=>s+Number(i.quantity||0),0)}</td><td>${!readOnly()&&o.status==='commandee'?`<button class="btn primary" onclick="receive('${o.id}')">Réceptionner</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function newOrder(){if(readOnly())return alert('Compte visiteur : modification interdite.');const ps=db.products.filter(p=>p.active!==false).sort((a,b)=>Number(low(b))-Number(low(a)));$('content').innerHTML=`<div class="card"><h2>Nouvelle commande</h2><div class="grid"><div><label>Date</label><input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Date prévue</label><input id="oe" type="date"></div><div><label>Fournisseur</label><input id="os"></div><div><label>État</label><select id="ost"><option value="brouillon">Brouillon</option><option value="commandee">Commandée</option></select></div></div><br>${ps.map(p=>`<div class="line ${low(p)?'reorder':''}"><div><b>${esc(p.name)}</b><div class="muted">stock ${bal(p.id)} · conseillé ${need(p)}</div></div><input class="oq" data-id="${p.id}" type="number" min="0" step="1" value="${low(p)?need(p):''}"></div>`).join('')}<br><label>Remarque</label><textarea id="on"></textarea><br><br><button class="btn primary" onclick="saveOrder()">Enregistrer</button> <button class="btn secondary" onclick="show('orders')">Annuler</button><div id="msg" class="status"></div></div>`}async function saveOrder(){try{const items=[...document.querySelectorAll('.oq')].map(x=>({product_id:x.dataset.id,quantity:Number(x.value||0)})).filter(x=>x.quantity>0);await api('save-order','POST',{supplier:$('os').value,order_date:$('od').value,expected_date:$('oe').value||null,status:$('ost').value,note:$('on').value,items});await refresh();show('orders')}catch(e){$('msg').className='status err';$('msg').textContent=e.message}}async function receive(id){if(readOnly())return alert('Compte visiteur : modification interdite.');if(!confirm('Confirmer la réception ?'))return;try{await api('receive-order','POST',{id});await refresh()}catch(e){alert(e.message)}}async function refresh(){db=await api('data');$('syncInfo').textContent='Données actualisées : '+new Date(db.server_time).toLocaleString('fr-FR');render()}
async function geminiConfig(method='GET',body=null){const r=await fetch(GEMINI_CONFIG,{method,headers:{'content-type':'application/json','authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse Gemini invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Configuration Gemini impossible');return j}
async function loadSecretariatGeminiConfig(){const box=$('sgState');if(!box)return;try{const c=await geminiConfig('GET'),n=Number(c.key_count||0),m=Number(c.max_keys||10);if(n>0){box.className='status ok';box.textContent='ACTIVE · '+n+'/'+m+' clé(s) Gemini Secrétariat enregistrée(s). Bascule automatique entre les clés.'}else{box.className='status err';box.textContent='INACTIVE · 0/'+m+' clé Gemini Secrétariat enregistrée. Le lecteur utilise temporairement le pool Comptabilité en secours.'}}catch(e){box.className='status err';box.textContent=e.message}}
async function saveSecretariatGeminiKey(){const input=$('sgKey'),msg=$('sgMsg'),btn=$('sgSave'),key=String(input?.value||'').trim();if(key.length<20){msg.className='status err';msg.textContent='Entre la clé Gemini complète.';return}try{btn.disabled=true;msg.className='status';msg.textContent='Test réel de la clé Gemini…';const r=await geminiConfig('POST',{action:'save_test',api_key:key});if(r.active&&r.saved){input.value='';msg.className='status ok';msg.textContent='Clé '+(r.key_count||'?')+'/'+(r.max_keys||10)+' enregistrée et active.';await loadSecretariatGeminiConfig()}else{msg.className='status err';msg.textContent='Clé non enregistrée. '+(r.reason||'Le test Gemini a échoué.')}}catch(e){msg.className='status err';msg.textContent=e.message}finally{btn.disabled=false}}
async function testSecretariatGemini(){const msg=$('sgMsg');try{msg.className='status';msg.textContent='Test du pool Gemini Secrétariat…';const r=await geminiConfig('POST',{action:'test'});if(r.active){msg.className='status ok';msg.textContent='ACTIVE · test Gemini réussi.'}else{msg.className='status err';msg.textContent='INACTIVE · '+(r.reason||'Aucune clé utilisable.')}}catch(e){msg.className='status err';msg.textContent=e.message}}
function settingsPage(){const ro=readOnly();$('content').innerHTML='<div class="card"><h2>Clés API Gemini · Secrétariat</h2><p class="muted">Pool indépendant de la Comptabilité. Jusqu’à <b>10 clés API Gemini</b>. Chaque clé est testée avant enregistrement et stockée chiffrée dans <b>Supabase Vault</b>. Les clés ne sont jamais réaffichées ni enregistrées dans GitHub.</p><div id="sgState" class="status">Vérification…</div><div style="max-width:720px;margin-top:12px"><label>Clé API Gemini Secrétariat</label><input id="sgKey" type="password" autocomplete="off" placeholder="Colle ici la clé du projet Gemini Secrétariat" '+(ro?'disabled':'')+'><div class="actions" style="margin-top:10px">'+(ro?'':'<button id="sgSave" class="btn primary" onclick="saveSecretariatGeminiKey()">Enregistrer et tester</button>')+'<button class="btn secondary" onclick="testSecretariatGemini()">Tester le pool</button></div><div id="sgMsg" class="status"></div></div></div>';loadSecretariatGeminiConfig()}
function passwordPage(){$('content').innerHTML=`<div class="card"><h2>Changer le mot de passe</h2><p class="muted">10 caractères minimum.</p><input id="p1" type="password" placeholder="Nouveau mot de passe"><br><br><input id="p2" type="password" placeholder="Confirmation"><br><br><button class="btn primary" onclick="changePassword()">Enregistrer</button><div id="pm" class="status"></div></div>`}async function changePassword(){const a=$('p1').value,b=$('p2').value,m=$('pm');if(a.length<10)return m.textContent='10 caractères minimum.';if(a!==b)return m.textContent='Les mots de passe ne correspondent pas.';try{await adminAction('change-password',{password:a});if(localStorage.getItem('edm_admin_token')===token)localStorage.removeItem('edm_admin_token');logout()}catch(e){m.className='status err';m.textContent=e.message}}
if(token)load().catch(()=>logout());
</script></body></html>
