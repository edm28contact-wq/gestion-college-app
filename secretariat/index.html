<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secrétariat commandes</title><style>:root{font-family:system-ui,Arial;color:#17202a;background:#f4f6f8;--p:#243447;--ok:#176b3a;--bad:#a32929}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde3e8;border-radius:12px;padding:14px;margin-bottom:12px}.login{max-width:390px;margin:12vh auto}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--p);color:#fff}.secondary{background:#e8edf1}.danger{background:#fdeaea;color:var(--bad)}.active{background:var(--p);color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid #c7d0d9;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:26px;font-weight:800}.muted{color:#6e7983;font-size:13px}.hide{display:none!important}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left}.line{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.narrow{max-width:520px}.reorder{background:#fde8e8;color:#8d1717}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge-red{background:#b42318;color:#fff}.badge-ok{background:#e8f4ec;color:#176b39}.badge-off{background:#eceff1;color:#66717a}.order-qty{font-size:18px;font-weight:900;color:#b42318}.status{min-height:22px;margin-top:8px}.ok{color:var(--ok)}.err{color:var(--bad)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><section id="login" class="card login"><h1>Secrétariat commandes</h1><p class="muted">Le compte administrateur central <b>holding-admin</b> utilise le même mot de passe que sur les autres espaces protégés du Collège.</p><label>Identifiant</label><input id="user" value="holding-admin" autocomplete="username"><br><br><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="doLogin()">Se connecter</button><p id="loginMsg" class="status"></p></section><section id="app" class="hide"><div class="actions" style="justify-content:space-between;align-items:center"><div><h1>Secrétariat commandes</h1><div id="who" class="muted"></div><div id="syncInfo" class="muted"></div></div><div class="actions"><a class="btn secondary" href="../admin/holding/">Holding</a><button class="btn secondary" onclick="logout()">Déconnexion</button></div></div><br><div class="tabs"><button id="tStocks" class="btn active" onclick="show('stocks')">Stocks</button><button id="tOrders" class="btn secondary" onclick="show('orders')">Commandes</button><a class="btn secondary" href="factures/">Factures</a><button id="tPassword" class="btn secondary" onclick="show('password')">Mot de passe</button></div><br><div id="content"></div></section></main><div id="modal"></div><script>
const ROOT='https://ojjbnwpkfvzjfukgqddz.supabase.co/functions/v1';
const PUBLISHABLE='sb_publishable_pB4h3KASp9MHM6upvCAcCA_b_9vKHiX';
const ADMIN_API=ROOT+'/admin-api',SECRETARIAT_API=ROOT+'/secretariat-api';
let token=localStorage.getItem('edm_admin_token')||localStorage.getItem('college_secretariat_token')||'',db=null,page='stocks';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveToken(v){token=v;localStorage.setItem('college_secretariat_token',v);if($('user')?.value.trim().toLowerCase()==='holding-admin')localStorage.setItem('edm_admin_token',v)}
async function loginApi(body){const r=await fetch(ADMIN_API+'?action=login',{method:'POST',headers:{'content-type':'application/json','apikey':PUBLISHABLE},body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Connexion refusée');return j}
async function api(action,method='GET',body){const r=await fetch(SECRETARIAT_API+'?action='+encodeURIComponent(action),{method,headers:{'content-type':'application/json','x-admin-session':token,'apikey':PUBLISHABLE},body:body?JSON.stringify(body):undefined,cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(r.status===401){logout();throw new Error('Session expirée')}if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function adminAction(action,body){const r=await fetch(ADMIN_API+'?action='+encodeURIComponent(action),{method:'POST',headers:{'content-type':'application/json','x-admin-session':token,'apikey':PUBLISHABLE},body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw new Error(j.error||'Erreur serveur');return j}
async function doLogin(){try{$('loginMsg').className='status';$('loginMsg').textContent='Connexion…';const j=await loginApi({username:$('user').value,password:$('pass').value});if(!(j.role==='secretariat'||j.role==='holding_admin'||j.is_super_admin===true||j.permissions?.secretariat===true||j.permissions?.['*']===true))throw new Error('Accès secrétariat non autorisé');saveToken(j.token);$('pass').value='';await load()}catch(e){$('loginMsg').className='status err';$('loginMsg').textContent=e.message||'Erreur'}}
function logout(){token='';db=null;localStorage.removeItem('college_secretariat_token');$('app').classList.add('hide');$('login').classList.remove('hide')}
async function load(){db=await api('data');$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=(db.current_user?.display_name||db.current_user?.username||'')+' · '+(db.current_user?.username||'');setSyncInfo();render()}
function setSyncInfo(){$('syncInfo').textContent='Données actualisées : '+new Date(db?.server_time||Date.now()).toLocaleString('fr-FR')}
function bal(id){return Number(db.balances.find(x=>x.product_id===id)?.quantity||0)}function needsReorder(p){return p.active!==false&&bal(p.id)<Number(p.min_stock||0)}function orderQty(p){return needsReorder(p)?Math.max(0,Number(p.target_stock||0)-bal(p.id)):0}
function show(p){page=p;$('tStocks').className='btn '+(p==='stocks'?'active':'secondary');$('tOrders').className='btn '+(p==='orders'?'active':'secondary');$('tPassword').className='btn '+(p==='password'?'active':'secondary');render()}
function render(){if(!db)return;if(page==='stocks')renderStocks();else if(page==='orders')renderOrders();else renderPassword()}
function renderStocks(){const products=[...db.products].sort((a,b)=>Number(needsReorder(b))-Number(needsReorder(a))||String(a.name).localeCompare(String(b.name),'fr')),reorder=products.filter(needsReorder),active=products.filter(p=>p.active!==false);$('content').innerHTML=`<div class="grid"><div class="card"><div class="muted">Produits</div><div class="kpi">${products.length}</div></div><div class="card"><div class="muted">Actifs</div><div class="kpi">${active.length}</div></div><div class="card ${reorder.length?'reorder':''}"><div class="muted">À recommander</div><div class="kpi">${reorder.length}</div></div></div><div class="card"><div class="actions" style="justify-content:space-between"><div><b>État des stocks</b><div class="muted">Une recommandation apparaît lorsque le stock descend sous le minimum.</div></div><button class="btn secondary" onclick="refresh()">Actualiser</button></div></div><div class="card table"><table><thead><tr><th>Produit</th><th>Catégorie</th><th>Stock</th><th>Mini</th><th>Cible</th><th>À commander</th><th>État</th></tr></thead><tbody>${products.map(p=>{const cat=db.categories.find(c=>c.id===p.category_id)?.name||'',low=needsReorder(p);return `<tr class="${low?'reorder':''}"><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'')}</div></td><td>${esc(cat)}</td><td>${bal(p.id)} ${esc(p.unit||'')}</td><td>${Number(p.min_stock||0)}</td><td>${Number(p.target_stock||0)}</td><td>${low?`<span class="order-qty">${orderQty(p).toLocaleString('fr-FR')}</span>`:'—'}</td><td>${p.active===false?'<span class="badge badge-off">Inactif</span>':low?'<span class="badge badge-red">À recommander</span>':'<span class="badge badge-ok">OK</span>'}</td></tr>`}).join('')}</tbody></table></div>`}
function renderOrders(){const os=db.orders||[];$('content').innerHTML=`<div class="actions"><button class="btn primary" onclick="newOrder()">Nouvelle commande</button><button class="btn secondary" onclick="refresh()">Actualiser</button></div><br><div class="card table"><table><thead><tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>État</th><th>Articles</th><th>Créée par</th><th></th></tr></thead><tbody>${os.map(o=>{const items=(db.order_items||[]).filter(i=>i.order_id===o.id);return `<tr><td>CMD-${String(o.order_no).padStart(6,'0')}</td><td>${esc(o.order_date)}</td><td>${esc(o.supplier||'')}</td><td>${esc(o.status)}</td><td>${items.reduce((s,i)=>s+Number(i.quantity||0),0)}</td><td>${esc(o.created_by||'')}</td><td>${o.status==='commandee'?`<button class="btn primary" onclick="receive('${o.id}')">Réceptionner</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function renderPassword(){$('content').innerHTML=`<div class="card narrow"><h2>Changer le mot de passe</h2><p class="muted">Pour holding-admin, ce changement s’applique au même compte sur tous les espaces protégés du Collège. 10 caractères minimum.</p><label>Nouveau mot de passe</label><input id="newPass" type="password" autocomplete="new-password"><br><br><label>Confirmer</label><input id="newPass2" type="password" autocomplete="new-password"><br><br><button class="btn primary" onclick="changePassword()">Changer le mot de passe</button><p id="pwMsg" class="status"></p></div>`}
async function changePassword(){const p=$('newPass').value,p2=$('newPass2').value,msg=$('pwMsg');if(p.length<10){msg.className='status err';msg.textContent='10 caractères minimum.';return}if(p!==p2){msg.className='status err';msg.textContent='Les mots de passe ne correspondent pas.';return}try{await adminAction('change-password',{password:p});localStorage.removeItem('edm_admin_token');alert('Mot de passe modifié. Reconnectez-vous avec le nouveau mot de passe sur tous les espaces.');logout()}catch(e){msg.className='status err';msg.textContent=e.message}}
async function refresh(){try{db=await api('data');setSyncInfo();render()}catch(e){alert(e.message)}}
function newOrder(){const products=db.products.filter(p=>p.active!==false).sort((a,b)=>Number(needsReorder(b))-Number(needsReorder(a))||String(a.name).localeCompare(String(b.name),'fr'));$('content').innerHTML=`<div class="card"><h2>Nouvelle commande</h2><div class="grid"><div><label>Date</label><input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Date prévue</label><input id="oe" type="date"></div><div><label>Fournisseur</label><input id="os"></div><div><label>État</label><select id="ost"><option value="brouillon">Brouillon</option><option value="commandee">Commandée</option></select></div></div><br>${products.map(p=>`<div class="line ${needsReorder(p)?'reorder':''}"><div><b>${esc(p.name)}</b><div class="muted">stock ${bal(p.id)} / mini ${Number(p.min_stock||0)} / cible ${Number(p.target_stock||0)} ${needsReorder(p)?'· conseillé '+orderQty(p):''}</div></div><input class="oq" data-id="${p.id}" type="number" min="0" step="1" value="${needsReorder(p)?orderQty(p):''}" placeholder="Quantité"></div>`).join('')}<br><label>Remarque</label><textarea id="on"></textarea><br><br><div class="actions"><button class="btn primary" onclick="saveOrder()">Enregistrer</button><button class="btn secondary" onclick="show('orders')">Annuler</button></div><p id="msg" class="status"></p></div>`}
async function saveOrder(){const items=[...document.querySelectorAll('.oq')].map(x=>({product_id:x.dataset.id,quantity:Number(x.value||0)})).filter(x=>x.quantity>0);try{await api('save-order','POST',{supplier:$('os').value,order_date:$('od').value,expected_date:$('oe').value||null,status:$('ost').value,note:$('on').value,items});await refresh();show('orders')}catch(e){$('msg').className='status err';$('msg').textContent=e.message}}
async function receive(id){if(!confirm('Confirmer la réception ? Le stock sera augmenté.'))return;try{await api('receive-order','POST',{id});await refresh()}catch(e){alert(e.message)}}
if(token)load().catch(()=>logout());
</script></body></html>
